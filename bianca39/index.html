<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<!-- VIEWPORT CORRETO -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Convite Interativo</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- BOTÃO PLAY/PAUSE -->
<button id="audioBtn" class="audio-btn">
  <span id="audioIcon">▶</span>
</button>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<!-- ================= PAGINA 1 ================= -->
<section class="pagina">
  <img src="media/pagina1.png" class="full-img" alt="Convite Página 1">
</section>

<!-- ================= PAGINA 2 (VIDEO LOOP) ================= -->
<section class="pagina">
  <video autoplay muted loop playsinline class="full-video">
    <source src="media/pagina2.mp4" type="video/mp4">
  </video>
</section>

<!-- ================= PAGINA 3 ================= -->
<section class="pagina">

  <img src="media/pagina3.png" class="full-img" alt="Convite Página 3">

  <!-- CONTADOR -->
  <div class="contador-topo">
    <h2>FALTAM!</h2>
    <div id="countdown"></div>
  </div>

  <!-- CANVA CENTRAL -->
  <div class="canva-container">
    <iframe 
      src="https://www.canva.com/design/DAGzjYuhX2M/rqhthTAdy_vF8cUo3qrzEg/view?embed"
      allowfullscreen>
    </iframe>
  </div>

  <!-- BOTÃO AGENDA -->
  <button class="btn-principal btn-agenda" onclick="gerarICS()">
    SALVAR NA AGENDA
  </button>

</section>

<!-- ================= PAGINA 5 ================= -->
<section class="pagina">

  <img src="media/pagina5.png" class="full-img" alt="Convite Página 5">

  <button class="btn-principal btn-confirmar" onclick="abrirModal()">
    CONFIRMAR PRESENÇA
  </button>

  <a href="https://maps.app.goo.gl/1D3JBDRJyoShTRnh9" 
     target="_blank"
     class="btn-principal btn-maps">
     COMO CHEGAR?
  </a>

</section>

<!-- ================= MODAL CONFIRMAÇÃO ================= -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h2>Você irá à festa?</h2>

    <form action="https://formsubmit.co/crispoparte@gmail.com" method="POST">

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="Nova Confirmação de Presença">

      <label>
        <input type="radio" name="Presença" value="Sim, Eu confirmo" required>
        Sim, Eu confirmo
      </label>

      <label>
        <input type="radio" name="Presença" value="Não posso">
        Não posso
      </label>

      <input type="text" name="Nome" placeholder="Seu nome" required>
      <input type="text" name="Acompanhantes" placeholder="Quem mais irá com você?">

      <button type="submit" class="btn-marrom">
        Enviar
      </button>

    </form>

  </div>
</div>

<!-- ================= PAGINA 6 ================= -->
<section class="pagina">

  <img src="media/pagina6.png" class="full-img" alt="Convite Página 6">

  <div class="pix-area">
    <p class="pix-label">Chave Pix</p>

    <div class="pix-line">
      <span id="pixCode">71993233142</span>
      <button id="copyButton" class="btn-principal">
        Copiar
      </button>
    </div>

    <p id="copyMessage" class="pix-msg">Chave copiada!</p>
  </div>

</section>

<!-- ================= RODAPÉ ================= -->
<footer>
  <p>Desenvolvido por Cris Oliveira</p>
  <p>Todos os direitos reservados.</p>
  <p>
    Entre em contato com o Desenvolvedor
    <a href="https://wa.me/5571993233142" target="_blank">
      WhatsApp
    </a>
  </p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
