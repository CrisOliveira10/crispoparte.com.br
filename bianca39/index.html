<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Interativo</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- BOTÃO PLAY/PAUSE -->
<button id="audioBtn" class="audio-btn">
  <span id="audioIcon">▶</span>
</button>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<!-- PAGINA 1 -->
<section class="pagina">
  <img src="media/pagina1.png" class="full-img">
</section>

<!-- PAGINA 2 (VIDEO LOOP) -->
<section class="pagina">
  <video autoplay muted loop playsinline class="full-video">
    <source src="media/pagina2.mp4" type="video/mp4">
  </video>
</section>

<!-- PAGINA 3 (CONTADOR + CANVA + AGENDA) -->
<section class="pagina central relative">

  <img src="media/pagina3.png" class="full-img">

  <!-- CONTADOR NO TOPO -->
  <div class="contador-topo">
    <h2>FALTAM!</h2>
    <div id="countdown"></div>
  </div>

  <!-- CANVA CENTRAL -->
  <div class="canva-container">
    <iframe 
      src="https://www.canva.com/design/DAGzjYuhX2M/rqhthTAdy_vF8cUo3qrzEg/view?embed"
      allowfullscreen>
    </iframe>
  </div>

  <!-- BOTÃO SALVAR NA AGENDA NO RODAPÉ -->
  <button class="btn-principal btn-agenda" onclick="gerarICS()">
    SALVAR NA AGENDA
  </button>

</section>

<!-- PAGINA 5 (CONFIRMAÇÃO) -->
<section class="pagina central relative">
  <img src="media/pagina5.png" class="full-img">

  <button class="btn-principal btn-confirmar" onclick="abrirModal()">
    CONFIRMAR PRESENÇA
  </button>

  <a href="https://maps.app.goo.gl/1D3JBDRJyoShTRnh9" 
     target="_blank"
     class="btn-principal btn-maps">
     COMO CHEGAR?
  </a>

</section>

<!-- MODAL CONFIRMAÇÃO -->
<div id="modal" class="modal">
  <div class="modal-content">

    <h2>Você irá à festa?</h2>

    <form action="https://formsubmit.co/crispoparte@gmail.com" method="POST">

      <label>
        <input type="radio" name="Presença" value="Sim, Eu confirmo" required>
        Sim, Eu confirmo
      </label>

      <label>
        <input type="radio" name="Presença" value="Não posso">
        Não posso
      </label>

      <input type="text" name="Nome" placeholder="Seu nome" required>
      <input type="text" name="Acompanhantes" placeholder="Quem mais irá com você?">

      <button type="submit" class="btn-marrom">Enviar</button>

    </form>

  </div>
</div>

<!-- PAGINA 6 (PIX) -->
<section class="pagina central relative">
  <img src="media/pagina6.png" class="full-img">

  <div class="pix-area">
    <p>Chave Pix:</p>
    <strong id="pixKey">71993233142</strong>
    <button class="btn-principal" onclick="copiarPix()">
      COPIAR PIX
    </button>
    <p id="pixMsg"></p>
  </div>

</section>

<!-- RODAPÉ -->
<footer>
  <p>Desenvolvido por Cris Oliveira</p>
  <p>Todos os direitos reservados.</p>
  <p>
    Entre em contato com o Desenvolvedor  
    <a href="https://wa.me/5571993233142" target="_blank">WhatsApp</a>
  </p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
