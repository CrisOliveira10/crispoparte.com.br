<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Convite Isabela - 15 Anos</title>

    <style>
        :root {
            --cor-botao-musica: rgba(255, 255, 255, 0.8);
            --cor-icone: #1a2a6c; /* Tom azul marinho combinando com Van Gogh */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Principal */
        .page {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            max-width: 500px; 
            margin: 0 auto;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .page img, .page video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Áreas de Clique (Hotspots) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            /* background: rgba(255,0,0,0.2);  Descomente para testar o posicionamento */
        }

        .btn-voltar {
            position: absolute;
            top: 5%;
            right: 8%;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            border: 1px solid white;
        }

        /* BOTÃO DE MÚSICA FLUTUANTE */
        #btn-musica {
            position: fixed;
            top: 25px;
            left: 20px;
            width: 45px;
            height: 45px;
            background-color: var(--cor-botao-musica);
            border-radius: 50%;
            z-index: 999;
            display: none; /* Aparece após o primeiro clique */
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            border: none;
            animation: pulse-suave 2s infinite;
        }

        /* Ícones de Play e Pause */
        .icon-play { 
            width: 0; height: 0; 
            border-top: 8px solid transparent; 
            border-bottom: 8px solid transparent; 
            border-left: 12px solid var(--cor-icone); 
            margin-left: 4px; 
        }
        
        .icon-pause { 
            display: flex; gap: 4px; 
        }
        .icon-pause div { 
            width: 4px; height: 16px; 
            background-color: var(--cor-icone); 
            border-radius: 2px;
        }

        @keyframes pulse-suave {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
    </style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop preload="auto"></audio>

<button id="btn-musica" onclick="toggleMusica()" aria-label="Controlar música">
    <div id="container-icone">
        <div class="icon-pause"><div></div><div></div></div>
    </div>
</button>

<div class="page" id="page1" style="display:block;">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg" alt="Capa do Convite">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline preload="auto"></video>
    </div>
</div>

<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg" alt="Informações do Evento">

        <a class="hotspot"
           style="bottom: 39%; left: 28%; width: 20%; height: 11%;"
           href="https://wa.me/5571983868333?text=Olá!%20Gostaria%20de%20confirmar%20minha%20presença%20no%20aniversário%20da%20Isabela."
           target="_blank"></a>

        <a class="hotspot"
           style="bottom: 39%; left: 52%; width: 20%; height: 11%;"
           href="https://maps.google.com/?q=Salvador+Shopping"
           target="_blank"></a>

        <div class="hotspot"
             style="bottom: 27%; left: 28%; width: 20%; height: 11%;"
             onclick="goPage(4)"></div>

        <div class="hotspot" 
             style="bottom: 27%; left: 52%; width: 20%; height: 11%;" 
             onclick="goPage(5)"></div>
    </div>
</div>

<div class="page" id="page4">
    <div class="content-wrapper">
        <img src="pagina4.jpg" alt="Sugestões de Presentes">
        <div class="btn-voltar" onclick="goPage(3)">✖</div>
    </div>
</div>

<div class="page" id="page5">
    <div class="content-wrapper">
        <img src="pagina5.jpg" alt="Traje Sugerido">
        <div class="btn-voltar" onclick="goPage(3)">✖</div>
    </div>
</div>

<script>
    const musica = document.getElementById('musica');
    const video = document.getElementById('video');
    const btnMusica = document.getElementById('btn-musica');
    const containerIcone = document.getElementById('container-icone');

    function startInvite() {
        // Inicia música (necessário interação humana para browsers bloquearem autoplay)
        musica.play().then(() => {
            btnMusica.style.display = 'flex';
        }).catch(e => console.log("Aguardando interação para áudio."));
        
        // Vai para a página do vídeo
        goPage(2);
        
        // Tenta tocar o vídeo
        video.play().catch(error => {
            console.log("Vídeo bloqueado, tentando mudo...");
            video.muted = true;
            video.play();
        });

        // Quando o vídeo acabar, vai para a página de informações
        video.onended = () => {
            goPage(3);
        };
    }

    function toggleMusica() {
        if (musica.paused) {
            musica.play();
            containerIcone.innerHTML = '<div class="icon-pause"><div></div><div></div></div>';
        } else {
            musica.pause();
            containerIcone.innerHTML = '<div class="icon-play"></div>';
        }
    }

    function goPage(num) {
        // Esconde todas as páginas
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        // Mostra a página desejada
        const targetPage = document.getElementById('page' + num);
        if (targetPage) {
            targetPage.style.display = 'block';
        }
    }
</script>

</body>
</html>
