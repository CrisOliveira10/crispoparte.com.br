<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Convite Interativo</title>

<style>

/* ========================================================= */
/* 🔴 ÁREA DE CORES EDITÁVEIS (ALUNAS ALTERAM AQUI) */
/* ========================================================= */
:root{
  --cor-fundo: #faf7f2;
  --cor-cronometro-fundo: #644a3e; 
  --cor-cronometro-texto: #ffffff;
  --cor-botoes-geral: #4d1010;
}

/* ========================================================= */

html,body{
  margin:0;
  padding:0;
  background:var(--cor-fundo);
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

.pagina{
  position:relative;
  width:100%;
  max-width:430px;
  margin:0 auto;
}

.full-img,
.full-video{
  width:100%;
  display:block;
}

/* BOTÃO ÁUDIO */
#audioBtn{
  position:fixed;
  top:15px;
  right:15px;
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
  z-index:9999;
}

/* CRONÔMETRO (PÁGINA 3) */
.cronometro {
  position: absolute;
  top: 25%; 
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  display: flex;
  justify-content: center;
  gap: 10px;
  background: var(--cor-cronometro-fundo);
  padding: 12px 5px;
  border-radius: 50px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 10;
}

.tempo-unidade {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--cor-cronometro-texto);
  min-width: 55px;
}

.tempo-valor {
  font-size: 24px;
  font-weight: bold;
  line-height: 1;
}

.tempo-legenda {
  font-size: 9px;
  text-transform: uppercase;
  margin-top: 4px;
  letter-spacing: 1px;
}

/* SLIDER DE FOTOS (PÁGINA 4) */
.slider-container {
    position: absolute;
    top: 15%; 
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.slider-wrapper {
    display: flex;
    transition: transform 0.4s ease-out;
    touch-action: pan-y;
}

.slider-wrapper img {
    width: 100%;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
}

/* BOTÕES DE LINK */
.maps-btn{
  display:block;
  text-align:center;
  font-size:20px;
  padding:15px;
  background: var(--cor-botoes-geral);
  color:#fff;
  text-decoration:none;
}

/* FORMULÁRIO */
.form-box{
  padding:40px 15px;
  text-align:center;
}

.form-box h2{
  font-size:40px;
  margin-bottom:25px;
}

.form-box input{
  width:100%;
  padding:15px;
  font-size:18px;
  margin-bottom:15px;
}

.form-box button{
  padding:15px;
  font-size:20px;
  background: var(--cor-botoes-geral);
  color:#fff;
  border:none;
  width:100%;
  cursor: pointer;
}

/* PIX */
.pix-box{
  text-align:center;
  padding:30px 20px;
}

#pixKey{
  font-size:22px;
  font-weight:bold;
  display:block;
  margin-bottom:15px;
}

#copyBtn{
  padding:14px 30px;
  font-size:16px;
  background: var(--cor-botoes-geral);
  color:#fff;
  border:none;
}

footer{
  text-align:center;
  padding:30px;
  font-size:14px;
}

@media(min-width:768px){
  .pagina{ box-shadow:0 0 25px rgba(0,0,0,0.2); }
}

</style>
</head>

<body>

<button id="audioBtn">▶</button>
<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<section class="pagina">
<img src="media/pagina1.png" class="full-img">
</section>

<section class="pagina">
<video autoplay muted loop playsinline class="full-video">
<source src="media/pagina2.mp4" type="video/mp4">
</video>
</section>

<section class="pagina">
<img src="media/pagina3.png" class="full-img">
<div class="cronometro" id="contador"></div>
</section>

<section class="pagina">
<a href="https://forms.gle/i5171PjDYHXc1ej76" target="_blank" class="maps-btn">
CONFIRME SUA PRESENÇA
</a>
</section>

<section class="pagina">
<img src="media/pagina4.png" class="full-img">
<div class="slider-container">
    <div class="slider-wrapper" id="sliderWrapper"></div>
</div>
</section>

<section class="pagina">
<img src="media/pagina5.png" class="full-img">

<a href="https://maps.google.com" target="_blank" class="maps-btn">
COMO CHEGAR
</a>

<div class="form-box">
<h2>DEIXE SUA MENSAGEM</h2>
<form action="https://formsubmit.co/crispoparte@gmail.com" method="POST">
  
  <input type="hidden" name="_next" value="https://crispoparte.com.br/paloma">

  <input type="hidden" name="_success" value="Recebemos sua mensagem! Voltando ao convite...">

  <input type="hidden" name="_captcha" value="false">
  
  <input type="text" name="Nome" placeholder="Seu Nome" required>
  <input type="text" name="Sua menssagem aqui!" placeholder="Sua menssagem aqui!">
  
  <button type="submit">ENVIAR</button>
</form>
</div>
</section>

<section class="pagina">
<img src="media/pagina6.png" class="full-img">
<div class="pix-box">
<span id="pixKey">71993233142</span>
<button id="copyBtn">COPIAR CHAVE PIX</button>
</div>
</section>

<footer>
Desenvolvido por Cris Oliveira<br>
Todos os direitos reservados.
</footer>

<script>

/* ========================================================= */
/* 🔴 CONFIGURAÇÃO DO SLIDER (ADICIONAR FOTOS AQUI) */
/* ========================================================= */
const listaFotos = ['foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg', 'foto5.jpg', 'foto6.jpg']; 

const wrapper = document.getElementById('sliderWrapper');
listaFotos.forEach(nomeFoto => {
    const img = document.createElement('img');
    img.src = `media/${nomeFoto}`;
    wrapper.appendChild(img);
});

let startsX = 0;
let currentIndex = 0;
wrapper.addEventListener('touchstart', e => startsX = e.touches[0].clientX);
wrapper.addEventListener('touchend', e => {
    let diff = startsX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
        if (diff > 0 && currentIndex < listaFotos.length - 1) currentIndex++;
        else if (diff < 0 && currentIndex > 0) currentIndex--;
        wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
    }
});

/* --- ÁUDIO --- */
const audio = document.getElementById("bgAudio");
const btn = document.getElementById("audioBtn");
let tocando=false;
btn.onclick=function(){
if(!tocando){ audio.play(); btn.innerHTML="❚❚"; tocando=true; }
else{ audio.pause(); btn.innerHTML="▶"; tocando=false; }
}

/* ========================================================= */
/* 🔴 CONFIGURAÇÃO DA DATA DO EVENTO */
/* ========================================================= */
const dataEvento = new Date("2026-02-21T20:00:00");

function atualizar(){
const agora = new Date();
const diff = dataEvento - agora;

if(diff<=0){
document.getElementById("contador").innerHTML="É HOJE!";
return;
}

// Cálculo com 2 dígitos (padStart garante o 0 na frente)
const d = Math.floor(diff/(1000*60*60*24)).toString().padStart(2, '0');
const h = Math.floor((diff/(1000*60*60))%24).toString().padStart(2, '0');
const m = Math.floor((diff/(1000*60))%60).toString().padStart(2, '0');
const s = Math.floor((diff/1000)%60).toString().padStart(2, '0');

document.getElementById("contador").innerHTML = `
    <div class="tempo-unidade"><span class="tempo-valor">${d}</span><span class="tempo-legenda">DIAS</span></div>
    <div class="tempo-unidade"><span class="tempo-valor">${h}</span><span class="tempo-legenda">HORAS</span></div>
    <div class="tempo-unidade"><span class="tempo-valor">${m}</span><span class="tempo-legenda">MIN</span></div>
    <div class="tempo-unidade"><span class="tempo-valor">${s}</span><span class="tempo-legenda">SEG</span></div>
`;
}
setInterval(atualizar,1000);
atualizar();

/* --- PIX --- */
document.getElementById("copyBtn").onclick=function(){
const chave=document.getElementById("pixKey").innerText;
navigator.clipboard.writeText(chave);
alert("Chave Pix copiada!");
}

</script>
</body>
</html>
