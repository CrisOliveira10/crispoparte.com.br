function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',bad?6000:4000)}
function touch(){dirty=true;$('#save').classList.add('dirty');$('#st').textContent='● alterações não publicadas';
  try{localStorage.setItem(MODE==='local'?'cpa_data':'cpa_draft',JSON.stringify(D))}catch(e){toast('⚠️ Sem espaço no navegador: use imagens por URL ou reduza o tamanho.',1)}}

/* ---------- Upload (arquivo) ---------- */
async function upload(file){
  if(MODE==='server'){const fd=new FormData();fd.append('f',file);
    const r=await fetch('api.php?action=upload',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));
    if(!j.ok)throw new Error(j.erro||'Falha no envio');return j.path}
  if(file.type.startsWith('video/'))throw new Error('Sem servidor PHP não é possível enviar vídeo por arquivo. Cole o link (URL) do vídeo, ou copie o arquivo para a pasta imagens/ e digite o caminho.');
  const bm=await createImageBitmap(file),s=Math.min(1,1400/Math.max(bm.width,bm.height));
  const c=h('canvas',{width:Math.round(bm.width*s),height:Math.round(bm.height*s)});c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  let u=c.toDataURL('image/webp',.85);return u.startsWith('data:image/webp')?u:c.toDataURL('image/png')}

/* ---------- Campos ---------- */
const PH='Cole o link (https://…) ou o caminho (imagens/foto.jpg)';
function mediaF(o,f){
  const kind=f.t,acc=kind==='img'?'image/*':kind==='video'?'video/*':'image/*,video/*';
  const pv=h('div',{class:'pv'}),inp=h('input',{placeholder:PH}),info=h('small');
  const show=()=>{pv.innerHTML='';const v=o[f.k]||'';if(!v)return;const m=h(isVid(v)?'video':'img',{src:v});if(isVid(v)){m.muted=true;m.preload='metadata';m.controls=true}pv.append(m)};
  const set=v=>{o[f.k]=v;const d=v.startsWith('data:');inp.value=d?'':v;inp.placeholder=d?'✓ Arquivo enviado do computador':PH;show();touch()};
  inp.oninput=()=>{o[f.k]=inp.value.trim();inp.placeholder=PH;show();touch()};
  const fi=h('input',{type:'file',accept:acc,hidden:'',onchange:async()=>{const file=fi.files[0];if(!file)return;
    if(kind==='img'&&!file.type.startsWith('image/')||kind==='video'&&!file.type.startsWith('video/')){toast('Este campo não aceita esse tipo de arquivo',1);fi.value='';return}
    info.textContent='Enviando…';try{set(await upload(file));info.textContent='✓ Enviado'}catch(e){info.textContent='';toast('❌ '+e.message,1)}fi.value=''}});
  const v=o[f.k]||'';inp.value=v.startsWith('data:')?'':v;if(v.startsWith('data:'))inp.placeholder='✓ Arquivo enviado do computador';show();
  return h('div',{class:'media'},pv,h('div',{class:'mc'},inp,h('div',{class:'row'},h('label',{class:'btn'},'📁 Enviar arquivo',fi),h('button',{class:'btn ghost',onclick:()=>set('')},'Limpar'),info)))}

function field(o,f){
  const t=f.t||'text',w=h('div',{class:'f'+(f.w?' '+f.w:'')});
  if(t==='chk'){const i=h('input',{type:'checkbox',onchange:()=>{o[f.k]=i.checked;touch()}});i.checked=!!o[f.k];w.append(h('label',{class:'chk'},i,f.l));return w}
  w.append(h('label',{},f.l));
  if(t==='img'||t==='video'||t==='media')w.append(mediaF(o,f));
  else if(t==='list')w.append(listEd(o[f.k]||(o[f.k]=[]),f));
  else if(t==='sel'){const s=h('select',{onchange:()=>{o[f.k]=s.value;touch()}});
    const fill=()=>{const op=(typeof f.o==='function'?f.o():f.o).slice(),v=o[f.k]??'';if(v!==''&&!op.some(x=>x[0]===v))op.push([v,v]);s.innerHTML='';op.forEach(([a,b])=>s.append(h('option',{value:a},b)));s.value=v};
    s.onfocus=fill;fill();w.append(s)}
  else{const i=h(t==='area'?'textarea':'input',{rows:f.r||3,placeholder:f.p,oninput:()=>{o[f.k]=i.value;touch()}});i.value=o[f.k]??'';w.append(i)}
  if(f.h)w.append(h('small',{},f.h));return w}

function listEd(arr,sp){
  const box=h('div',{class:'list'});
  const draw=(open)=>{box.innerHTML='';
    arr.forEach((it,i)=>{
      const mv=d=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];touch();draw(j)};
      const bt=(l,fn,ti)=>h('button',{title:ti,onclick:e=>{e.preventDefault();e.stopPropagation();fn()}},l);
      const name=h('span',{class:'tt'},sp.title?sp.title(it,i):'Item '+(i+1));
      const th=sp.th&&it[sp.th]&&!isVid(it[sp.th])?h('img',{class:'th',src:it[sp.th]}):null;
      const d=h('details',{class:'item'},h('summary',{},th,name,h('span',{class:'acts'},
        bt('↑',()=>mv(-1),'Subir'),bt('↓',()=>mv(1),'Descer'),
        bt('⧉',()=>{arr.splice(i+1,0,JSON.parse(JSON.stringify(it)));touch();draw(i+1)},'Duplicar'),
        bt('🗑',()=>{if(confirm('Excluir este item?')){arr.splice(i,1);touch();draw()}},'Excluir'))),
        h('div',{class:'grid'},sp.f.map(s=>field(it,s))));
      d.addEventListener('input',()=>name.textContent=sp.title?sp.title(it,i):'Item '+(i+1));
      if(open===i)d.open=true;box.append(d)});
    box.append(h('button',{class:'add',onclick:()=>{arr.push(JSON.parse(JSON.stringify(sp.add||{})));touch();draw(arr.length-1)}},'＋ '+(sp.addL||'Adicionar')))};
  draw();return box}

function go(id){cur=id;const tab=TABS.find(t=>t.id===id);
  $('#tabs').innerHTML='';TABS.forEach(t=>$('#tabs').append(h('button',{class:t.id===id?'on':'',onclick:()=>go(t.id)},t.n)));
  const m=$('#main');m.innerHTML='';
  m.append(h('div',{class:'info'},'Tudo o que você digitar aqui fica gravado. Ao terminar, clique em “💾 Salvar e publicar”.'));
  tab.b.forEach(b=>m.append(h('section',{class:'card'},h('h2',{},b.h),b.o?h('div',{class:'grid'},b.f.map(f=>field(D[b.o],f))):listEd(D[b.list]||(D[b.list]=[]),b.sp))))}

/* ---------- Salvar / carregar ---------- */
async function save(){const b=$('#save');b.disabled=true;
  try{if(MODE==='server'){
      const r=await fetch('api.php?action=save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:D})});
      const j=await r.json().catch(()=>({}));if(r.status===401){showLogin();return}if(!r.ok||!j.ok)throw new Error(j.erro||'Erro ao salvar');
      localStorage.removeItem('cpa_draft');toast('✅ Publicado no site às '+j.em)}
    else{localStorage.setItem('cpa_data',JSON.stringify(D));toast('💾 Salvo neste navegador. Para publicar: clique em “Baixar data.json” e envie o arquivo para a pasta do site.')}
    dirty=false;b.classList.remove('dirty');$('#st').textContent='✓ tudo salvo'}
  catch(e){toast('❌ '+e.message,1)}finally{b.disabled=false}}
const norm=d=>{d=d&&d.cfg?d:(SEED||{cfg:{}});d.cfg=d.cfg||{};['pecas_cats','pecas','conv_cats','conv','destaques','mais','aval','inst'].forEach(k=>d[k]=d[k]||[]);return d};
async function start(){
  let d=null;
  try{if(MODE==='server'){const r=await fetch('api.php?action=load',{cache:'no-store'});if(r.ok)d=await r.json()}
      else d=JSON.parse(localStorage.getItem('cpa_data')||'null')}catch(e){}
  if(!d||!d.cfg){try{const r=await fetch('data.json',{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}}
  D=norm(d);
  if(MODE==='server'){try{const dr=localStorage.getItem('cpa_draft');
    if(dr&&dr!==JSON.stringify(D)&&confirm('Encontrei alterações que você digitou e ainda não publicou. Deseja recuperá-las?')){D=norm(JSON.parse(dr));touch()}
    else if(dr&&dr===JSON.stringify(D))localStorage.removeItem('cpa_draft')}catch(e){}}
  $('#login').hidden=true;$('#app').hidden=false;
  $('#mode').textContent=MODE==='server'?'Conectado ao servidor — publica direto no site':'Modo local — salva neste navegador';
  $('#view').href=MODE==='server'?'index.html':'index.html?preview=1';$('#out').hidden=MODE!=='server';go(cur)}
function showLogin(warn){$('#app').hidden=true;$('#login').hidden=false;$('#lw').hidden=!warn;$('#pw').focus()}
async function login(){const r=await fetch('api.php?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:$('#pw').value})});
  if(r.ok){$('#le').textContent='';start()}else $('#le').textContent='Senha incorreta'}
$('#lb').onclick=login;$('#pw').onkeydown=e=>e.key==='Enter'&&login();$('#save').onclick=save;
$('#out').onclick=async()=>{await fetch('api.php?action=logout');location.reload()};
$('#exp').onclick=()=>{const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'})),download:'data.json'});a.click()};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{try{D=norm(JSON.parse(await e.target.files[0].text()));touch();go(cur);toast('Backup importado. Clique em Salvar e publicar para aplicar no site.')}catch(x){toast('Arquivo inválido',1)}e.target.value=''};
addEventListener('beforeunload',e=>{if(dirty&&MODE==='server'){e.preventDefault();e.returnValue=''}});
(async()=>{try{const r=await fetch('api.php?action=ping',{cache:'no-store'});const j=await r.json();if(!j.ok)throw 0;MODE='server';j.auth?start():showLogin(j.senhaPadrao)}catch(e){MODE='local';start()}})();
</script></body></html>
