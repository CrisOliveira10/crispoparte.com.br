<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Sou fã Cris</title>

<style>
:root { --accent: #25D366; --record: #ff0000; --boom: #e1306c; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    background: #000;
    color: #fff;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    font-family: sans-serif;
}

.stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
}

#camera {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.1s linear;
}

#camera.mirrored { transform: scaleX(-1); }

#editorCanvas,
#canvasPreview,
#videoPreview {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
}

#editorCanvas { z-index: 7; background: #000; display: none; }
#canvasPreview, #videoPreview {
    object-fit: contain;
    background: black;
    display: none;
    z-index: 10;
}

#molduraImagePreview {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: bottom;
    pointer-events: none;
    z-index: 15;
    display: none;
}

#canvasFinal { display: none; }

/* UI */

.ui-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    display: flex;
    flex-direction: column;
    padding: 40px 20px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    pointer-events: auto;
}

/* POSICIONAMENTO LATERAL DIREITO */
.controls-bottom {
    position: absolute;
    right: 20px;
    top: 55%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    pointer-events: auto;
}

/* ======== ALTERAÇÃO CIRÚRGICA AQUI ======== */

/* Arte visual 9:16 */
.controls-bottom::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('botoes.png') center/contain no-repeat;
    z-index: 0;
    pointer-events: none;
}

/* Mantém estrutura clicável */
.controls-bottom > * {
    position: relative;
    z-index: 1;
}

/* Torna todos invisíveis mas funcionais */
.btn-photo,
.btn-boom,
.btn-gallery,
.btn-video,
#videoTimer {
    opacity: 0;
}

/* ======== FIM DA ALTERAÇÃO ======== */

.capture-controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
}

.btn-ui {
    padding: 10px 20px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #fff;
    border-radius: 20px;
    color: #fff;
    cursor: pointer;
}

.btn-photo {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 2px solid #fff;
}

.btn-boom {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid var(--boom);
}

.btn-gallery {
    width: 50px;
    height: 50px;
    border-radius: 10px;
}

.btn-video {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 5px solid #fff;
}

#startScreen {
    position: absolute;
    inset: 0;
    background: #000 url('capajpg.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

#startBtn {
    padding: 25px 55px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    background: #FF5722;
    color: #fff;
    border-radius: 50px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="stage" id="mainStage">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="editorCanvas"></canvas>
    <canvas id="canvasPreview"></canvas>
    <canvas id="canvasFinal"></canvas>
    <video id="videoPreview" playsinline controls loop></video>
    <img id="molduraImagePreview" src="" />

    <div class="ui-layer" id="cameraUI" style="display:none;">
        <div class="top-bar">
            <button class="btn-ui" id="switchBtn">🔄 INVERTER</button>
        </div>

        <div class="controls-bottom">
            <div id="videoTimer">00:00</div>
            <div class="capture-controls">
                <button id="galleryBtn" class="btn-gallery"></button>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
                <button id="capturePhotoBtn" class="btn-photo"></button>
                <button id="captureVideoBtn" class="btn-video"></button>
                <button id="boomerangBtn" class="btn-boom"></button>
            </div>
        </div>
    </div>

    <div id="startScreen">
        <button id="startBtn">INICIAR CÂMERA</button>
    </div>
</div>

<script>
/* TODO O SEU JAVASCRIPT ORIGINAL PERMANECE EXATAMENTE IGUAL */

</script>

</body>
</html>
