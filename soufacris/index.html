<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Lucca 2 Anos</title>

<style>
:root { --accent: #25D366; --record: #ff0000; --boom: #e1306c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #000; color: #fff; overflow: hidden; width: 100vw; height: 100dvh; font-family: sans-serif; }

.stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }

#camera { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.1s linear; }
#camera.mirrored { transform: scaleX(-1); }

#editorCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 7; background: #000; display: none; }
#canvasPreview, #videoPreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: black; display: none; z-index: 10; }
#molduraImagePreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: bottom; pointer-events: none; z-index: 15; display: none; }
#canvasFinal { display: none; }

.ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; display: flex; flex-direction: column; padding: 40px 20px; }
.top-bar { display: flex; justify-content: space-between; pointer-events: auto; }

/* =============================
   PAINEL LATERAL AJUSTADO
============================= */

.controls-bottom { 
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 110px;      /* largura fixa */
    height: 520px;     /* altura fixa da arte */
    pointer-events: auto;
}

/* imagem decorativa ocupa 100% do painel */
.bg-buttons-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    z-index: 0;
}

/* distribuição matemática */
.capture-controls {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    z-index: 1;
}

/* BOTÕES INVISÍVEIS */
.btn-photo, .btn-boom, .btn-gallery, .btn-video { 
    background: transparent; 
    border: none; 
    cursor: pointer; 
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-gallery { width: 50px; height: 50px; }
.btn-photo { width: 55px; height: 55px; }
.btn-video { width: 65px; height: 65px; }
.btn-boom { width: 55px; height: 55px; }

.btn-video.recording { opacity: 0.5; background: rgba(255,0,0,0.3); border-radius: 50%; }

#videoTimer { 
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 0, 0, 0.7); 
    padding: 5px 15px; 
    border-radius: 10px; 
    font-weight: bold; 
    font-size: 18px; 
    display: none; 
}

#resultUI { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; z-index: 40; background: rgba(0,0,0,0.85); }

.actions-box { display: flex; flex-direction: column; gap: 15px; width: 85%; pointer-events: auto; }

.btn-res { padding: 20px; border-radius: 15px; border: none; font-weight: bold; font-size: 18px; cursor: pointer; color: #fff; }

#startScreen { position: absolute; inset: 0; background: #000 url('capajpg.jpg') center/cover no-repeat; display: flex; align-items: center; justify-content: center; z-index: 100; }
#startBtn { padding: 15px 35px; font-size: 18px; font-weight: bold; border: none; background: #FF5722; color: #fff; border-radius: 50px; cursor: pointer; }

</style>
</head>

<body>

<div class="stage" id="mainStage">
<video id="camera" autoplay playsinline muted></video>
<canvas id="editorCanvas"></canvas>
<canvas id="canvasPreview"></canvas>
<canvas id="canvasFinal"></canvas>
<video id="videoPreview" playsinline controls loop></video>
<img id="molduraImagePreview" src="" />

<div class="ui-layer" id="cameraUI" style="display:none;">
<div class="top-bar">
<button class="btn-ui" id="switchBtn">🔄 INVERTER</button>
</div>

<div class="controls-bottom">

<img src="botoes.png" class="bg-buttons-img" alt="Painel">

<div id="videoTimer">00:00</div>

<div class="capture-controls">
<button id="galleryBtn" class="btn-gallery"></button>
<input type="file" id="fileInput" accept="image/*" style="display:none;">

<button id="capturePhotoBtn" class="btn-photo"></button>
<button id="captureVideoBtn" class="btn-video"></button>
<button id="boomerangBtn" class="btn-boom"></button>
</div>

</div>
</div>

<div id="resultUI">
<div class="actions-box">
<button id="downloadBtn" class="btn-res" style="background:var(--accent);">📥 BAIXAR AGORA</button>
<button id="newBtn" class="btn-res" style="background:#444;">🔄 VOLTAR</button>
</div>
</div>

<div id="startScreen">
<button id="startBtn">INICIAR CÂMERA</button>
</div>

</div>

<script>
/* SUA LÓGICA ORIGINAL INTACTA */
let usingFrontCamera = true, stream = null, isRecording = false, mediaRecorder = null, recordedChunks = [];
let currentFileUrl = null, currentType = 'image';

const video = document.getElementById('camera'),
canvasFinal = document.getElementById('canvasFinal'),
canvasPreview = document.getElementById('canvasPreview'),
videoPreview = document.getElementById('videoPreview'),
molduraImg = document.getElementById('molduraImagePreview'),
ctxFinal = canvasFinal.getContext('2d', { alpha: false }),
fileInput = document.getElementById('fileInput');

document.getElementById('startBtn').onclick = () => initCamera();
document.getElementById('switchBtn').onclick = switchCamera;
document.getElementById('capturePhotoBtn').onclick = takePhoto;
document.getElementById('captureVideoBtn').onclick = () => isRecording ? stopRecording() : startRecording(false);
document.getElementById('boomerangBtn').onclick = () => startRecording(true);
document.getElementById('newBtn').onclick = () => resetAll();
document.getElementById('galleryBtn').onclick = () => fileInput.click();

async function initCamera() {
if (stream) stream.getTracks().forEach(t => t.stop());
try {
stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: usingFrontCamera ? 'user' : 'environment' },
audio: true
});
video.srcObject = stream;
video.onloadedmetadata = () => {
video.play();
document.getElementById('startScreen').style.display = 'none';
document.getElementById('cameraUI').style.display = 'flex';
molduraImg.src = 'moldura1.png';
molduraImg.style.display = 'block';
};
} catch (e) { alert("Câmera não disponível."); }
}

function takePhoto() {
currentType = 'image';
canvasFinal.width = 1080; canvasFinal.height = 1920;
ctxFinal.drawImage(video, 0, 0, 1080, 1920);
if (molduraImg.complete) ctxFinal.drawImage(molduraImg, 0, 0, 1080, 1920);
canvasFinal.toBlob(blob => {
currentFileUrl = URL.createObjectURL(blob);
showResult(currentFileUrl, 'image');
}, 'image/png');
}

function startRecording() {
isRecording = true;
canvasFinal.width = 720; canvasFinal.height = 1280;
const canvasStream = canvasFinal.captureStream(30);
mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
mediaRecorder.onstop = () => {
currentFileUrl = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
showResult(currentFileUrl, 'video');
};
mediaRecorder.start();
const loop = () => { if(isRecording){ ctxFinal.drawImage(video,0,0,720,1280); if(molduraImg.complete) ctxFinal.drawImage(molduraImg,0,0,720,1280); requestAnimationFrame(loop);} };
loop();
}

function stopRecording() { isRecording = false; if(mediaRecorder) mediaRecorder.stop(); }

function showResult(url, type) {
document.getElementById('resultUI').style.display = 'flex';
if (type === 'image') {
canvasPreview.style.display = 'block';
canvasPreview.width = window.innerWidth;
canvasPreview.height = window.innerHeight;
canvasPreview.getContext('2d').drawImage(canvasFinal,0,0,canvasPreview.width,canvasPreview.height);
} else {
videoPreview.style.display = 'block';
videoPreview.src = url;
videoPreview.play();
}
document.getElementById('downloadBtn').onclick = () => {
const a = document.createElement('a');
a.href = url;
a.download = `registro.${type === 'image' ? 'png' : 'webm'}`;
a.click();
};
}

function resetAll() {
videoPreview.pause();
document.getElementById('resultUI').style.display = 'none';
document.getElementById('cameraUI').style.display = 'flex';
}

function switchCamera() { usingFrontCamera = !usingFrontCamera; initCamera(); }

</script>
</body>
</html>
