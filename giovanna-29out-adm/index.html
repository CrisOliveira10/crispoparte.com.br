<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Respostas — Confirme sua presença Giovanna</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--pbg:#F4F6F8;--pcd:#FFFFFF;--ptx:#9dd2f6;--pbd:#D5DAE0;--pb1:#2278d0;--pb1t:#FFFFFF;--pb2:#9fd0f4;--pb2t:#26323B;--ps1:#2f75cd;--ps2:#a1cef2;--f:'Baloo 2'}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f),system-ui,sans-serif;color:var(--ptx);background:#E7E9EC}
.w{max-width:560px;margin:0 auto;min-height:100vh;background:var(--pbg);padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 30px)}
.top{display:flex;align-items:center;gap:12px;padding:18px 0}.top .hero{display:block}.top .logo{height:56px;width:auto;max-width:90px;object-fit:contain}.top .ttl,.top .nart{display:none}
h1{font-size:1.25rem}.sub{font-size:.85rem;opacity:.7}
.cd{background:var(--pcd);border:1px solid var(--pbd);border-radius:14px;padding:14px;margin-bottom:14px}.cd h2{font-size:.95rem;margin-bottom:10px}
input{width:100%;font:inherit;color:var(--ptx);border:1px solid var(--pbd);border-radius:10px;padding:11px 12px;background:var(--pcd);outline:none}
.b{font:inherit;font-weight:700;cursor:pointer;color:var(--pb1t);background:var(--pb1);border:0;border-radius:10px;padding:11px 16px}.b.y{background:var(--pb2);color:var(--pb2t)}.b:disabled{opacity:.6}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{text-align:center;border:1px solid var(--pbd);border-radius:12px;padding:12px 4px;background:var(--pcd)}.st strong{display:block;font-size:1.6rem}.st small{font-size:.7rem;opacity:.85}
.st.r{background:var(--ps1);color:var(--pb1t)}.st.y{background:var(--ps2);color:var(--pb2t)}
.ft{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.ft button{font:inherit;font-size:.85rem;border:1px solid var(--pbd);border-radius:999px;padding:6px 12px;background:var(--pcd);color:var(--ptx);cursor:pointer}.ft .on{background:var(--ptx);color:var(--pcd)}
.it{border-top:1px solid var(--pbd);padding:12px 0;font-size:.92rem;line-height:1.5}.it b{font-size:1rem}.it small{display:block;opacity:.75}
.tg{float:right;border-radius:6px;padding:1px 10px;font-size:.78rem;font-weight:700;color:#fff;background:#15803D}.tg.n{background:#B91C1C}
.msg{min-height:1.3em;margin:8px 0;font-size:.88rem;font-weight:600}.row{display:flex;gap:8px}.row input{flex:1;min-width:0}

<script>
(function(){const C=window.C,$=s=>document.querySelector(s);let sn="",D=[],F="todos";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const post=async o=>(await fetch(C.url.trim(),{method:"POST",body:JSON.stringify(Object.assign({senha:sn},o))})).json();
const demo=[{enviadoEm:new Date().toISOString(),nome:"Convidado 1",presenca:"Sim",qtd:2,nomesAcomp:"Acompanhante A (5), Acompanhante B",idades:"5;",recado:"Mensagem de exemplo"},{enviadoEm:new Date().toISOString(),nome:"Convidado 2",presenca:"Não",qtd:0,nomesAcomp:"",idades:"",recado:""}];
async function carregar(){$("#er").textContent="";if(C.preview){D=demo;return true}
try{const j=await post({acao:"painel"});if(!j.ok){$("#er").textContent=j.erro==="senha"?"Senha incorreta.":"Não foi possível carregar.";return false}D=j.rows;return true}catch(e){$("#er").textContent="Sem conexão com a planilha.";return false}}
function render(){const vao=D.filter(d=>d.presenca==="Sim"),lim=+$("#ia").value;let ad=0,cr=0;
vao.forEach(d=>{ad++;const ids=String(d.idades||"").split(";");for(let i=0;i<(+d.qtd||0);i++){const a=ids[i];if(a!==undefined&&a!==""&&+a<=lim)cr++;else ad++}});
$("#c1").textContent=vao.length;$("#c2").textContent=ad+cr;$("#c3").textContent=D.length-vao.length;$("#c4").textContent=D.filter(d=>d.recado).length;$("#c5").textContent=ad;$("#c6").textContent=cr;
const q=$("#bq").value.toLowerCase();$("#ft").innerHTML="";
[["todos","Todos"],["vao","Presentes"],["nao","Ausentes"],["rec","Com mensagem"]].forEach(f=>{const b=document.createElement("button");b.type="button";b.textContent=f[1];b.className=F===f[0]?"on":"";b.onclick=()=>{F=f[0];render()};$("#ft").appendChild(b)});
const L=D.slice().reverse().filter(d=>(F==="todos"||(F==="vao"&&d.presenca==="Sim")||(F==="nao"&&d.presenca!=="Sim")||(F==="rec"&&d.recado))&&String(d.nome).toLowerCase().includes(q));
$("#ls").innerHTML=L.map(d=>{const v=d.presenca==="Sim";return '<div class="it"><span class="tg'+(v?'':' n')+'">'+(v?'Presente':'Ausente')+'</span><b>'+esc(d.nome)+'</b>'+(d.qtd>0?'<small>+'+d.qtd+': '+esc(d.nomesAcomp)+'</small>':'')+(d.recado?'<small>“'+esc(d.recado)+'”</small>':'')+'<small>'+new Date(d.enviadoEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+'</small></div>'}).join("")||'<p class="sub">Nenhuma resposta ainda.</p>'}
async function entrar(){sn=$("#sn").value;if(!sn&&!C.preview){$("#er").textContent="Digite a senha.";return}$("#go").disabled=true;const ok=await carregar();$("#go").disabled=false;if(ok){$("#lg").hidden=true;$("#pn").hidden=false;render()}}
$("#go").onclick=entrar;$("#sn").addEventListener("keydown",e=>{if(e.key==="Enter")entrar()});
$("#at").onclick=async()=>{if(await carregar())render()};$("#bq").oninput=render;
try{const v=localStorage.getItem("ia");if(v)$("#ia").value=v}catch(e){}
$("#ia").oninput=()=>{try{localStorage.setItem("ia",$("#ia").value)}catch(e){}render()};
if(C.mode==="lista")$("#ad").hidden=false;
$("#na").onclick=async()=>{const v=$("#nn").value.trim().replace(/\s+/g," "),m=$("#nm");if(v.length<3){m.textContent="Escreva o nome completo.";return}
$("#na").disabled=true;m.textContent="Salvando…";
try{const j=C.preview?{ok:true}:await post({acao:"addlista",nome:v});m.textContent=j.ok?(j.repetido?"Esse nome já está na lista.":"Nome incluído na lista."):"Não foi possível incluir.";if(j.ok&&!j.repetido)$("#nn").value=""}catch(e){m.textContent="Sem conexão com a planilha."}
$("#na").disabled=false};
$("#cs").onclick=()=>{const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const csv="\ufeff"+[["Data/hora","Nome","Presença","Qtd acompanhantes","Acompanhantes","Mensagem"]].concat(D.map(d=>[d.enviadoEm,d.nome,d.presenca,d.qtd,d.nomesAcomp,d.recado])).map(r=>r.map(q).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="respostas.csv";a.click()};
})();
