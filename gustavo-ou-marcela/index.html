@media(prefers-reduced-motion:reduce){.tl.on,.fn.on,.rv .ar,#som{animation:none!important}}</style></head><body><div id="app"></div><script>(function convite(c){
 const D=document,K=c.cores,P=c.__p,f=c.form;
 const $=(t,cl,p)=>{const e=D.createElement(t);if(cl)e.className=cl;if(p)p.appendChild(e);return e};

 const app=D.getElementById('app'),st=$('div','st',app),AR=[];
 let ratio=9/16,ed=!!P,rev=0;

 if(ed)app.classList.add('ed');
 const tell=(k,o)=>{if(!P)return;const v={};['l','t','w','h','x','y'].forEach(n=>{if(typeof o[n]==='number')v[n]=o[n]});parent.postMessage({cv:1,k:k,v:v},'*')};
 const tela=img=>{const t=$('section','tl',st),i=$('img','',t);i.alt='';i.draggable=false;i.src=img;return t};
 const capa=tela(c.imgCapa),jogo=tela(c.imgJogo),fim=tela(c.imgFinal),fimA=c.imgFinalAzul?tela(c.imgFinalAzul):fim,T={capa:capa,jogo:jogo,fim:fim,fimA:fimA};
 fim.classList.add('fn');fimA.classList.add('fn');
 const place=(el,o,m)=>{

 };
 /* arrastar e redimensionar (só no modo Posicionar da prévia) */
 function drag(el,k,o,m){

  el.addEventListener('pointerdown',e=>{
   if(!ed)return;e.preventDefault();e.stopPropagation();

 const ic=capa.firstChild,setR=()=>{if(ic.naturalWidth){ratio=ic.naturalWidth/ic.naturalHeight;fit()}};
 ic.onload=setR;

 /* toque para abrir (capa) */

 /* textos */
 const alvo=t=>[...new Set(t=='fims'?[fim,fimA]:[T[t]])].filter(Boolean);
 c.textos.forEach((o,i)=>{
  if(!o.t)return;
  alvo(o.tela).forEach(p=>{
   const d=$('div','tx ob',p);d.textContent=o.t;d.style.color=o.cor;d.style.fontFamily=o.fonte;d.style.setProperty('--s',o.tam);

 });

 let fmEl=null;

  alvo(o.tela).forEach(p=>{
   const a=$('a','bt ob',p);a.textContent=o.txt;a.style.background=o.cor;a.style.color=o.corTxt;a.style.setProperty('--s',o.tam);
   a.href=o.tipo=='link'&&o.url?o.url:'#';if(o.tipo=='link'){a.target='_blank';a.rel='noopener'}

  });
 });

 /* áreas de raspar: só revelam a arte que já está por baixo */
 const nr=c.areas.filter(a=>a.ind=='rosa').length,na=c.areas.filter(a=>a.ind=='azul').length;
 const win=nr>na?'rosa':na>nr?'azul':(nr+na?null:'todas');
 let falta=win?c.areas.filter(a=>win=='todas'||a.ind==win).length:0;
 const rr=(x,a,b,w,h,r)=>{x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
 c.areas.forEach((o,i)=>{
  const ar=$('div','ar ob',jogo),cv=$('canvas','',ar);ar.dataset.r=1;AR.push([ar,o]);
  if(o.ind=='rosa'||o.ind=='azul'){const ib=$('b','ib',ar);ib.style.setProperty('--i',o.ind=='rosa'?'#ff4fa3':'#2d9cf0')}
  let W=300,H=300,N=20,cov=new Uint8Array(N*N),val=new Uint8Array(N*N),nv=1,hit=0,feito=0,ult=null,rasp=0,lim=c.limiar/100;
  const x=cv.getContext('2d',{willReadFrequently:true});
  const init=im=>{
   if(im){const m=Math.min(1,600/Math.max(im.naturalWidth,im.naturalHeight));W=Math.round(im.naturalWidth*m);H=Math.round(im.naturalHeight*m);ar.dataset.r=H/W}
   cv.width=W;cv.height=H;
   if(im)x.drawImage(im,0,0,W,H);
   else{
    const sq=o.forma=='quadrado',g=x.createLinearGradient(0,0,W,H);
    [[0,o.c1],[.25,o.c2],[.5,o.c3],[.75,mix(o.c2,-.12)],[1,o.c1]].forEach(s=>g.addColorStop(s[0],s[1]));
    x.fillStyle=g;x.beginPath();if(sq)rr(x,0,0,W,H,W*.06);else x.arc(W/2,H/2,W/2,0,7);x.fill();
    x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=W*.017;x.beginPath();if(sq)rr(x,W*.03,H*.03,W*.94,H*.94,W*.04);else x.arc(W/2,H/2,W*.47,0,7);x.stroke();
    for(let k=0;k<1000;k++){const px=Math.random()*W,py=Math.random()*H;if(sq||Math.hypot(px-W/2,py-H/2)<W*.48){x.fillStyle=Math.random()>.5?'rgba(255,255,255,.13)':'rgba(100,60,0,.08)';x.fillRect(px,py,2,2)}}
   }
   val.fill(1);
   try{const d=x.getImageData(0,0,W,H).data;for(let j=0;j<N;j++)for(let k=0;k<N;k++)val[j*N+k]=d[(((((j+.5)*H/N)|0)*W)+(((k+.5)*W/N)|0))*4+3]>80?1:0}catch(_){lim*=.6}
   nv=val.reduce((a,b)=>a+b,0)||1;fit();
  };
  if(o.forma=='png'&&o.img){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>init(im);im.onerror=()=>{const i2=new Image();i2.onload=()=>init(i2);i2.onerror=()=>init(null);i2.src=o.img};im.src=o.img}else init(null);
  place(ar,o,'sq');drag(ar,'areas.'+i,o,'sq');
  const mark=p=>{const r=Math.min(W,H)*.11;for(let j=0;j<N;j++)for(let k=0;k<N;k++){const n=j*N+k;if(cov[n]||!val[n])continue;if(Math.hypot((k+.5)*W/N-p.x,(j+.5)*H/N-p.y)<=r){cov[n]=1;hit++}}};
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};

 /* efeito mágico */

 /* formulário de presença via WhatsApp */
 function criaForm(){
  fmEl=$('div','fm',st);fmEl.style.cssText='--fc:'+f.cor+';--ff:'+f.fundo+';--ft:'+f.texto;
  const op=g=>'<div class="op" data-g="'+g+'"><button type="button" data-v="1">'+E(f.sim)+'</button><button type="button" data-v="0">'+E(f.nao)+'</button></div>';

  const upd=()=>{q('.fs').hidden=sel.v!==1;q('.fa').hidden=!(sel.v===1&&sel.s===0);if(!q('.fa').hidden&&!q('.fl').children.length)add()};
  fmEl.addEventListener('click',e=>{
   const b=e.target.closest('button');
   if(e.target===fmEl||(b&&b.classList.contains('fx'))){fmEl.classList.remove('on');return}
   if(!b)return;
   const g=b.parentNode.dataset.g;
   if(g){sel[g]=+b.dataset.v;[].forEach.call(b.parentNode.children,x=>x.classList.toggle('on',x===b));upd();return}
   if(b.classList.contains('ad')){add();return}
   if(b.classList.contains('en')){

    const ac=[].map.call(fmEl.querySelectorAll('.rw'),r=>({n:r.querySelector('.an').value.trim(),c:r.querySelector('.cr').checked,i:r.querySelector('.id').value.trim()})).filter(a=>a.n);
    let ok=!!(nome&&num&&sel.v!==null);
    if(sel.v===1&&(sel.s===null||(sel.s===0&&!ac.length)))ok=false;
    q('.er').hidden=ok;if(!ok)return;
    const L=[f.mSaud.replace('{nome}',nome)];
    if(sel.v===1){L.push(f.mConf.replace('{evento}',f.evento));if(sel.s===0){L.push(f.mAcomp);ac.forEach(a=>L.push('- '+a.n+(a.c?' ('+f.mCrianca+(a.i?', '+a.i+' '+f.mAnos:'')+')':'')))}}
    else L.push(f.mNao);
    const a=D.createElement('a');a.href='https://wa.me/'+num+'?text='+encodeURIComponent(L.join('\n'));a.target='_blank';a.rel='noopener';D.body.appendChild(a);a.click();a.remove();
