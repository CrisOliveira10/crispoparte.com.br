<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Taynara & Allan</title>

<style>
    body {
        margin: 0;
        background: #000;
        overflow: hidden;
    }

    .page {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .bg {
        width: 100%;
        height: 100%;
        background-image: url('abrir.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        cursor: pointer;
    }
</style>
</head>

<body>

    <div style="display: none !important; visibility: hidden; pointer-events: none;" aria-hidden="true">
        © 2026 Cristiane Oliveira. Todos os direitos reservados. 
        Este software, design e algoritmos estão protegidos pela Lei de Direitos Autorais (Lei nº 9.610/98). 
        A extração, cópia ou redistribuição deste código sem autorização expressa da Cristiane Oliveira (crispoparte) é terminantemente proibida.
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <div class="page">
        <div class="bg" id="btnAbrir"></div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const botao = document.getElementById('btnAbrir');

        // Ação principal: Áudio + PDF
        botao.addEventListener('click', () => {
            audio.play().catch(error => {
                console.error("Erro ao tocar áudio:", error);
            });
            window.open('pagina3.pdf', '_blank');
        }, { once: false });

        // Script de Segurança e Direitos Autorais
        (function() {
            // Bloqueia clique direito
            document.addEventListener('contextmenu', e => e.preventDefault());
            
            // Bloqueia F12, Ctrl+U, Ctrl+Shift+I, Ctrl+C e Ctrl+S
            document.addEventListener('keydown', function(e) {
                if (e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85) || 
                   (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
                   (e.ctrlKey && e.keyCode == 67) || (e.ctrlKey && e.keyCode == 83)) {
                    e.preventDefault();
                    return false;
                }
            });

            // Mensagem de alerta no Console
            console.log("%c Protegido pela Lei 9.610/98 - Autoria: Cristiane Oliveira ", "color: white; background: red; font-weight: bold; font-size: 14px;");
            console.log("A cópia não autorizada deste código é proibida.");
        })();
    </script>
</body> 
</html>
