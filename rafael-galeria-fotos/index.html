<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rafael - Instamomentos</title>

    <!-- Conexoes antecipadas: o navegador abre os canais antes de precisar deles -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://i.ibb.co">
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
    
    <!-- Bibliotecas auxiliares: Cropper.js e JSZip -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- Cropper.js e JSZip agora carregam sob demanda (estudio de foto / ZIP), para nao disputar banda com o feed -->

    <style>
        :root { --cor-fundo: #121212; --cor-texto: #ffffff; --cor-destaque: #0285B1; --cor-secundaria: #8E8E8E; --card-bg: #1e1e1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        /* TELA DE CAPA (STORY 9:16) */
        #storyCapaScreen {
            position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background-color: #000; z-index: 99999; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        #storyCapaScreen img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }

        /* App Principal */
        #mainAppContainer { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; width: 100%; }
        .event-header { width: 100%; background-color: #000; overflow: hidden; }
        .event-header img { width: 100%; height: 180px; display: block; object-fit: cover; }
        .event-info { text-align: center; padding: 12px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(18,18,18,1) 100%); }
        .event-info h1 { font-size: 1.3rem; color: var(--cor-destaque); margin-bottom: 3px; font-weight: bold; }
        .event-info p { font-size: 0.8rem; color: #aaa; }

        .nav-tabs { display: flex; background-color: var(--card-bg); border-bottom: 2px solid #333; }
        .tab-btn { flex: 1; padding: 12px 6px; background: none; border: none; color: #888; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-align: center; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { color: var(--cor-destaque); border-bottom: 3px solid var(--cor-destaque); background-color: rgba(255, 51, 102, 0.05); }

        .container-conteudo { padding: 15px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
        .section-tab { display: none; }
        .section-tab.active { display: block; }

        .capture-box { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .capture-box h3 { margin-bottom: 5px; font-size: 1.1rem; }
        .options-group { margin: 15px 0; display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; color: #ccc; }
        .btn-acao { background-color: var(--cor-destaque); color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3); }
        .btn-secundario { background-color: #333; color: #fff; box-shadow: none; }

        .feed-grid { display: flex; flex-direction: column; gap: 20px; }
        .feed-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .media-container { position: relative; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
        .media-container img, .media-container video { width: 100%; max-height: 450px; display: block; object-fit: contain; }
        .feed-actions { padding: 12px; display: flex; align-items: center; gap: 15px; justify-content: space-between; }
        .feed-actions-left { display: flex; align-items: center; gap: 15px; }
        .like-btn, .comment-count-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 5px; }
        .btn-baixar-card { background: #333; color: #fff; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-baixar-card:hover { background: var(--cor-destaque); }

        /* INTERFACE DA CÂMERA COM TRAVA RETRATO 9:16 RIGOROSA */
        .camera-container { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background-color: #000; z-index: 1000; display: none; overflow: hidden; touch-action: none; }
        .video-wrapper { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); width: min(100vw, calc(100dvh * 9 / 16)); height: min(100dvh, calc(100vw * 16 / 9)); z-index: 1; overflow: hidden; background: #000; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; transform-origin: center center; transition: transform 0.05s linear; }
        #molduraOverlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; z-index: 2; }
        
        .flash-effect { position: absolute; inset: 0; background: #fff; z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.15s ease-out; }

        .camera-header { position: absolute; top: 0; width: 100%; padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); display: flex; justify-content: space-between; align-items: center; }
        .btn-fechar { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        
        #recordingTimerBadge { display: none; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; border: 1px solid #ff3366; }

        .camera-controles { position: absolute; bottom: 0; width: 100%; padding: 40px 20px; padding-bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px)); z-index: 10; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; flex-direction: column; gap: 20px; }
        .filtros { display: flex; gap: 10px; justify-content: center; }
        .btn-filtro { background-color: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; }
        .btn-filtro.ativo { background-color: var(--cor-destaque); border-color: var(--cor-destaque); }
        .acoes-principais { display: flex; justify-content: space-around; align-items: center; }
        .btn-acao-camera { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; width: 60px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn-acao-camera span { font-size: 0.65rem; color: #fff; margin-top: 4px; font-weight: bold; }
        .btn-capturar-final { width: 75px; height: 75px; border-radius: 50%; background-color: #fff; border: 5px solid rgba(255,255,255,0.3); cursor: pointer; transition: transform 0.1s, background-color 0.2s; }
        .btn-capturar-final:active { transform: scale(0.9); }

        /* MODO TELÃO (SLIDESHOW COM BOTÃO DE ZIP) */
        #telaoModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .telao-topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%); z-index: 10000; flex-wrap: wrap; gap: 10px; }
        .telao-topbar h2 { color: var(--cor-destaque); font-size: 1.3rem; text-shadow: 0 2px 5px rgba(0,0,0,0.8); margin: 0; }
        .telao-topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .telao-filtros { display: flex; gap: 8px; }
        .telao-filtro-btn { background: #333; color: #aaa; border: none; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .telao-filtro-btn.ativo { background: var(--cor-destaque); color: #fff; }
        .btn-baixar-tudo { background: #28a745; color: #fff; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: opacity 0.2s; }
        .btn-baixar-tudo:hover { opacity: 0.9; }
        .close-telao { background: #ff3366; color: #fff; border: none; padding: 8px 16px; font-size: 0.9rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .telao-body { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .telao-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: #fff; border: 2px solid rgba(255,255,255,0.2); font-size: 2rem; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10005; transition: 0.2s; }
        .telao-nav:hover { background: var(--cor-destaque); border-color: var(--cor-destaque); }
        .telao-prev { left: 25px; }
        .telao-next { right: 25px; }

        /* MODAL DE FOTO/VÍDEO E COMENTÁRIOS */
        .modal-foto { position: fixed; inset: 0; background-color: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .btn-fechar-modal { position: absolute; top: 25px; left: 20px; background: none; border: none; color: #fff; font-size: 1.1rem; cursor: pointer; z-index: 2010; font-weight: bold; }
        .modal-media-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; max-height: 42vh; margin-bottom: 8px; }
        .modal-media-wrapper img, .modal-media-wrapper video { max-width: 90%; max-height: 42vh; object-fit: contain; border-radius: 8px; }
        .modal-acoes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
        .btn-acao-modal { background-color:#333; color:white; padding:8px 14px; border-radius:25px; border:none; font-weight:bold; cursor: pointer; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; }

        .modal-comentarios-container { width: 100%; max-width: 450px; background: #1a1a1a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; max-height: 38vh; border: 1px solid #333; }
        .modal-comentarios-lista { flex: 1; overflow-y: auto; list-style: none; padding-right: 5px; margin-bottom: 8px; }
        .comentario-item { font-size: 0.85rem; color: #ccc; margin-bottom: 6px; border-bottom: 1px dashed #333; padding-bottom: 4px; text-align: left; }
        
        .comentario-form { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .comentario-form input#inputNomeConvidado { width: 100%; background: #2a2a2a; border: 1px solid #444; padding: 8px 12px; border-radius: 20px; color: #fff; font-size: 16px; outline: none; }
        .comentario-linha-inferior { display: flex; gap: 6px; width: 100%; }
        .comentario-linha-inferior input#inputTextoComentario { flex: 1; min-width: 0; background: #2a2a2a; border: 1px solid #444; padding: 8px 12px; border-radius: 20px; color: #fff; font-size: 16px; outline: none; }
        .comentario-linha-inferior button#btnEnviarComentarioModal { background: var(--cor-destaque); border: none; color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; flex: 0 0 auto; }

        .toast-aviso { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: rgba(0,0,0,0.88); color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 0.85rem; z-index: 100001; display: none; max-width: 90%; text-align: center; border: 1px solid #444; }
        .btn-carregar-mais { margin-bottom: 20px; }

        .file-input-hidden { display: none; }
    </style>
</head>
<body>

    <!-- TELA DE CAPA STORY -->
    <div id="storyCapaScreen" onclick="window.entrarNoApp()" style="display: flex; position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: #000; z-index: 99999; justify-content: center; align-items: center;">
        <img src="https://res.cloudinary.com/dh20cfdvx/image/upload/f_auto,q_auto,c_limit,w_1080/v1792066499/Filtro_365_sorrisos_1_yjp7gm.png" alt="Capa Story" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="window.entrarNoApp()">
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="mainAppContainer">
        <header class="event-header">
            <img src="https://res.cloudinary.com/dh20cfdvx/image/upload/f_auto,q_auto,c_limit,w_1080/v1792066222/minha-arte_2_xz5eg9.png" alt="Capa do Evento">
        </header>
        <div class="event-info">
            <h1>Rafael</h1>
            <p>27 de abril de 2027</p>
        </div>

        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('capture')">📸 Câmera</button>
            <button class="tab-btn" onclick="switchTab('photosFeed')">🖼️ Fotos</button>
            <button class="tab-btn" onclick="switchTab('videosFeed')">🎥 Vídeos</button>
            <button class="tab-btn" onclick="openTelao()" style="color: #4285F4;">🖥️ Telão</button>
        </nav>

        <div class="container-conteudo">
            <div id="capture" class="section-tab active">
                <div class="capture-box">
                    <h3>Compartilhe seu Momento</h3>
                    <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">Vídeos aceitam até 30s em retrato (9:16).</p>

                    <div class="options-group">
                        <label><input type="radio" name="frameMode" value="withFrame" checked> Com Moldura</label>
                        <label><input type="radio" name="frameMode" value="noFrame"> Sem Moldura</label>
                    </div>

                    <button class="btn-acao" onclick="openCamera('photo')">Tirar Foto (Câmera)</button>
                    <button class="btn-acao" onclick="openCamera('video')">Gravar Vídeo (Até 30s)</button>
                    <button class="btn-acao btn-secundario" onclick="document.getElementById('galleryInput').click()">Enviar da Galeria</button>
                    <input type="file" id="galleryInput" class="file-input-hidden" accept="image/*,video/*" onchange="handleGalleryUpload(event)">
                </div>
            </div>

            <div id="photosFeed" class="section-tab">
                <div class="feed-grid" id="photoGridContainer"></div>
                <button id="btnMaisFotos" class="btn-acao btn-secundario btn-carregar-mais" style="display:none;" onclick="carregarMais()">Carregar mais</button>
            </div>

            <div id="videosFeed" class="section-tab">
                <div class="feed-grid" id="videoGridContainer"></div>
                <button id="btnMaisVideos" class="btn-acao btn-secundario btn-carregar-mais" style="display:none;" onclick="carregarMais()">Carregar mais</button>
            </div>
        </div>
    </div>

    <!-- MODO TELÃO COM BOTÃO DE ZIP -->
    <div id="telaoModal">
        <div class="telao-topbar">
            <h2>Rafael - Ao Vivo</h2>
            <div class="telao-topbar-right">
                <div class="telao-filtros">
                    <button class="telao-filtro-btn ativo" onclick="setTelaoFilter('todos', this)">Todos</button>
                    <button class="telao-filtro-btn" onclick="setTelaoFilter('fotos', this)">🖼️ Fotos</button>
                    <button class="telao-filtro-btn" onclick="setTelaoFilter('videos', this)">🎥 Vídeos</button>
                </div>
                <button class="btn-baixar-tudo" onclick="baixarTudoZip()">📦 Baixar Tudo (ZIP)</button>
                <button class="close-telao" onclick="closeTelao()">Fechar Telão</button>
            </div>
        </div>
        <div class="telao-body" id="telaoMediaContainer">
            <button class="telao-nav telao-prev" onclick="telaoAnterior()">❮</button>
            <button class="telao-nav telao-next" onclick="telaoProximo()">❯</button>
        </div>
    </div>

    <div id="toastAviso" class="toast-aviso"></div>

    <!-- INTERFACE DA CÂMERA -->
    <div id="cameraContainer" class="camera-container">
        <div class="flash-effect" id="flashEffect"></div>
        <div class="camera-header">
            <button id="btnFecharCamera" class="btn-fechar">❌ Voltar</button>
            <div id="recordingTimerBadge">
                🔴 <span id="timerCount">00:00</span> / 00:30
            </div>
        </div>
        <div class="video-wrapper" id="videoWrapper">
            <video id="videoElement" autoplay playsinline muted></video>
            <img id="molduraOverlay" src="https://res.cloudinary.com/dh20cfdvx/image/upload/v1792066499/Filtro_365_sorrisos_b6gkuk.png" crossorigin="anonymous" alt="Moldura">
        </div>
        <div class="camera-controles">
            <div class="filtros" id="grupoFiltros">
                <button id="btnFiltroNormal" class="btn-filtro ativo">Normal</button>
                <button id="btnFiltroPB" class="btn-filtro">P&B</button>
            </div>
            <div class="acoes-principais">
                <button id="btnUploadFoto" class="btn-acao-camera">🖼️<span>Galeria</span></button>
                <input type="file" id="inputUploadArquivo" class="file-input-hidden" accept="image/*,video/*" onchange="handleGalleryUpload(event)">
                <button id="btnFlash" class="btn-acao-camera">⚡<span>Flash</span></button>
                <button id="btnCapturarFinal" class="btn-capturar-final"></button>
                <button id="btnVideoLink" class="btn-acao-camera" style="color: #FFD700;">🎬<span>Vídeo</span></button>
                <button id="btnInverterCamera" class="btn-acao-camera">🔄<span>Trocar</span></button>
            </div>
        </div>
    </div>

    <!-- MODAL DE PREVIEW DA CÂMERA -->
    <div id="modalPreviewCamera" class="modal-foto" style="z-index: 3000;">
        <h3 style="color: white; margin-bottom: 10px;">Gostou da foto?</h3>

            <img id="imgPreviewCamera" style="display: block; width: 100%; height: 100%; object-fit: contain;">
            <img id="molduraPreviewCamera" src="https://res.cloudinary.com/dh20cfdvx/image/upload/v1792066499/Filtro_365_sorrisos_b6gkuk.png" crossorigin="anonymous" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; z-index: 3010; display: none;">
        </div>
        <div class="modal-acoes" style="margin-top: 15px;">
            <button id="btnDescartarFoto" class="btn-acao-modal" style="background-color:#ff4444;">❌ Tentar Novamente</button>
            <button id="btnEnviarFotoCamera" class="btn-acao-modal" style="background-color:var(--cor-destaque);">✅ Enviar Foto</button>
        </div>
    </div>

    <!-- MODAL DE ESTÚDIO / CORTE -->
    <div id="modalEstudio" class="modal-foto" style="z-index: 3000;">
        <h3 style="color: white; margin-bottom: 10px;">Ajuste sua foto com o toque</h3>
        <div style="width: 100%; max-width: 320px; aspect-ratio: 9 / 16; background-color: #000; overflow: hidden; border-radius: 12px; position: relative;">
            <img id="imagemParaCortar" style="display: block; max-width: 100%;">
            <img id="molduraEstudio" src="https://res.cloudinary.com/dh20cfdvx/image/upload/v1792066499/Filtro_365_sorrisos_b6gkuk.png" crossorigin="anonymous" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; z-index: 3010;">
        </div>
        <div class="modal-acoes" style="margin-top: 15px;">
            <button id="btnCancelarCorte" class="btn-acao-modal" style="background-color:#ff4444;">❌ Cancelar</button>
            <button id="btnConfirmarCorte" class="btn-acao-modal" style="background-color:var(--cor-destaque);">✅ Enviar Foto</button>

<script type="module">

    const firebaseConfig = {

        projectId: "insta-momentos-drive",
        appId: "1:235265106885:web:3a4c77698c6d0392e221ac"
    };
    
    const IMGBB_API_KEY = "aa0c9dc6122e459a16cf1f6e8d9d3686";

        function playCameraShutterSound() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                if (!audioCtxObturador) audioCtxObturador = new Ctx();
                const audioCtx = audioCtxObturador;
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function drawToCanvas(ctx, canvasWidth, canvasHeight, withMoldura) {
            const vWidth = videoElement.videoWidth || canvasWidth;
            const vHeight = videoElement.videoHeight || canvasHeight;
            const canvasRatio = canvasWidth / canvasHeight;
            const videoRatio = vWidth / vHeight;
            
            let sWidth = vWidth;
            let sHeight = vHeight;
            
            if (videoRatio > canvasRatio) {
                sWidth = vHeight * canvasRatio;
            } else {
                sHeight = vWidth / canvasRatio;
            }
            
            const zW = sWidth / currentZoom;
            const zH = sHeight / currentZoom;
            const sX = (vWidth - zW) / 2;
            const sY = (vHeight - zH) / 2;

            ctx.save();
            if (usandocameraFrontal) { 
                ctx.translate(canvasWidth, 0); 
                ctx.scale(-1, 1); 
            }
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            ctx.drawImage(videoElement, sX, sY, zW, zH, 0, 0, canvasWidth, canvasHeight);
            ctx.restore();

            if (filtroPBAtivo) {
                ctx.save();
                ctx.globalCompositeOperation = 'saturation';
                ctx.fillStyle = 'hsl(0, 0%, 50%)';
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.restore();
            }
            
            if (withMoldura && molduraOverlay.complete && molduraOverlay.naturalWidth > 0) {
                ctx.drawImage(molduraOverlay, 0, 0, canvasWidth, canvasHeight);
            }
        }

        function prepareVideoRecorder() {
            recordedChunks = [];
            if (!recordCanvas) {
                recordCanvas = document.createElement('canvas');
                recordCanvas.style.position = 'fixed';
                recordCanvas.style.top = '-9999px';
                recordCanvas.style.opacity = '0';
                document.body.appendChild(recordCanvas);

            recordCanvas.width = 720;
            recordCanvas.height = 1280;
            recordCtx = recordCanvas.getContext('2d');

            const canvasStream = recordCanvas.captureStream(30);
            const audioTracks = stream.getAudioTracks();
            if (audioTracks.length > 0) {
                canvasStream.addTrack(audioTracks[0]);
            }

            let options = { mimeType: 'video/mp4', videoBitsPerSecond: 800000 };
            try {
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 800000 };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm', videoBitsPerSecond: 800000 };
                    }
                }
                mediaRecorder = new MediaRecorder(canvasStream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(canvasStream);
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = async () => {
                clearInterval(recordingTimer);
                if (videoRecordingFrameId) cancelAnimationFrame(videoRecordingFrameId);
                hideRecordingTimer();
                
                if (descartarVideo) { descartarVideo = false; recordedChunks = []; return; }
                const mimeType = mediaRecorder.mimeType || 'video/webm';
                let ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                
                const blob = new Blob(recordedChunks, { type: mimeType });
                const file = new File([blob], "Instamomento_Video_" + Date.now() + "." + ext, { type: blob.type });
                
                fecharInterface();
                await enviarVideoServidores(file);
            };
        }

        // FILA DE UPLOAD RESILIENTE (FALHAS DE INTERNET / OFFLINE) - IndexedDB (nao estoura a cota do localStorage)
        function filaAbrir() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) { reject(new Error('sem indexedDB')); return; }
                const req = indexedDB.open('insta_fila_' + EVENTO_ID, 1);
                req.onupgradeneeded = () => { req.result.createObjectStore('fila', { autoIncrement: true }); };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function filaAdicionar(base64) {
            try {
                const bd = await filaAbrir();
                return await new Promise((resolve) => {
                    const tx = bd.transaction('fila', 'readwrite');
                    tx.objectStore('fila').add({ tipo: 'foto', dados: base64, ts: Date.now() });
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = () => resolve(false);
                    tx.onabort = () => resolve(false);
                });
            } catch (e) { return false; }
        }

        async function filaListar() {
            const bd = await filaAbrir();
            return new Promise((resolve, reject) => {
                const itens = [];
                const cur = bd.transaction('fila', 'readonly').objectStore('fila').openCursor();
                cur.onsuccess = () => {
                    const c = cur.result;
                    if (c) { itens.push({ key: c.key, dados: c.value.dados }); c.continue(); }
                    else resolve(itens);
                };
                cur.onerror = () => reject(cur.error);
            });
        }

        async function filaRemover(key) {
            const bd = await filaAbrir();
            return new Promise((resolve) => {
                const tx = bd.transaction('fila', 'readwrite');
                tx.objectStore('fila').delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            });
        }

        let processandoFila = false;
        async function processarFilaOffline() {
            if (processandoFila || !navigator.onLine) return;
            processandoFila = true;
            try {
                const itens = await filaListar();
                for (const item of itens) {
                    try {
                        await enviarMidiaServidores(item.dados, 'foto', true);
                        await filaRemover(item.key);
                        mostrarAviso("✅ Foto da fila enviada!", 2500);
                    } catch (err) {
                        // continua na fila; tenta de novo depois
                    }
                }
            } catch (e) {
            } finally {
                processandoFila = false;
            }
        }
        window.addEventListener('online', processarFilaOffline);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) processarFilaOffline(); });
        setInterval(processarFilaOffline, 45000);
        processarFilaOffline();

        async function enviarMidiaServidores(base64Data, tipo = 'foto', daFila = false) {
            if (!navigator.onLine && !daFila) {
                if (await filaAdicionar(base64Data)) {
                    alert("⚠️ Sem conexão com a internet! Sua foto foi salva na fila e será enviada assim que o sinal voltar.");
                    return 'fila';
                }
                throw new Error("Sem conexão e não foi possível guardar a foto na fila. Tente novamente.");
            }

            let resposta = null;
            try {
                const form = new FormData();
                form.append('image', base64Data);
                resposta = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, { method: 'POST', body: form });
            } catch (e) {
                resposta = null;
            }

            // Falha de rede ou servidor fora do ar: guarda na fila (nunca perde a foto em silencio)
            if (!resposta || resposta.status >= 500) {
                if (!daFila && await filaAdicionar(base64Data)) {
                    alert("📶 Sem sinal estável. Sua foto foi guardada e será enviada automaticamente quando a conexão voltar.");
                    return 'fila';
                }
                throw new Error("Sem conexão estável com o serviço de imagens.");
            }

            let d = null;
            try { d = await resposta.json(); } catch (e) {}
            if (!d || !d.success || !d.data) {
                throw new Error((d && d.error && d.error.message) || "O serviço de imagens não aceitou a foto.");
            }
            const imgUrl = d.data.url;
            const previewUrl = (d.data.medium && d.data.medium.url) || (d.data.thumb && d.data.thumb.url) || d.data.url;

            // 1) Publica no feed primeiro: o convidado nao espera o Drive
            await addDoc(collection(db, "eventos/" + EVENTO_ID + "/postagens"), {

        async function enviarVideoServidores(file) {
            if (!CLOUD_NAME || !UPLOAD_PRESET) {
                alert("O envio de vídeos não está configurado neste evento.");
                return;
            }

            let videoUrl = "";
            while (!videoUrl) {
                try {
                    mostrarAviso("⏳ Enviando vídeo... não feche o aplicativo.", 0);
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    formData.append('folder', EVENTO_ID);
                    const resCloud = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const cloudData = await resCloud.json();
                    if (!resCloud.ok || !cloudData.secure_url) {
                        throw new Error((cloudData && cloudData.error && cloudData.error.message) || 'o servidor recusou o vídeo');
                    }
                    videoUrl = cloudData.secure_url;
                } catch (err) {
                    esconderAviso();
                    if (!confirm("Não foi possível enviar o vídeo (" + err.message + "). Tentar novamente?")) return;
                }
            }
            esconderAviso();

            const previewUrl = criarPreviewVideoCloudinary(videoUrl);

            await addDoc(collection(db, "eventos/" + EVENTO_ID + "/postagens"), {
                url_imagem: videoUrl,
                preview_url: previewUrl || '',

                curtidas: 0,

                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',

                            body: JSON.stringify({

        }

        // GALERIA DE FOTOS — carregamento sob demanda + insercao incremental
        let fotoObserver = null;

        function carregarImagemLazy(img) {
            const url = img.dataset.src;
            if (!url || img.dataset.loaded === '1') return;
            img.dataset.loaded = '1';
            img.src = url;
        }

        function observarImagens(raiz) {
            const imagens = raiz.querySelectorAll('img[data-src]');
            if (!('IntersectionObserver' in window)) { imagens.forEach(carregarImagemLazy); return; }
            if (!fotoObserver) {
                fotoObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            carregarImagemLazy(entry.target);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '500px 0px' });
            }
            imagens.forEach(img => fotoObserver.observe(img));
        }

        // BAIXAR: o atributo "download" e ignorado em links de outro dominio.
        // iPhone/iPad: abre a folha de compartilhar (Salvar na galeria). Demais: baixa o arquivo.
        window.baixarMidia = async function(url, tipo) {
            mostrarAviso("⏳ Preparando download...", 0);
            try {
                const resp = await fetch(url, { mode: 'cors' });
                if (!resp.ok) throw new Error('http ' + resp.status);
                const blob = await resp.blob();
                const ext = tipo === 'video' ? (/webm/i.test(blob.type) ? 'webm' : 'mp4') : 'jpg';
                const nome = 'Instamomento_' + Date.now() + '.' + ext;
                const arquivo = new File([blob], nome, { type: blob.type || (tipo === 'video' ? 'video/mp4' : 'image/jpeg') });
                esconderAviso();
                const ehIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
                if (ehIOS && navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                    try { await navigator.share({ files: [arquivo] }); return; }
                    catch (e) { if (e && e.name === 'AbortError') return; }
                }
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = nome;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
            } catch (e) {
                esconderAviso();
                window.open(url, '_blank');
            }
        };

            imgs.forEach(img => {
                if (img.src && img.src.startsWith('blob:')) {
                    URL.revokeObjectURL(img.src);
                }
            });
            document.getElementById('telaoModal').style.display = 'none';
            if (telaoTimer) clearTimeout(telaoTimer);
            container.innerHTML = "";
        }

        window.setTelaoFilter = (filtro, btnEl) => {
            telaoFilter = filtro;
            telaoIndex = 0;
            document.querySelectorAll('.telao-filtro-btn').forEach(b => b.classList.remove('ativo'));
            btnEl.classList.add('ativo');
            if (telaoTimer) clearTimeout(telaoTimer);
            startTelaoSlideshow();
        }

        window.telaoProximo = () => {
            if (telaoTimer) clearTimeout(telaoTimer);
            telaoIndex++;
            startTelaoSlideshow(true);
        }

        window.telaoAnterior = () => {
            if (telaoTimer) clearTimeout(telaoTimer);
            telaoIndex--;
            startTelaoSlideshow(true);
        }

        function getListaFiltrada() {
            if (telaoFilter === 'fotos') return telaoData.photos;
            if (telaoFilter === 'videos') return telaoData.videos;
            return [...telaoData.photos, ...telaoData.videos];
        }

        function startTelaoSlideshow(manual = false) {
            const container = document.getElementById('telaoMediaContainer');
            let list = getListaFiltrada();
            
            if(list.length === 0) {
                container.innerHTML = `<button class="telao-nav telao-prev" onclick="telaoAnterior()">❮</button><h3 style='color:#aaa;'>Nenhuma mídia encontrada para este filtro...</h3><button class="telao-nav telao-next" onclick="telaoProximo()">❯</button>`;
                return;
            }

            telaoIndex = (telaoIndex + list.length) % list.length;
            const item = list[telaoIndex];

            // Pre-carrega a proxima imagem: sem tela preta entre os slides
            const proximoItem = list[(telaoIndex + 1) % list.length];
            if (proximoItem && proximoItem.tipo !== 'video') { const pre = new Image(); pre.src = proximoItem.url; }

            if (item.tipo === 'video') {
                container.innerHTML = `
                    <button class="telao-nav telao-prev" onclick="telaoAnterior()">❮</button>
                    <video src="${item.url}" autoplay controls playsinline style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px; background:#000;"></video>
                    <button class="telao-nav telao-next" onclick="telaoProximo()">❯</button>
                `;
                const vidEl = container.querySelector('video');
                // Safari/TVs podem bloquear autoplay com som: tenta mudo; se ainda falhar, pula para o proximo
                const tentativaPlay = vidEl.play();
                if (tentativaPlay && tentativaPlay.catch) {
                    tentativaPlay.catch(() => {
                        vidEl.muted = true;
                        const segunda = vidEl.play();
                        if (segunda && segunda.catch) segunda.catch(() => {
                            telaoTimer = setTimeout(() => { telaoIndex++; startTelaoSlideshow(); }, 3000);
                        });
                    });
                }
                vidEl.onended = () => {
                    telaoIndex++;
                    startTelaoSlideshow();
                };
                vidEl.onerror = () => {
                    telaoTimer = setTimeout(() => { telaoIndex++; startTelaoSlideshow(); }, 3000);
                };
            } else {
                container.innerHTML = `
                    <button class="telao-nav telao-prev" onclick="telaoAnterior()">❮</button>
                    <img src="${item.url}" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px;">
                    <button class="telao-nav telao-next" onclick="telaoProximo()">❯</button>
                `;
                telaoTimer = setTimeout(() => {
                    telaoIndex++;
                    startTelaoSlideshow();
                }, 5000);
            }
        }

        window.baixarTudoZip = async function() {
            const senhaDigitada = prompt("Digite a Senha Admin para baixar o ZIP de todas as mídias:");
            if (!senhaDigitada) return;

            if (!navigator.onLine || !(await validarSenhaAdmin(senhaDigitada))) {
                alert("Senha incorreta ou sem conexão! Download bloqueado.");
                return;
            }

            // O ZIP le TODAS as midias do evento (o Telao so mantem as 200 mais recentes)
            let todasMidias = [];
            try {
                const snapTodas = await getDocs(query(collection(db, "eventos/" + EVENTO_ID + "/postagens"), orderBy("data_envio", "desc")));
                const todas = processarSnapshot(snapTodas);
                todasMidias = [...todas.photos, ...todas.videos];
            } catch (e) {
                alert("Não foi possível listar as mídias agora. Tente novamente.");
                return;
            }
            if (todasMidias.length === 0) {
                alert("Não há mídias para baixar no momento.");
                return;
            }

            try { await carregarScriptExterno(JSZIP_JS, 'JSZip'); } catch (e) {
                alert("Não foi possível carregar a biblioteca de compactação. Verifique a internet e tente de novo.");
                return;
            }

            const btnZip = document.querySelector('.btn-baixar-tudo');
            const textoOriginal = btnZip.innerHTML;
            btnZip.innerHTML = "📦 Compactando (0/" + todasMidias.length + ")...";
            btnZip.disabled = true;

            const zip = new JSZip();
            const pastaFotos = zip.folder("fotos");
            const pastaVideos = zip.folder("videos");

            let concluidas = 0;
            let falhas = 0;

            // 4 downloads ao mesmo tempo (antes era um por vez)
            let proximo = 0;
            const baixarUm = async () => {
                while (proximo < todasMidias.length) {
                    const i = proximo++;
                    const item = todasMidias[i];
                    try {
                        const response = await fetch(item.url);
                        if (!response.ok) throw new Error('http ' + response.status);
                        const blob = await response.blob();
                        const ext = item.tipo === 'video' ? (/webm/i.test(blob.type) ? 'webm' : 'mp4') : 'jpg';
                        const nomeArquivo = `${item.tipo}_${i + 1}_${item.id}.${ext}`;
                        if (item.tipo === 'video') pastaVideos.file(nomeArquivo, blob);
                        else pastaFotos.file(nomeArquivo, blob);
                    } catch (e) { falhas++; }
                    concluidas++;
                    btnZip.innerHTML = `📦 Compactando (${concluidas}/${todasMidias.length})...`;
                }
            };
            await Promise.all([baixarUm(), baixarUm(), baixarUm(), baixarUm()]);

            try {
                btnZip.innerHTML = "⏳ Gerando arquivo ZIP...";
                const content = await zip.generateAsync({ type: "blob" });
                const url = window.URL.createObjectURL(content);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Instamomentos_${EVENTO_ID}.zip`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { window.URL.revokeObjectURL(url); a.remove(); }, 4000);
                alert(falhas > 0 ? ("⚠️ ZIP gerado, mas " + falhas + " arquivo(s) não puderam ser baixados.") : "✅ Arquivo ZIP gerado e baixado com sucesso!");
            } catch (err) {
                alert("Erro ao gerar arquivo ZIP: " + err.message);
            } finally {
                btnZip.innerHTML = textoOriginal;
                btnZip.disabled = false;
            }
        };
        
        const btnVideoLink = document.getElementById('btnVideoLink');
        if (btnVideoLink) {
            btnVideoLink.onclick = () => {
                if(LINK_VIDEO_EXTERNO) window.open(LINK_VIDEO_EXTERNO, "_blank");
                else alert("Link externo não configurado.");
            };
        }

    } catch(e) {
        console.error('Falha ao iniciar o aplicativo:', e);
        const aviso = document.createElement('div');
        aviso.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:100000;background:#b00020;color:#fff;padding:12px;text-align:center;font-size:14px;';
        aviso.textContent = 'Não foi possível carregar o aplicativo. Atualize a página e tente novamente.';
        document.body.appendChild(aviso);
    }
</script>
