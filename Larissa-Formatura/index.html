<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apresentação Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background-color: #fff;
            overflow: hidden; 
        }

        /* Capa Invisível */
        #capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            z-index: 2000; /* Valor bem alto */
            cursor: pointer;
        }

        /* Container do PDF */
        #pdfArea {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: none;
            z-index: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botão Flutuante (Estilo sua foto) */
        #btnAudio {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 3000; /* Acima de tudo */
            display: none; 
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon { width: 32px; height: 32px; fill: #000; }
        .pause-icon { display: none; }
    </style>
</head>
<body>

    <div id="btnAudio" onclick="controlarAudio(event)">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="capa" onclick="ativarTudo()"></div>

    <div id="pdfArea">
        <iframe src="arquivo.pdf#toolbar=0&navpanes=0&scrollbar=1"></iframe>
    </div>

    <audio id="musica" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const som = document.getElementById('musica');
        const capa = document.getElementById('capa');
        const areaDoc = document.getElementById('pdfArea');
        const btn = document.getElementById('btnAudio');

        function ativarTudo() {
            // Tocar som imediatamente
            som.play().then(() => {
                console.log("Áudio tocando");
            }).catch(err => {
                console.log("Erro áudio:", err);
            });
            
            // Trocar telas
            capa.style.display = 'none';
            areaDoc.style.display = 'block';
            btn.style.display = 'flex';
            
            atualizarIcones(true);
        }

        function controlarAudio(e) {
            e.stopPropagation();
            if (som.paused) {
                som.play();
                atualizarIcones(true);
            } else {
                som.pause();
                atualizarIcones(false);
            }
        }

        function atualizarIcones(tocando) {
            document.querySelector('.play-icon').style.display = tocando ? 'none' : 'block';
            document.querySelector('.pause-icon').style.display = tocando ? 'block' : 'none';
        }
    </script>
</body>
</html>
