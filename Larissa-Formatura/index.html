<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apresentação Fluida</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; width: 100%; 
            background-color: #fff;
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* CAPA 1: Imagem Principal */
        #capa1 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            z-index: 5000; /* No topo de tudo */
            cursor: pointer;
        }

        /* CAPA 2: Sua Arte com botão Abrir */
        #capa2 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa2.jpg');
            background-size: cover;
            background-position: center;
            z-index: 4000;
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Botão ABRIR (Cor #105d4a) */
        .btn-abrir {
            background-color: #105d4a;
            color: white;
            padding: 18px 50px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: none;
            cursor: pointer;
            margin-top: 150px; /* Ajuste para sua arte */
        }

        /* Botão Flutuante Superior (Play/Pause) */
        #btnAudio {
            position: fixed;
            top: 25px; 
            right: 25px;
            width: 65px; 
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #105d4a;
            z-index: 6000; /* Acima de todas as capas e do PDF */
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .icon { width: 32px; height: 32px; fill: #105d4a; }
        .pause-icon { display: none; }

        /* Área do PDF Incorporado (Permite áudio durante navegação) */
        #pdfArea {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            z-index: 1000;
        }
        
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="btnAudio" onclick="controlarAudio(event)">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="capa1" onclick="passarParaCapa2()"></div>

    <div id="capa2">
        <button class="btn-abrir" onclick="abrirDoc()">ABRIR</button>
    </div>

    <div id="pdfArea">
        <iframe src="arquivo.pdf#toolbar=0&navpanes=0"></iframe>
    </div>

    <audio id="musica" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const som = document.getElementById('musica');
        const btnA = document.getElementById('btnAudio');
        const c1 = document.getElementById('capa1');
        const c2 = document.getElementById('capa2');
        const area = document.getElementById('pdfArea');

        function passarParaCapa2() {
            // LIBERA O ÁUDIO AQUI (Primeiro clique)
            som.play().catch(e => console.log("Áudio aguardando..."));
            
            c1.style.display = 'none';
            c2.style.display = 'flex';
            
            // O botão de controle aparece e não some mais
            btnA.style.display = 'flex';
            atualizarIcones(true);
        }

        function abrirDoc() {
            // Abre o PDF dentro da mesma página
            c2.style.display = 'none';
            area.style.display = 'block';
        }

        function controlarAudio(e) {
            e.stopPropagation();
            if (som.paused) {
                som.play();
                atualizarIcones(true);
            } else {
                som.pause();
                atualizarIcones(false);
            }
        }

        function atualizarIcones(tocando) {
            document.querySelector('.play-icon').style.display = tocando ? 'none' : 'block';
            document.querySelector('.pause-icon').style.display = tocando ? 'block' : 'none';
        }
    </script>
</body>
</html>
