<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apresentação Profissional</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; width: 100%; 
            background-color: #fff;
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* CAPA 1: Imagem Principal */
        #capa1 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            z-index: 3000;
            cursor: pointer;
            display: flex;
        }

        /* CAPA 2: Transição com o Botão Customizado */
        #capa2 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f4f4f4; /* Cor de fundo suave */
            z-index: 2000;
            display: none; /* Escondida inicialmente */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Botão com a cor #105d4a */
        .btn-abrir {
            background-color: #105d4a;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
        }

        /* Botão Flutuante Superior (Play/Pause) */
        #btnAudio {
            position: fixed;
            top: 20px; right: 20px;
            width: 60px; height: 60px;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #105d4a;
            z-index: 4000;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .icon { width: 30px; height: 30px; fill: #105d4a; }
        .pause-icon { display: none; }

        #pdfArea {
            width: 100%; height: 100vh;
            display: none;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="btnAudio" onclick="controlarAudio(event)">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="capa1" onclick="passarParaCapa2()"></div>

    <div id="capa2">
        <button class="btn-abrir" onclick="abrirPdf()">ABRIR DOCUMENTO</button>
    </div>

    <div id="pdfArea">
        <iframe src="arquivo.pdf"></iframe>
    </div>

    <audio id="musica" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const som = document.getElementById('musica');
        const btnA = document.getElementById('btnAudio');

        function passarParaCapa2() {
            // Toca o áudio no primeiro clique
            som.play();
            document.getElementById('capa1').style.display = 'none';
            document.getElementById('capa2').style.display = 'flex';
            btnA.style.display = 'flex';
            atualizarIcones(true);
        }

        function abrirPdf() {
            document.getElementById('capa2').style.display = 'none';
            document.getElementById('pdfArea').style.display = 'block';
        }

        function controlarAudio(e) {
            e.stopPropagation();
            if (som.paused) { som.play(); atualizarIcones(true); }
            else { som.pause(); atualizarIcones(false); }
        }

        function atualizarIcones(tocando) {
            document.querySelector('.play-icon').style.display = tocando ? 'none' : 'block';
            document.querySelector('.pause-icon').style.display = tocando ? 'block' : 'none';
        }
    </script>
</body>
</html>
