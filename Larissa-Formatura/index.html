<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visualizador Fluido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background-color: #fff;
            overflow: hidden; /* Trava o scroll até clicar na capa */
        }

        /* Capa Invisível que cobre toda a tela */
        #capa {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            z-index: 999; /* Fica na frente de tudo */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container do PDF que permite o Scroll */
        #pdfArea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Escondido no início */
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Botão Flutuante (Superior conforme sua foto) */
        #btnAudio {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 65px;
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 1000; /* Acima do PDF */
            display: none; /* Só aparece após abrir o arquivo */
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon { width: 32px; height: 32px; fill: #000; }
        .pause-icon { display: none; }
    </style>
</head>
<body>

    <div id="btnAudio" onclick="controlarAudio()">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="capa" onclick="ativarTudo()"></div>

    <div id="pdfArea">
        <iframe src="arquivo.pdf#toolbar=0&navpanes=0&scrollbar=1" id="meuIframe"></iframe>
    </div>

    <audio id="musica" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const som = document.getElementById('musica');
        const capa = document.getElementById('capa');
        const areaDoc = document.getElementById('pdfArea');
        const btn = document.getElementById('btnAudio');
        const iconPlay = document.querySelector('.play-icon');
        const iconPause = document.querySelector('.pause-icon');

        function ativarTudo() {
            // 1. Tocar o som (O clique na capa libera o áudio no navegador)
            som.play();
            
            // 2. Trocar visibilidade
            capa.style.display = 'none';
            areaDoc.style.display = 'block';
            btn.style.display = 'flex';
            
            // 3. Liberar o scroll da página
            document.body.style.overflow = 'auto';
            
            atualizarIcones(true);
        }

        function controlarAudio() {
            if (som.paused) {
                som.play();
                atualizarIcones(true);
            } else {
                som.pause();
                atualizarIcones(false);
            }
        }

        function atualizarIcones(tocando) {
            if (tocando) {
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
            }
        }
    </script>
</body>
</html>
