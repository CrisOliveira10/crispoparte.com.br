<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apresentação Interativa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; width: 100%; 
            background-color: #000;
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* CAPA 1: Imagem Principal */
        #capa1 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            z-index: 3000;
            cursor: pointer;
        }

        /* CAPA 2: Arte de fundo com o Botão */
        #capa2 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa2.jpg'); /* Sua arte que combina */
            background-size: cover;
            background-position: center;
            z-index: 2000;
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Botão ABRIR customizado */
        .btn-abrir {
            background-color: #105d4a;
            color: white;
            padding: 18px 50px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 150px; /* Ajuste aqui para posicionar sobre sua arte */
        }

        /* Botão Flutuante (Sempre visível após o primeiro clique) */
        #btnAudio {
            position: fixed;
            top: 25px; 
            right: 25px;
            width: 65px; 
            height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #105d4a;
            /* O z-index 5000 garante que ele fique na frente do PDF */
            z-index: 5000; 
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .icon { width: 32px; height: 32px; fill: #105d4a; }
        .pause-icon { display: none; }

        /* Área do PDF com Scroll */
        #pdfArea {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            display: none;
            z-index: 1000;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="btnAudio" onclick="controlarAudio(event)">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="capa1" onclick="passarParaCapa2()"></div>

    <div id="capa2">
        <button class="btn-abrir" onclick="abrirPdf()">ABRIR</button>
    </div>

    <div id="pdfArea">
        <iframe src="arquivo.pdf#toolbar=0&navpanes=0"></iframe>
    </div>

    <audio id="musica" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const som = document.getElementById('musica');
        const btnA = document.getElementById('btnAudio');
        const capa1 = document.getElementById('capa1');
        const capa2 = document.getElementById('capa2');
        const pdfArea = document.getElementById('pdfArea');

        function passarParaCapa2() {
            // Liga o áudio no primeiro toque
            som.play().catch(e => console.log("Erro áudio"));
            
            capa1.style.display = 'none';
            capa2.style.display = 'flex';
            
            // O botão de áudio já aparece aqui e não some mais
            btnA.style.display = 'flex';
            atualizarIcones(true);
        }

        function abrirPdf() {
            capa2.style.display = 'none';
            pdfArea.style.display = 'block';
            // O botão de áudio permanece visível devido ao z-index: 5000
        }

        function controlarAudio(e) {
            e.stopPropagation();
            if (som.paused) {
                som.play();
                atualizarIcones(true);
            } else {
                som.pause();
                atualizarIcones(false);
            }
        }

        function atualizarIcones(tocando) {
            document.querySelector('.play-icon').style.display = tocando ? 'none' : 'block';
            document.querySelector('.pause-icon').style.display = tocando ? 'block' : 'none';
        }
    </script>
</body>
</html>
