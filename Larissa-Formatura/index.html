<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apresentação Fluida</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            width: 100%; 
            background-color: #000;
            font-family: sans-serif;
            overflow: hidden; /* Evita scroll duplo na página pai */
        }

        /* Container do PDF (Scroll Infinito) */
        .pdf-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none; /* Escondido até o clique na capa */
        }

        .pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Capa Inicial */
        .capa-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            z-index: 50; /* Acima de tudo no início */
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        /* Botão Flutuante Superior Circular */
        .audio-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 100;
            display: none; /* Só aparece após o play */
            align-items: center;
            justify-content: center;
        }

        .icon { width: 30px; height: 30px; fill: #000; }
        .pause-icon { display: none; }

        /* Classe para esconder a capa suavemente */
        .hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>

    <button class="audio-btn" onclick="toggleAudio()" id="btnAudio">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="capa-container" id="capa" onclick="iniciarExperiencia()"></div>

    <div class="pdf-content" id="pdfArea">
        <iframe src="arquivo.pdf#toolbar=0&navpanes=0&scrollbar=1" class="pdf-viewer"></iframe>
    </div>

    <audio id="meuAudio" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('meuAudio');
        const capa = document.getElementById('capa');
        const pdfArea = document.getElementById('pdfArea');
        const btn = document.getElementById('btnAudio');
        const playIcon = document.querySelector('.play-icon');
        const pauseIcon = document.querySelector('.pause-icon');

        function iniciarExperiencia() {
            // 1. Inicia o áudio
            audio.play().catch(e => console.log("Erro ao tocar áudio"));
            
            // 2. Esconde a capa e mostra o conteúdo
            capa.classList.add('hidden');
            pdfArea.style.display = 'block';
            btn.style.display = 'flex';
            
            atualizarIcones(true);
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                atualizarIcones(true);
            } else {
                audio.pause();
                atualizarIcones(false);
            }
        }

        function atualizarIcones(isPlaying) {
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
