<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    
    <title>Apresentação Interativa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; width: 100%; 
            background-color: #000;
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* CAPA 1: Ativação */
        #capa1 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa.jpg');
            background-size: cover;
            background-position: center;
            z-index: 5000;
            cursor: pointer;
        }

        /* CAPA 2: Transição com sua Arte */
        #capa2 {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('capa2.jpg');
            background-size: cover;
            background-position: center;
            z-index: 4000;
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Botão ABRIR Customizado (#105d4a) */
        .btn-abrir {
            background-color: #105d4a;
            color: white;
            padding: 18px 50px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: none;
            cursor: pointer;
            margin-top: 150px;
            text-transform: uppercase;
        }

        /* ÁREA DO PDF: Onde o usuário navega */
        #pdfArea {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            z-index: 1000; /* Abaixo do botão flutuante */
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* BOTÃO FLUTUANTE: Precisa aparecer NO ARQUIVO (PDF) */
        #btnAudio {
            position: fixed;
            top: 25px; right: 25px;
            width: 65px; height: 65px;
            background-color: white;
            border-radius: 50%;
            border: 2px solid #105d4a;
            /* Z-INDEX MÁXIMO para flutuar sobre o PDF e Capas */
            z-index: 9999; 
            display: none; /* Aparece após o primeiro clique */
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .icon { width: 32px; height: 32px; fill: #105d4a; }
        .pause-icon { display: none; }
    </style>
</head>
<body>

    <div id="btnAudio" onclick="controlarAudio(event)">
        <svg class="icon play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <div id="capa1" onclick="ativarAudioEPassar()"></div>
    
    <div id="capa2">
        <button class="btn-abrir" onclick="abrirDoc()">ABRIR</button>
    </div>

    <div id="pdfArea">
        <iframe src="arquivo.pdf#toolbar=0&navpanes=0"></iframe>
    </div>

    <audio id="musica" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const som = document.getElementById('musica');
        const btnAudioContainer = document.getElementById('btnAudio');
        const c1 = document.getElementById('capa1');
        const c2 = document.getElementById('capa2');
        const areaPdf = document.getElementById('pdfArea');

        function ativarAudioEPassar() {
            // Toca o áudio no primeiro toque (requisito do navegador)
            som.load(); 
            som.play().catch(e => console.log("Áudio aguardando..."));

            c1.style.display = 'none';
            c2.style.display = 'flex';
            
            // O botão flutuante nasce aqui e não morre mais
            btnAudioContainer.style.display = 'flex';
            atualizarIcones(true);
        }

        function abrirDoc() {
            // Esconde a capa 2 e revela o PDF
            c2.style.display = 'none';
            areaPdf.style.display = 'block';
            
            // Note que NÃO escondemos o btnAudioContainer aqui, 
            // por isso ele continuará aparecendo "dentro" do arquivo (PDF)
        }

        function controlarAudio(e) {
            e.stopPropagation();
            if (som.paused) {
                som.play();
                atualizarIcones(true);
            } else {
                som.pause();
                atualizarIcones(false);
            }
        }

        function atualizarIcones(tocando) {
            document.querySelector('.play-icon').style.display = tocando ? 'none' : 'block';
            document.querySelector('.pause-icon').style.display = tocando ? 'block' : 'none';
        }
    </script>
</body>
</html>
