<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SilvaJardim | Portfólio</title>

<!--
  ╔══════════════════════════════════════════════════════════╗
  ║   SILVA JARDIM — FLIPBOOK COM IMAGENS DO CANVA           ║
  ╠══════════════════════════════════════════════════════════╣
  ║                                                          ║
  ║  📁 ESTRUTURA DE PASTAS NO GITHUB:                       ║
  ║                                                          ║
  ║  /seu-repositorio                                        ║
  ║    ├── index.html      ← este arquivo                    ║
  ║    ├── flip.mp3        ← som de virar página (opcional)  ║
  ║    └── pages/                                            ║
  ║          ├── 1.jpg                                       ║
  ║          ├── 2.jpg                                       ║
  ║          └── ... (quantas quiser)                        ║
  ║                                                          ║
  ║  ✏️  PARA ADICIONAR PÁGINAS:                             ║
  ║  Mude: const TOTAL_PAGES = 6  →  novo número            ║
  ║  Adicione o arquivo na pasta pages/                      ║
  ║                                                          ║
  ║  🎵 SOM: coloque flip.mp3 na raiz do projeto             ║
  ║  Se não existir, usa som sintetizado automaticamente     ║
  ║                                                          ║
  ║  🎨 COR DE FUNDO: edite --bg-color no :root do CSS       ║
  ║                                                          ║
  ╚══════════════════════════════════════════════════════════╝
-->

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --gold:   #c9a84c;

  /* ✏️ COR DE FUNDO — troque aqui quando quiser mudar */
  --bg-color: #f8f5f5;

  /* ✏️ COR DOS DOTS inativos */
  --dot-inactive: rgba(255,255,255,0.5);

  /* ✏️ COR DO HINT "deslize para navegar" */
  --hint-color: rgba(255,255,255,0.92);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-color); /* ✏️ fundo — edite --bg-color acima */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  font-family: sans-serif;
  user-select: none;
  touch-action: none;
}

/* ══════════════════════════════════════
   LAYOUT GERAL — livro + rodapé
══════════════════════════════════════ */
.book-scene {
  position: relative;
  width: 100%;
  flex: 1;                /* ocupa todo espaço acima do rodapé */
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Rodapé fixo com setas + dots + som */
.footer-bar {
  width: 100%;
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: var(--bg-color);
  position: relative;
  z-index: 50;
  /* Separador sutil */
  border-top: 1px solid rgba(0,0,0,0.06);
}

/* ══════════════════════════════════════
   LIVRO — proporcional ao espaço restante
══════════════════════════════════════ */

.book {
  position: relative;
  /* Proporção A4 dentro do espaço disponível (tela - rodapé 60px) */
  height: calc(100vh - 60px);
  width: calc((100vh - 60px) / 1.4142);
  max-width: 100vw;
  max-height: calc(100vw * 1.4142);
  perspective: 1400px;
  filter: drop-shadow(0 8px 32px rgba(0,0,0,0.18))
          drop-shadow(-4px 0 10px rgba(0,0,0,0.08));
}

/* ══════════════════════════════════════
   PÁGINAS
══════════════════════════════════════ */
.page {
  position: absolute;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  border-radius: 0; /* sem borda — arte ocupa tudo */
}

/* Lombada sutil */
.page::before {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: 16px; height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.14), transparent);
  z-index: 4;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}

/* ══════════════════════════════════════
   ZOOM — pinch e duplo toque
══════════════════════════════════════ */
.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
  pointer-events: none;
  transition: opacity 0.25s;
  /* transform aplicado pelo JS */
  transform-origin: 0 0;
}
.page img.loading { opacity: 0; }

/* Quando em zoom, esconde controles para não atrapalhar */
.book.zoomed .btn-zoom-reset ~ *,
.book.zoomed .swipe-hint {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

/* Botão de reset zoom — aparece quando em zoom */
.btn-zoom-reset {
  position: absolute;
  top: 12px; left: 12px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
  color: white; font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 40;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.book.zoomed .btn-zoom-reset {
  opacity: 1;
  pointer-events: auto;
}

/* Indicador visual de zoom no canto */
.zoom-level {
  position: absolute;
  top: 12px; left: 56px;
  background: rgba(0,0,0,0.4);
  color: white;
  font-size: 11px;
  padding: 4px 9px;
  border-radius: 20px;
  letter-spacing: 0.08em;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  backdrop-filter: blur(4px);
}
.book.zoomed .zoom-level {
  opacity: 1;
}

/* ══════════════════════════════════════
   ANIMAÇÕES DE VIRADA
══════════════════════════════════════ */
.anim-out-fwd  { animation: outFwd  0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 3; }
.anim-in-fwd   { animation: inFwd   0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 1; opacity: 1; }
.anim-out-back { animation: outBack 0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 3; }
.anim-in-back  { animation: inBack  0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 1; opacity: 1; }

@keyframes outFwd  {
  0%   { transform: perspective(1400px) rotateY(0deg);    opacity: 1; }
  100% { transform: perspective(1400px) rotateY(-90deg);  opacity: 0; }
}
@keyframes inFwd   {
  0%   { transform: perspective(1400px) rotateY(90deg);   opacity: 0; }
  100% { transform: perspective(1400px) rotateY(0deg);    opacity: 1; }
}
@keyframes outBack {
  0%   { transform: perspective(1400px) rotateY(0deg);    opacity: 1; }
  100% { transform: perspective(1400px) rotateY(90deg);   opacity: 0; }
}
@keyframes inBack  {
  0%   { transform: perspective(1400px) rotateY(-90deg);  opacity: 0; }
  100% { transform: perspective(1400px) rotateY(0deg);    opacity: 1; }
}

/* ══════════════════════════════════════
   BOTÕES DE NAVEGAÇÃO — no rodapé
══════════════════════════════════════ */
.nav-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.12);
  color: #333;
  font-size: 22px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
  flex-shrink: 0;
}
.nav-btn:hover  { background: rgba(201,168,76,0.2); }
.nav-btn:active { transform: scale(0.93); }
.nav-btn.disabled { opacity: 0.2; pointer-events: none; }

/* ══════════════════════════════════════
   DOTS — no rodapé, centro
══════════════════════════════════════ */
.dots {
  display: flex;
  gap: 8px;
  align-items: center;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--dot-inactive);
  cursor: pointer;
  transition: all 0.25s;
  border: none; padding: 0;
}
.dot.active {
  background: var(--gold);
  transform: scale(1.4);
}

/* ══════════════════════════════════════
   BOTÃO SOM — no rodapé, direita
══════════════════════════════════════ */
.btn-sound {
  position: absolute;
  right: 14px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(0,0,0,0.07);
  border: 1px solid rgba(0,0,0,0.10);
  color: #444; font-size: 15px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.btn-sound:hover { background: rgba(201,168,76,0.2); }

/* Esconde controles do rodapé quando em zoom */
.footer-bar.zoomed .nav-btn,
.footer-bar.zoomed .dots,
.footer-bar.zoomed .btn-sound {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

/* ══════════════════════════════════════
   HINT "deslize para navegar"
   — pisca até o usuário passar da página 1
══════════════════════════════════════ */
.swipe-hint {
  position: absolute;
  bottom: 14px;               /* acima dos dots do rodapé */
  left: 50%;
  transform: translateX(-50%);
  color: var(--hint-color);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.12em;
  pointer-events: none;
  white-space: nowrap;
  z-index: 30;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  animation: hintBlink 1.4s ease-in-out infinite;
}
.swipe-hint.hidden {
  animation: hintFadeOut 0.5s ease forwards;
}

@keyframes hintBlink {
  0%, 100% { opacity: 1;    transform: translateX(-50%) scale(1); }
  50%       { opacity: 0.25; transform: translateX(-50%) scale(0.96); }
}

@keyframes hintFadeOut {
  from { opacity: 1; }
  to   { opacity: 0; pointer-events: none; }
}

/* ══════════════════════════════════════
   SETA ANIMADA no hint
══════════════════════════════════════ */
.hint-arrow {
  display: inline-block;
  animation: arrowBounce 1.4s ease-in-out infinite;
}
@keyframes arrowBounce {
  0%, 100% { transform: translateX(0); }
  50%       { transform: translateX(5px); }
}

/* ══════════════════════════════════════
   LOADING PLACEHOLDER
══════════════════════════════════════ */
.page-loader {
  position: absolute; inset: 0;
  background: #ede9e3;  /* ✏️ cor do placeholder de carregamento */
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  color: rgba(0,0,0,0.3);
  font-size: 12px; letter-spacing: 0.1em;
  z-index: 1;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid rgba(0,0,0,0.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="book-scene">
  <div class="book" id="book">

    <!-- Hint piscando — some após passar da página 1 -->
    <div class="swipe-hint" id="swipeHint">
      deslize para navegar <span class="hint-arrow">›</span>
    </div>

    <!-- Botão reset zoom (aparece só quando em zoom) -->
    <button class="btn-zoom-reset" id="btnZoomReset" onclick="resetZoom()">✕</button>
    <div class="zoom-level" id="zoomLevel">1×</div>

  </div><!-- /book -->
</div><!-- /book-scene -->

<!-- ══ RODAPÉ — setas + dots + som ══ -->
<div class="footer-bar" id="footerBar">
  <button class="nav-btn disabled" id="btnPrev" onclick="prevPage()">‹</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="btnNext" onclick="nextPage()">›</button>
  <button class="btn-sound" id="btnSound">🔊</button>
</div>


<script>
/* ============================================================
   ✏️  EDITE AQUI — ÚNICA PARTE QUE VOCÊ PRECISA MEXER
   ============================================================ */

const TOTAL_PAGES  = 6;        // ← mude para o número total de páginas
const PAGES_FOLDER = 'pages/'; // ← pasta das imagens
const IMG_EXT      = 'jpg';    // ← extensão: 'jpg', 'png' ou 'webp'

// ✏️ Arquivo de som — coloque flip.mp3 na raiz do projeto
// Se não existir, usa som sintetizado automaticamente
const FLIP_SOUND_FILE = 'flip.mp3';

// ✏️ Volume do MP3: 0.0 (mudo) até 1.0 (máximo)
const FLIP_VOLUME = 0.75;

/* ============================================================
   ESTADO
   ============================================================ */
let current     = 1;
let animating   = false;
let soundOn     = true;
let audioCtx    = null;
let flipAudio   = null;
let mp3Ready    = false;
let hintHidden  = false;

/* ============================================================
   CARREGA flip.mp3 (com fallback silencioso)
   ============================================================ */
function loadFlipAudio() {
  flipAudio         = new Audio(FLIP_SOUND_FILE);
  flipAudio.preload = 'auto';
  flipAudio.volume  = FLIP_VOLUME;
  flipAudio.addEventListener('canplaythrough', () => { mp3Ready = true; }, { once: true });
  flipAudio.addEventListener('error',          () => { mp3Ready = false; }, { once: true });
}

/* ============================================================
   MONTA AS PÁGINAS DINAMICAMENTE
   ============================================================ */
function buildPages() {
  const book = document.getElementById('book');

  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const page = document.createElement('div');
    page.className = 'page' + (i === 1 ? ' active' : '');
    page.id = `page-${i}`;

    // Loader
    const loader = document.createElement('div');
    loader.className = 'page-loader';
    loader.innerHTML = `<div class="spinner"></div><span>${i} / ${TOTAL_PAGES}</span>`;
    page.appendChild(loader);

    // Imagem
    const img = document.createElement('img');
    img.className = 'loading';
    img.alt = `Página ${i}`;
    img.src = `${PAGES_FOLDER}${i}.${IMG_EXT}`;
    img.onload  = () => { img.classList.remove('loading'); loader.style.display = 'none'; };
    img.onerror = () => {
      loader.innerHTML =
        `<span style="text-align:center;padding:24px;font-size:12px;color:rgba(0,0,0,0.3);line-height:1.8">
          📄 ${i}.${IMG_EXT}<br>
          Adicione a imagem em<br>
          <strong style="color:rgba(0,0,0,0.5)">pages/${i}.${IMG_EXT}</strong>
        </span>`;
    };
    page.appendChild(img);

    // Insere antes dos controles (que já estão no DOM via HTML)
    book.insertBefore(page, document.getElementById('btnPrev'));
  }
}

/* ============================================================
   DOTS + CONTADOR + BOTÕES
   ============================================================ */
function buildDots() {
  const cont = document.getElementById('dots');
  cont.innerHTML = '';
  if (TOTAL_PAGES <= 16) {
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const d = document.createElement('button');
      d.className = 'dot' + (i === 1 ? ' active' : '');
      d.setAttribute('aria-label', `Página ${i}`);
      d.onclick = () => goTo(i);
      cont.appendChild(d);
    }
  }
}

function syncUI() {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i + 1 === current);
  });
  document.getElementById('btnPrev').classList.toggle('disabled', current === 1);
  document.getElementById('btnNext').classList.toggle('disabled', current === TOTAL_PAGES);
}

/* ============================================================
   HINT — some após sair da página 1
   ============================================================ */
function checkHint() {
  if (!hintHidden && current > 1) {
    hintHidden = true;
    const h = document.getElementById('swipeHint');
    h.classList.add('hidden');
    // Remove do DOM após a animação para não interferir em cliques
    setTimeout(() => h.remove(), 600);
  }
}

/* ============================================================
   SOM — MP3 com fallback sintetizado
   ============================================================ */
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function playFlip(fwd) {
  if (!soundOn) return;
  if (mp3Ready && flipAudio) {
    try { flipAudio.currentTime = 0; flipAudio.play().catch(() => playSynth(fwd)); return; }
    catch(e) {}
  }
  playSynth(fwd);
}

function playSynth(fwd) {
  if (!audioCtx) return;
  try {
    const freqs = fwd ? [900, 600, 380] : [380, 600, 900];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g   = audioCtx.createGain();
      const bpf = audioCtx.createBiquadFilter();
      bpf.type = 'bandpass'; bpf.frequency.value = f; bpf.Q.value = 0.5;
      osc.type = 'sawtooth';
      osc.connect(bpf); bpf.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.045;
      osc.frequency.setValueAtTime(f, t);
      osc.frequency.exponentialRampToValueAtTime(f * 0.4, t + 0.13);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      osc.start(t); osc.stop(t + 0.16);
    });
    // Ruído de papel
    const sr  = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, ~~(sr * 0.13), sr);
    const d   = buf.getChannelData(0);
    for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * 0.28;
    const ns  = audioCtx.createBufferSource(); ns.buffer = buf;
    const hpf = audioCtx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 2000;
    const ng  = audioCtx.createGain();
    ng.gain.setValueAtTime(0.12, audioCtx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
    ns.connect(hpf); hpf.connect(ng); ng.connect(audioCtx.destination);
    ns.start();
  } catch(e) {}
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function goTo(target, fwd) {
  if (animating || target === current || target < 1 || target > TOTAL_PAGES) return;
  // Bloqueia troca de página se estiver em zoom
  if (isZoomed) { resetZoom(); return; }
  initAudio();

  if (fwd === undefined) fwd = target > current;
  animating = true;
  playFlip(fwd);

  const oldEl = document.getElementById(`page-${current}`);
  const newEl = document.getElementById(`page-${target}`);

  newEl.style.opacity = '1';
  newEl.classList.remove('active','anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back');
  oldEl.classList.remove('anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back');

  if (fwd) {
    oldEl.classList.add('anim-out-fwd');
    newEl.classList.add('anim-in-fwd');
  } else {
    oldEl.classList.add('anim-out-back');
    newEl.classList.add('anim-in-back');
  }

  syncUI();

  setTimeout(() => {
    oldEl.classList.remove('active','anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back');
    oldEl.style.opacity = '';
    newEl.classList.remove('anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back');
    newEl.classList.add('active');
    newEl.style.opacity = '';

    current = target;
    syncUI();
    checkHint(); // ← verifica se deve esconder o hint
    animating = false;

    // Pré-carrega a próxima
    preload(current + 1);
  }, 520);
}

function nextPage() { goTo(current + 1, true);  }
function prevPage() { goTo(current - 1, false); }

/* ============================================================
   SWIPE + DRAG + TECLADO
   ============================================================ */
let tx = 0, ty = 0, mx = 0;
const bookEl = document.getElementById('book');

bookEl.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, { passive: true });

bookEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = Math.abs(e.changedTouches[0].clientY - ty);
  if (!isZoomed && Math.abs(dx) > 38 && dy < 70) dx < 0 ? nextPage() : prevPage();
}, { passive: true });

bookEl.addEventListener('mousedown', e => { mx = e.clientX; });
bookEl.addEventListener('mouseup',   e => {
  const dx = e.clientX - mx;
  if (Math.abs(dx) > 50) dx < 0 ? nextPage() : prevPage();
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); prevPage(); }
});

/* ============================================================
   BOTÃO SOM
   ============================================================ */
document.getElementById('btnSound').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('btnSound').textContent = soundOn ? '🔊' : '🔇';
  initAudio();
});

/* ============================================================
   PRÉ-CARREGA IMAGEM
   ============================================================ */
function preload(i) {
  if (i < 1 || i > TOTAL_PAGES) return;
  const img = new Image();
  img.src = `${PAGES_FOLDER}${i}.${IMG_EXT}`;
}

/* ============================================================
   ZOOM — pinch (2 dedos) + duplo toque
   ============================================================

   Como usar:
   • Pinch (juntar/afastar 2 dedos) → zoom in/out
   • Duplo toque                     → zoom 2× no ponto tocado
   • Duplo toque (já em zoom)        → volta ao normal
   • Botão ✕ (canto superior esq.)  → volta ao normal
   • Enquanto em zoom: arrasta para mover a imagem
   • Navegação de páginas desativada durante o zoom

   ============================================================ */

const MIN_SCALE = 1;    // mínimo (normal)
const MAX_SCALE = 5;    // máximo (5×)
const DBL_TAP_SCALE = 2.5; // zoom do duplo toque

let zoomScale   = 1;
let zoomOffsetX = 0;
let zoomOffsetY = 0;
let isZoomed    = false;

// Estado do pinch
let pinchStartDist  = 0;
let pinchStartScale = 1;
let pinchMidX = 0, pinchMidY = 0;

// Estado do pan (arrastar)
let panStartX = 0, panStartY = 0;
let panOffsetStartX = 0, panOffsetStartY = 0;
let isPanning = false;

// Duplo toque
let lastTapTime = 0;
let lastTapX = 0, lastTapY = 0;

function getActivePage() {
  return document.getElementById(`page-${current}`);
}

function getActiveImg() {
  const page = getActivePage();
  return page ? page.querySelector('img') : null;
}

function applyZoom() {
  const img = getActiveImg();
  if (!img) return;

  // Limita offsets para não sair da imagem
  const page    = getActivePage();
  const pw      = page.offsetWidth;
  const ph      = page.offsetHeight;
  const maxX    = 0;
  const minX    = pw  - pw  * zoomScale;
  const maxY    = 0;
  const minY    = ph  - ph  * zoomScale;

  zoomOffsetX = Math.min(maxX, Math.max(minX, zoomOffsetX));
  zoomOffsetY = Math.min(maxY, Math.max(minY, zoomOffsetY));

  img.style.transition = 'none';
  img.style.transform  =
    `translate(${zoomOffsetX}px, ${zoomOffsetY}px) scale(${zoomScale})`;

  // Atualiza estado zoomed
  const book   = document.getElementById('book');
  const footer = document.getElementById('footerBar');
  if (zoomScale > 1.05) {
    isZoomed = true;
    book.classList.add('zoomed');
    footer.classList.add('zoomed');
    document.getElementById('zoomLevel').textContent =
      zoomScale.toFixed(1).replace('.0','') + '×';
  } else {
    isZoomed = false;
    book.classList.remove('zoomed');
    footer.classList.remove('zoomed');
  }
}

function resetZoom(animate = true) {
  const img = getActiveImg();
  if (!img) return;
  zoomScale   = 1;
  zoomOffsetX = 0;
  zoomOffsetY = 0;
  isZoomed    = false;
  if (animate) img.style.transition = 'transform 0.3s ease';
  img.style.transform = 'none';
  setTimeout(() => { if (img) img.style.transition = 'none'; }, 350);
  document.getElementById('book').classList.remove('zoomed');
  document.getElementById('footerBar').classList.remove('zoomed');
}

// ── PINCH ──────────────────────────────
function getPinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function getPinchMid(touches, rect) {
  return {
    x: ((touches[0].clientX + touches[1].clientX) / 2) - rect.left,
    y: ((touches[0].clientY + touches[1].clientY) / 2) - rect.top,
  };
}

bookEl.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    pinchStartDist  = getPinchDist(e.touches);
    pinchStartScale = zoomScale;
    const rect = bookEl.getBoundingClientRect();
    const mid  = getPinchMid(e.touches, rect);
    pinchMidX = mid.x;
    pinchMidY = mid.y;
    isPanning = false;
  } else if (e.touches.length === 1 && isZoomed) {
    // Inicia pan
    isPanning   = true;
    panStartX   = e.touches[0].clientX;
    panStartY   = e.touches[0].clientY;
    panOffsetStartX = zoomOffsetX;
    panOffsetStartY = zoomOffsetY;
  }
}, { passive: false });

bookEl.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dist     = getPinchDist(e.touches);
    const ratio    = dist / pinchStartDist;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * ratio));

    // Zoom centrado no ponto médio dos dedos
    const scaleDelta = newScale / zoomScale;
    zoomOffsetX = pinchMidX - scaleDelta * (pinchMidX - zoomOffsetX);
    zoomOffsetY = pinchMidY - scaleDelta * (pinchMidY - zoomOffsetY);
    zoomScale   = newScale;

    applyZoom();
  } else if (e.touches.length === 1 && isPanning && isZoomed) {
    e.preventDefault();
    const dx    = e.touches[0].clientX - panStartX;
    const dy    = e.touches[0].clientY - panStartY;
    zoomOffsetX = panOffsetStartX + dx;
    zoomOffsetY = panOffsetStartY + dy;
    applyZoom();
  }
}, { passive: false });

bookEl.addEventListener('touchend', e => {
  if (e.touches.length < 2) {
    // Se terminou o pinch e escala < 1.1 → reseta
    if (zoomScale < 1.1) resetZoom();
  }
  if (e.touches.length === 0) isPanning = false;
}, { passive: true });

// ── DUPLO TOQUE ────────────────────────
bookEl.addEventListener('touchend', e => {
  if (e.changedTouches.length !== 1) return;

  const now = Date.now();
  const t   = e.changedTouches[0];
  const dt  = now - lastTapTime;
  const dx  = Math.abs(t.clientX - lastTapX);
  const dy  = Math.abs(t.clientY - lastTapY);

  if (dt < 300 && dx < 30 && dy < 30) {
    // Duplo toque detectado
    if (isZoomed) {
      resetZoom();
    } else {
      // Zoom centrado no ponto tocado
      const rect = bookEl.getBoundingClientRect();
      const tx   = t.clientX - rect.left;
      const ty   = t.clientY - rect.top;
      zoomScale   = DBL_TAP_SCALE;
      zoomOffsetX = tx - DBL_TAP_SCALE * tx;
      zoomOffsetY = ty - DBL_TAP_SCALE * ty;
      const img = getActiveImg();
      if (img) img.style.transition = 'transform 0.3s ease';
      applyZoom();
      setTimeout(() => { const i = getActiveImg(); if (i) i.style.transition = 'none'; }, 350);
    }
    lastTapTime = 0;
    return;
  }

  lastTapTime = now;
  lastTapX    = t.clientX;
  lastTapY    = t.clientY;
}, { passive: true });

// ── RESET AO TROCAR PÁGINA ─────────────
// (já feito no goTo via resetZoom antes de animar)

/* ============================================================
   START
   ============================================================ */
buildPages();
buildDots();
syncUI();
loadFlipAudio();
preload(2); // pré-carrega página 2

['click','touchstart'].forEach(ev =>
  document.addEventListener(ev, initAudio, { once: true })
);
</script>
</body>
