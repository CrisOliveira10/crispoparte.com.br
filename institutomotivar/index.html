<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SilvaJardim | Portfólio</title>

<!--
  ╔══════════════════════════════════════════════════════════╗
  ║   SILVA JARDIM — FLIPBOOK COM IMAGENS DO CANVA           ║
  ╠══════════════════════════════════════════════════════════╣
  ║                                                          ║
  ║  📁 ESTRUTURA DE PASTAS NO GITHUB:                       ║
  ║                                                          ║
  ║  /seu-repositorio                                        ║
  ║    ├── index.html      ← este arquivo                    ║
  ║    ├── flip.mp3        ← som de virar página (opcional)  ║
  ║    └── pages/                                            ║
  ║          ├── 1.jpg                                       ║
  ║          ├── 2.jpg                                       ║
  ║          ├── 3.jpg                                       ║
  ║          └── ... (quantas quiser)                        ║
  ║                                                          ║
  ║  ✏️  PARA ADICIONAR PÁGINAS:                             ║
  ║  1. Exporte a arte do Canva como JPG                     ║
  ║  2. Nomeie como 7.jpg, 8.jpg, etc.                       ║
  ║  3. Coloque na pasta pages/                              ║
  ║  4. Mude: const TOTAL_PAGES = 6  →  7 (ou mais)         ║
  ║                                                          ║
  ║  🎵 SOM:                                                 ║
  ║  Coloque flip.mp3 na mesma pasta do index.html           ║
  ║  Se não colocar, usa som sintetizado automaticamente     ║
  ║                                                          ║
  ║  🎨 COR DE FUNDO:                                        ║
  ║  Procure por --bg-color no CSS e troque o valor          ║
  ║                                                          ║
  ╚══════════════════════════════════════════════════════════╝
-->

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --gold:   #c9a84c;
  --shadow: rgba(0,0,0,0.25);

  /* ✏️ COR DE FUNDO — troque o valor abaixo quando quiser mudar */
  --bg-color: #f8f5f5;

  /* ✏️ COR DOS DOTS inativos — círculos de navegação */
  --dot-color: rgba(0,0,0,0.2);

  /* ✏️ COR DO CONTADOR DE PÁGINAS (ex: "1 / 6") */
  --counter-color: rgba(0,0,0,0.3);

  /* ✏️ COR DO HINT "deslize para navegar" */
  --hint-color: rgba(0,0,0,0.25);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-color); /* ✏️ fundo — edite --bg-color acima */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  user-select: none;
  touch-action: none;
}

/* ─── LIVRO ─── */
.book-scene {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.book {
  position: relative;
  width:  min(390px, 88vw);
  height: min(693px, 84vh);
  perspective: 1400px;
}

/* ─── PÁGINAS ─── */
.page {
  position: absolute;
  inset: 0;
  border-radius: 3px 14px 14px 3px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
  box-shadow:
    6px 6px 30px var(--shadow),
    -3px 0 10px rgba(0,0,0,0.2),
    inset -4px 0 12px rgba(0,0,0,0.08);
}

/* Lombada */
.page::before {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: 20px; height: 100%;
  background: linear-gradient(to right, rgba(0,0,0,0.2), transparent);
  z-index: 2;
  pointer-events: none;
}

/* Reflexo borda direita */
.page::after {
  content: '';
  position: absolute;
  right: 0; top: 0;
  width: 3px; height: 100%;
  background: linear-gradient(to bottom,
    rgba(255,255,255,0.15), transparent 50%, rgba(255,255,255,0.07));
  z-index: 2;
  pointer-events: none;
}

.page.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 2;
}

/* ─── IMAGEM ─── */
.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  transition: opacity 0.3s;
}
.page img.loading { opacity: 0; }

/* ─── ANIMAÇÕES ─── */
.anim-out-fwd  { animation: outFwd  0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 3; }
.anim-in-fwd   { animation: inFwd   0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 1; opacity: 1; }
.anim-out-back { animation: outBack 0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 3; }
.anim-in-back  { animation: inBack  0.5s cubic-bezier(0.4,0,0.2,1) forwards; z-index: 1; opacity: 1; }

@keyframes outFwd  {
  0%   { transform: perspective(1400px) rotateY(0);     opacity: 1; }
  100% { transform: perspective(1400px) rotateY(-90deg);opacity: 0; }
}
@keyframes inFwd   {
  0%   { transform: perspective(1400px) rotateY(90deg); opacity: 0; }
  100% { transform: perspective(1400px) rotateY(0);     opacity: 1; }
}
@keyframes outBack {
  0%   { transform: perspective(1400px) rotateY(0);    opacity: 1; }
  100% { transform: perspective(1400px) rotateY(90deg);opacity: 0; }
}
@keyframes inBack  {
  0%   { transform: perspective(1400px) rotateY(-90deg);opacity: 0; }
  100% { transform: perspective(1400px) rotateY(0);     opacity: 1; }
}

/* ─── BOTÕES NAV ─── */
.nav-btn {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(0,0,0,0.07);       /* ✏️ fundo dos botões de seta */
  border: 1px solid rgba(0,0,0,0.12); /* ✏️ borda dos botões de seta */
  color: #333;                         /* ✏️ cor da seta */
  font-size: 22px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  z-index: 20;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.nav-btn:hover  { background: rgba(201,168,76,0.25); transform: translateY(-50%) scale(1.08); }
.nav-btn:active { transform: translateY(-50%) scale(0.94); }
.nav-btn.disabled { opacity: 0.2; pointer-events: none; }
.btn-prev { left:  -58px; }
.btn-next { right: -58px; }

/* ─── DOTS ─── */
.dots {
  position: absolute;
  bottom: -42px;
  left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
  z-index: 20;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--dot-color); /* ✏️ edite --dot-color no :root */
  cursor: pointer;
  transition: all 0.25s;
  border: none; padding: 0;
}
.dot.active { background: var(--gold); transform: scale(1.4); }

/* ─── CONTADOR ─── */
.counter {
  position: absolute;
  bottom: -70px;
  left: 50%; transform: translateX(-50%);
  color: var(--counter-color); /* ✏️ edite --counter-color no :root */
  font-size: 11px;
  letter-spacing: 0.16em;
  white-space: nowrap;
}

/* ─── BOTÃO SOM ─── */
.btn-sound {
  position: fixed;
  top: 14px; right: 14px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(0,0,0,0.07);       /* ✏️ fundo do botão de som */
  border: 1px solid rgba(0,0,0,0.12); /* ✏️ borda do botão de som */
  color: #444; font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.2s;
}
.btn-sound:hover { background: rgba(201,168,76,0.25); }

/* ─── HINT ─── */
.swipe-hint {
  position: fixed;
  bottom: 18px; left: 50%; transform: translateX(-50%);
  color: var(--hint-color); /* ✏️ edite --hint-color no :root */
  font-size: 11px; letter-spacing: 0.12em;
  pointer-events: none;
  transition: opacity 0.6s;
  white-space: nowrap;
  z-index: 50;
}
.swipe-hint.hidden { opacity: 0; }

/* ─── LOADING PLACEHOLDER ─── */
.page-loader {
  position: absolute; inset: 0;
  background: #ede9e3; /* ✏️ cor do placeholder enquanto a imagem carrega */
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  gap: 12px;
  color: rgba(0,0,0,0.25);
  font-size: 12px; letter-spacing: 0.1em;
  z-index: 1;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid rgba(0,0,0,0.08);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── MOBILE ─── */
@media (max-width: 520px) {
  .btn-prev, .btn-next {
    top: auto; bottom: -58px;
    transform: none;
    width: 42px; height: 42px; font-size: 20px;
  }
  .btn-prev { left: calc(50% - 58px); }
  .btn-next { right: calc(50% - 58px); }
  .btn-prev:hover, .btn-next:hover { transform: scale(1.08); }
  .btn-prev:active, .btn-next:active { transform: scale(0.94); }
  .dots    { bottom: -66px; }
  .counter { bottom: -92px; }
}
</style>
</head>
<body>

<button class="btn-sound" id="btnSound">🔊</button>
<div class="swipe-hint" id="swipeHint">‹ deslize para navegar ›</div>

<div class="book-scene">
  <div class="book" id="book"></div>

  <button class="nav-btn btn-prev disabled" id="btnPrev" onclick="prevPage()">‹</button>
  <button class="nav-btn btn-next"          id="btnNext" onclick="nextPage()">›</button>

  <div class="dots"    id="dots"></div>
  <div class="counter" id="counter"></div>
</div>

<script>
/* ============================================================
   ✏️  EDITE AQUI — ÚNICA PARTE QUE VOCÊ PRECISA MEXER
   ============================================================ */

const TOTAL_PAGES  = 6;       // ← mude para o número total de páginas
const PAGES_FOLDER = 'pages/'; // ← pasta das imagens (não mude se seguir a estrutura)
const IMG_EXT      = 'jpg';    // ← extensão: 'jpg', 'png' ou 'webp'

// ✏️ ARQUIVO DE SOM — coloque flip.mp3 na mesma pasta do index.html
// Se o arquivo não existir, o som sintetizado é usado automaticamente
const FLIP_SOUND_FILE = 'flip.mp3';

/* ============================================================
   ESTADO INTERNO
   ============================================================ */
let current   = 1;
let animating = false;
let soundOn   = true;
let audioCtx  = null;
let hinted    = false;

// Áudio MP3
let flipAudio      = null;  // elemento <audio> para o MP3
let mp3Available   = false; // true se flip.mp3 carregou com sucesso

/* ============================================================
   CARREGA flip.mp3 — com fallback para som sintetizado
   ============================================================ */
function loadFlipAudio() {
  flipAudio = new Audio(FLIP_SOUND_FILE);
  flipAudio.preload = 'auto';
  flipAudio.volume  = 0.7; // ✏️ volume do MP3: 0.0 (mudo) a 1.0 (máximo)

  flipAudio.addEventListener('canplaythrough', () => {
    mp3Available = true;
  }, { once: true });

  flipAudio.addEventListener('error', () => {
    // flip.mp3 não encontrado → usa som sintetizado automaticamente
    mp3Available = false;
  }, { once: true });
}

/* ============================================================
   MONTA AS PÁGINAS
   ============================================================ */
function buildPages() {
  const book = document.getElementById('book');
  for (let i = 1; i <= TOTAL_PAGES; i++) {
    const page = document.createElement('div');
    page.className = 'page' + (i === 1 ? ' active' : '');
    page.id = `page-${i}`;

    // Spinner de carregamento
    const loader = document.createElement('div');
    loader.className = 'page-loader';
    loader.id = `loader-${i}`;
    loader.innerHTML = `<div class="spinner"></div><span>${i} / ${TOTAL_PAGES}</span>`;
    page.appendChild(loader);

    // Imagem
    const img = document.createElement('img');
    img.className = 'loading';
    img.alt = `Página ${i}`;
    img.src = `${PAGES_FOLDER}${i}.${IMG_EXT}`;
    img.onload  = () => { img.classList.remove('loading'); loader.style.display = 'none'; };
    img.onerror = () => {
      loader.innerHTML =
        `<span style="color:rgba(255,255,255,0.25);text-align:center;padding:20px;font-size:12px">
          📄 ${i}.${IMG_EXT}<br><br>
          Coloque a imagem na pasta<br><strong style="color:rgba(255,255,255,0.5)">pages/</strong>
        </span>`;
    };
    page.appendChild(img);
    book.appendChild(page);
  }
}

/* ============================================================
   DOTS + CONTADOR + BOTÕES
   ============================================================ */
function buildDots() {
  const cont = document.getElementById('dots');
  cont.innerHTML = '';
  if (TOTAL_PAGES <= 14) {
    for (let i = 1; i <= TOTAL_PAGES; i++) {
      const d = document.createElement('button');
      d.className = 'dot' + (i === 1 ? ' active' : '');
      d.setAttribute('aria-label', `Página ${i}`);
      d.onclick = () => goTo(i);
      cont.appendChild(d);
    }
  }
}

function syncUI() {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i + 1 === current);
  });
  document.getElementById('counter').textContent = `${current} / ${TOTAL_PAGES}`;
  document.getElementById('btnPrev').classList.toggle('disabled', current === 1);
  document.getElementById('btnNext').classList.toggle('disabled', current === TOTAL_PAGES);
}

/* ============================================================
   SOM — tenta MP3 primeiro, fallback para síntese
   ============================================================ */
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}

function playFlip(fwd) {
  if (!soundOn) return;

  // ── Tenta tocar o MP3 ──
  if (mp3Available && flipAudio) {
    try {
      flipAudio.currentTime = 0;
      flipAudio.play().catch(() => playSynth(fwd)); // fallback se bloqueado
      return;
    } catch(e) {}
  }

  // ── Fallback: som sintetizado ──
  playSynth(fwd);
}

function playSynth(fwd) {
  if (!audioCtx) return;
  try {
    const freqs = fwd ? [900, 600, 380] : [380, 600, 900];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g   = audioCtx.createGain();
      const bpf = audioCtx.createBiquadFilter();
      bpf.type = 'bandpass'; bpf.frequency.value = f; bpf.Q.value = 0.5;
      osc.type = 'sawtooth';
      osc.connect(bpf); bpf.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.045;
      osc.frequency.setValueAtTime(f, t);
      osc.frequency.exponentialRampToValueAtTime(f * 0.4, t + 0.13);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      osc.start(t); osc.stop(t + 0.16);
    });
    // Ruído de papel
    const sr  = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, ~~(sr * 0.13), sr);
    const d   = buf.getChannelData(0);
    for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * 0.28;
    const ns = audioCtx.createBufferSource(); ns.buffer = buf;
    const hpf = audioCtx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 2000;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.12, audioCtx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
    ns.connect(hpf); hpf.connect(ng); ng.connect(audioCtx.destination);
    ns.start();
  } catch(e) {}
}

/* ============================================================
   NAVEGAÇÃO PRINCIPAL
   ============================================================ */
function goTo(target, fwd) {
  if (animating || target === current || target < 1 || target > TOTAL_PAGES) return;
  hideHint();
  initAudio();

  if (fwd === undefined) fwd = target > current;
  animating = true;
  playFlip(fwd);

  const oldEl = document.getElementById(`page-${current}`);
  const newEl = document.getElementById(`page-${target}`);

  // Deixa nova página visível atrás
  newEl.style.opacity = '1';
  newEl.classList.remove(
    'active','anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back'
  );

  oldEl.classList.remove('anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back');

  if (fwd) {
    oldEl.classList.add('anim-out-fwd');
    newEl.classList.add('anim-in-fwd');
  } else {
    oldEl.classList.add('anim-out-back');
    newEl.classList.add('anim-in-back');
  }

  syncUI(); // atualiza dots imediatamente

  setTimeout(() => {
    oldEl.classList.remove(
      'active','anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back'
    );
    oldEl.style.opacity = '';

    newEl.classList.remove('anim-out-fwd','anim-in-fwd','anim-out-back','anim-in-back');
    newEl.classList.add('active');
    newEl.style.opacity = '';

    current = target;
    syncUI();
    animating = false;
  }, 520);
}

function nextPage() { goTo(current + 1, true);  }
function prevPage() { goTo(current - 1, false); }

/* ============================================================
   SWIPE (toque) + DRAG (mouse)
   ============================================================ */
let tx = 0, ty = 0, mx = 0;

const bookEl = document.getElementById('book');

bookEl.addEventListener('touchstart', e => {
  tx = e.touches[0].clientX;
  ty = e.touches[0].clientY;
}, { passive: true });

bookEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = Math.abs(e.changedTouches[0].clientY - ty);
  if (Math.abs(dx) > 40 && dy < 70) dx < 0 ? nextPage() : prevPage();
}, { passive: true });

bookEl.addEventListener('mousedown', e => { mx = e.clientX; });
bookEl.addEventListener('mouseup',   e => {
  const dx = e.clientX - mx;
  if (Math.abs(dx) > 50) dx < 0 ? nextPage() : prevPage();
});

/* ============================================================
   TECLADO
   ============================================================ */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
  if (e.key === 'ArrowLeft')                   { e.preventDefault(); prevPage(); }
});

/* ============================================================
   BOTÃO SOM
   ============================================================ */
document.getElementById('btnSound').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('btnSound').textContent = soundOn ? '🔊' : '🔇';
  initAudio();
});

/* ============================================================
   HINT SWIPE
   ============================================================ */
function hideHint() {
  if (!hinted) {
    hinted = true;
    document.getElementById('swipeHint').classList.add('hidden');
  }
}
setTimeout(hideHint, 4000);

/* ============================================================
   PRÉ-CARREGA PRÓXIMAS IMAGENS (performance)
   ============================================================ */
function preload(i) {
  if (i < 1 || i > TOTAL_PAGES) return;
  const img = new Image();
  img.src = `${PAGES_FOLDER}${i}.${IMG_EXT}`;
}

/* ============================================================
   START
   ============================================================ */
buildPages();
buildDots();
syncUI();
loadFlipAudio(); // carrega flip.mp3 se existir

// Pré-carrega página 2 logo de início
preload(2);

// Inicializa áudio no primeiro gesto do usuário
['click','touchstart'].forEach(ev =>
  document.addEventListener(ev, initAudio, { once: true })
);
</script>
</body>
</html>
