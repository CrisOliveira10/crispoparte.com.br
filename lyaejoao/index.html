<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite Lya e João</title>
<meta property="og:title" content="Convite especial: Lya & João">
    <meta property="og:description" content="Toque para abrir os detalhes deste dia incrível.">
    <meta property="og:image" content="https://crispoparte.com.br/lyaejoao/capalink.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">


<style>
:root {
    --cor-botao: #ffffff;
}

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🔴 ATIVE PARA VER HOTSPOTS */
body.modo-edicao .hotspot {
    border: 2px dashed red;
    background: rgba(255,0,0,0.2);
}

/* PÁGINAS */
.page {
    display: none;
    width: 100%;
    height: 100dvh;
    position: relative;
    max-width: 500px;
    margin: 0 auto;
}

.page img,
.page video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.content-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
}

/* ANIMAÇÃO */
@keyframes pulse-white {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255,255,255,0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}

/* BOTÃO ÁUDIO CORRIGIDO */
.btn-audio {
    position: fixed;
    top: 30px;
    left: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: rgba(0,0,0,0.5);
    border: 2px solid #ffffff;
    color: #ffffff;
    display: none;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 1000;
    font-size: 20px;
    font-weight: bold;
    animation: pulse-white 2s infinite;
}

.btn-audio:active {
    transform: scale(0.9);
    animation: none;
}

.hotspot {
    position: absolute;
    cursor: pointer;
    z-index: 10;
}
</style>
</head>

<!-- 🔴 REMOVA class="modo-edicao" PARA ENTREGA -->
<body>

<audio id="musica" src="audio.mp3" loop preload="auto"></audio>

<div id="btnControleAudio" class="btn-audio" onclick="toggleAudio()">
    <span id="iconeAudio">▶</span>
</div>

<!-- PÁGINA 1 -->
<div class="page" id="page1" style="display:block;">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<!-- PÁGINA 2 -->
<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline muted></video>
    </div>
</div>

<!-- PÁGINA 3 -->
<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg">

        <a class="hotspot"
           style="top:63%; left:50%; width:22%; height:10%; transform:translateX(-50%);"
           href="http://noivos.casar.com/lyaejoao"
           target="_blank">
        </a>

    </div>
</div>

<script>
const musica = document.getElementById('musica');
const video = document.getElementById('video');
const btnAudio = document.getElementById('btnControleAudio');
const iconeAudio = document.getElementById('iconeAudio');

function startInvite() {
    musica.play().catch(() => {});
    btnAudio.style.display = 'flex';
    iconeAudio.innerText = "II";

    goPage(2);
    video.play();

    video.onended = () => {
        goPage(3);
    };
}

function toggleAudio() {
    if (musica.paused) {
        musica.play();
        iconeAudio.innerText = "II";
        btnAudio.style.animation = "pulse-white 2s infinite";
    } else {
        musica.pause();
        iconeAudio.innerText = "▶";
        btnAudio.style.animation = "none";
    }
}

function goPage(num) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    const targetPage = document.getElementById('page' + num);
    if (targetPage) {
        targetPage.style.display = 'block';
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !musica.paused) {
        musica.play();
    }
});
</script>

</body>
</html>
