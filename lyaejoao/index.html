<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite Lya e João</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#000;
    height:100dvh; /* 🔥 viewport real mobile */
    width:100vw;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
}

/* CONTAINER PADRÃO IGUAL AO SEU ANTIGO */
.page{
    position:absolute;
    width:100%;
    height:100dvh;
    max-width:500px;
    margin:0 auto;
    opacity:0;
    pointer-events:none;
    transition:opacity .8s ease;
}

.page.active{
    opacity:1;
    pointer-events:auto;
}

.page img,
.page video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.content-wrapper{
    position:relative;
    width:100%;
    height:100%;
}

/* HOTSPOT */
.hotspot{
    position:absolute;
    cursor:pointer;
    z-index:10;
}

/* BOTÃO PREMIUM */
.btn-audio{
    position:fixed;
    top:30px;
    left:20px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:rgba(0,0,0,.5);
    border:2px solid #fff;
    display:none;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    z-index:1000;
    backdrop-filter:blur(4px);
    transition:.3s;
}

.btn-audio svg{
    width:22px;
    height:22px;
    fill:#fff;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.07)}
    100%{transform:scale(1)}
}

.btn-audio.playing{
    animation:pulse 2s infinite;
}

</style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop preload="auto"></audio>
<div id="btnAudio" class="btn-audio" onclick="toggleAudio()"></div>

<!-- PÁGINAS -->
<div class="page active" id="page1">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline muted></video>
    </div>
</div>

<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg">
        <a class="hotspot"
           style="top:63%; left:50%; width:22%; height:10%; transform:translateX(-50%);"
           href="http://noivos.casar.com/lyaejoao"
           target="_blank">
        </a>
    </div>
</div>

<script>

const musica=document.getElementById("musica");
const video=document.getElementById("video");
const btnAudio=document.getElementById("btnAudio");
let tocando=false;

const playIcon=`<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"></polygon></svg>`;
const pauseIcon=`<svg viewBox="0 0 24 24"><rect x="5" y="3" width="5" height="18"></rect><rect x="14" y="3" width="5" height="18"></rect></svg>`;

function atualizarBotao(){
    btnAudio.innerHTML=tocando?pauseIcon:playIcon;
    btnAudio.classList.toggle("playing",tocando);
}

function mudarPagina(n){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page"+n).classList.add("active");
}

function startInvite(){
    btnAudio.style.display="flex";

    musica.play().then(()=>{
        tocando=true;
        atualizarBotao();
    }).catch(()=>{});

    mudarPagina(2);

    video.play().catch(()=>{});
    video.onended=()=>mudarPagina(3);
}

function toggleAudio(){
    if(tocando){
        musica.pause();
        tocando=false;
    }else{
        musica.play().catch(()=>{});
        tocando=true;
    }
    atualizarBotao();
}

document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible" && tocando){
        musica.play().catch(()=>{});
    }
});

atualizarBotao();

</script>

</body>
</html>
