<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Convite Lya e João</title>

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* PÁGINAS COM FADE */
.page {
    position: absolute;
    width: 100%;
    height: 100vh;
    max-width: 500px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
}

.page.active {
    opacity: 1;
    pointer-events: auto;
}

.page img,
.page video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.content-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
}

/* HOTSPOT */
.hotspot {
    position: absolute;
    cursor: pointer;
    z-index: 10;
}

/* BOTÃO ÁUDIO PREMIUM */
.btn-audio {
    position: fixed;
    top: 25px;
    left: 20px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 2px solid #fff;
    display: none;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 1000;
    backdrop-filter: blur(6px);
    transition: transform 0.3s ease;
}

.btn-audio:hover {
    transform: scale(1.08);
}

.btn-audio svg {
    width: 22px;
    height: 22px;
    fill: #fff;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.07); }
    100% { transform: scale(1); }
}

.btn-audio.playing {
    animation: pulse 2s infinite;
}

</style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop preload="auto"></audio>

<div id="btnAudio" class="btn-audio" onclick="toggleAudio()"></div>

<!-- PÁGINAS -->
<div class="page active" id="page1">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline muted></video>
    </div>
</div>

<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg">
        <a class="hotspot"
           style="top:63%; left:50%; width:22%; height:10%; transform:translateX(-50%);"
           href="http://noivos.casar.com/lyaejoao"
           target="_blank">
        </a>
    </div>
</div>

<script>

const musica = document.getElementById('musica');
const video = document.getElementById('video');
const btnAudio = document.getElementById('btnAudio');
let isPlaying = false;

const playIcon = `
<svg viewBox="0 0 24 24">
<polygon points="5,3 19,12 5,21"></polygon>
</svg>`;

const pauseIcon = `
<svg viewBox="0 0 24 24">
<rect x="5" y="3" width="5" height="18"></rect>
<rect x="14" y="3" width="5" height="18"></rect>
</svg>`;

function updateButton() {
    btnAudio.innerHTML = isPlaying ? pauseIcon : playIcon;
    btnAudio.classList.toggle("playing", isPlaying);
}

function fadeToPage(num) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page' + num);
    if (target) target.classList.add('active');
}

function startInvite() {

    btnAudio.style.display = "flex";

    musica.play().then(() => {
        isPlaying = true;
        updateButton();
    }).catch(() => {
        isPlaying = false;
        updateButton();
    });

    fadeToPage(2);

    video.play().catch(()=>{});
    video.onended = () => fadeToPage(3);
}

function toggleAudio() {
    if (isPlaying) {
        musica.pause();
        isPlaying = false;
    } else {
        musica.play().catch(()=>{});
        isPlaying = true;
    }
    updateButton();
}

document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible" && isPlaying) {
        musica.play().catch(()=>{});
    }
});

updateButton();

</script>

</body>
</html>
