<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Instamomentos - Galeria</title>
    
    <!-- Ferramentas do Estúdio de Corte (Cropper.js) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root {
            --cor-fundo: #F8F9FA;
            --cor-texto: #333333;
            --cor-destaque: #235587; 
            --cor-secundaria: #8E8E8E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); min-height: 100dvh; display: flex; flex-direction: column; }

        .header-perfil { background-color: #fff; padding-bottom: 20px; border-bottom: 1px solid #dbdbdb; }
        .banner { width: 100%; height: 180px; background-color: #e0e0e0; background-size: cover; background-position: center; display: block; }
        .info-perfil { display: flex; flex-direction: column; align-items: center; margin-top: -50px; text-align: center; padding: 0 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; background-color: #ccc; object-fit: cover; margin-bottom: 10px; }
        .titulo-evento { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .data-evento { font-size: 0.9rem; color: var(--cor-secundaria); margin-bottom: 10px; }
        .descricao { font-size: 0.95rem; margin-bottom: 20px; }

        .estatisticas { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .stat-numero { font-weight: bold; font-size: 1.1rem; }
        .stat-label { font-size: 0.8rem; color: var(--cor-secundaria); }

        .btn-principal-festa { width: 90%; max-width: 300px; margin: 10px auto; display: block; padding: 15px; background-color: var(--cor-destaque); color: #ffffff; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; }

        .galeria-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; background-color: #f4f4f4; }
        .post-container { position: relative; background: #fff; border-radius: 12px; overflow: hidden; }
        .media-wrapper { position: relative; width: 100%; aspect-ratio: 9 / 16; background-color: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-wrapper img { width: 100%; height: 100%; object-fit: contain; }

        .curtidas-feed { position: absolute; bottom: 8px; right: 8px; background-color: rgba(0, 0, 0, 0.6); color: white; padding: 4px 10px; border-radius: 15px; font-size: 0.8rem; display: flex; align-items: center; gap: 5px; pointer-events: none; z-index: 5; }

        .camera-container { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background-color: #000; z-index: 1000; display: none; flex-direction: column; justify-content: space-between; }
        .camera-header { padding: 15px 20px; display: flex; position: absolute; width: 100%; z-index: 10; }
        .btn-fechar { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }

        .video-wrapper { position: relative; width: 100%; max-height: 80dvh; aspect-ratio: 9 / 16; margin: auto 0; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        #molduraOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        .camera-controles { padding: 20px; background-color: #000; display: flex; flex-direction: column; gap: 15px; }
        .filtros { display: flex; gap: 10px; justify-content: center; }
        .btn-filtro { background-color: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; }
        .btn-filtro.ativo { background-color: var(--cor-destaque); }

        .acoes-principais { display: flex; justify-content: space-around; align-items: center; }
        .btn-inverter { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .btn-capturar-final { width: 70px; height: 70px; border-radius: 50%; background-color: #fff; border: 5px solid #ccc; cursor: pointer; }

        .btn-video-externo { background: none; border: none; color: #FFD700; font-size: 1.5rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .btn-video-externo span { font-size: 0.6rem; color: #fff; margin-top: 2px; }

        .aviso-redirecionar { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-confirmar-sair { background-color: #25d366; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; margin-top: 20px; width: 100%; cursor: pointer; }

        .modal-foto { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background-color: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn-fechar-modal { position: absolute; top: 20px; left: 20px; background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; z-index: 2010; }
        .img-expandida { max-width: 90%; max-height: 70dvh; object-fit: contain; border-radius: 8px; margin-bottom: 20px; }
        .modal-acoes { display: flex; gap: 15px; }
        .btn-acao-modal { background-color: #333; color: #fff; border: none; padding: 12px 20px; border-radius: 25px; font-size: 1rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="sessaoFeed">
    <header class="header-perfil">
        <div class="banner"></div>
        <div class="info-perfil">
            <img src="" alt="Avatar" class="avatar" id="avatarEvento">
            <h1 class="titulo-evento" id="nomeEvento">Carregando...</h1>
            <p class="data-evento" id="dataEvento"></p>
            <p class="descricao" id="descricaoEvento"></p>
            <div class="estatisticas">
                <div class="stat-item"><span class="stat-numero" id="totalFotos">0</span><span class="stat-label">Fotos</span></div>
                <div class="stat-item"><span class="stat-numero" id="totalCurtidas">0</span><span class="stat-label">Curtidas</span></div>
            </div>
            <button class="btn-principal-festa" id="btnAbrirCamera">📸 Adicionar Foto</button>
        </div>
    </header>
    <main class="galeria-grid" id="feedGaleria"></main>
</div>

<div id="cameraContainer" class="camera-container">
    <div class="camera-header"><button id="btnFecharCamera" class="btn-fechar">❌ Voltar</button></div>
    <div class="video-wrapper">
        <video id="videoElement" autoplay playsinline></video>
        <img id="molduraOverlay" src="" alt="Moldura">
    </div>
    <div class="camera-controles">
        <div class="filtros">
            <button id="btnFiltroNormal" class="btn-filtro ativo">Normal</button>
            <button id="btnFiltroPB" class="btn-filtro">P&B</button>
        </div>
       <div class="acoes-principais">
            <button id="btnUploadFoto" class="btn-inverter">🖼️</button>
            <input type="file" id="inputUploadArquivo" accept="image/*" style="display: none;">
            <button id="btnCapturarFinal" class="btn-capturar-final"></button>
            <button onclick="window.avisarSaida()" class="btn-video-externo">🎬<span>Vídeo</span></button>
            <button id="btnInverterCamera" class="btn-inverter">🔄</button>
        </div>
    </div>
</div>

<div id="modalFoto" class="modal-foto">
    <button onclick="window.fecharModal()" class="btn-fechar-modal">❌ Voltar</button>
    <img id="imgModalExpandida" class="img-expandida" src="" alt="Foto Expandida">
    <div class="modal-acoes">
        <button id="btnModalCurtir" class="btn-acao-modal">❤️ <span id="contadorModalCurtidas">0</span></button>
        <a id="btnModalBaixar" class="btn-acao-modal" href="#" style="text-decoration:none; color:white;">⬇️ Baixar</a>
        <button id="btnModalDeletar" class="btn-acao-modal">🗑️</button>
    </div>
</div>

<div id="modalEstudio" class="modal-foto" style="z-index: 3000;">
    <h3 style="color: white; margin-bottom: 10px;">Ajuste sua foto</h3>
    <div style="width: 90%; height: 60dvh; background-color: #000; overflow: hidden; border-radius: 12px; position: relative;">
        <img id="imagemParaCortar" src="" style="max-width: 100%; display: block;">
        <img id="molduraEstudio" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 3010;">
    </div>
    <div class="modal-acoes" style="margin-top: 20px;">
        <button id="btnCancelarCorte" class="btn-acao-modal" style="background-color: #ff4444;">❌ Cancelar</button>
        <button id="btnConfirmarCorte" class="btn-acao-modal" style="background-color: var(--cor-destaque);">✅ Enviar</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAhuu4yUKVgxtRHchUvywRJ5eHw0fUIJgE",
        authDomain: "insta-momentos.firebaseapp.com",
        projectId: "insta-momentos",
        storageBucket: "insta-momentos.firebasestorage.app",
        messagingSenderId: "331954094992",
        appId: "1:331954094992:web:e7489c969308a2885f2915"
    };
    const IMGBB_API_KEY = "aa0c9dc6122e459a16cf1f6e8d9d3686";
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const sessaoFeed = document.getElementById('sessaoFeed');
    const cameraContainer = document.getElementById('cameraContainer');
    const btnAbrirCamera = document.getElementById('btnAbrirCamera');
    const btnFecharCamera = document.getElementById('btnFecharCamera');
    const videoElement = document.getElementById('videoElement');
    let stream = null;
    let usandoCameraFrontal = false;
    let cropper = null;

    async function abrirCamera() {
        sessaoFeed.style.display = 'none';
        cameraContainer.style.display = 'flex';
        const modo = usandoCameraFrontal ? "user" : "environment";
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: modo } });
            videoElement.srcObject = stream;
        } catch (err) { alert("Erro ao abrir câmera"); fecharInterface(); }
    }

    function fecharInterface() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        cameraContainer.style.display = 'none';
        sessaoFeed.style.display = 'block';
    }

    btnAbrirCamera.onclick = abrirCamera;
    btnFecharCamera.onclick = fecharInterface;
    document.getElementById('btnInverterCamera').onclick = () => { usandoCameraFrontal = !usandoCameraFrontal; fecharInterface(); abrirCamera(); };

    onSnapshot(doc(db, "configuracoes", "dados_festa"), (d) => {
        if (d.exists()) {
            const data = d.data();
            document.getElementById('nomeEvento').textContent = data.nome || "";
            document.getElementById('dataEvento').textContent = data.data || "";
            document.getElementById('descricaoEvento').textContent = data.texto || "";
            if (data.url_avatar) document.getElementById('avatarEvento').src = data.url_avatar;
            if (data.url_banner) document.querySelector('.banner').style.backgroundImage = `url('${data.url_banner}')`;
            if (data.url_moldura) document.getElementById('molduraOverlay').src = data.url_moldura;
        }
    });

    onSnapshot(query(collection(db, "postagens"), orderBy("data_envio", "desc")), (snap) => {
        const feed = document.getElementById('feedGaleria');
        feed.innerHTML = "";
        let totalC = 0;
        snap.forEach(docSnap => {
            const p = docSnap.data();
            totalC += (p.curtidas || 0);
            const card = document.createElement('div');
            card.className = 'post-container';
            card.innerHTML = `<div class="media-wrapper" onclick="window.abrirModal('${p.url_imagem}', '${docSnap.id}', ${p.curtidas || 0})">
                <img src="${p.url_imagem}"><div class="curtidas-feed">❤️ ${p.curtidas || 0}</div></div>`;
            feed.appendChild(card);
        });
        document.getElementById('totalFotos').textContent = snap.size;
        document.getElementById('totalCurtidas').textContent = totalC;
    });

    window.abrirModal = (url, id, curtidas) => {
        document.getElementById('imgModalExpandida').src = url;
        document.getElementById('contadorModalCurtidas').textContent = curtidas;
        const btnBaixar = document.getElementById('btnModalBaixar');
        btnBaixar.onclick = async (e) => {
            e.preventDefault();
            btnBaixar.textContent = "⏳...";
            try {
                const res = await fetch(url + "?t=" + new Date().getTime());
                const blob = await res.blob();
                const link = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = link; a.download = "Instamomentos.jpg";
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                btnBaixar.textContent = "✅ Salvo";
                setTimeout(() => btnBaixar.textContent = "⬇️ Baixar", 2000);
            } catch(err) { window.open(url, '_blank'); }
        };
        document.getElementById('btnModalCurtir').onclick = () => updateDoc(doc(db, "postagens", id), { curtidas: increment(1) });
        document.getElementById('btnModalDeletar').onclick = () => confirm("Apagar?") && deleteDoc(doc(db, "postagens", id));
        document.getElementById('modalFoto').style.display = 'flex';
    };

    window.fecharModal = () => document.getElementById('modalFoto').style.display = 'none';

    document.getElementById('btnCapturarFinal').onclick = async () => {
        const btn = document.getElementById('btnCapturarFinal');
        btn.disabled = true;
        const canvas = document.createElement('canvas');
        canvas.width = 1080; canvas.height = 1920;
        const ctx = canvas.getContext('2d');
        if (usandoCameraFrontal) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
        ctx.setTransform(1,0,0,1,0,0);
        ctx.drawImage(document.getElementById('molduraOverlay'), 0, 0, canvas.width, canvas.height);
        const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        const form = new FormData(); form.append('image', base64);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: form });
        const imgData = await res.json();
        if (imgData.success) {
            await addDoc(collection(db, "postagens"), { url_imagem: imgData.data.url, curtidas: 0, data_envio: serverTimestamp() });
            fecharInterface();
        }
        btn.disabled = false;
    };

    const inputUploadArquivo = document.getElementById('inputUploadArquivo');
    const modalEstudio = document.getElementById('modalEstudio');
    const imagemParaCortar = document.getElementById('imagemParaCortar');

    document.getElementById('btnUploadFoto').onclick = () => inputUploadArquivo.click();

    inputUploadArquivo.onchange = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            imagemParaCortar.src = e.target.result;
            document.getElementById('molduraEstudio').src = document.getElementById('molduraOverlay').src;
            modalEstudio.style.display = 'flex';
            if (cropper) cropper.destroy();
            cropper = new Cropper(imagemParaCortar, { aspectRatio: 9 / 16, viewMode: 1 });
        };
        reader.readAsDataURL(file);
    };

    document.getElementById('btnCancelarCorte').onclick = () => {
        modalEstudio.style.display = 'none';
        if (cropper) cropper.destroy();
        inputUploadArquivo.value = "";
    };

    document.getElementById('btnConfirmarCorte').onclick = async () => {
        const canvas = cropper.getCroppedCanvas({ width: 1080, height: 1920 });
        const ctx = canvas.getContext('2d');
        ctx.drawImage(document.getElementById('molduraOverlay'), 0, 0, canvas.width, canvas.height);
        const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        const form = new FormData(); form.append('image', base64);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: form });
        const imgData = await res.json();
        if (imgData.success) {
            await addDoc(collection(db, "postagens"), { url_imagem: imgData.data.url, curtidas: 0, data_envio: serverTimestamp() });
            modalEstudio.style.display = 'none';
            fecharInterface();
        }
    };

    // --- LÓGICA DE REDIRECIONAMENTO DE VÍDEO (CORRIGIDA) ---
    window.avisarSaida = () => {
        const modalAviso = document.createElement('div');
        modalAviso.id = "modalAvisoSaida";
        Object.assign(modalAviso.style, {
            position: "fixed", top: "0", left: "0", width: "100%", height: "100%",
            backgroundColor: "rgba(0,0,0,0.8)", display: "flex", justifyContent: "center",
            alignItems: "center", zIndex: "9999"
        });
        modalAviso.innerHTML = `
            <div class="aviso-redirecionar">
                <p style="font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; color: #333;">🎬 Gravar Vídeo</p>
                <p style="color: #555; line-height: 1.4;">Você está sendo direcionado para fora do Instamomentos para a geração do vídeo com filtro de moldura.</p>
                <button class="btn-confirmar-sair" id="confirmarSair">Ir para o Filtro</button>
                <button id="cancelarSair" style="background: none; border: none; color: #888; margin-top: 15px; cursor: pointer; text-decoration: underline;">Cancelar</button>
            </div>
        `;
        document.body.appendChild(modalAviso);
        document.getElementById('confirmarSair').onclick = () => {
            window.open("https://crispoparte.com.br/juliana50/", "_blank"); 
            modalAviso.remove();
        };
        document.getElementById('cancelarSair').onclick = () => modalAviso.remove();
    };
</script>
</body>
</html>
