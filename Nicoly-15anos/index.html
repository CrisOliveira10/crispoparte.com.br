<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Convite Nicoly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        .page {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .page img,
        .page video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* BOTÕES INVISÍVEIS */
        .hotspot {
            position: absolute;
            width: 70px;
            height: 70px;
            cursor: pointer;
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* BOTÃO FLUTUANTE PLAY/PAUSE */
        #btn-audio {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #fff;
            border-radius: 50%;
            z-index: 9999;
            display: none; /* Só aparece após o start */
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Desenho dos Símbolos */
        .symbol-pause {
            display: flex;
            gap: 4px;
        }
        .symbol-pause div {
            width: 4px;
            height: 16px;
            background: white;
        }

        .symbol-play {
            width: 0; 
            height: 0; 
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 14px solid white;
            margin-left: 4px;
            display: none;
        }
    </style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop></audio>

<div id="btn-audio" onclick="toggleAudio()">
    <div id="icon-pause" class="symbol-pause">
        <div></div>
        <div></div>
    </div>
    <div id="icon-play" class="symbol-play"></div>
</div>

<div class="page" id="page1" style="display:block;">
    <img src="pagina1.jpg">
    <div class="hotspot" style="top:0;left:0;width:100%;height:100%;" onclick="startInvite()"></div>
</div>

<div class="page" id="page2">
    <video id="video" src="pagina2.mp4" playsinline></video>
</div>

<div class="page" id="page3">
    <img src="pagina3.jpg">

    <a class="hotspot"
       style="bottom:18%; left:16%;"
       href="https://wa.me/5571993233142"
       target="_blank"></a>

    <a class="hotspot"
       style="bottom:18%; left:42%;"
       href="https://maps.app.goo.gl/f6znvALZZBPfC8WK7"
       target="_blank"></a>

    <div class="hotspot"
         style="bottom:18%; left:68%;"
         onclick="goPage(4)"></div>
</div>

<div class="page" id="page4">
    <img src="pagina4.jpg">
    <div class="btn-voltar" onclick="goPage(3)"></div>
</div>

<script>
    const musica = document.getElementById('musica');
    const video = document.getElementById('video');
    const btnAudio = document.getElementById('btn-audio');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    function startInvite() {
        musica.play().then(() => {
            btnAudio.style.display = 'flex';
        }).catch(e => console.log("Erro ao tocar"));
        
        goPage(2);
        video.play();

        video.onended = () => {
            goPage(3);
        };
    }

    function toggleAudio() {
        if (musica.paused) {
            musica.play();
            iconPause.style.display = 'flex';
            iconPlay.style.display = 'none';
        } else {
            musica.pause();
            iconPause.style.display = 'none';
            iconPlay.style.display = 'block';
        }
    }

    function goPage(num) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        const targetPage = document.getElementById('page' + num);
        if (targetPage) {
            targetPage.style.display = 'block';
        }
    }
</script>

</body>
</html>
