<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Convite Pedro</title>
    <meta property="og:title" content="Convite especial: Pedro - 1 Ano">
    <meta property="og:description" content="Toque para abrir os detalhes deste dia incrível.">
    <meta property="og:image" content="https://crispoparte.com.br/pedro/capalink.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        .page {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .page img,
        .page video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* BOTÕES INVISÍVEIS */
        .hotspot {
            position: absolute;
            width: 70px;
            height: 70px;
            cursor: pointer;
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
        }

        /* AJUSTE CIRÚRGICO: BOTÃO DE CONTROLE DE ÁUDIO */
        #btn-audio {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            z-index: 9999;
            display: none; /* Inicia oculto, aparece após o start */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Ícones Play/Pause via CSS */
        .icon-pause::before, .icon-pause::after {
            content: '';
            width: 4px;
            height: 15px;
            background: white;
            margin: 0 2px;
        }

        .icon-play {
            width: 0; 
            height: 0; 
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-left: 12px solid white;
            margin-left: 4px;
        }
    </style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop></audio>

<div id="btn-audio" onclick="toggleAudio()">
    <div id="audio-icon" class="icon-pause"></div>
</div>

<div class="page" id="page1" style="display:block;">
    <img src="pagina1.png">
    <div class="hotspot" style="top:0;left:0;width:100%;height:100%;" onclick="startInvite()"></div>
</div>

<div class="page" id="page2">
    <video id="video" src="pagina2.mp4" playsinline></video>
</div>

<div class="page" id="page3">
    <img src="pagina3.jpg">

    <a class="hotspot"
       style="bottom:18%; left:16%;"
       href="https://wa.me/5571993233142"
       target="_blank"></a>

    <a class="hotspot"
       style="bottom:18%; left:42%;"
       href="https://maps.app.goo.gl/f6znvALZZBPfC8WK7"
       target="_blank"></a>

    <div class="hotspot"
         style="bottom:18%; left:68%;"
         onclick="goPage(4)"></div>
</div>

<div class="page" id="page4">
    <img src="pagina4.jpg">

    <div class="btn-voltar" onclick="goPage(3)"></div>
</div>

<script>
    const musica = document.getElementById('musica');
    const video = document.getElementById('video');
    const btnAudio = document.getElementById('btn-audio');
    const audioIcon = document.getElementById('audio-icon');

    function startInvite() {
        musica.play().then(() => {
            btnAudio.style.display = 'flex'; // Mostra o botão quando a música começa
        }).catch(e => console.log("Áudio bloqueado"));
        
        goPage(2);
        video.play();

        video.onended = () => {
            goPage(3);
        };
    }

    // Função para pausar/tocar
    function toggleAudio() {
        if (musica.paused) {
            musica.play();
            audioIcon.className = 'icon-pause';
        } else {
            musica.pause();
            audioIcon.className = 'icon-play';
        }
    }

    function goPage(num) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        const targetPage = document.getElementById('page' + num);
        if (targetPage) {
            targetPage.style.display = 'block';
        }
    }
</script>

</body>
</html>
