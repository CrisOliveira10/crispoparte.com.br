/* 🔴 ÁREA DE CORES EDITÁVEIS (ALUNAS ALTERAM AQUI) */
/* ========================================================= */
:root{
  --cor-fundo: #faf7f2;
  --cor-cronometro-fundo: #644a3e; 
  --cor-cronometro-texto: #ffffff;
  --cor-botoes-geral:#6e605c;
}

/* ========================================================= */

html,body{
  margin:0;
  padding:0;
  background:var(--cor-fundo);
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

.pagina{
  position:relative;
  width:100%;
  max-width:430px;
  margin:0 auto;
}

.full-img,
.full-video{
  width:100%;
  display:block;
}

/* BOTÃO ÁUDIO */
#audioBtn{
  position:fixed;
  top:15px;
  right:15px;
  width:50px;
  height:50px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
  z-index:9999;
}

/* CRONÔMETRO (PÁGINA 3) */
.cronometro {
  position: absolute;
  top: 20%; 
  left: 50%;
  transform: translateX(-50%);
  width: 85%;
  display: flex;
  justify-content: center;
  gap: 10px;
  background: var(--cor-cronometro-fundo);
  padding: 12px 5px;
  border-radius: 50px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 10;
}

.tempo-unidade {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: var(--cor-cronometro-texto);
  min-width: 55px;
}

.tempo-valor {
  font-size: 24px;
  font-weight: bold;
  line-height: 1;
}

.tempo-legenda {
  font-size: 9px;
  text-transform: uppercase;
  margin-top: 4px;
  letter-spacing: 1px;
}

/* SLIDER DE FOTOS (PÁGINA 4) */
.slider-container {
    position: absolute;
    top: 8%; /* 🔴 Para SUBIR diminua, para DESCER aumente */
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.slider-wrapper {
    display: flex;
    transition: transform 0.4s ease-out;
    touch-action: pan-y;
}

.slider-wrapper img {
    width: 100%;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
}

  font-size:20px;
  padding:15px;

  color:#fff;
  text-decoration:none;
}
