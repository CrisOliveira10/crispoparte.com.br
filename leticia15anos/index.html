<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Convite Leticia 15 anos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            display: none;
            width: 100%;
            height: 100dvh;
            position: relative;
            max-width: 500px; 
            margin: 0 auto;
        }

        .page img,
        .page video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
         /* background: rgba(255,0,0,0.3); / / Remova o comentário para ajustar as posições */
        }

        .btn-voltar {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 12%;
            aspect-ratio: 1/1;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
        }
    </style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop></audio>

<div class="page" id="page1" style="display:block;">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline></video>
    </div>
</div>

<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg">

        <a class="hotspot"
           style="bottom:28%; left:18%; width:15%; height:12%;"
           href="https://wa.me/5571993233142?text=Gostaria%20de%20confirmar%20presen%C3%A7a"
           target="_blank"></a>

        <a class="hotspot"
           style="bottom:28%; left:35%; width:15%; height:12%;"
            href="https://maps.app.goo.gl/DqbXn5Nz9gSzQmSCA"
           target="_blank"></a>

        <div class="hotspot"
             style="bottom:28%; left:51%; width:15%; height:12%;"
             onclick="goPage(4)"></div>

        <div class="hotspot" 
             style="bottom:28%; left:68%; width:15%; height:12%;" 
             onclick="goPage(5)"></div>
    </div>
</div>

<div class="page" id="page4">
    <div class="content-wrapper">
        <img src="pagina4.jpg">
        <div class="btn-voltar" onclick="goPage(3)"></div>
    </div>
</div>

<div class="page" id="page5">
    <div class="content-wrapper">
        <img src="pagina5.jpg">
        <div class="btn-voltar" onclick="goPage(3)"></div>
    </div>
</div>

<script>
    const musica = document.getElementById('musica');
    const video = document.getElementById('video');

    function startInvite() {
        musica.play().catch(e => console.log("Áudio aguardando interação"));
        goPage(2);
        video.play();

        video.onended = () => {
            goPage(3);
        };
    }

    function goPage(num) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        const targetPage = document.getElementById('page' + num);
        if (targetPage) {
            targetPage.style.display = 'block';
        }
    }
</script>

</body>
</html>
