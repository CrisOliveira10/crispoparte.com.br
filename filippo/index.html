<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Convite Interativo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            position: fixed;
        }

        /* Capa de Entrada */
        .page-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            background: #000;
            transition: opacity 0.5s ease;
        }

        .bg-btn {
            width: 100%;
            height: 100%;
            background-image: url('abrir.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
        }

        /* Container do Canva */
        #container-canva {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 1;
            overflow-x: hidden; /* Trava rolagem lateral */
            overflow-y: auto;   /* Permite rolagem vertical igual ao PDF */
            -webkit-overflow-scrolling: touch;
        }

        /* O TRUQUE DO ZOOM: 
           Como sua arte é 1366x768 (Paisagem) e o celular é Retrato,
           aumentamos a escala para que a largura da arte preencha a largura da tela.
        */
        .canva-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 50%;
            width: 150%; /* Aumentamos a largura para "zoom" */
            height: 100%;
            border: none;
            transform: translateX(-50%); /* Centraliza o zoom */
        }
    </style>
</head>

<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <div class="page-overlay" id="overlay">
        <div class="bg-btn" id="btnAbrir"></div>
    </div>

    <div id="container-canva">
        <div class="canva-wrapper">
            <iframe src="https://www.canva.com/design/DAG8FQsgmJ0/656UfPLYCpXCZPXNwlCf7A/view?embed" 
                    allow="autoplay">
            </iframe>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const botao = document.getElementById('btnAbrir');
        const overlay = document.getElementById('overlay');
        const containerCanva = document.getElementById('container-canva');

        botao.addEventListener('click', () => {
            audio.play().catch(e => console.log("Áudio ativado"));
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                containerCanva.style.display = 'block';
            }, 500);
        });

        // Segurança mantida
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 83))) {
                e.preventDefault();
            }
        });
    </script>
</body> 
</html>
