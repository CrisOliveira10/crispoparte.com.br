<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Interativo</title>

    <style>
        /* Reseta margens e garante que ocupará a tela toda */
        * {
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden; /* Evita rolagem dupla na capa */
            position: fixed; /* Previne "puxar para atualizar" em navegadores mobile */
        }

        /* Capa de Entrada */
        .page-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            background: #000;
            transition: opacity 0.6s ease;
        }

        .bg-btn {
            width: 100%;
            height: 100%;
            background-image: url('abrir.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
        }

        /* Container do Canva Ocupando Tudo */
        #container-canva {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Ajuste para esconder elementos do canva se necessário */
        .canva-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <div style="display: none !important; visibility: hidden;" aria-hidden="true">
        © 2026 Cristiane Oliveira. Protegido pela Lei nº 9.610/98.
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <div class="page-overlay" id="overlay">
        <div class="bg-btn" id="btnAbrir"></div>
    </div>

    <div id="container-canva">
        <div class="canva-wrapper">
            <iframe src="https://www.canva.com/design/DAG8FQsgmJ0/656UfPLYCpXCZPXNwlCf7A/view?embed" 
                    allowfullscreen="allowfullscreen" 
                    allow="autoplay">
            </iframe>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const botao = document.getElementById('btnAbrir');
        const overlay = document.getElementById('overlay');
        const containerCanva = document.getElementById('container-canva');

        botao.addEventListener('click', () => {
            // Inicia áudio
            audio.play().catch(e => console.log("Áudio aguardando interação"));

            // Transição visual
            overlay.style.opacity = '0';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                containerCanva.style.display = 'block';
                
                // Libera a rolagem para o conteúdo interno
                document.body.style.position = 'static';
                document.body.style.overflow = 'auto';
            }, 600);
        });

        // Script de Segurança Mantido
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 83))) {
                    e.preventDefault();
                }
            });
        })();
    </script>
</body> 
</html>
