<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Convite Interativo</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* Capa de Entrada */
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            background: #000;
            transition: opacity 0.6s ease;
        }

        .bg-btn {
            width: 100%;
            height: 100%;
            background-image: url('abrir.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
        }

        /* Container que força o preenchimento total */
        #container-canva {
            display: none;
            position: fixed; /* Fixa para evitar saltos */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* O segredo: iframe com 100% da altura da tela (100dvh para celulares novos) */
        iframe {
            width: 100%;
            height: 100dvh; /* dvh adapta-se dinamicamente às barras do navegador */
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }

        /* Ajuste para remover barras extras do Canva em alguns casos */
        .canva-wrapper {
            width: 100%;
            height: 100%;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>

<body>

    <div style="display: none !important; visibility: hidden;" aria-hidden="true">
        © 2026 Cristiane Oliveira. Protegido pela Lei nº 9.610/98.
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <div class="page-overlay" id="overlay">
        <div class="bg-btn" id="btnAbrir"></div>
    </div>

    <div id="container-canva">
        <div class="canva-wrapper">
            <iframe src="https://www.canva.com/design/DAG8FQsgmJ0/656UfPLYCpXCZPXNwlCf7A/view?embed" 
                    allowfullscreen="allowfullscreen" 
                    allow="autoplay">
            </iframe>
        </div>
    </div>

    <script>
        const audio = document.getElementById('bgMusic');
        const botao = document.getElementById('btnAbrir');
        const overlay = document.getElementById('overlay');
        const containerCanva = document.getElementById('container-canva');

        botao.addEventListener('click', () => {
            audio.play().catch(e => console.log("Áudio aguardando..."));

            overlay.style.opacity = '0';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                containerCanva.style.display = 'block';
                // Garante que o body não tente rolar sozinho, deixando a rolagem pro Canva
                document.body.style.overflow = 'hidden'; 
            }, 600);
        });

        // Segurança
        (function() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', function(e) {
                if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 83))) {
                    e.preventDefault();
                }
            });
        })();
    </script>
</body> 
</html>
