<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Convite Pedro</title>
    <meta property="og:title" content="Convite especial: Pedro - 1 Ano">
    <meta property="og:description" content="Toque para abrir os detalhes deste dia incrível.">
    <meta property="og:image" content="https://crispoparte.com.br/pedro/capalink.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            height: 100dvh; 
        }

        .page {
            display: none;
            width: 100vw;
            height: 100dvh; 
            position: relative;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .page img,
        .page video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* BOTÕES INVISÍVEIS */
        .hotspot {
            position: absolute;
            width: 15%; 
            height: 10%;
            cursor: pointer;
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            position: absolute;
            top: 3%;
            right: 5%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
        }

        /* BOTÃO DE CONTROLE DE ÁUDIO */
        #btn-audio {
            position: fixed;
            top: 3%;
            left: 5%;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            z-index: 9999;
            display: none; 
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Símbolo Pause (dois traços) - CSS Corrigido */
        .icon-pause::before, .icon-pause::after {
            content: '';
            width: 4px;
            height: 16px;
            background: white;
            margin: 0 2px;
            display: block; /* Garante que apareçam */
        }

        /* Símbolo Play (triângulo) - CSS Corrigido */
        .icon-play {
            width: 0; 
            height: 0; 
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid white;
            margin-left: 5px; /* Ajuste fino */
        }
        /* Remove os traços do pause quando for play */
        .icon-play::before, .icon-play::after {
            display: none;
        }
    </style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop></audio>

<div id="btn-audio" onclick="toggleAudio()">
    <div id="audio-icon" class="icon-pause"></div>
</div>

<div class="page" id="page1" style="display:flex;">
    <img src="pagina1.jpg">
    <div class="hotspot" style="top:0;left:0;width:100%;height:100%;" onclick="startInvite()"></div>
</div>

<div class="page" id="page2">
    <video id="video" src="pagina2.mp4" playsinline></video>
</div>

<div class="page" id="page3">
    <img src="pagina3.jpg">

    <a class="hotspot"
       style="bottom:15%; left:10%; width:25%; height:15%;"
       href="https://wa.me/5571993233142"
       target="_blank"></a>

    <a class="hotspot"
       style="bottom:15%; left:37%; width:25%; height:15%;"
       href="https://maps.app.goo.gl/f6znvALZZBPfC8WK7"
       target="_blank"></a>

    <div class="hotspot"
         style="bottom:15%; left:65%; width:25%; height:15%;"
         onclick="goPage(4)"></div>
</div>

<div class="page" id="page4">
    <img src="pagina4.jpg">
    <div class="btn-voltar" onclick="goPage(3)"></div>
</div>

<script>
    const musica = document.getElementById('musica');
    const video = document.getElementById('video');
    const btnAudio = document.getElementById('btn-audio');
    const audioIcon = document.getElementById('audio-icon');

    function startInvite() {
        musica.play().then(() => {
            btnAudio.style.display = 'flex'; // Mostra o botão
        }).catch(e => console.log("Áudio bloqueado até interação"));
        
        goPage(2);
        video.play();

        video.onended = () => {
            goPage(3);
        };
    }

    // Função de alternar Play/Pause
    function toggleAudio() {
        if (musica.paused) {
            musica.play();
            audioIcon.className = 'icon-pause';
        } else {
            musica.pause();
            audioIcon.className = 'icon-play';
        }
    }

    function goPage(num) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        const targetPage = document.getElementById('page' + num);
        if (targetPage) {
            targetPage.style.display = 'flex';
        }
    }
</script>

</body>
</html>
