<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Convite Pedro</title>

<meta property="og:title" content="Convite especial: Pedro - 1 Ano">
<meta property="og:description" content="Toque para abrir os detalhes deste dia incrível.">
<meta property="og:image" content="https://crispoparte.com.br/pedro/capalink.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">

<style>
:root {
    --cor-botao: #ffffff; 
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page {
    display: none;
    width: 100%;
    height: 100dvh;
    position: relative;
    max-width: 500px;
    margin: 0 auto;
}

.page img,
.page video {
    width: 100%;
    height: 100%;
    object-fit: contain; 
    display: block;
}

.content-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ANIMAÇÃO PULSE */
@keyframes pulse-white {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
}

/* BOTÃO PLAY/PAUSE */
.btn-audio {
    position: fixed;
    top: 30px; 
    left: 20px; 
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background-color: rgba(0, 0, 0, 0.4); 
    border: 2px solid var(--cor-botao);
    color: var(--cor-botao);
    display: none; 
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 1000;
    font-size: 18px;
    animation: pulse-white 2s infinite;
}

.btn-audio:active {
    transform: scale(0.9);
    animation: none;
}

/* HOTSPOTS */
.hotspot { 
    position: absolute; 
    cursor: pointer; 
    z-index: 10; 
}

/* MODO EDIÇÃO VISUAL */
.modo-edicao .hotspot {
    background: rgba(255, 0, 0, 0.4);
    border: 2px dashed red;
}

.btn-voltar { 
    position: absolute; 
    top: 5%; 
    right: 5%; 
    width: 12%; 
    aspect-ratio: 1/1; 
    z-index: 20; 
}

/* BOTÃO EDITAR */
.btn-editar {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 2000;
    padding: 10px 15px;
    background: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop preload="auto"></audio>

<div id="btnControleAudio" class="btn-audio" onclick="toggleAudio()">
    <span id="iconeAudio">II</span>
</div>

<!-- BOTÃO EDITAR -->
<button class="btn-editar" onclick="toggleEdit()">Editar</button>

<!-- PAGE 1 -->
<div class="page" id="page1" style="display:block;">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline muted></video>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg">

        <!-- MAPA -->
        <a class="hotspot" 
           style="bottom:15%; left:16%; width:20%; height:10%;" 
           href="https://maps.app.goo.gl/3WJJH3e2wECwHCbk7" 
           target="_blank"></a>

        <!-- WHATSAPP -->
        <a class="hotspot" 
           style="bottom:15%; left:40%; width:20%; height:10%;" 
           href="https://wa.me/5571993233142" 
           target="_blank"></a>

        <!-- IR PARA PAGE 4 -->
        <div class="hotspot" 
             style="bottom:15%; left:64%; width:20%; height:10%;" 
             onclick="goPage(4)"></div>
    </div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
    <div class="content-wrapper">
        <img src="pagina4.jpg">
        <div class="btn-voltar" onclick="goPage(3)"></div>
    </div>
</div>

<script>
const musica = document.getElementById('musica');
const video = document.getElementById('video');
const btnAudio = document.getElementById('btnControleAudio');
const iconeAudio = document.getElementById('iconeAudio');

function startInvite() {
    musica.play().catch(e => console.log("Áudio pendente"));
    btnAudio.style.display = 'flex';
    goPage(2);
    video.play();

    video.onended = () => {
        goPage(3);
    };
}

function toggleAudio() {
    if (musica.paused) {
        musica.play();
        iconeAudio.innerText = "II";
        btnAudio.style.animation = "pulse-white 2s infinite";
    } else {
        musica.pause();
        iconeAudio.innerText = "▶";
        btnAudio.style.animation = "none";
    }
}

function goPage(num) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    const targetPage = document.getElementById('page' + num);
    if (targetPage) {
        targetPage.style.display = 'block';
    }
}

/* ATIVAR/DESATIVAR MODO EDIÇÃO */
function toggleEdit() {
    document.body.classList.toggle("modo-edicao");
}

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !musica.paused) {
        musica.play();
    }
});
</script>

</body>
</html>
