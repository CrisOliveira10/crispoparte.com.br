<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Convite Antonio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --gold: #c9a96e;
      --gold-light: #e8d5a3;
      --dark: #080808;
      --scene-duration: 1.4s;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--dark);
      touch-action: none;
    }

    /* ══════════════════════════════════════
       VIEWPORT + VIDEO
    ══════════════════════════════════════ */
    #scene-viewport {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      display: flex;
      align-items: stretch;
    }

    #media-wrapper {
      position: relative;
      height: 100dvh;
      width: auto;
      flex-shrink: 0;
      overflow: visible;
    }

    #video {
      display: block;
      height: 100dvh;
      width: auto;
      object-fit: contain;
      object-position: left center;
      transform: translateX(0);
      transition: transform var(--scene-duration) cubic-bezier(0.76, 0, 0.24, 1);
      will-change: transform;
      pointer-events: none;
      user-select: none;
      -webkit-transform: translateX(0);
    }

    /* ══════════════════════════════════════
       INTRO OVERLAY
       OTIMIZAÇÃO 1: fundo começa com cor sólida
       e o vídeo blur aparece assim que carrega
    ══════════════════════════════════════ */
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      /* começa com fundo escuro imediato — sem delay visual */
      background:  url('capa.jpg') center center / cover no-repeat;
      transition: opacity 0.65s ease;
      overflow: hidden;
    }

    #overlay-bg {
      position: absolute;
      inset: -20px;
      z-index: 0;
      overflow: hidden;
      /* OTIMIZAÇÃO 2: opacity:0 inicialmente,
         JS faz fade-in quando frame estiver pronto */
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #overlay-bg.ready {
      opacity: 1;
    }

    #overlay-bg video {
      width: calc(100% + 40px);
      height: calc(100% + 40px);
      object-fit: cover;
      filter: blur(18px) brightness(0.55) saturate(0.85);
      transform: scale(1.05);
      pointer-events: none;
      /* OTIMIZAÇÃO 3: GPU hint para o filtro blur */
      will-change: filter;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    #overlay-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at 50% 45%,
        rgba(112,131,138,0.18) 0%,
        rgba(10,15,18,0.55) 100%);
    }

    #overlay-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .play-ring {
      width: clamp(88px, 24vw, 110px);
      height: clamp(88px, 24vw, 110px);
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: ringPulse 2.4s ease-in-out infinite;
    }

    .play-ring::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.2);
      animation: ringPulse 2.4s ease-in-out infinite 0.3s;
    }

    .play-ring::after {
      content: '';
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      animation: ringPulse 2.4s ease-in-out infinite 0.6s;
    }

    @keyframes ringPulse {
      0%, 100% { opacity: 1;  transform: scale(1);    }
      50%       { opacity: 0.6; transform: scale(0.96); }
    }

    .play-icon {
      width: 60%;
      height: 60%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-icon svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 18px rgba(255,255,255,0.35));
    }

    #intro-overlay .invite-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 6.5vw, 2rem);
      font-weight: 300;
      font-style: italic;
      color: #fff;
      letter-spacing: 0.1em;
      text-align: center;
      padding: 0 2.5rem;
      margin-top: 1.6rem;
      text-shadow: 0 2px 18px rgba(0,0,0,0.7), 0 0 40px rgba(112,131,138,0.4);
      animation: shimmer 2.6s ease-in-out infinite;
    }

    #intro-overlay .subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.5rem, 2.8vw, 0.7rem);
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.38em;
      text-transform: uppercase;
      margin-top: 0.55rem;
      animation: shimmer 2.6s ease-in-out infinite 0.4s;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 1;  }
      50%       { opacity: 0.5; }
    }

    /* ══════════════════════════════════════
       AUDIO BUTTON
    ══════════════════════════════════════ */
    #audio-btn {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      left: calc(20px + env(safe-area-inset-left, 0px));
      z-index: 40;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid rgba(201,169,110,0.45);
      background: rgba(8,8,8,0.65);
      color: var(--gold-light);
      font-size: 1.1rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.25s, border-color 0.25s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    #audio-btn:active { transform: scale(0.88); }
    #audio-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ══════════════════════════════════════
       SCENE INDICATOR (dots)
    ══════════════════════════════════════ */
    #scene-dots {
      position: fixed;
      bottom: calc(36px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: none;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: background 0.4s, transform 0.4s;
    }

    .dot.active {
      background: var(--gold);
      transform: scale(1.4);
    }

    /* ══════════════════════════════════════
       FINAL PAGE
    ══════════════════════════════════════ */
    #final-page {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--dark);
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.9s ease;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #final-page.visible { display: flex; }
    #final-page.fade-in { opacity: 1; }

    #final-media {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #final-media img.bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      pointer-events: none;
    }

    #final-media .hotspots {
      position: relative;
      z-index: 2;
      display: flex;
      gap: clamp(1rem, 5vw, 2rem);
      align-items: center;
      justify-content: center;
      margin-top: 55%;
    }

    .hotspot {
      width: clamp(82px, 22vw, 100px);
      height: clamp(82px, 22vw, 100px);
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--gold-light);
      gap: 0.45rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .hotspot:hover, .hotspot:active { transform: scale(1.06); }

    .hotspot-icon-img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.3));
    }

    .hotspot-label {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.5rem, 2.5vw, 0.62rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      padding: 0 0.4rem;
      color: rgba(92,61,30,1);
    }

    .hotspot { opacity: 0; transform: translateY(18px) scale(0.9); transition: opacity 0.5s ease, transform 0.5s ease; }
    .hotspot.enter { opacity: 1; transform: translateY(0) scale(1); }
    .hotspot:nth-child(1) { transition-delay: 0.15s; }
    .hotspot:nth-child(2) { transition-delay: 0.3s; }
    .hotspot:nth-child(3) { transition-delay: 0.45s; }
    .hotspot.enter:hover, .hotspot.enter:active { transform: scale(1.06); }
  </style>
</head>
<body>

  <!-- ── Intro Overlay ── -->
  <div id="intro-overlay" role="button" aria-label="Clique para abrir o convite">
    <div id="overlay-bg">
      <!--
        OTIMIZAÇÃO: preload="metadata" carrega apenas o primeiro frame
        sem baixar o vídeo inteiro antes de exibir
      -->
      <video src="video.mp4" muted playsinline webkit-playsinline x5-playsinline
             preload="metadata" id="bg-video"></video>
    </div>
    <div id="overlay-tint"></div>
    <div id="overlay-content">
      <div class="play-ring">
        <div class="play-icon">
          <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="29" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
            <polygon points="25,18 46,30 25,42" fill="#ffffff"/>
          </svg>
        </div>
      </div>
      <p class="invite-text">Clique aqui para ver o convite</p>
      <p class="subtitle">Toque para iniciar</p>
    </div>
  </div>

  <!-- ── Video Viewport ── -->
  <div id="scene-viewport">
    <div id="media-wrapper">
      <video id="video"
             src="video.mp4"
             muted
             playsinline
             webkit-playsinline
             x5-playsinline
             preload="auto"
             disablepictureinpicture
             controlslist="nodownload nofullscreen noremoteplayback">
      </video>
    </div>
  </div>

  <!-- ── Áudio separado do vídeo ── -->
  <audio id="audio" src="audio.mp3" preload="auto" loop></audio>

  <!-- ── Audio Button (bottom-left) ── -->
  <button id="audio-btn" aria-label="Controle de áudio"></button>

  <!-- ── Scene Indicator Dots ── -->
  <div id="scene-dots" role="presentation"></div>

  <!-- ── Final Page ── -->
  <div id="final-page" aria-label="Links do convite">
    <div id="final-media">
      <img class="bg-img" src="pagina.jpg" alt="Página do convite">
      <div class="hotspots">
        <a href="https://crispoparte.com.br/antonioconfirmar/" class="hotspot">
          <img src="icon1.png" class="hotspot-icon-img" alt="Confirmar Presença">
          <span class="hotspot-label">Confirmar</span>
        </a>
        <a href="https://maps.app.goo.gl/Hjz8npnJR5EXf7nX8" class="hotspot">
          <img src="icon2.png" class="hotspot-icon-img" alt="Local">
          <span class="hotspot-label">Local</span>
        </a>
        <a href="https://crispoparte.com.br/filtrolateral/" class="hotspot">
          <img src="icon3.png" class="hotspot-icon-img" alt="Filtro moldura">
          <span class="hotspot-label">Filtro</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      totalScenes    : 7,
      sceneDurationMs: 6000,
      transitionMs   : 1400,
      audioFadeMs    : 2200,
      audioTargetVol : 0.82,
      audioStartVol  : 0.04,
    };

    const video     = document.getElementById('video');
    const audio     = document.getElementById('audio');
    const overlay   = document.getElementById('intro-overlay');
    const audioBtn  = document.getElementById('audio-btn');
    const finalPage = document.getElementById('final-page');
    const dotsEl    = document.getElementById('scene-dots');
    const bgVideo   = document.getElementById('bg-video');
    const overlayBg = document.getElementById('overlay-bg');

    let currentScene    = 0;
    let isTransitioning = false;
    let sceneTimer      = null;
    let isMuted         = false;
    let audioFadeTimer  = null;

    const iconOn  = `<svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54,8.46a5,5,0,0,1,0,7.07"/><path d="M19.07,4.93a10,10,0,0,1,0,14.14"/></svg>`;
    const iconOff = `<svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

    /* ── Dots ── */
    function buildDots() {
      for (let i = 0; i < CONFIG.totalScenes; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        dotsEl.appendChild(d);
      }
    }
    function updateDots(index) {
      dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === index));
    }

    /* ── Navegação ── */
    function getSceneOffsetPx(index) {
      return index * (video.offsetWidth / CONFIG.totalScenes);
    }
    function goToScene(index) {
      if (isTransitioning) return;
      isTransitioning = true;
      currentScene = index;
      video.style.transform = `translateX(-${getSceneOffsetPx(index)}px)`;
      updateDots(index);
      setTimeout(() => {
        isTransitioning = false;
        if (currentScene < CONFIG.totalScenes - 1) {
          scheduleNext();
        } else {
          sceneTimer = setTimeout(showFinalPage, CONFIG.sceneDurationMs);
        }
      }, CONFIG.transitionMs);
    }
    function scheduleNext() {
      clearTimeout(sceneTimer);
      sceneTimer = setTimeout(() => {
        if (currentScene < CONFIG.totalScenes - 1) goToScene(currentScene + 1);
      }, CONFIG.sceneDurationMs);
    }

    /* ── Tela Final ── */
    function showFinalPage() {
      finalPage.classList.add('visible');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        finalPage.classList.add('fade-in');
        finalPage.querySelectorAll('.hotspot').forEach(h => requestAnimationFrame(() => h.classList.add('enter')));
      }));
    }

    /* ── Fade de áudio ── */
    function fadeInAudio() {
      audio.volume = CONFIG.audioStartVol;
      audio.play().catch(() => {});
      isMuted = false;
      audioBtn.innerHTML = iconOn;
      const steps = 50, target = CONFIG.audioTargetVol, start = CONFIG.audioStartVol;
      const increment = (target - start) / steps;
      const interval  = CONFIG.audioFadeMs / steps;
      let step = 0;
      clearInterval(audioFadeTimer);
      audioFadeTimer = setInterval(() => {
        step++;
        audio.volume = Math.min(start + increment * step, target);
        if (step >= steps) { audio.volume = target; clearInterval(audioFadeTimer); }
      }, interval);
    }

    /* ── Overlay click ── */
    overlay.addEventListener('click', () => {
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      setTimeout(() => overlay.style.display = 'none', 620);
      audioBtn.style.display = 'flex';
      dotsEl.style.display   = 'flex';
      video.play().catch(() => {});
      fadeInAudio();
      scheduleNext();
    });

    /* ── Botão áudio ── */
    audioBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      isMuted ? audio.pause() : audio.play().catch(() => {});
      audioBtn.innerHTML = isMuted ? iconOff : iconOn;
    });

    /* ── Resize ── */
    window.addEventListener('resize', () => {
      const t = video.style.transition;
      video.style.transition = 'none';
      video.style.transform  = `translateX(-${getSceneOffsetPx(currentScene)}px)`;
      requestAnimationFrame(() => video.style.transition = t);
    });

    /* ══════════════════════════════════════
       INIT — bg-video otimizado
       
       ANTES: play().then(pause) — lento porque
       aguarda o browser decodificar frames

       AGORA: 3 estratégias em cascata:
       1. seeked event → frame exibido instantaneamente
       2. loadeddata   → fallback se seeked não disparar
       3. setTimeout   → fallback final após 800ms
    ══════════════════════════════════════ */
    buildDots();
    audioBtn.innerHTML = iconOff;
    video.muted = true;
    video.currentTime = 0;

    function showBgFrame() {
      overlayBg.classList.add('ready'); // fade-in suave do blur
    }

    // Estratégia 1: assim que o seek para t=0 completar, o frame está pronto
    bgVideo.addEventListener('seeked', showBgFrame, { once: true });

    // Estratégia 2: fallback loadeddata
    bgVideo.addEventListener('loadeddata', showBgFrame, { once: true });

    // Estratégia 3: fallback por tempo (caso o browser bloqueie os eventos)
    setTimeout(showBgFrame, 800);

    // Força o carregamento do primeiro frame
    bgVideo.muted = true;
    bgVideo.currentTime = 0;
    bgVideo.load();
  </script>
</body>
</html>
