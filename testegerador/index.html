<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>${nomeEvento}</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;overflow:hidden;height:100dvh;} .page{position:absolute;width:100%;height:100dvh;opacity:0;transition:opacity .6s;display:flex;justify-content:center;align-items:center;pointer-events:none;} .active{opacity:1;pointer-events:auto;z-index:10;} img,video{width:100%;height:100%;object-fit:contain;} .hotspot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;z-index:100;} #form-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:2000;padding:20px;} .form-box{background:#fff;border-radius:15px;padding:20px;text-align:center;max-width:400px;margin:auto;} ${timerCSS}</style></head><body><audio id="m" src="${audioBase64}" loop></audio><div id="timer-wrapper"><div id="timer"><span id="d">00</span>D <span id="h">00</span>H <span id="mi">00</span>M <span id="se">00</span>S</div></div>${paginasHTML}<div id="form-modal"><div class="form-box"><img src="${headerBase64}" style="width:100%"><button onclick="enviarWhats()">Confirmar no WhatsApp</button><p onclick="this.parentElement.parentElement.style.display='none'">FECHAR</p></div></div><script>let mu=document.getElementById('m'),lPg=1,ini=false,curZ="";function s(){if(ini)return;ini=true;mu.play();g(2)}function g(n){if(n<=3)lPg=n;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));let t=document.getElementById('pg'+n);if(t)t.classList.add('active');if(document.getElementById('timer-wrapper'))document.getElementById('timer-wrapper').style.display=(n==${timerData?timerData.pg:0})?'block':'none'}function rv(){g(lPg)}function abrirForm(z){curZ=z;document.getElementById('form-modal').style.display='block'}</script></body></html>
