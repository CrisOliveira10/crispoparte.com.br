<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>${title}</title>

<meta property="og:title" content="Convite Especial - ${title}">
<meta property="og:description" content="Clique para abrir o convite interativo!">
<meta property="og:image" content="${b64Capa}">
<meta property="og:url" content="${linkU}">
<meta property="og:type" content="website">

<style>
/* Mantendo seu CSS original 9:16 */
body, html { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow-x: hidden; }
.page-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.9); z-index: 999; display: flex; justify-content: center; align-items: center; cursor: pointer; }
.bg-btn { width: 220px; height: 220px; background: url('${b64Abrir}') center/contain no-repeat; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% {transform:scale(1);} 50% {transform:scale(1.05);} }

#container-canva { position: relative; width: 100%; max-width: 500px; margin: 0 auto; min-height: 100dvh; }
.canva-wrapper { position: relative; width: 100%; padding-top: 177.77%; }
iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

#music-control { position: fixed; top: 20px; right: 20px; z-index: 1000; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; color: #fff; display: none; cursor: pointer; }
</style>
</head>
<body>
    <audio id="bgMusic" loop src="${b64Audio}"></audio>
    <button id="music-control" onclick="const a=document.getElementById('bgMusic'); a.paused?a.play():a.pause();">🎵</button>
    
    <div class="page-overlay" id="overlay" onclick="document.getElementById('overlay').style.display='none'; document.getElementById('music-control').style.display='block'; document.getElementById('bgMusic').play();">
        <div class="bg-btn"></div>
    </div>

    <div id="container-canva">
        <div class="canva-wrapper">
            <iframe src="${canva}" allow="autoplay"></iframe>
        </div>
    </div>
</body>
</html>
