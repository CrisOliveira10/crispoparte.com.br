<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Checklist Interativo</title>
    <style>
        :root { --accent: #25D366; --record: #ff0000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; color: #fff; overflow: hidden; width: 100vw; height: 100dvh; font-family: sans-serif; }
        .frame { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #111; }
        #camera { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(1); transform-origin: center center; background: black; transition: transform 0.3s; }
        #camera.mirrored { transform: scaleX(-1); }
        #canvasPreview, #videoPreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: black; display: none; z-index: 6; }
        #molduraImagePreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: bottom; pointer-events: none; z-index: 5; display: none; }
        #canvasFinal { display: none; }
        .ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        .timer-badge { background: var(--record); padding: 5px 12px; border-radius: 12px; font-weight: bold; font-size: 16px; display: none; animation: pulse 1s infinite; }
        @keyframes pulse { 0%{opacity:1}50%{opacity:.7}100%{opacity:1} }
        .controls-bottom { display: flex; flex-direction: column; align-items: center; gap: 30px; pointer-events: auto; padding-bottom: 20px; }
        .btn { padding: 10px 16px; font-size: 14px; font-weight: 600; border: 2px solid rgba(255,255,255,0.3); border-radius: 20px; background: rgba(0,0,0,0.65); cursor: pointer; color: #fff; }
        .capture-controls { display: flex; gap: 20px; align-items: center; }
        .action-btn-mini { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fff; background: rgba(255,255,255,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .action-btn-large { width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,0.2); cursor: pointer; display: flex; align-items:center; justify-content:center; transition: .2s; }
        .action-btn-large.recording { border-color: var(--record); background: rgba(255,0,0,.5); }
        .stop-icon { display: none; width:30px; height:30px; background:red; border-radius:4px; }

const video = document.getElementById('camera'); const videoPreview = document.getElementById('videoPreview'); const canvasPreview = document.getElementById('canvasPreview'); const ctxPreview = canvasPreview.getContext('2d'); const canvasFinal = document.getElementById('canvasFinal'); const ctxFinal = canvasFinal.getContext('2d', { alpha:false }); const molduraImagePreview = document.getElementById('molduraImagePreview'); const startScreen = document.getElementById('startScreen'); const cameraUI = document.getElementById('cameraUI'); const resultUI = document.getElementById('resultUI'); const recordingTimer = document.getElementById('recordingTimer'); const errorMsg = document.getElementById('errorMsg'); const downloadBtn = document.getElementById('downloadBtn'); const capturePhotoBtn = document.getElementById('capturePhotoBtn'); const captureVideoBtn = document.getElementById('captureVideoBtn'); const circlePanel = document.getElementById('circlePanel'); const circleButtons = Array.from(document.querySelectorAll('.circle-btn'));
function updateCirclesVisibility() { if (currentMolduraKey === 'm1') { circlePanel.style.display = 'flex'; circlePanel.setAttribute('aria-hidden', 'false'); } else { circlePanel.style.display = 'none'; circlePanel.setAttribute('aria-hidden', 'true'); } }
document.addEventListener('DOMContentLoaded', () => { setMoldura('m1'); });
document.getElementById('startBtn').addEventListener('click', () => initCamera(true)); document.getElementById('switchBtn').addEventListener('click', switchCamera); document.getElementById('newPhotoBtn').addEventListener('click', resetCamera);
capturePhotoBtn.addEventListener('click', takePhoto); captureVideoBtn.addEventListener('click', () => { isRecording ? stopRecording() : startRecording(); }); downloadBtn.addEventListener('click', triggerDownload);
circleButtons.forEach(btn => { btn.addEventListener('click', (ev) => { btn.classList.toggle('on'); }); });
function setMoldura(key) { currentMolduraKey = key; const moldura = MOLDURAS[key]; molduraImagePreview.style.display = 'none'; molduraImagePreview.src = moldura.src; molduraImagePreview.style.display = 'block'; updateCirclesVisibility(); }
function getActiveMolduraElement() { return molduraImagePreview; }
function flashEffect() { const f = document.getElementById('flash'); f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 150); }
function drawVideoToCanvas(ctx, w, h, mirror) { const vw = video.videoWidth; const vh = video.videoHeight; if (!vw || !vh) return; ctx.clearRect(0,0,w,h); ctx.save(); ctx.translate(w/2, h/2); if (usingFrontCamera && mirror) ctx.scale(-1, 1); const vidRatio = vw / vh; let dw, dh; if (vidRatio > w/h) { dh = h; dw = h * vidRatio; } else { dw = w; dh = w / vidRatio; } ctx.drawImage(video, -dw/2, -dh/2, dw, dh); ctx.restore(); }
function drawImageLayer(ctx, img, w, h) { const iw = img.naturalWidth; const ih = img.naturalHeight; if (!iw || !ih) return; const ratio = iw / ih; const targetH = w / ratio; const y = h - targetH; ctx.drawImage(img, 0, y, w, targetH); }
function drawCirclesOnCanvas(ctx, w, h) { const btns = Array.from(document.querySelectorAll('.circle-btn')); const videoRect = video.getBoundingClientRect(); if (videoRect.width === 0 || videoRect.height === 0) return; for (let i = 0; i < btns.length; i++) { const btn = btns[i]; const r = btn.getBoundingClientRect(); const centerX_screen = r.left + r.width / 2; const centerY_screen = r.top + r.height / 2; const relX = (centerX_screen - videoRect.left) / videoRect.width; const relY = (centerY_screen - videoRect.top) / videoRect.height; const x = relX * w; const y = relY * h; ctx.beginPath(); ctx.lineWidth = 4; ctx.strokeStyle = "white"; ctx.fillStyle = "white"; const radius = Math.round((r.width / videoRect.width) * w / 2) || 15; ctx.arc(x, y, radius, 0, Math.PI * 2); if (btn.classList.contains('on')) { ctx.fill(); } else { ctx.stroke(); } } }
function takePhoto() { flashEffect(); canvasFinal.width = 1080; canvasFinal.height = 1920; drawVideoToCanvas(ctxFinal, canvasFinal.width, canvasFinal.height, true); drawImageLayer(ctxFinal, getActiveMolduraElement(), canvasFinal.width, canvasFinal.height); drawCirclesOnCanvas(ctxFinal, canvasFinal.width, canvasFinal.height); canvasPreview.width = stage.clientWidth; canvasPreview.height = stage.clientHeight; ctxPreview.drawImage(canvasFinal, 0, 0, canvasPreview.width, canvasPreview.height); canvasFinal.toBlob(blob => showResult('image', blob), 'image/png'); }
function startRecording() { if (isRecording) return; isRecording = true; captureVideoBtn.classList.add('recording'); recordingTimer.style.display = 'block'; recordingStartTime = Date.now(); recordedChunks = []; canvasFinal.width = 720; canvasFinal.height = 1280; function loop() { if (!isRecording) return; drawVideoToCanvas(ctxFinal, canvasFinal.width, canvasFinal.height, true); drawImageLayer(ctxFinal, getActiveMolduraElement(), canvasFinal.width, canvasFinal.height); drawCirclesOnCanvas(ctxFinal, canvasFinal.width, canvasFinal.height); updateTimer(); animationFrameId = requestAnimationFrame(loop); } loop(); const canvasStream = canvasFinal.captureStream(30); if (stream && stream.getAudioTracks().length > 0) { canvasStream.addTrack(stream.getAudioTracks()[0]); } mediaRecorder = new MediaRecorder(canvasStream, { mimeType:'video/webm' }); mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recordedChunks.push(e.data); }; mediaRecorder.onstop = finishVideo; mediaRecorder.start(); }
function stopRecording() { isRecording = false; captureVideoBtn.classList.remove('recording'); cancelAnimationFrame(animationFrameId); if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); recordingTimer.style.display = 'none'; recordingTimer.innerText = "00:00"; }
function finishVideo() { const blob = new Blob(recordedChunks, { type:'video/webm' }); const url = URL.createObjectURL(blob); videoPreview.src = url; showResult('video', blob); }
function showResult(type, blob) { video.style.display = 'none'; molduraImagePreview.style.display = 'none'; circlePanel.style.display = "none"; cameraUI.style.display = 'none'; resultUI.style.display = 'flex'; resultUI.querySelector('.actions').style.display = 'flex'; const timestamp = Date.now(); if (type === 'image') { canvasPreview.style.display = 'block'; videoPreview.style.display = 'none'; const url = URL.createObjectURL(blob); currentDownloadData = { blob, url, filename: `foto_${timestamp}.png` }; downloadBtn.innerText = "📥 Baixar Foto (.png)"; } else { canvasPreview.style.display = 'none'; videoPreview.style.display = 'block'; const url = videoPreview.src; currentDownloadData = { blob, url, filename: `video_${timestamp}.webm` }; downloadBtn.innerText = "📥 Baixar Vídeo (.webm)"; } }

async function initCamera(tryAudio = true) { if (stream) stream.getTracks().forEach(t => t.stop()); const constraints = { video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, audio: tryAudio }; try { stream = await navigator.mediaDevices.getUserMedia(constraints); handleStreamSuccess(stream); } catch (err) { if (tryAudio) initCamera(false); else errorMsg.innerText = "Erro ao acessar câmera!"; } }
