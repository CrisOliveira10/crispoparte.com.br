="bTut">🎬 Tutorial</button></div></div><div id="ov"><div id="top"><button id="x">✕ Fechar</button><a id="ext" target="_blank" rel="noopener">Abrir em nova aba</a></div><div id="box" style="flex:1;display:flex"></div></div><script>var C={"titulo":"Clarissa 15 anos","data":"2027-04-27","cor":"#0284b0","capa":"","ban":"","album":"https://photos.app.goo.gl/RAorcedgHPVp4Du48","cam":"camera.html","tut":""};var $=function(i){return document.getElementById(i)};document.documentElement.style.setProperty("--c",C.cor);if(C.capa)$("capa").style.backgroundImage="url("+C.capa+")";$("t").textContent=C.titulo;if(C.ban)$("ban").src=C.ban;else $("ban").style.display="none";if(C.data){var d=new Date(C.data+"T12:00:00");$("dt").textContent=d.toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"})}$("bCam").href=C.cam||"#";if(!C.tut)$("bTut").style.display="none";if(!C.album)$("bAlb").style.display="none";$("capa").onclick=function(){$("capa").style.display="none";$("home").style.display="block";scrollTo(0,0)};function abre(html,ext){$("box").innerHTML=html;$("ext").href=ext;$("ov").style.display="flex"}$("x").onclick=function(){$("ov").style.display="none";$("box").innerHTML=""};$("bAlb").onclick=function(){var m=C.album.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/);if(m)abre('<iframe src="https://drive.google.com/embeddedfolderview?id='+m[1]+'#grid"></iframe>',C.album);else window.open(C.album,"_blank")};$("bTut").onclick=function(){var u=C.tut,y=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(y)abre('<iframe src="https://www.youtube.com/embed/'+y[1]+'?autoplay=1&playsinline=1" allow="autoplay;fullscreen" allowfullscreen></iframe>',u);else abre('<video src="'+u+'" controls autoplay playsinline></video>',u)};</script></body></html>
