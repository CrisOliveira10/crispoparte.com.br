  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #e0f2fe; font-family: 'Inter', sans-serif; color: #1e293b; }
    .invite-font-display { font-family: 'Fredoka', sans-serif; }
    .backdrop-desktop {
      width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: radial-gradient(circle at 20% 20%, rgba(250,204,21,0.30), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(244,114,182,0.26), transparent 45%),
                  linear-gradient(160deg, #e0f2fe 0%, #f0fdf4 50%, #fdf2f8 100%);
    }
    /* Media-wrapper 9:16: mantém proporção exata da arte sem cortes e trava hotspots em % */
    .stage-916 {
      position: relative;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #e0f2fe;
    }
    @media (min-width: 640px) {
      .stage-916 {
        width: auto; height: 96dvh; aspect-ratio: 9 / 16; border-radius: 1.75rem;
        border: 4px solid #ffffff; box-shadow: 0 24px 60px rgba(30,41,59,0.22);
      }
    }
    .scene-layer { position: absolute; inset: 0; opacity: 0; transition: opacity 0.48s cubic-bezier(0.22,1,0.36,1); overflow: hidden; }
    .scene-layer.active { opacity: 1; }
    .scene-bg-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .pos-item { position: absolute; transform: translate(-50%, -50%); }
    .hotspot-box { background: transparent; border: none; color: transparent; cursor: pointer; }
    @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
    .animate-pulse-cta { animation: pulseBtn 1.7s ease-in-out infinite; }
    .gamer-btn-3d {
      width: 66px; height: 66px; border-radius: 1.25rem; display: flex; flex-direction: column; position: relative; -webkit-touch-callout: none;
      align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.35);
      cursor: pointer; touch-action: none; transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    .gamer-btn-vivo { background: linear-gradient(145deg, #a3e635 0%, #65a30d 100%); box-shadow: 0 7px 0 #365314, 0 12px 20px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.55); }
    .gamer-btn-morto { background: linear-gradient(145deg, #fb923c 0%, #ea580c 100%); box-shadow: 0 7px 0 #7c2d12, 0 12px 20px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.5); }
    .gamer-btn-3d:active, .gamer-btn-3d.is-pressed { transform: translateY(5px) scale(0.96); }
    @keyframes qteGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); box-shadow: 0 0 24px 6px rgba(250,204,21,0.9); } }
    .qte-highlight { animation: qteGlow 0.55s ease-in-out infinite; border-color: #facc15 !important; }
    .anim-char-wrap { transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1); transform-origin: bottom center; }
    .anim-char-vivo { transform: translateY(-16px) scale(1.05, 1.07); }
    .anim-char-morto { transform: translateY(20px) scale(1.12, 0.74); }
    @keyframes camShake { 0%,100% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(-4px,3px) rotate(-1deg); } 50% { transform: translate(4px,-3px) rotate(1deg); } 75% { transform: translate(-3px,-2px) rotate(-0.6deg); } }
    .cam-shake { animation: camShake 0.28s ease-in-out; }
    .cam-tilt-up { transform: scale(1.04) translateY(-6px); transition: transform 0.2s ease; }
    .cam-tilt-down { transform: scale(1.04) translateY(6px); transition: transform 0.2s ease; }
    .speed-lines { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: repeating-radial-gradient(circle at center, transparent 0, transparent 48%, rgba(255,255,255,0.14) 50%, transparent 52%); transition: opacity 0.2s ease; }
    .speed-lines.active { opacity: 1; }
    @keyframes floatScore { 0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1.15); } }
    .score-pop { position: absolute; left: 50%; top: 42%; font-weight: 900; pointer-events: none; animation: floatScore 0.65s ease-out forwards; text-shadow: 0 2px 8px rgba(30,41,59,0.5); z-index: 45; }
  </style>

        toast('Inspeção desabilitada • Direitos Autorais Reservados.');

      }
      if (c3.showInfoCard && ((c3.dateText||'').trim() || (c3.locationText||'').trim() || (c3.dressCodeText||'').trim())) {
        layer.appendChild(place('c3_info', '<div data-ts="c3_info" style="background:'+rgba(c3.infoCardBgColor,(c3.infoCardBgOpacity||80)/100)+';color:'+c3.infoTextColor+'" class="w-[295px] max-w-[90vw] rounded-2xl p-3 border border-white/15 backdrop-blur-md space-y-2 text-left text-xs">' + (c3.dateText ? '<div>📅 <strong>'+esc(c3.dateText)+'</strong></div>' : '') + (c3.locationText ? '<div>📍 <strong>'+esc(c3.locationText)+'</strong></div>' : '') + (c3.dressCodeText ? '<div>👕 <strong>'+esc(c3.dressCodeText)+'</strong></div>' : '') + '</div>'));
      }
      const b1 = renderBtn('c3_btn_rsvp', c3.rsvpBtn, () => openRsvp(layer)); if (b1) layer.appendChild(b1);
      const b2 = renderBtn('c3_btn_gifts', c3.giftsBtn, () => go('presentes')); if (b2) layer.appendChild(b2);
      const b3 = renderBtn('c3_btn_maps', c3.mapsBtn, () => { if (c3.mapsUrl) window.open(c3.mapsUrl, '_blank', 'noopener'); }); if (b3) layer.appendChild(b3);
      const b4 = renderBtn('c3_btn_next', c3.nextBtn, () => go('cena4')); if (b4) layer.appendChild(b4);
      if (iv) cleanup = () => clearInterval(iv);
    }

    function buildMsg(d) {
      const c3 = STATE.cena3;
      const NL = String.fromCharCode(10);
      const LINE = '━━━━━━━━━━━━━━━';
      const out = [];
      out.push('🎉 *CONFIRMAÇÃO DE PRESENÇA*');
      out.push(LINE);
      if ((c3.eventTitle || '').trim()) out.push('🎈 *Evento:* ' + c3.eventTitle.trim());
      if ((c3.dateText || '').trim()) out.push('📅 *Data:* ' + c3.dateText.trim());
      if ((c3.locationText || '').trim()) out.push('📍 *Local:* ' + c3.locationText.trim());
      out.push(LINE);
      out.push('👤 *Convidado:* ' + d.guestName + d.selfTag);
      out.push('📌 *Resposta:* ' + d.going);
      out.push('👥 *Total de pessoas:* ' + (1 + d.comps.length));
      if (d.comps.length) {
        out.push('');
        out.push('*Acompanhantes:*');
        d.comps.forEach((c, i) => {
          const nm = (c.name || '').trim() || ('Acompanhante ' + (i + 1));
          out.push((i + 1) + '. ' + nm + (c.type === 'crianca' ? ' (Criança - ' + (c.age || '').trim() + ')' : ' (Adulto)'));
        });
      }
      if (d.note) { out.push(''); out.push('💌 *Recado:* ' + d.note); }
      out.push(LINE);
      out.push('_Enviado pelo convite interativo_');
      return out.join(NL);
    }

    function openRsvp(layer) {
      const comps = [];
      const m = document.createElement('div');
      m.className = 'absolute inset-0 z-50 bg-slate-900/45 backdrop-blur-md flex items-center justify-center p-3 overflow-y-auto';
      m.innerHTML = '<div class="w-full max-w-[315px] rounded-3xl bg-white border border-pink-300 p-4 space-y-2.5 text-left my-auto">' +
        '<div class="flex justify-between items-center"><h3 class="invite-font-display text-lg font-extrabold text-pink-600">✅ Confirmar Presença</h3><button type="button" data-x class="w-7 h-7 rounded-full bg-slate-100 text-slate-600 text-xs">✕</button></div>' +
        '<div class="space-y-1.5"><input type="text" data-n placeholder="Seu nome completo *" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800" />' +
        '<div class="flex items-center justify-between gap-2"><label class="inline-flex items-center gap-1.5 text-[11px] text-slate-600 font-semibold"><input type="checkbox" data-sc class="accent-pink-500" />Sou criança / menor</label>' +
        '<input type="text" data-sa placeholder="Idade (ex: 6 anos)" class="hidden w-32 bg-slate-50 border border-amber-400 rounded-lg px-2 py-1 text-[11px] text-slate-800" /></div></div>' +
        '<select data-g class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800"><option value="Sim, eu vou! 🎉">Sim, eu vou! 🎉</option><option value="Infelizmente não poderei ir 😢">Infelizmente não poderei ir 😢</option></select>' +
        '<div class="bg-slate-50 border border-slate-300 rounded-xl p-2 space-y-2"><div class="flex justify-between items-center text-[10px] font-bold"><span>Acompanhantes</span><button type="button" data-add class="px-2 py-1 rounded bg-[#84cc16] text-[#0b0d17] font-black">+ Adicionar Acompanhante</button></div><div data-list class="space-y-2 max-h-36 overflow-y-auto"></div></div>' +
        '<textarea rows="2" data-msg placeholder="Recado opcional..." class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800"></textarea>' +
        '<button type="button" data-send class="w-full py-3 rounded-2xl bg-gradient-to-r from-[#22c55e] to-[#84cc16] text-[#0b0d17] font-black text-xs uppercase">ENVIAR NO WHATSAPP</button></div>';

      const scChk = m.querySelector('[data-sc]'), saInp = m.querySelector('[data-sa]');
      scChk.addEventListener('change', () => { saInp.classList.toggle('hidden', !scChk.checked); });

      const list = m.querySelector('[data-list]');
      function draw() {
        list.innerHTML = comps.map((c,i) =>
          '<div class="bg-slate-50 border border-slate-300 rounded-xl p-2 space-y-1.5">' +
            '<div class="flex items-center gap-1"><input type="text" value="'+esc(c.name)+'" data-i="'+i+'" placeholder="Nome do acompanhante" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-[11px] text-slate-800"/><button type="button" data-del="'+i+'" class="px-2 py-1 rounded bg-rose-500/20 text-rose-600 text-[10px] font-bold">✕</button></div>' +
            '<div class="flex items-center gap-1.5"><select data-t="'+i+'" class="bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 text-[10px] font-bold text-slate-700"><option value="adulto" '+(c.type!=='crianca'?'selected':'')+'>Adulto</option><option value="crianca" '+(c.type==='crianca'?'selected':'')+'>Criança</option></select>' +
            (c.type==='crianca' ? '<input type="text" value="'+esc(c.age)+'" data-age="'+i+'" placeholder="Idade (ex: 5 anos) *" class="flex-1 bg-slate-50 border border-amber-400 rounded-lg px-2 py-1 text-[10px] text-slate-800" />' : '<span class="text-[10px] text-slate-500">Adulto</span>') +
            '</div></div>'
        ).join('');
        list.querySelectorAll('[data-i]').forEach(el => el.addEventListener('input', () => comps[el.dataset.i].name = el.value));
        list.querySelectorAll('[data-t]').forEach(el => el.addEventListener('change', () => { comps[el.dataset.t].type = el.value; draw(); }));
        list.querySelectorAll('[data-age]').forEach(el => el.addEventListener('input', () => comps[el.dataset.age].age = el.value));
        list.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => { comps.splice(Number(el.dataset.del), 1); draw(); }));
      }
      m.querySelector('[data-add]').addEventListener('click', () => { comps.push({name:'',type:'adulto',age:''}); draw(); });
      m.querySelector('[data-x]').addEventListener('click', () => m.remove());
      m.querySelector('[data-send]').addEventListener('click', () => {
        const nm = m.querySelector('[data-n]').value.trim();
        if (!nm) { toast('Digite seu nome!'); return; }
        if (scChk.checked && !saInp.value.trim()) { toast('Informe sua idade!'); return; }
        if (comps.some(c => c.type === 'crianca' && !c.age.trim())) { toast('Informe a idade da criança!'); return; }
        const goTxt = m.querySelector('[data-g]').value;
        const note = m.querySelector('[data-msg]').value.trim();
        const ph = (STATE.cena3.whatsappNumber||'').replace(/\D/g,'');
        const selfTag = scChk.checked ? ' (Criança - ' + saInp.value.trim() + ')' : '';
        const txt = buildMsg({ guestName: nm, selfTag, going: goTxt, comps, note });
        window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(txt), '_blank', 'noopener');
        m.remove(); go('cena4');
      });
      layer.appendChild(m);
    }

    function scGifts(layer) {
      const gft = STATE.cena3.gifts;
      layer.appendChild(buildBg(gft.bg, gft.overlay, 'linear-gradient(160deg,#fbcfe8,#fde68a,#bae6fd)'));
      if (gft.fitMode === 'contain') layer.querySelectorAll('.scene-bg-media').forEach(e => { e.style.objectFit = 'contain'; });
      if ((gft.title||'').trim()) layer.appendChild(place('gift_title', '<h2 data-ts="gift_title" style="color:'+gft.titleColor+'" class="invite-font-display text-2xl font-extrabold whitespace-nowrap">'+esc(gft.title)+'</h2>'));
      if ((gft.text||'').trim()) layer.appendChild(place('gift_text', '<p data-ts="gift_text" style="color:'+gft.textColor+'" class="w-[285px] max-w-[88vw] text-xs text-center rounded-2xl px-3.5 py-2">'+esc(gft.text)+'</p>'));
      if ((gft.pixKey||'').trim()) {
        layer.appendChild(place('gift_pix_box', '<div data-ts="gift_pix" style="background:'+rgba(gft.pixBoxBg,(gft.pixBoxOpacity||78)/100)+'" class="w-[270px] rounded-2xl px-3.5 py-2 border border-green-300 text-center"><div class="text-[9px] font-black text-slate-500">CHAVE PIX</div><div data-ts="gift_pix_key" class="font-mono font-extrabold text-green-700 truncate">'+esc(gft.pixKey)+'</div></div>'));
        const cb = renderBtn('gift_btn_pix', gft.copyPixBtn, () => {
          const ta = document.createElement('textarea'); ta.value = gft.pixKey; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (_) {} ta.remove(); toast('Chave PIX copiada!');
        });
        if (cb) layer.appendChild(cb);
      }
      if ((gft.externalUrl||'').trim()) {
        const eb = renderBtn('gift_btn_ext', gft.extBtn, () => window.open(gft.externalUrl, '_blank', 'noopener'));
        if (eb) layer.appendChild(eb);
      }
      const cl = renderBtn('gift_btn_close', gft.closeBtn, () => go('cena3'));
      if (cl) layer.appendChild(cl);
    }

    function sc4(layer) {
      const c4 = STATE.cena4;
      layer.appendChild(buildBg(c4.bg, c4.overlay, 'linear-gradient(155deg,#a7f3d0,#fde68a,#fbcfe8)'));
      if ((c4.badgeText||'').trim()) layer.appendChild(place('c4_badge', '<div data-ts="c4_badge" style="background:'+c4.badgeBgColor+';color:'+c4.badgeTextColor+'" class="px-3.5 py-1 rounded-full text-[10px] font-black uppercase whitespace-nowrap">'+esc(c4.badgeText)+'</div>'));
      if ((c4.title||'').trim() || (c4.message||'').trim()) {
        layer.appendChild(place('c4_message', '<div data-ts="c4_card" style="background:'+rgba(c4.cardBgColor,(c4.cardOpacity||82)/100)+'" class="w-[290px] max-w-[88vw] rounded-3xl p-5 border border-white/15 backdrop-blur-md text-center space-y-2"><h2 data-ts="c4_title" style="color:'+c4.titleColor+'" class="invite-font-display text-2xl font-extrabold">'+esc(c4.title)+'</h2><p data-ts="c4_message" style="color:'+c4.messageColor+'" class="text-xs">'+esc(c4.message)+'</p></div>'));
      }
      const wb = renderBtn('c4_btn_whats', c4.whatsBtn, () => openRsvp(layer));
      if (wb) layer.appendChild(wb);
      const rb = renderBtn('c4_btn_replay', c4.replayBtn, () => go('cena1'));
      if (rb) layer.appendChild(rb);
    }

    go('cena1');
  </script>
</body>
</html>
