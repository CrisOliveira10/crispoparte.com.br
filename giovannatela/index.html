<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Convite Interativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #c9a96e; --gold-light: #e8d5a3; --dark: #080808; }

    html, body { width: 100%; height: 100dvh; overflow: hidden; background: var(--dark); touch-action: none; }

    #scene-viewport { position: fixed; inset: 0; z-index: 1; overflow: hidden; }

    /*
      art-wrapper: 500×500 — a arte quadrada.
      O JS controla tudo via transform (translate + scale).
      A transição CSS é ativada/desativada pelo JS:
        - Ken Burns (vai e volta): RAF sem transition CSS
        - Pan entre cenas: transition CSS cúbica
    */
    #art-wrapper {
      position: absolute;
      top: 0; left: 0;
      width: 500px; height: 500px;
      transform-origin: top left;
      will-change: transform;
    }
    #video {
      display: block;
      width: 500px; height: 500px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* INTRO */
    #intro-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      background: url('capa.jpg') center center / cover no-repeat;
      transition: opacity 0.65s ease; overflow: hidden;
    }
    #overlay-bg { position: absolute; inset: -20px; z-index: 0; opacity: 0; transition: opacity 0.5s ease; }
    #overlay-bg.ready { opacity: 1; }
    #overlay-bg video {
      width: calc(100% + 40px); height: calc(100% + 40px);
      object-fit: cover;
      filter: blur(18px) brightness(0.55) saturate(0.85);
      transform: scale(1.05); pointer-events: none;
      will-change: filter; -webkit-backface-visibility: hidden; backface-visibility: hidden;
    }
    #overlay-tint { position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse at 50% 45%, rgba(112,131,138,0.18) 0%, rgba(10,15,18,0.55) 100%); }
    #overlay-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .play-ring {
      width: clamp(88px,24vw,110px); height: clamp(88px,24vw,110px);
      border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center;
      position: relative; animation: ringPulse 2.4s ease-in-out infinite;
    }
    .play-ring::before { content:''; position:absolute; inset:-10px; border-radius:50%; border:1.5px solid rgba(255,255,255,0.2); animation:ringPulse 2.4s ease-in-out infinite 0.3s; }
    .play-ring::after  { content:''; position:absolute; inset:-22px; border-radius:50%; border:1px solid rgba(255,255,255,0.1); animation:ringPulse 2.4s ease-in-out infinite 0.6s; }
    @keyframes ringPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(.96)} }
    .play-icon { width:60%;height:60%;display:flex;align-items:center;justify-content:center; }
    .play-icon svg { width:100%;height:100%;filter:drop-shadow(0 2px 18px rgba(255,255,255,.35)); }

    #intro-overlay .invite-text {
      font-family:'Cormorant Garamond',serif; font-size:clamp(1.2rem,6.5vw,2rem);
      font-weight:300; font-style:italic; color:#fff; letter-spacing:.1em;
      text-align:center; padding:0 2.5rem; margin-top:1.6rem;
      text-shadow:0 2px 18px rgba(0,0,0,.7),0 0 40px rgba(112,131,138,.4);
      animation:shimmer 2.6s ease-in-out infinite;
    }
    #intro-overlay .subtitle {
      font-family:'Cinzel',serif; font-size:clamp(.5rem,2.8vw,.7rem);
      color:rgba(255,255,255,.45); letter-spacing:.38em; text-transform:uppercase;
      margin-top:.55rem; animation:shimmer 2.6s ease-in-out infinite .4s;
    }
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* AUDIO BTN */
    #audio-btn {
      position:fixed; bottom:calc(28px + env(safe-area-inset-bottom,0px)); left:calc(20px + env(safe-area-inset-left,0px));
      z-index:40; width:46px; height:46px; border-radius:50%;
      border:1.5px solid rgba(201,169,110,.45); background:rgba(8,8,8,.65);
      color:var(--gold-light); display:none; align-items:center; justify-content:center;
      cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      transition:transform .1s; -webkit-tap-highlight-color:transparent;
    }
    #audio-btn:active { transform:scale(.88); }
    #audio-btn svg { width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round; }

    /* DOTS */
    #scene-dots {
      position:fixed; bottom:calc(36px + env(safe-area-inset-bottom,0px));
      left:50%; transform:translateX(-50%); z-index:40;
      display:none; gap:8px; align-items:center;
    }
    .dot { width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .4s,transform .4s; }
    .dot.active { background:var(--gold);transform:scale(1.4); }

    /* FINAL PAGE */
    #final-page {
      position:fixed; inset:0; z-index:60; background:var(--dark);
      display:none; align-items:center; justify-content:center;
      opacity:0; transition:opacity .9s ease;
      padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    }
    #final-page.visible { display:flex; }
    #final-page.fade-in { opacity:1; }
    #final-media { position:relative; width:100%; height:100dvh; display:flex; align-items:center; justify-content:center; }
    #final-media img.bg-img { position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;user-select:none;pointer-events:none; }

    /* HOTSPOTS */
    .hotspots {
      position:absolute; z-index:2;
      bottom:10%; left:50%; transform:translateX(-50%);
      width:88%; display:flex; align-items:center; justify-content:space-around;
    }
    .hotspot {
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-decoration:none;color:var(--gold-light);gap:.4rem;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      overflow:visible; /* label nunca cortada */
      width:clamp(72px,20vw,96px); height:clamp(72px,20vw,96px);
      opacity:0; transform:translateY(18px) scale(.9);
      transition:opacity .5s ease,transform .5s ease;
    }
    .hotspot.enter            { opacity:1;transform:translateY(0) scale(1); }
    .hotspot:nth-child(1)     { transition-delay:.15s; }
    .hotspot:nth-child(2)     { transition-delay:.30s; }
    .hotspot:nth-child(3)     { transition-delay:.45s; }
    .hotspot.enter:active     { transform:scale(1.06); }
    .hotspot-icon-img         { width:75%;height:75%;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.3)); }
    .hotspot-label            { font-family:'Cinzel',serif;font-size:clamp(.48rem,2.5vw,.62rem);letter-spacing:.2em;text-transform:uppercase;text-align:center;color:rgba(92,61,30,1); }
  </style>
</head>
<body>

  <div id="intro-overlay" role="button" aria-label="Clique para abrir o convite">
    <div id="overlay-bg">
      <video src="video.mp4" muted playsinline webkit-playsinline x5-playsinline preload="metadata" id="bg-video"></video>
    </div>
    <div id="overlay-tint"></div>
    <div id="overlay-content">
      <div class="play-ring">
        <div class="play-icon">
          <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="29" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
            <polygon points="25,18 46,30 25,42" fill="#ffffff"/>
          </svg>
        </div>
      </div>
      <p class="invite-text">Clique aqui para ver o convite</p>
      <p class="subtitle">Toque para iniciar</p>
    </div>
  </div>

  <div id="scene-viewport">
    <div id="art-wrapper">
      <video id="video" src="video.mp4" muted playsinline webkit-playsinline x5-playsinline
             preload="auto" disablepictureinpicture
             controlslist="nodownload nofullscreen noremoteplayback"></video>
    </div>
  </div>

  <audio id="audio" src="audio.mp3" preload="auto" loop></audio>
  <button id="audio-btn" aria-label="Controle de áudio"></button>
  <div id="scene-dots" role="presentation"></div>

  <div id="final-page" aria-label="Links do convite">
    <div id="final-media">
      <img class="bg-img" src="pagina.jpg" alt="Página do convite">
      <div class="hotspots">
        <a href="https://crispoparte.com.br/antonioconfirmar/" class="hotspot">
          <img src="icon1.png" class="hotspot-icon-img" alt="Confirmar">
          <span class="hotspot-label">Confirmar</span>
        </a>
        <a href="https://maps.app.goo.gl/Hjz8npnJR5EXf7nX8" class="hotspot">
          <img src="icon2.png" class="hotspot-icon-img" alt="Local">
          <span class="hotspot-label">Local</span>
        </a>
        <a href="https://crispoparte.com.br/filtroantoniol/" class="hotspot">
          <img src="icon3.png" class="hotspot-icon-img" alt="Filtro">
          <span class="hotspot-label">Filtro</span>
        </a>
      </div>
    </div>
  </div>

  <script>
  /* ═══════════════════════════════════════════════════════════════
     ⚙️  CONFIGURAÇÃO — edite apenas este bloco
     ═══════════════════════════════════════════════════════════════

     totalMs         → duração total do vídeo em ms.
                        Tempo por cena = totalMs ÷ número de cenas.

     transitionMs    → duração do pan entre cenas.

     kenBurnsAmount  → intensidade do zoom vai-e-volta por cena.
                        0.04 = sutil (4%) | 0.08 = notável (8%).
                        O zoom cresce até o pico e volta ao normal.

     zoomLevel       → quão "dentro" da arte a câmera fica.
                        1.0 = altura da arte = altura da tela (sem pan vertical)
                        1.5 = 50% mais dentro → pan vertical disponível.

     scenes[]        → cenas na ORDEM de exibição.
                        panX 0.0=esquerda … 1.0=direita
                        panY 0.0=topo     … 1.0=fundo
                        panY=1.0 alinha o FUNDO da arte com o FUNDO da tela.
  ═══════════════════════════════════════════════════════════════ */
  const CONFIG = {
    artSize        : 500,
    totalMs        : 40000,
    transitionMs   : 1000,
    kenBurnsAmount : 0.05,
    audioFadeMs    : 2200,
    audioTargetVol : 0.82,
    audioStartVol  : 0.04,
    zoomLevel      : 1.55,

    scenes: [
      { panX: 0.00, panY: 0.00 }, // 1 — topo esquerdo
      { panX: 0.00, panY: 1.00 }, // 2 — fundo esquerdo   (panY=1 = fundo alinhado)
      { panX: 0.50, panY: 0.00 }, // 3 — topo centro
      { panX: 0.40, panY: 1.00 }, // 4 — fundo centro-esq
      { panX: 0.65, panY: 1.00 }, // 5 — fundo centro-dir
      { panX: 1.00, panY: 0.00 }, // 6 — topo direito
      { panX: 1.00, panY: 1.00 }, // 7 — fundo direito
    ]
  };

  const sceneDurationMs = Math.round(CONFIG.totalMs / CONFIG.scenes.length);

  const video      = document.getElementById('video');
  const audio      = document.getElementById('audio');
  const overlay    = document.getElementById('intro-overlay');
  const audioBtn   = document.getElementById('audio-btn');
  const finalPage  = document.getElementById('final-page');
  const dotsEl     = document.getElementById('scene-dots');
  const bgVideo    = document.getElementById('bg-video');
  const overlayBg  = document.getElementById('overlay-bg');
  const artWrapper = document.getElementById('art-wrapper');

  let currentScene   = 0;
  let isPanning      = false;
  let sceneTimer     = null;
  let kbRafId        = null;
  let kbStartTime    = null;
  let kbSceneRef     = null;
  let kbDur          = 0;
  let isMuted        = false;
  let audioFadeTimer = null;

  const iconOn  = `<svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54,8.46a5,5,0,0,1,0,7.07"/><path d="M19.07,4.93a10,10,0,0,1,0,14.14"/></svg>`;
  const iconOff = `<svg viewBox="0 0 24 24"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

  /* ── Calcula transform(translate + scale) ──────────────────────
     Posiciona a arte 500×500 para a cena, aplicando kbFactor.
     O zoom (kbFactor > 1) é centrado no ponto visível central
     da cena, não no centro geométrico da arte — isso garante
     que o enquadramento não derive durante o Ken Burns.
  ─────────────────────────────────────────────────────────────── */
  function calcTransform(scene, kbFactor) {
    kbFactor = kbFactor || 1;
    const vW  = window.innerWidth;
    const vH  = window.innerHeight;
    const art = CONFIG.artSize;

    // Scale base: cobrir a tela (object-fit: cover equivalente)
    const coverScale = Math.max(vW / art, vH / art);
    const baseScale  = coverScale * CONFIG.zoomLevel;

    // Translate base (panX/panY definem o enquadramento)
    const baseTx = scene.panX * (vW - art * baseScale); // ≤0
    const baseTy = scene.panY * (vH - art * baseScale); // ≤0
    // panY=1 → baseTy = vH - art*baseScale  → fundo da arte = fundo da tela ✓

    // Ponto central visível em coordenadas da arte (pixels)
    const centerArtX = (vW / 2 - baseTx) / baseScale;
    const centerArtY = (vH / 2 - baseTy) / baseScale;

    // Nova escala com Ken Burns
    const newScale = baseScale * kbFactor;

    // Translate que mantém o centro visual fixo durante o zoom
    const tx = vW / 2 - centerArtX * newScale;
    const ty = vH / 2 - centerArtY * newScale;

    return `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${newScale.toFixed(6)})`;
  }

  /* ── Ken Burns: zoom vai e volta via requestAnimationFrame ──── */
  function easeInOut(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; }

  function kbFrame(ts) {
    if (!kbStartTime) kbStartTime = ts;
    const progress = Math.min((ts - kbStartTime) / kbDur, 1);

    // Onda suave: cresce até o pico (50%) e volta — o "respira"
    const wave   = progress < .5 ? easeInOut(progress * 2) : easeInOut((1 - progress) * 2);
    const factor = 1 + CONFIG.kenBurnsAmount * wave;

    artWrapper.style.transform = calcTransform(kbSceneRef, factor);

    if (progress < 1) kbRafId = requestAnimationFrame(kbFrame);
  }

  function startKenBurns(scene, duration) {
    cancelAnimationFrame(kbRafId);
    kbStartTime = null;
    kbSceneRef  = scene;
    kbDur       = Math.max(duration, 200);
    artWrapper.style.transition = 'none'; // RAF, sem CSS transition
    kbRafId = requestAnimationFrame(kbFrame);
  }

  /* ── Dots ─────────────────────────────────────────────────── */
  function buildDots() {
    CONFIG.scenes.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      dotsEl.appendChild(d);
    });
  }
  function updateDots(i) {
    dotsEl.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === i));
  }

  /* ── Navegar para uma cena ────────────────────────────────────
     instant=true  → snap (sem animação de pan, ex: primeira cena)
     instant=false → pan suave + Ken Burns após o pan
  ─────────────────────────────────────────────────────────────── */
  function startScene(index, instant) {
    if (isPanning && !instant) return;

    cancelAnimationFrame(kbRafId);
    clearTimeout(sceneTimer);
    currentScene = index;
    updateDots(index);

    if (instant) {
      artWrapper.style.transition = 'none';
      artWrapper.style.transform  = calcTransform(CONFIG.scenes[index], 1);
      startKenBurns(CONFIG.scenes[index], sceneDurationMs);
    } else {
      isPanning = true;
      artWrapper.style.transition = `transform ${CONFIG.transitionMs}ms cubic-bezier(0.76,0,0.24,1)`;
      artWrapper.style.transform  = calcTransform(CONFIG.scenes[index], 1);

      // Após o pan: inicia Ken Burns pelo tempo restante da cena
      setTimeout(() => {
        isPanning = false;
        startKenBurns(CONFIG.scenes[index], sceneDurationMs - CONFIG.transitionMs);
      }, CONFIG.transitionMs);
    }

    // Agenda próxima cena (tempo total sempre = sceneDurationMs)
    sceneTimer = setTimeout(() => {
      const next = index + 1;
      if (next < CONFIG.scenes.length) startScene(next, false);
      else showFinalPage();
    }, sceneDurationMs);
  }

  /* ── Tela final ───────────────────────────────────────────── */
  function showFinalPage() {
    cancelAnimationFrame(kbRafId);
    clearTimeout(sceneTimer);
    finalPage.classList.add('visible');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      finalPage.classList.add('fade-in');
      finalPage.querySelectorAll('.hotspot')
               .forEach(h => requestAnimationFrame(() => h.classList.add('enter')));
    }));
  }

  /* ── Fade-in de áudio ─────────────────────────────────────── */
  function fadeInAudio() {
    audio.volume = CONFIG.audioStartVol;
    audio.play().catch(() => {});
    isMuted = false;
    audioBtn.innerHTML = iconOn;
    const steps = 50, target = CONFIG.audioTargetVol, start = CONFIG.audioStartVol;
    const inc = (target - start) / steps, ivl = CONFIG.audioFadeMs / steps;
    let step = 0;
    clearInterval(audioFadeTimer);
    audioFadeTimer = setInterval(() => {
      step++;
      audio.volume = Math.min(start + inc * step, target);
      if (step >= steps) { audio.volume = target; clearInterval(audioFadeTimer); }
    }, ivl);
  }

  /* ── Eventos ─────────────────────────────────────────────── */
  overlay.addEventListener('click', () => {
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    setTimeout(() => overlay.style.display = 'none', 650);
    audioBtn.style.display = 'flex';
    dotsEl.style.display   = 'flex';
    video.play().catch(() => {});
    fadeInAudio();
    startScene(0, true); // cena 0 sem pan de entrada
  });

  audioBtn.addEventListener('click', () => {
    isMuted = !isMuted;
    isMuted ? audio.pause() : audio.play().catch(() => {});
    audioBtn.innerHTML = isMuted ? iconOff : iconOn;
  });

  window.addEventListener('resize', () => {
    cancelAnimationFrame(kbRafId);
    artWrapper.style.transition = 'none';
    artWrapper.style.transform  = calcTransform(CONFIG.scenes[currentScene], 1);
    if (!isPanning) startKenBurns(CONFIG.scenes[currentScene], sceneDurationMs);
  });

  /* ── Init ─────────────────────────────────────────────────── */
  buildDots();
  audioBtn.innerHTML = iconOff;
  video.muted = true;
  video.currentTime = 0;
  artWrapper.style.transition = 'none';
  artWrapper.style.transform  = calcTransform(CONFIG.scenes[0], 1);

  function showBgFrame() { overlayBg.classList.add('ready'); }
  bgVideo.addEventListener('seeked',     showBgFrame, { once: true });
  bgVideo.addEventListener('loadeddata', showBgFrame, { once: true });
  setTimeout(showBgFrame, 800);
  bgVideo.muted = true;
  bgVideo.currentTime = 0;
  bgVideo.load();
  </script>
</body>
</html>
