<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Interativo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            overflow: hidden; 
            background-color: #000; 
        }

        /* Container de Rolagem Estilo TikTok/Reels */
        .container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Cada página é um quadro 9:16 */
        .page {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover; /* Garante que a imagem preencha a tela */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* CONFIGURAÇÃO DAS IMAGENS DE FUNDO - Adicione aqui as novas páginas */
        .p1 { background-image: url('pagina1.jpg'); }
        .p2 { background-image: url('pagina2.jpg'); }
        .p3 { background-image: url('pagina3.jpg'); }
        .p4 { background-image: url('pagina4.jpg'); }
        /* Para adicionar a 11: .p11 { background-image: url('pagina11.jpg'); } */

        /* HOTSPOT (Link sobre a imagem) */
        .hotspot {
            position: absolute;
            bottom: 15%; /* Distância do fundo da tela - Ajuste conforme sua arte */
            padding: 15px 40px;
            background-color: rgba(255, 255, 255, 0.85); /* Fundo semi-transparente */
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-family: sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* BOTÃO WHATSAPP FIXO */
        .whatsapp-fixo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            text-decoration: none;
        }

        /* Ajuste para PC: mantém o aspecto de celular no meio da tela */
        @media (min-width: 768px) {
            .page { max-width: 450px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <a href="https://wa.me/5571993233142" class="whatsapp-fixo" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="35" alt="Zap">
    </a>

    <div class="container">
        
        <section class="page p1">
            <a href="https://www.instagram.com/crisoliveiraconvitestop10/?hl=en" class="hotspot">Instagram</a>
        </section>

        <section class="page p3">
            <a href="https://crispoparte.com.br/analaura10anos" class="hotspot">VER EXPERIÊNCIA</a>
        </section>

        <section class="page p4">
            <a href="https://crispoparte.com.br/luccafiltro2" class="hotspot">VER EXPERIÊNCIA</a>
        </section>
        <section class="page p5">
            <a href="LINK_4" class="hotspot">ACESSAR CONVITE</a>
        </section>

        </div>

</body>
</html>
