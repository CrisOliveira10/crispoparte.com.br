<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Curso - Cristiane Oliveira</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Permitir rolagem real no navegador */
        html, body { 
            height: 100%; 
            width: 100%; 
            overflow-y: auto; 
            background-color: #ffffff; 
        }

        .container-canva {
            width: 100%;
            height: 100vh; /* Mantém o iframe na visão */
        }

        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        .desktop-view { display: block; }
        .mobile-view { display: none; }

        @media screen and (max-width: 768px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
        }
    </style>
</head>
<body>

<div class="container-canva">
    <iframe class="desktop-view" 
            src="https://www.canva.com/design/DAHAq42whx8/Y_InP7BBBfw0-fQSLYsFWQ/view?embed" 
            allowfullscreen>
    </iframe>

    <iframe class="mobile-view" 
            src="https://www.canva.com/design/DAHAqyOJpY4/sKGX-JtNWbnLBjbBh4uJRQ/view?embed" 
            allowfullscreen>
    </iframe>
</div>

</body>
</html>
