<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Cristiane Oliveira</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Liberamos a rolagem total do corpo do site */
        html, body { 
            height: 100%; 
            width: 100%; 
            overflow-y: auto; /* Permite rolagem vertical */
            overflow-x: hidden;
            background-color: #ffffff; 
        }

        .container-canva {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* O segredo: o iframe precisa ser gigante ou se ajustar ao conteúdo */
        iframe { 
            width: 100%; 
            height: 100vh; /* Ele ocupa a visão, mas permite que o conteúdo role */
            border: none; 
        }

        .desktop-view { display: block; }
        .mobile-view { display: none; }

        @media screen and (max-width: 768px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
        }
    </style>
</head>
<body>

<div class="container-canva">
    <iframe class="desktop-view" 
            src="https://www.canva.com/design/DAHAq42whx8/Y_InP7BBBfw0-fQSLYsFWQ/view?website" 
            allowfullscreen>
    </iframe>

    <iframe class="mobile-view" 
            src="https://www.canva.com/design/DAHAqyOJpY4/sKGX-JtNWbnLBjbBh4uJRQ/view?website" 
            allowfullscreen>
    </iframe>
</div>

</body>
</html>
