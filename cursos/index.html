    <style>
        /* Reset total de margens e preenchimento */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Força o corpo e o html a ocuparem 100% da altura visível sem rolagem */
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff; /* Ajuste para a cor de fundo do seu design */
            position: fixed; /* Evita rebote (bounce) no iOS */
        }

        /* Container principal que segura o iframe */
        .container-canva {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* O segredo para mobile: remover restrições de aspect-ratio do iframe */
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: block;
        }

        /* Ajuste específico para garantir que o Canva não crie barras pretas no mobile */
        @media screen and (max-width: 768px) {
            .container-canva {
                height: 100vh;
                height: -webkit-fill-available; /* Ajuste para navegadores Safari/iPhone */
            }
        }
    </style>
