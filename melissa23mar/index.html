<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Convite Melissa</title>

    <style>
        :root {
            --cor-botao: #ffffff;
            --aspect-ratio: 9 / 16;
            --tempo-transicao: 0.8s;
        }

        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            height: 100dvh;
            position: absolute;
            max-width: 500px;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .interactive-area {
            position: absolute;
            aspect-ratio: var(--aspect-ratio);
            height: 100%;
            max-width: 100%;
        }

        /* ============================================================
           🔴 MODO EDIÇÃO — VISUALIZAR HOTSPOT
           Para ATIVAR  → adicione a classe "modo-edicao" no <body>:
               <body class="modo-edicao">
           Para DESATIVAR → remova a classe (deixe só <body>):
               <body>
           Com o modo ativo, o hotspot aparece com borda vermelha
           tracejada e fundo semitransparente para conferir o alinhamento.
        ============================================================ */
        body.modo-edicao .hotspot {
            border: 2px dashed red;
            background: rgba(255, 0, 0, 0.2);
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            /* Por padrão invisível — só aparece no modo-edicao */
        }

        /* BOTÃO DE CONTROLE DE ÁUDIO */
        .btn-audio {
            position: fixed;
            top: env(safe-area-inset-top, 30px);
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            color: #ffffff;
            display: flex;          /* já visível — música toca na página única */
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 18px;
            animation: pulse-white 2s infinite;
        }

        @keyframes pulse-white {
            0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70%  { transform: scale(1);    box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
    </style>
</head>

<!-- ============================================================
     🔴 MODO EDIÇÃO: para ver o hotspot troque por → <body class="modo-edicao">
     ✅ MODO NORMAL:  deixe somente              → <body>
============================================================ -->
<body>

<!-- ============================================================
     🎵 ÁUDIO — coloque o arquivo audio.mp3 na mesma pasta
============================================================ -->
<audio id="musica" src="audio.mp3" loop preload="auto"></audio>

<!-- Botão play/pause do áudio -->
<div id="btnControleAudio" class="btn-audio" onclick="toggleAudio()">
    <span id="iconeAudio">▶</span>
</div>

<!-- ============================================================
     📄 PÁGINA ÚNICA — imagem de fundo + hotspot do botão
     • Troque "pagina3.jpg" pelo nome da sua arte
     • Ajuste top / left / width / height do hotspot
       para cobrir exatamente o botão "Confirmar presença"
     • Use o MODO EDIÇÃO acima para conferir o alinhamento
============================================================ -->
<div class="page" id="page3">
    <div class="content-wrapper">
        <div class="media-container">
            <img src="pagina3.jpg" alt="Convite">
            <div class="interactive-area">

                <!-- ✏️ HOTSPOT — ajuste top/left/width/height conforme sua arte -->
                <a class="hotspot"
                   style="top:63%; left:50%; width:40%; height:10%; transform:translateX(-50%);"
                   href="http://noivos.casar.com/lyaejoao"
                   target="_blank">
                </a>

            </div>
        </div>
    </div>
</div>

<script>
    const musica = document.getElementById('musica');
    const btnAudio = document.getElementById('btnControleAudio');
    const iconeAudio = document.getElementById('iconeAudio');

    // Tenta iniciar o áudio ao carregar a página (pode ser bloqueado pelo browser)
    window.addEventListener('load', () => {
        musica.play()
            .then(() => { iconeAudio.innerText = "II"; })
            .catch(() => {
                // Autoplay bloqueado — inicia no primeiro toque do usuário
                iconeAudio.innerText = "▶";
                document.addEventListener('click', () => {
                    musica.play().then(() => { iconeAudio.innerText = "II"; });
                }, { once: true });
            });
    });

    function toggleAudio() {
        if (musica.paused) {
            musica.play();
            iconeAudio.innerText = "II";
            btnAudio.style.animation = "pulse-white 2s infinite";
        } else {
            musica.pause();
            iconeAudio.innerText = "▶";
            btnAudio.style.animation = "none";
        }
    }

    // Retoma áudio ao voltar para a aba
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && !musica.paused) {
            musica.play();
        }
    });
</script>

</body>
</html>
