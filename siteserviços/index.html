<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lista de Produtos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root {
  --cor-primaria:      #f95d7d;
  --cor-secundaria:    #4ad1c9;
  --cor-fundo:         #ffffff;
  --cor-texto:         #333333;
  --cor-rodape:        #994d89;
  --cor-card-borda:    #e0e0e0;
  --cor-btn-texto:     #ffffff;
  --fonte-titulo:      'Nunito', sans-serif;
  --fonte-corpo:       'Poppins', sans-serif;
  --raio-btn:          30px;
  --raio-card:         12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body { font-family: var(--fonte-corpo); color: var(--cor-texto); background: var(--cor-fundo); }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }

header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 100; }
.header-logo img { height: 38px; }
.header-logo span { font-family: var(--fonte-titulo); font-size: 1.5rem; font-weight: 900; color: var(--cor-primaria); letter-spacing: -1px; }
.header-right { display: flex; align-items: center; gap: 14px; }
.hamburger-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
.hamburger-btn span { display: block; width: 24px; height: 2.5px; background: var(--cor-texto); border-radius: 2px; transition: .3s; }

.menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 200; }
.menu-overlay.open { display: block; }
.menu-drawer { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #fff; z-index: 201; padding: 32px 24px; transition: left .3s ease; box-shadow: 4px 0 20px rgba(0,0,0,.12); }
.menu-drawer.open { left: 0; }
.menu-drawer .close-menu { background: none; border: none; cursor: pointer; font-size: 1.5rem; color: var(--cor-texto); position: absolute; top: 14px; right: 18px; }
.menu-drawer nav { margin-top: 40px; }
.menu-drawer nav a { display: block; padding: 14px 0; font-family: var(--fonte-titulo); font-weight: 700; font-size: 1.05rem; color: var(--cor-texto); border-bottom: 1px solid #f0f0f0; transition: color .2s; }
.menu-drawer nav a:hover { color: var(--cor-primaria); }

.hero { position: relative; width: 100%; background: var(--cor-secundaria); overflow: visible; }
.hero-banner { width: 100%; height: 220px; object-fit: cover; display: block; }
.hero-circle-wrap { position: absolute; bottom: -65px; left: 50%; transform: translateX(-50%); width: 130px; height: 130px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18); overflow: hidden; background: var(--cor-secundaria); z-index: 10; }
.hero-circle-wrap img { width: 100%; height: 100%; object-fit: cover; }


.hero-placeholder { width: 100%; height: 220px; background: linear-gradient(135deg, var(--cor-secundaria) 0%, #4a2880 100%); display: flex; align-items: center; justify-content: flex-start; padding: 0 32px; position: relative; overflow: hidden; }
.hero-placeholder-text { font-family: var(--fonte-titulo); font-weight: 900; font-size: 2.4rem; color: var(--cor-primaria); z-index: 1; }
.hero-placeholder-sub { font-size: .55rem; letter-spacing: 2px; color: rgba(255,255,255,.8); margin-top: 2px; }

.profile-section { text-align: center; padding: 90px 20px 30px; margin-top: 0; }
.event-title { font-family: var(--fonte-titulo); font-size: 1.7rem; font-weight: 900; color: var(--cor-primaria); margin-bottom: 4px; }
.event-organizer { font-size: .9rem; color: #777; margin-bottom: 28px; }

.welcome-section { max-width: 600px; margin: 0 auto; padding: 0 24px 48px; text-align: center; }
.welcome-section h2 { font-family: var(--fonte-titulo); font-size: 1.3rem; font-weight: 800; color: var(--cor-primaria); margin-bottom: 16px; }
.welcome-section p { font-size: .88rem; line-height: 1.8; color: #555; margin-bottom: 12px; text-align: justify; }

.gifts-section { padding: 0 0 40px; text-align: center; }
.gifts-section h2 { font-family: var(--fonte-titulo); font-size: 1.5rem; font-weight: 900; color: var(--cor-primaria); margin-bottom: 28px; }
.carousel-wrapper { position: relative; display: flex; align-items: center; gap: 8px; max-width: 900px; margin: 0 auto; padding: 0 12px; }
.carousel-track-container { overflow: hidden; flex: 1; }
.carousel-track { display: flex; gap: 16px; transition: transform .4s ease; }

.product-card { flex: 0 0 calc(25% - 12px); min-width: 200px; border: 1.5px solid var(--cor-card-borda); border-radius: var(--raio-card); padding: 16px 12px 12px; background: #fff; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: box-shadow .2s, transform .2s; }
.product-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.1); transform: translateY(-3px); }
.product-card img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #f5f5f5; }.product-card .product-name { font-family: var(--fonte-titulo); font-weight: 700; font-size: .92rem; margin-bottom: 4px; }
.product-card .product-price { font-size: .85rem; color: #555; margin-bottom: 14px; }

.btn-pedido { display: block; width: 100%; padding: 10px; background: var(--cor-primaria); color: var(--cor-btn-texto); border: none; border-radius: var(--raio-btn); font-family: var(--fonte-titulo); font-weight: 800; font-size: .8rem; letter-spacing: 1px; cursor: pointer; transition: opacity .2s, transform .15s; }
.btn-pedido:hover { opacity: .88; transform: scale(1.02); }
.btn-modelo { display: block; width: 100%; padding: 8px; background: transparent; color: var(--cor-primaria); border: 2px solid var(--cor-primaria); border-radius: var(--raio-btn); font-family: var(--fonte-titulo); font-weight: 800; font-size: .75rem; letter-spacing: 1px; cursor: pointer; transition: all .2s; margin-top: 8px; text-align: center; text-decoration: none; }
.btn-modelo:hover { background: var(--cor-primaria); color: #fff; }

.carousel-arrow { background: #fff; border: 1.5px solid #ddd; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; color: #555; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,.1); transition: background .2s, color .2s; z-index: 2; }
.carousel-arrow:hover { background: var(--cor-primaria); color: #fff; border-color: var(--cor-primaria); }
.carousel-arrow:disabled { opacity: .3; cursor: default; }

.carousel-dots { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
.carousel-dots button { width: 10px; height: 10px; border-radius: 50%; border: none; background: #ddd; cursor: pointer; transition: background .2s, transform .2s; }
.carousel-dots button.active { background: var(--cor-primaria); transform: scale(1.2); }

.btn-ver-lista { display: inline-block; margin-top: 28px; padding: 12px 36px; border: 2px solid var(--cor-primaria); border-radius: var(--raio-btn); color: var(--cor-primaria); font-family: var(--fonte-titulo); font-weight: 800; font-size: .9rem; letter-spacing: 1px; cursor: pointer; background: transparent; transition: background .2s, color .2s; }
.btn-ver-lista:hover { background: var(--cor-primaria); color: #fff; }

.recados-section { background: var(--cor-primaria); padding: 52px 20px; text-align: center; clip-path: polygon(0 30px, 2% 0, 4% 30px, 6% 0, 8% 30px, 10% 0, 12% 30px, 14% 0, 16% 30px, 18% 0, 20% 30px, 22% 0, 24% 30px, 26% 0, 28% 30px, 30% 0, 32% 30px, 34% 0, 36% 30px, 38% 0, 40% 30px, 42% 0, 44% 30px, 46% 0, 48% 30px, 50% 0, 52% 30px, 54% 0, 56% 30px, 58% 0, 60% 30px, 62% 0, 64% 30px, 66% 0, 68% 30px, 70% 0, 72% 30px, 74% 0, 76% 30px, 78% 0, 80% 30px, 82% 0, 84% 30px, 86% 0, 88% 30px, 90% 0, 92% 30px, 94% 0, 96% 30px, 98% 0, 100% 30px, 100% 100%, 0 100%); margin-top: 20px; }
.recados-section h2 { font-family: var(--fonte-titulo); font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
.recados-section p { color: rgba(255,255,255,.85); font-size: .88rem; margin-bottom: 28px; }
.envelope-icon { width: 80px; height: 80px; margin: 0 auto 28px; background: rgba(255,255,255,.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.envelope-icon svg { width: 42px; fill: #fff; }
.btn-recado { display: inline-block; padding: 12px 36px; border: 2px solid #fff; border-radius: var(--raio-btn); color: #fff; font-family: var(--fonte-titulo); font-weight: 800; font-size: .9rem; letter-spacing: 1px; background: transparent; cursor: pointer; transition: background .2s, color .2s; }
.btn-recado:hover { background: #fff; color: var(--cor-primaria); }

footer { background: var(--cor-rodape); color: #fff; text-align: center; padding: 24px 20px; font-size: .78rem; line-height: 1.8; }
footer svg { width: 16px; vertical-align: middle; fill: #fff; margin-right: 4px; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 300; align-items: center; justify-content: center; padding: 16px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 18px; width: 100%; max-width: 480px; max-height: 90dvh; overflow-y: auto; padding: 28px 24px 20px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: slideUp .3s ease; }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #888; }
.modal-box h3 { font-family: var(--fonte-titulo); font-weight: 900; font-size: 1.25rem; color: var(--cor-texto); margin-bottom: 4px; }
.modal-box .checkout-sub { font-size: .8rem; color: #888; margin-bottom: 20px; }
.checkout-field { width: 100%; border: 1.5px solid #ddd; border-radius: 8px; padding: 11px 14px; font-family: var(--fonte-corpo); font-size: .88rem; margin-bottom: 12px; outline: none; transition: border-color .2s; }
.checkout-field:focus { border-color: var(--cor-primaria); }

.pix-row { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
.btn-pix { flex: 1; padding: 12px; background: var(--cor-primaria); color: #fff; border: none; border-radius: var(--raio-btn); font-family: var(--fonte-titulo); font-weight: 800; font-size: .88rem; letter-spacing: 1px; cursor: pointer; transition: opacity .2s; }
.btn-pix:hover { opacity: .88; }
.btn-enviar-pedido { flex: 1; padding: 12px; background: #25d366; color: #fff; border: none; border-radius: var(--raio-btn); font-family: var(--fonte-titulo); font-weight: 800; font-size: .78rem; letter-spacing: .5px; cursor: pointer; transition: opacity .2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-enviar-pedido:hover { opacity: .88; }
.btn-enviar-pedido svg { width: 18px; fill: #fff; flex-shrink: 0; }
.copy-pix-link { text-align: center; font-size: .78rem; color: #888; cursor: pointer; margin-bottom: 22px; display: block; }
.copy-pix-link:hover { color: var(--cor-primaria); text-decoration: underline; }

.resumo-box { background: #f9f9f9; border-radius: 12px; padding: 18px 16px; margin-bottom: 16px; }
.resumo-box h4 { font-family: var(--fonte-titulo); font-weight: 900; font-size: .95rem; text-align: center; letter-spacing: 1px; margin-bottom: 16px; color: var(--cor-texto); }
.resumo-item { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.resumo-item img { width: 52px; height: 52px; object-fit: cover; border-radius: 50%; border: 1.5px solid #ddd; background: #eee; }
.resumo-item-info { flex: 1; }
.resumo-item-info .rname { font-weight: 700; font-size: .88rem; }
.resumo-item-info .rprice { font-size: .82rem; color: #555; font-weight: 700; }
.qty-control { display: flex; align-items: center; gap: 8px; border: 1.5px solid #ddd; border-radius: 20px; padding: 4px 10px; }
.qty-control button { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--cor-texto); font-weight: 700; width: 20px; text-align: center; }
.qty-control span { font-size: .88rem; font-weight: 700; min-width: 16px; text-align: center; }
.resumo-total { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1.5px solid #eee; font-size: .88rem; font-weight: 700; }
.resumo-total .total-val { font-family: var(--fonte-titulo); font-weight: 900; font-size: 1rem; color: var(--cor-primaria); }
.btn-voltar { display: block; width: 100%; padding: 14px; background: var(--cor-primaria); color: #fff; border: none; border-radius: var(--raio-btn); font-family: var(--fonte-titulo); font-weight: 900; font-size: .95rem; cursor: pointer; transition: opacity .2s; margin-top: 4px; }
.btn-voltar:hover { opacity: .88; }

.modal-lista-box { background: #fff; border-radius: 18px; width: 100%; max-width: 700px; max-height: 90dvh; overflow-y: auto; padding: 28px 24px 24px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: slideUp .3s ease; }
.modal-lista-box h3 { font-family: var(--fonte-titulo); font-weight: 900; font-size: 1.3rem; color: var(--cor-primaria); margin-bottom: 20px; text-align: center; }
.lista-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }

.modal-recado-box { background: #fff; border-radius: 18px; width: 100%; max-width: 440px; padding: 32px 28px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.2); animation: slideUp .3s ease; }
.modal-recado-box h3 { font-family: var(--fonte-titulo); font-weight: 900; font-size: 1.2rem; color: var(--cor-primaria); margin-bottom: 6px; }
.modal-recado-box p { font-size: .82rem; color: #888; margin-bottom: 20px; }
.recado-textarea { width: 100%; min-height: 100px; resize: vertical; border: 1.5px solid #ddd; border-radius: 8px; padding: 11px 14px; font-family: var(--fonte-corpo); font-size: .88rem; outline: none; margin-bottom: 12px; transition: border-color .2s; }
.recado-textarea:focus { border-color: var(--cor-primaria); }
.btn-enviar-recado { width: 100%; padding: 12px; background: var(--cor-primaria); color: #fff; border: none; border-radius: var(--raio-btn); font-family: var(--fonte-titulo); font-weight: 800; font-size: .9rem; cursor: pointer; transition: opacity .2s; }
.btn-enviar-recado:hover { opacity: .88; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: #333; color: #fff; padding: 10px 22px; border-radius: 24px; font-size: .85rem; font-weight: 600; z-index: 500; opacity: 0; transition: all .4s ease; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 680px) { .product-card { flex: 0 0 calc(50% - 8px); min-width: 145px; } .hero-circle-wrap { width: 110px; height: 110px; top: 220px; transform: translate(-50%, -50%); } .profile-section { padding-top: 80px; } .pix-row { flex-direction: column; } .btn-pix, .btn-enviar-presente { width: 100%; } }.hero-circle-wrap { width: 110px; height: 110px; top: 220px; transform: translate(-50%, -50%); } .profile-section { padding-top: 80px; } .pix-row { flex-direction: column; } .btn-pix, .btn-enviar-presente { width: 100%; } }
@media (max-width: 420px) { .product-card { flex: 0 0 calc(100% - 4px); min-width: 200px; } }
</style>
</head>

  const bannerWrap = document.getElementById('heroBanner');
  if(CONFIG.bannerSrc) {
    const bannerImg = new Image();
    bannerImg.src = CONFIG.bannerSrc;
    bannerImg.onload = () => { bannerWrap.innerHTML = ''; bannerImg.style.cssText = 'width:100%;height:220px;object-fit:cover;display:block;'; bannerWrap.appendChild(bannerImg); };
  }

  const circleEl = document.getElementById('heroCircle');
  if(CONFIG.circuloSrc) circleEl.src = CONFIG.circuloSrc;
  circleEl.onerror = () => { circleEl.closest('.hero-circle-wrap').innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--cor-secundaria);"><svg viewBox="0 0 60 60" width="60" fill="var(--cor-primaria)"><path d="M30 5 C17 5 7 15 7 28 C7 36 11 43 17 48 L17 55 L30 50 L43 55 L43 48 C49 43 53 36 53 28 C53 15 43 5 30 5Z" opacity=".7"/><circle cx="22" cy="26" r="4"/><circle cx="38" cy="26" r="4"/></svg></div>`; };

  document.getElementById('eventTitle').textContent = CONFIG.nomeEvento;
  document.getElementById('eventOrganizer').textContent = CONFIG.organizador;
  document.getElementById('saudacaoTitle').textContent = CONFIG.saudacao;
  document.getElementById('welcomeText').innerHTML = CONFIG.textoBemVindo.map(t => `<p>${t}</p>`).join('');
  document.getElementById('rodapeTexto').textContent = CONFIG.rodapeTexto;
  if (CONFIG.rodapeCNPJ) document.getElementById('rodapeCNPJ').textContent = `CNPJ: ${CONFIG.rodapeCNPJ}`;
  document.getElementById('pixKeyLabel').textContent = `copiar chave pix · ${CONFIG.chavePix}`;

  buildCarousel(); buildListaGrid();
});

let currentIndex = 0;
const VISIBLE = () => window.innerWidth <= 420 ? 1 : window.innerWidth <= 680 ? 2 : CONFIG.cardsVisiveis;

function buildCarousel() {
  const track = document.getElementById('carouselTrack');
  track.innerHTML = '';
  CONFIG.produtos.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    
    let botoesHTML = `<button class="btn-pedido" onclick="openCheckout(${p.id})">PEDIDO</button>`;
    if (p.linkModelo) {
      botoesHTML += `<a href="${p.linkModelo}" target="_blank" class="btn-modelo">VER MODELO</a>`;
    }

    card.innerHTML = `<img src="${p.imagem}" alt="${p.nome}" onerror="this.src='https://via.placeholder.com/200x160?text=${encodeURIComponent(p.nome)}'"/> <div class="product-name">${p.nome}</div> <div class="product-price">R$ ${p.preco.toFixed(2).replace('.',',')}</div> ${botoesHTML}`;
    track.appendChild(card);
  });
  buildDots(); updateCarousel();
}

function buildDots() {
  const vis = VISIBLE();
  const total = Math.ceil(CONFIG.produtos.length / vis);
  const dotsEl = document.getElementById('carouselDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const btn = document.createElement('button');
    btn.onclick = () => { currentIndex = i * vis; updateCarousel(); };
    dotsEl.appendChild(btn);
  }
  updateDots();
}

function updateCarousel() {
  const track = document.getElementById('carouselTrack');
  const cards = track.querySelectorAll('.product-card');
  if (!cards.length) return;
  const cardW = cards[0].offsetWidth;
  const gap = 16;
  track.style.transform = `translateX(-${currentIndex * (cardW + gap)}px)`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex >= CONFIG.produtos.length - VISIBLE();
  updateDots();
}

function updateDots() {
  const vis = VISIBLE();
  const dots = document.querySelectorAll('#carouselDots button');
  const activeGroup = Math.floor(currentIndex / vis);
  dots.forEach((d, i) => d.classList.toggle('active', i === activeGroup));
}

function slidePrev() { currentIndex = Math.max(0, currentIndex - VISIBLE()); updateCarousel(); }
function slideNext() { currentIndex = Math.min(CONFIG.produtos.length - VISIBLE(), currentIndex + VISIBLE()); updateCarousel(); }
window.addEventListener('resize', () => { buildDots(); updateCarousel(); });

let checkoutProduto = null; const qtds = {};
function openCheckout(prodId) { checkoutProduto = CONFIG.produtos.find(p => p.id === prodId); if (!checkoutProduto) return; if (!qtds[prodId]) qtds[prodId] = 1; renderResumo([checkoutProduto]); document.getElementById('checkoutModal').classList.add('open'); }
function closeCheckout() { document.getElementById('checkoutModal').classList.remove('open'); checkoutProduto = null; }

function renderResumo(produtos) {
  const el = document.getElementById('resumoItens'); el.innerHTML = ''; let total = 0;
  produtos.forEach(p => {
    if (!qtds[p.id]) qtds[p.id] = 1; total += p.preco * qtds[p.id];
    el.innerHTML += `<div class="resumo-item" id="item-${p.id}"><img src="${p.imagem}" alt="${p.nome}" onerror="this.src='https://via.placeholder.com/52?text=?'"/><div class="resumo-item-info"><div class="rname">${p.nome}</div><div class="rprice">R$ ${p.preco.toFixed(2).replace('.',',')}</div></div><div class="qty-control"><button onclick="changeQty(${p.id}, -1)">−</button><span id="qty-${p.id}">${qtds[p.id]}</span><button onclick="changeQty(${p.id}, 1)">+</button></div></div>`;
  });
  document.getElementById('totalVal').textContent = 'R$ ' + total.toFixed(2).replace('.',',');
}

function changeQty(prodId, delta) { qtds[prodId] = Math.max(1, (qtds[prodId] || 1) + delta); document.getElementById(`qty-${prodId}`).textContent = qtds[prodId]; const prods = checkoutProduto ? [checkoutProduto] : CONFIG.produtos; let total = 0; prods.forEach(p => { total += p.preco * (qtds[p.id] || 1); }); document.getElementById('totalVal').textContent = 'R$ ' + total.toFixed(2).replace('.',','); }

function copiarPix() { navigator.clipboard.writeText(CONFIG.chavePix).then(() => showToast('Chave PIX copiada!')).catch(() => { showToast(`Chave PIX: ${CONFIG.chavePix}`); }); }

function enviarWhatsApp() {
  const nome = document.getElementById('nomeComprador').value.trim() || '(não informado)'; const msg = document.getElementById('msgComprador').value.trim(); if (!checkoutProduto) return;
  const qtd = qtds[checkoutProduto.id] || 1; const total = (checkoutProduto.preco * qtd).toFixed(2).replace('.',',');
  let texto = `Olá, ${CONFIG.nomeEvento.split(' ').pop()} já reservei meu pedido ${checkoutProduto.nome}`;
  if (qtd > 1) texto += ` (x${qtd})`;
  texto += `, total R$ ${total}.\nNome: ${nome}.`;
  if (msg) texto += `\nRecado: ${msg}`;
  texto += `\nEstarei efetuando pix: Chave pix ${CONFIG.chavePix}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`, '_blank');
}

function buildListaGrid() {
  const grid = document.getElementById('listaGrid'); grid.innerHTML = '';
  CONFIG.produtos.forEach(p => {
    const card = document.createElement('div'); card.className = 'product-card';
    
    let botoesHTML = `<button class="btn-pedido" onclick="openCheckout(${p.id}); closeListaCompleta();">PEDIDO</button>`;
    if (p.linkModelo) {
      botoesHTML += `<a href="${p.linkModelo}" target="_blank" class="btn-modelo">VER MODELO</a>`;
    }

    card.innerHTML = `<img src="${p.imagem}" alt="${p.nome}" onerror="this.src='https://via.placeholder.com/200x160?text=${encodeURIComponent(p.nome)}'"/><div class="product-name">${p.nome}</div><div class="product-price">R$ ${p.preco.toFixed(2).replace('.',',')}</div>${botoesHTML}`;
    grid.appendChild(card);
  });
}

function openListaCompleta() { document.getElementById('listaModal').classList.add('open'); }
function closeListaCompleta() { document.getElementById('listaModal').classList.remove('open'); }
function openRecado() { document.getElementById('recadoModal').classList.add('open'); }
function closeRecado() { document.getElementById('recadoModal').classList.remove('open'); }

function enviarRecado() {
  const nome = document.getElementById('nomeRecado').value.trim(); const texto = document.getElementById('textoRecado').value.trim();
  if (!nome || !texto) { showToast('Preencha seu nome e recado!'); return; }
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(`*Recado para ${CONFIG.nomeEvento}*\nDe: ${nome}\n\n${texto}`)}`, '_blank');
  closeRecado(); document.getElementById('nomeRecado').value = ''; document.getElementById('textoRecado').value = '';
}

function openMenu() { document.getElementById('menuDrawer').classList.add('open'); document.getElementById('menuOverlay').classList.add('open'); }
function closeMenu() { document.getElementById('menuDrawer').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

document.querySelectorAll('.modal-overlay').forEach(overlay => { overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.classList.remove('open'); checkoutProduto = null; } }); });
</script>
</body>
</html>
