<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel</title>
    <!-- Estilos omitidos para brevidade, mantenha os seus -->
    <style>
        body { background: #111a24; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        .card-glass { background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 24px; text-align: center; border: 1px solid #1dbab3; }
        button { background: #1dbab3; border: none; padding: 15px; color: white; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div id="tela-login" class="card-glass">
        <h2>Área Restrita</h2>
        <input type="password" id="senha-acesso" placeholder="Senha">
        <button id="btn-entrar" onclick="verificarSenha()">ENTRAR</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBas2xIT1YsC2NcTcJP0bCWW1ZuFZDb2RI", authDomain: "gerador-mascote.firebaseapp.com", projectId: "gerador-mascote", storageBucket: "gerador-mascote.firebasestorage.app", messagingSenderId: "709992550205", appId: "1:709992550205:web:bf9df2d56fb18a258d3f54" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function verificarSenha() {
            const btn = document.getElementById('btn-entrar');
            btn.innerText = "Conectando...";
            const digitada = document.getElementById('senha-acesso').value.trim();

            db.collection("acesso").doc("geradormascote").get()
            .then((doc) => {
                if (doc.exists && doc.data().senha_alunos == digitada) {
                    alert("Acesso liberado!"); // Se vir isto, a ligação está perfeita!
                } else {
                    alert("Senha incorreta ou erro no banco.");
                }
            })
            .catch((error) => {
                alert("Erro de conexão Firebase: " + error.message);
            });
        }
    </script>
</body>
</html>
