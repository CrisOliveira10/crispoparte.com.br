<script>
let currentZap = "";
function abrirForm(z){ currentZap = z; document.getElementById('form-modal').style.display='flex'; }
function enviarWhats() {
    let nome = document.getElementById("fnome").value;
    let convidados = document.getElementById("fconvidados").value;
    let participa = document.getElementById("fparticipa").value;
    let adultos = document.getElementById("fadultos").value;
    let criancas = document.getElementById("fcriancas").value;
    let idades = document.getElementById("fidades").value;
    if(nome === "" || participa === "") { alert("Por favor, preencha seu nome e se você vai participar."); return; }
    let infoIdade = idades ? idades : "Não informado";
    let msg = `✨ *CONFIRMAÇÃO DE PRESENÇA* ✨\n\n👤 *Nome:* ${nome}\n🙌 *Vai participar?* ${participa}\n👥 *Acompanhantes:* ${convidados}\n👨‍👩‍👧‍👦 *Total de Adultos:* ${adultos}\n👶 *Total de Crianças:* ${criancas}\n🎂 *Idade das Crianças:* ${infoIdade}\n\n_Enviado via Formulário_`;
    window.open(`https://wa.me/${currentZap}?text=${encodeURIComponent(msg)}`);
}

const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  { width: 400, height: 700, size: "stretch", minWidth: 300, maxWidth: 600, minHeight: 400, maxHeight: 900, maxShadowOpacity: 0.5, showCover: false, mobileScrollSupport: false, useMouseEvents: true }
);
pageFlip.loadFromHTML(document.querySelectorAll(".page"));

document.getElementById("next").onclick = () => { if (scale === 1) pageFlip.flipNext(); };
document.getElementById("prev").onclick = () => { if (scale === 1) pageFlip.flipPrev(); };

const bgMusic = document.getElementById("bgMusic");
const btnMusic = document.getElementById("btn-music");
let musicOn = false, musicStarted = false;
bgMusic.volume = 0.75;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  bgMusic.play().then(() => { musicOn = true; syncMusicBtn(); }).catch(() => { musicStarted = false; });
}
function syncMusicBtn() {
  btnMusic.textContent = musicOn ? '♪' : '🔇';
  btnMusic.classList.toggle('muted', !musicOn);
}
btnMusic.addEventListener('click', () => {
  if (!musicStarted) { startMusic(); return; }
  if (musicOn) { bgMusic.pause(); musicOn = false; }
  else { bgMusic.play(); musicOn = true; }
  syncMusicBtn();
});

function onFirstInteraction() {
  startMusic();
  document.removeEventListener('touchstart', onFirstInteraction);
  document.removeEventListener('touchend', onFirstInteraction);
  document.removeEventListener('mousedown', onFirstInteraction);
  document.removeEventListener('keydown', onFirstInteraction);
}
document.addEventListener('touchstart', onFirstInteraction, { passive: true });
document.addEventListener('touchend', onFirstInteraction, { passive: true });
document.addEventListener('mousedown', onFirstInteraction);
document.addEventListener('keydown', onFirstInteraction);

const hotspotGroups = document.querySelectorAll('.hotspot-group');
function updateHotspots(pageNumber) {
  hotspotGroups.forEach(g => {
    g.classList.toggle('active', parseInt(g.dataset.page, 10) === pageNumber);
  });
}
pageFlip.on('flip', (e) => {
  const pageNumber = e.data + 1;
  if (pageNumber === 2) startMusic();
  updateHotspots(pageNumber);
});
updateHotspots(1);

if("sim"==='sim'){
    setInterval(()=>{ 
        const dist=new Date("")-new Date(); if(dist<0)return;
        const eD=document.getElementById('d'), eH=document.getElementById('h'), eM=document.getElementById('mi'), eS=document.getElementById('se');
        if(eD) eD.innerText=Math.floor(dist/86400000).toString().padStart(2,'0');
        if(eH) eH.innerText=Math.floor((dist%86400000)/3600000).toString().padStart(2,'0');
        if(eM) eM.innerText=Math.floor((dist%3600000)/60000).toString().padStart(2,'0');
        if(eS) eS.innerText=Math.floor((dist%60000)/1000).toString().padStart(2,'0');
    },1000);
}

const container = document.getElementById("zoom-container");
const book = document.getElementById("book");
const badge = document.getElementById("zoom-badge");
const resetBtn = document.getElementById("zoom-reset");
const MIN_SCALE = 1, MAX_SCALE = 4, DBL_SCALE = 2.5;
let scale=1, posX=0, posY=0, isZoomed=false;
let pinching=false, pinchStartDist=0, pinchStartScale=1, pinchOriginX=0, pinchOriginY=0, pinchStartPosX=0, pinchStartPosY=0;
let panning=false, panStartX=0, panStartY=0, panOriginX=0, panOriginY=0;
let lastTapTime=0, lastTapX=0, lastTapY=0;

function getDist(touches) { const dx = touches[0].clientX - touches[1].clientX; const dy = touches[0].clientY - touches[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
function getMid(touches) { return { x: (touches[0].clientX + touches[1].clientX) / 2, y: (touches[0].clientY + touches[1].clientY) / 2 }; }
function clampPos(x, y, s) {
  const rect = container.getBoundingClientRect();
  const maxX = (rect.width * (s - 1)) / 2, minX = -(rect.width * (s - 1)) / 2;
  const maxY = (rect.height * (s - 1)) / 2, minY = -(rect.height * (s - 1)) / 2;
  return { x: Math.min(maxX, Math.max(minX, x)), y: Math.min(maxY, Math.max(minY, y)) };
}
function applyTransform(animate) {
  if (animate) { book.style.transition = 'transform 0.3s ease'; setTimeout(() => { book.style.transition = ''; }, 320); } else { book.style.transition = ''; }
  book.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  const show = scale > 1.05;
  badge.textContent = scale.toFixed(1).replace('.0', '') + '×';
  badge.classList.toggle('visible', show); resetBtn.classList.toggle('visible', show); isZoomed = show;
  if (show) { pageFlip.disable(); } else { pageFlip.enable(); }
  const layer = document.getElementById('hotspot-layer');
  if (layer) { layer.style.transform = book.style.transform; layer.style.pointerEvents = show ? 'none' : ''; }
}
function resetZoom(animate = true) { scale = 1; posX = 0; posY = 0; applyTransform(animate); }
resetBtn.addEventListener('click', () => resetZoom(true));

container.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    e.preventDefault(); pinching = true; panning = false; pinchStartDist = getDist(e.touches); pinchStartScale = scale;
    pinchStartPosX = posX; pinchStartPosY = posY;
    const mid = getMid(e.touches), rect = container.getBoundingClientRect();
    pinchOriginX = mid.x - rect.left - rect.width / 2; pinchOriginY = mid.y - rect.top - rect.height / 2;
  } else if (e.touches.length === 1 && isZoomed) { panning = true; panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY; panOriginX = posX; panOriginY = posY; }
}, { passive: false });

container.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinching) {
    e.preventDefault(); const newDist = getDist(e.touches), ratio = newDist / pinchStartDist;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * ratio)), delta = newScale / scale;
    posX = pinchOriginX + delta * (pinchStartPosX - pinchOriginX); posY = pinchOriginY + delta * (pinchStartPosY - pinchOriginY);
    scale = newScale; const c = clampPos(posX, posY, scale); posX = c.x; posY = c.y; applyTransform(false);
  } else if (e.touches.length === 1 && panning && isZoomed) {
    e.preventDefault(); const c = clampPos(panOriginX + e.touches[0].clientX - panStartX, panOriginY + e.touches[0].clientY - panStartY, scale);
    posX = c.x; posY = c.y; applyTransform(false);
  }
}, { passive: false });

container.addEventListener('touchend', e => {
  if (e.touches.length < 2 && pinching) { pinching = false; if (scale < 1.1) resetZoom(true); }
  if (e.touches.length === 0) panning = false;
  if (e.changedTouches.length === 1) {
    const now = Date.now(), t = e.changedTouches[0], dt = now - lastTapTime, dx = Math.abs(t.clientX - lastTapX), dy = Math.abs(t.clientY - lastTapY);
    if (dt < 300 && dx < 30 && dy < 30) {
      if (isZoomed) { resetZoom(true); } else {
        const rect = container.getBoundingClientRect(), ox = t.clientX - rect.left - rect.width / 2, oy = t.clientY - rect.top - rect.height / 2;
        scale = DBL_SCALE; posX = ox - DBL_SCALE * ox; posY = oy - DBL_SCALE * oy; const c = clampPos(posX, posY, scale); posX = c.x; posY = c.y; applyTransform(true);
      }
      lastTapTime = 0; return;
    }
    lastTapTime = now; lastTapX = t.clientX; lastTapY = t.clientY;
  }
}, { passive: true });
</script>
