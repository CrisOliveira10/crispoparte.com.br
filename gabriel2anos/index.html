<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gabriel 2 Anos</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #e9e9e9;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}

/* Área de zoom */
#zoom-container {
  width: 95vw;
  max-width: 420px;
  height: calc(100vh - 70px);
  overflow: hidden;
  touch-action: none;
  position: relative;
  cursor: grab;
}
#zoom-container:active { cursor: grabbing; }

/* Flipbook */
#book {
  width: 100%;
  height: 100%;
  transform-origin: center center;
}

/* Páginas */
.page {
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
.page img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}
.page video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}
/* Botões de navegação */
.controls {
  position: fixed;
  bottom: 12px;
  display: flex;
  gap: 20px;
  z-index: 10;
}
.controls button {
  border: none;
  background: #333;
  color: white;
  font-size: 20px;
  padding: 10px 22px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}
.controls button:active { background: #555; }

/* Indicador de zoom */
#zoom-badge {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.5);
  color: white;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: 0.08em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 20;
}
#zoom-badge.visible { opacity: 1; }

/* Botão reset zoom */
#zoom-reset {
  position: fixed;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 13px;
  padding: 5px 11px;
  border-radius: 20px;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 20;
}
#zoom-reset.visible { opacity: 1; pointer-events: auto; }

/* ══════════════════════════════════════
   BOTÃO DE MÚSICA
══════════════════════════════════════ */
#btn-music {
  position: fixed;
  top: 8px;
  left: 14px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  border: 2px solid rgba(255,255,255,0.5);
  color: white;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.2s, opacity 0.2s;
  animation: musicPulse 1.6s ease-in-out infinite;
}
#btn-music:hover  { background: rgba(0,0,0,0.8); }
#btn-music.muted  { animation: none; opacity: 0.45; }

@keyframes musicPulse {
  0%   { box-shadow: 0 0 0  0px rgba(255,255,255,0.9); }
  70%  { box-shadow: 0 0 0 16px rgba(255,255,255,0.0); }
  100% { box-shadow: 0 0 0  0px rgba(255,255,255,0.0); }
}

/* ══════════════════════════════════════
   CAMADA DE HOTSPOTS
══════════════════════════════════════ */
#hotspot-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.hotspot-group {
  display: none;
  position: absolute;
  inset: 0;
  pointer-events: none;
  flex-direction: column; 
  align-items: center;    
  justify-content: center; 
}

.hotspot-group.active { 
  display: flex; 
  gap: 40px; /* Aumente aqui para afastar mais um do outro */
}

.hotspot-btn {
  position: relative; 
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  border: none;
  cursor: pointer;
  background: rgba(255,0,0,0.25); /* Mude para transparent após calibrar */
  border-radius: 120px;
  padding: 30px 50px;
  transition: background 0.2s;
}
.hotspot-btn:active { transform: scale(0.97); }

</style>
</head>
<body>

<button id="btn-music" title="Som">♪</button>

<div id="zoom-container">
  <div id="book">
    <div class="page"><img src="pages/1.jpg" alt="Página 1"></div>
    <div class="page"><img src="pages/2.jpg" alt="Página 2"></div>
    <div class="page"><img src="pages/3.jpg" alt="Página 3"></div>
    <div class="page"><img src="pages/4.jpg" alt="Página 4"></div>
    <div class="page"><img src="pages/5.jpg" alt="Página 5"></div>
    <div class="page"><img src="pages/6.jpg" alt="Página 6"></div>
    <div class="page"><img src="pages/7.jpg" alt="Página 7"></div>
    <div class="page"><img src="pages/8.jpg" alt="Página 8"></div>
    <div class="page">
      <video autoplay muted loop playsinline>
        <source src="pages/9.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div id="hotspot-layer">

    <div class="hotspot-group" data-page="5" style="top: 5%;">

      <a class="hotspot-btn" 
         href="https://wa.me/5571993233142" 
         target="_blank" 
         style="width: 85%;">
      </a>

      <a class="hotspot-btn" 
         href="https://maps.app.goo.gl/az4F91tWrhgbCHjw6" 
         target="_blank" 
         style="width: 85%;">
      </a>

    </div>

  </div>
</div>

<div class="controls">
  <button id="prev">◀</button>
  <button id="next">▶</button>
</div>

<div id="zoom-badge">1×</div>
<button id="zoom-reset">✕ zoom</button>

<audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

<script>
/* FLIPBOOK */
const pageFlip = new St.PageFlip(
  document.getElementById("book"),
  {
    width: 400,
    height: 700,
    size: "stretch",
    minWidth: 300,
    maxWidth: 600,
    minHeight: 400,
    maxHeight: 900,
    maxShadowOpacity: 0.5,
    showCover: false,
    mobileScrollSupport: false,
    useMouseEvents: true,
  }
);

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

document.getElementById("next").onclick = () => { if (scale === 1) pageFlip.flipNext(); };
document.getElementById("prev").onclick = () => { if (scale === 1) pageFlip.flipPrev(); };

/* MÚSICA */
const bgMusic = document.getElementById("bgMusic");
const btnMusic = document.getElementById("btn-music");
let musicOn = false;
let musicStarted = false;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  bgMusic.play().then(() => { musicOn = true; syncMusicBtn(); }).catch(() => { musicStarted = false; });
}

function syncMusicBtn() {
  btnMusic.textContent = musicOn ? '♪' : '🔇';
  btnMusic.classList.toggle('muted', !musicOn);
}

btnMusic.addEventListener('click', () => {
  if (!musicStarted) { startMusic(); return; }
  if (musicOn) { bgMusic.pause(); musicOn = false; }
  else { bgMusic.play(); musicOn = true; }
  syncMusicBtn();
});

function onFirstInteraction() {
  startMusic();
  ['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(ev => document.removeEventListener(ev, onFirstInteraction));
}
['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, onFirstInteraction, { passive: true }));

/* HOTSPOTS */
const hotspotGroups = document.querySelectorAll('.hotspot-group');
function updateHotspots(pageNumber) {
  hotspotGroups.forEach(g => {
    g.classList.toggle('active', parseInt(g.dataset.page, 10) === pageNumber);
  });
}

pageFlip.on('flip', (e) => {
  const pageNumber = e.data + 1;
  if (pageNumber === 2) startMusic();
  updateHotspots(pageNumber);
});
updateHotspots(1);

/* ZOOM */
const container = document.getElementById("zoom-container");
const book = document.getElementById("book");
const badge = document.getElementById("zoom-badge");
const resetBtn = document.getElementById("zoom-reset");
let scale = 1, posX = 0, posY = 0, isZoomed = false;

function applyTransform(animate) {
  book.style.transition = animate ? 'transform 0.3s ease' : '';
  book.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
  const show = scale > 1.05;
  badge.classList.toggle('visible', show);
  resetBtn.classList.toggle('visible', show);
  isZoomed = show;
  show ? pageFlip.disable() : pageFlip.enable();
  const layer = document.getElementById('hotspot-layer');
  if (layer) {
    layer.style.transform = book.style.transform;
    layer.style.pointerEvents = show ? 'none' : '';
  }
}

function resetZoom() { scale = 1; posX = 0; posY = 0; applyTransform(true); }
resetBtn.addEventListener('click', resetZoom);

// Simplificado para economia de espaço, mas funcional como o seu original
container.addEventListener('touchstart', e => {
  if (e.touches.length === 1 && isZoomed) {
    panning = true; panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
    panOriginX = posX; panOriginY = posY;
  }
}, { passive: false });
</script>
</body>
</html>
