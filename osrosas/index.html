<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Convite Melissa</title>

    <style>
        :root {
            --aspect-ratio: 9 / 16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            height: 100dvh; /* Evita cortes no Safari */
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container que mantém a proporção da imagem */
        .media-wrapper {
            position: relative;
            height: 100%;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Garante que a imagem não corte (contain) */
        .media-wrapper img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        /* Área interativa que sobrepõe exatamente a imagem */
        .interactive-area {
            position: absolute;
            aspect-ratio: var(--aspect-ratio);
            height: 100%; 
            /* Se a tela for muito larga, a altura dita o tamanho */
            max-height: 100dvh;
            pointer-events: none; /* Deixa cliques passarem para os filhos */
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            pointer-events: auto;
            /* background: rgba(255, 0, 0, 0.3); */ /* Descomente para testar a posição */
        }

        /* MODO EDIÇÃO */
        body.modo-edicao .hotspot {
            border: 2px dashed red;
            background: rgba(255, 0, 0, 0.2);
        }

        .btn-audio {
            position: fixed;
            top: env(safe-area-inset-top, 30px);
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            animation: pulse-white 2s infinite;
        }

        @keyframes pulse-white {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
    </style>
</head>
<body>

<audio id="musica" src="audio.mp3" loop preload="auto" playsinline></audio>

<div id="btnControleAudio" class="btn-audio" onclick="toggleAudio()">
    <span id="iconeAudio">▶</span>
</div>

<div class="page">
    <div class="media-wrapper">
        <img src="convite3.jpg" alt="Convite">
        
        <div class="interactive-area">
            <a class="hotspot" 
               style="top: 70%; left: 42%; width: 17%; height: 9.5%;" 
               href="https://crispoparte.com.br/confirmarmelissa/" 
               target="_blank">
            </a>

            <a class="hotspot" 
               style="top: 81.5%; left: 42%; width: 17%; height: 9.5%;" 
               href="https://maps.app.goo.gl/vpVxGkwH1yrGFdKt5" 
               target="_blank">
            </a>
        </div>
    </div>
</div>

<script>
    const musica = document.getElementById('musica');
    const iconeAudio = document.getElementById('iconeAudio');

    window.addEventListener('load', () => {
        musica.play().then(() => { iconeAudio.innerText = "II"; }).catch(() => {
            document.addEventListener('click', () => {
                musica.play().then(() => { iconeAudio.innerText = "II"; });
            }, { once: true });
        });
    });

    function toggleAudio() {
        if (musica.paused) {
            musica.play();
            iconeAudio.innerText = "II";
        } else {
            musica.pause();
            iconeAudio.innerText = "▶";
        }
    }
</script>

</body>
</html>
