  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root { --vice-pink:#FF2A85; --vice-cyan:#00F0FF; --vice-orange:#FF7B54; --vice-dark:#0D0B14; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; width:100%; height:100%; background:#130524; color:#fff; font-family:'Chakra Petch',sans-serif; overflow:hidden; }
    body { display:flex; align-items:center; justify-content:center; height:100dvh; background:radial-gradient(circle at 50% 45%, rgba(74,21,75,0.42) 0%, #130524 72%); }
    #app { position:relative; height:min(100dvh, calc(100vw * 16 / 9)); aspect-ratio:9/16; max-width:100vw; overflow:hidden; background:#0D0B14; box-shadow:0 0 60px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,42,133,0.22); }
    .font-hud { font-family:'Chakra Petch',sans-serif; }
    .font-gta { font-family:'Anton',sans-serif; }
    .gta-title { font-family:'Anton',sans-serif; letter-spacing:0.04em; text-transform:uppercase; -webkit-text-stroke:2px #000; paint-order:stroke fill; text-shadow:0 4px 0 #000,0 0 22px rgba(255,42,133,0.75); }
    .gta-badge-text { font-family:'Anton',sans-serif; background:linear-gradient(180deg,#00F0FF 0%,#FF2A85 52%,#FF7B54 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 3px 0 #1B0624) drop-shadow(0 0 18px rgba(255,42,133,0.7)); }
    .neon-script { font-family:'Yellowtail',cursive; color:#fff; text-shadow:0 0 6px #fff,0 0 14px #FF2A85,0 0 28px #FF2A85; }
    .logo-png-shadow { filter:drop-shadow(0 6px 14px rgba(0,0,0,0.75)) drop-shadow(0 0 20px rgba(255,42,133,0.55)); }
    .mission-passed-text { font-family:'Anton',sans-serif; background:linear-gradient(180deg,#FFF3B0 0%,#FFB703 55%,#FF7B54 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px rgba(255,183,3,0.85)); }
    .mission-failed-text { font-family:'Anton',sans-serif; background:linear-gradient(180deg,#FF9AA2 0%,#FF2A55 55%,#B91C1C 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 24px rgba(239,68,68,0.9)); }
    @keyframes pulseNeon { 0%,100%{box-shadow:0 0 12px rgba(0,240,255,0.65),inset 0 0 10px rgba(0,240,255,0.35);transform:scale(1);} 50%{box-shadow:0 0 28px rgba(0,240,255,0.95),0 0 40px rgba(255,42,133,0.45),inset 0 0 14px rgba(0,240,255,0.55);transform:scale(1.03);} }
    .btn-neon-pulse { animation:pulseNeon 2s infinite ease-in-out; }
    @keyframes kenBurns { 0%{transform:scale(1) translate(0,0);} 50%{transform:scale(1.14) translate(-1.5%,-1.5%);} 100%{transform:scale(1.22) translate(1%,-2%);} }
    .animate-kenburns { animation:kenBurns 7s ease-in-out infinite alternate; }
    @keyframes glitchFade { 0%{opacity:0;transform:translateY(10px) skewX(-6deg);filter:blur(4px);} 30%{opacity:1;transform:skewX(2deg);filter:blur(0);} 100%{opacity:1;transform:none;} }
    .animate-glitch-in { animation:glitchFade 0.65s cubic-bezier(0.22,1,0.36,1) forwards; }
    @keyframes missionZoom { 0%{opacity:0;transform:scale(1.45);filter:blur(6px);} 100%{opacity:1;transform:scale(1);filter:blur(0);} }
    .animate-mission-zoom { animation:missionZoom 0.75s cubic-bezier(0.16,1,0.3,1) forwards; }
    @keyframes spinSlow { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }
    .animate-spin-slow { animation:spinSlow 14s linear infinite; }
    @keyframes qtePop { 0%{opacity:0;transform:scale(0.75);} 70%{opacity:1;transform:scale(1.06);} 100%{opacity:1;transform:scale(1);} }
    .animate-qte-pop { animation:qtePop 0.25s cubic-bezier(0.22,1,0.36,1) forwards; }
    @keyframes qteShake { 0%,100%{transform:translate(0,0) scale(1.05);} 25%{transform:translate(-4px,3px) scale(1.06);} 50%{transform:translate(4px,-3px) scale(1.07);} 75%{transform:translate(-3px,-2px) scale(1.06);} }
    .animate-qte-shake { animation:qteShake 0.16s linear infinite; }
    .gamepad-no-select { touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
    .xbox-btn { position:relative; border-radius:9999px; display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; color:#fff; text-shadow:0 2px 3px rgba(0,0,0,0.85); border:2px solid rgba(255,255,255,0.28); box-shadow:0 5px 0 rgba(0,0,0,0.72),0 8px 16px rgba(0,0,0,0.65),inset 0 -4px 8px rgba(0,0,0,0.55),inset 0 2px 4px rgba(255,255,255,0.45); transition:transform 0.08s ease,box-shadow 0.08s ease,filter 0.1s ease; cursor:pointer; }
    .xbox-btn::after { content:''; position:absolute; top:7%; left:16%; width:68%; height:36%; border-radius:9999px; background:linear-gradient(180deg,rgba(255,255,255,0.68) 0%,rgba(255,255,255,0.04) 100%); pointer-events:none; }
    .xbox-btn:active, .xbox-btn.is-pressed { transform:translateY(3px) scale(0.91); box-shadow:0 1px 0 rgba(0,0,0,0.8),0 2px 6px rgba(0,0,0,0.65),inset 0 2px 8px rgba(0,0,0,0.55); filter:brightness(1.18); }
    .xbox-a { background:radial-gradient(circle at 35% 30%,#4ade80 0%,#16a34a 52%,#064e3b 100%); border-color:rgba(134,239,172,0.75); }
    .xbox-b { background:radial-gradient(circle at 35% 30%,#f87171 0%,#dc2626 52%,#7f1d1d 100%); border-color:rgba(252,165,165,0.75); }
    .xbox-x { background:radial-gradient(circle at 35% 30%,#38bdf8 0%,#2563eb 52%,#1e3a8a 100%); border-color:rgba(125,211,252,0.75); }
    .xbox-y { background:radial-gradient(circle at 35% 30%,#fde047 0%,#eab308 52%,#854d0e 100%); border-color:rgba(254,240,138,0.8); color:#1c1002; text-shadow:0 1px 0 rgba(255,255,255,0.5); }
    .dpad-btn { position:relative; border-radius:16px; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,rgba(46,38,72,0.92) 0%,rgba(16,12,28,0.96) 100%); border:2px solid rgba(255,255,255,0.22); color:#e2e8f0; box-shadow:0 5px 0 rgba(0,0,0,0.75),0 8px 16px rgba(0,0,0,0.6),inset 0 2px 3px rgba(255,255,255,0.25); transition:transform 0.08s ease,box-shadow 0.08s ease; cursor:pointer; }
    .dpad-btn:active, .dpad-btn.is-pressed { transform:translateY(3px) scale(0.92); box-shadow:0 1px 0 rgba(0,0,0,0.85),inset 0 2px 8px rgba(0,0,0,0.6); filter:brightness(1.2); }
    @keyframes qteRingPulse { 0%,100%{box-shadow:0 0 0 3px rgba(0,240,255,0.95),0 0 22px rgba(255,42,133,0.95),0 5px 0 rgba(0,0,0,0.72);transform:scale(1.04);} 50%{box-shadow:0 0 0 6px rgba(255,42,133,0.95),0 0 32px rgba(0,240,255,0.95),0 5px 0 rgba(0,0,0,0.72);transform:scale(1.13);} }
    .qte-highlight { animation:qteRingPulse 0.65s infinite ease-in-out !important; border-color:#00F0FF !important; z-index:15; }
    .vice-default-bg { background:radial-gradient(circle at 50% 44%,rgba(255,190,92,0.95) 0%,rgba(255,123,84,0.85) 16%,rgba(255,42,133,0.65) 36%,rgba(74,21,75,0.92) 64%,#0D0B14 100%); }
    .vice-grid-floor { background-image:linear-gradient(to right,rgba(0,240,255,0.25) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,42,133,0.35) 1px,transparent 1px); background-size:36px 22px; transform:perspective(260px) rotateX(68deg); transform-origin:center top; }
    .hud-glass { background:rgba(13,11,20,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,42,133,0.45); box-shadow:0 0 24px rgba(255,42,133,0.2),inset 0 0 18px rgba(0,240,255,0.08); }

    .game-ctrl-btn:active, .game-ctrl-btn.is-pressed { transform:scale(0.92); filter:brightness(1.25); }
  </style>
</head>
<body>
  <div id="app"></div>
  <audio id="bg-audio" loop></audio>

  <script>
    function createViceCityGame(container, cfg, callbacks) {
      'use strict';

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      const diffMap = {
        facil: { spawnRate: 1.55, speedMult: 0.85, totalDist: 1400, bridgeGap: 68 },
        medio: { spawnRate: 1.15, speedMult: 1.0, totalDist: 1750, bridgeGap: 78 },
        dificil: { spawnRate: 0.82, speedMult: 1.22, totalDist: 2150, bridgeGap: 88 }
      };
      const diff = diffMap[cfg.gameDifficulty] || diffMap.medio;

      // Estrutura HTML do Jogo (Canvas + HUD + Controles + Overlay de Resultado)
      const isCompact = container.clientWidth < 460;
      const topPad = isCompact ? 'pt-9' : 'pt-4';

      container.innerHTML = `
        <div class="relative w-full h-full overflow-hidden bg-[#0D0B14] select-none" style="touch-action:none;">
          <canvas id="vc-game-canvas" class="block w-full h-full transition-all duration-500"></canvas>

          <!-- Flash de Dano / Alerta -->
          <div id="vc-damage-flash" class="pointer-events-none absolute inset-0 bg-red-600/0 transition-colors duration-150 z-10"></div>

          <!-- Alerta de Ponte Levadiça -->
          <div id="vc-bridge-alert" class="hidden pointer-events-none absolute top-[18%] left-1/2 -translate-x-1/2 z-20 w-[88%] max-w-xs text-center">
            <div class="px-3 py-2 rounded-xl bg-black/80 border-2 border-yellow-400 shadow-[0_0_25px_rgba(250,204,21,0.7)] animate-pulse">
              <div class="font-hud font-bold text-xs sm:text-sm uppercase tracking-wider text-yellow-300">⚠ PONTE ABRINDO!</div>
              <div class="font-gta text-base sm:text-lg text-white tracking-wide">SALTE AGORA! ⬆</div>
            </div>
          </div>

          <!-- Feedback Flutuante (+$250 / SALTO PERFEITO!) -->
          <div id="vc-float-msg" class="pointer-events-none absolute top-[32%] left-1/2 -translate-x-1/2 z-20 font-gta text-lg sm:text-2xl text-emerald-300 opacity-0 transition-all duration-300 drop-shadow-[0_3px_0_#000]"></div>

          <!-- HUD TOPO -->
          <div class="absolute top-0 left-0 right-0 ${topPad} px-3 flex items-start justify-between z-20 pointer-events-none">
            <button id="vc-btn-skip" type="button"
              class="pointer-events-auto px-3 py-1 rounded-full bg-black/65 hover:bg-black/85 border border-white/25 text-[11px] font-hud uppercase tracking-wider text-white cursor-pointer">
              Pular >>
            </button>

            <div class="flex flex-col items-end gap-0.5 pr-11">
              <div id="vc-hud-lives" class="flex items-center gap-1 text-sm drop-shadow-[0_0_8px_rgba(255,42,133,0.9)]">
                ❤️❤️❤️
              </div>
              <div id="vc-hud-stars" class="flex items-center gap-0.5 text-[11px] text-yellow-400">
                ★☆☆☆☆
              </div>
              <div id="vc-hud-cash" class="font-hud font-bold text-sm sm:text-base text-emerald-400 drop-shadow-[0_2px_0_#000]">
                $0
              </div>
            </div>
          </div>

          <!-- HUD INFERIOR (Minimapa + Velocímetro + Controles + Objetivo) -->
          <div id="vc-hud-bottom" class="absolute bottom-0 left-0 right-0 p-2.5 pb-2 z-20 flex flex-col gap-2 pointer-events-none">
            <!-- Linha Minimapa & Velocímetro -->
            <div class="flex items-end justify-between px-1">
              <!-- Minimapa Circular -->
              <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-[#120A24]/85 border-2 border-[#00F0FF]/70 shadow-[0_0_14px_rgba(0,240,255,0.35)] relative overflow-hidden">
                <div class="absolute inset-0 opacity-30" style="background-image:linear-gradient(to right,#FF2A85 1px,transparent 1px),linear-gradient(to bottom,#00F0FF 1px,transparent 1px);background-size:14px 14px;"></div>
                <div class="absolute left-1/2 top-0 bottom-0 w-2.5 -translate-x-1/2 bg-purple-400/25"></div>
                <div id="vc-map-dest" class="absolute left-1/2 top-2 -translate-x-1/2 w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-[0_0_8px_#FACC15] animate-ping"></div>
                <div class="absolute left-1/2 top-2 -translate-x-1/2 w-2 h-2 rounded-full bg-yellow-300"></div>
                <div id="vc-map-player" class="absolute left-1/2 bottom-2.5 -translate-x-1/2 w-0 h-0 border-l-[5px] border-r-[5px] border-b-[10px] border-l-transparent border-r-transparent border-b-white drop-shadow-[0_0_4px_#00F0FF]"></div>
              </div>

              <!-- Velocímetro + Barra de Progresso -->
              <div class="bg-black/65 backdrop-blur-sm border border-[#FF2A85]/45 rounded-xl px-2.5 py-1.5 text-right min-w-[104px]">
                <div class="flex items-baseline justify-end gap-1">
                  <span id="vc-hud-speed" class="font-gta text-xl sm:text-2xl text-white leading-none">95</span>
                  <span class="font-hud text-[10px] text-[#00F0FF] font-bold">km/h</span>
                </div>
                <div class="w-24 h-1.5 bg-white/15 rounded-full overflow-hidden mt-1">
                  <div id="vc-hud-prog" class="h-full bg-gradient-to-r from-[#00F0FF] via-[#FF2A85] to-[#FFB703] w-0"></div>
                </div>
                <div id="vc-hud-pct" class="font-hud text-[9px] text-purple-200/80 mt-0.5">0% até a festa</div>
              </div>
            </div>

            <!-- Controles Visíveis na Tela -->
            <div class="flex items-end justify-between gap-2 pointer-events-auto">
              <!-- Esquerda / Direita -->
              <div class="flex items-center gap-2">
                <button id="vc-ctrl-left" type="button"
                  class="game-ctrl-btn w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-black/75 border-2 border-[#00F0FF]/80 text-[#00F0FF] font-bold text-xl flex items-center justify-center shadow-[0_0_14px_rgba(0,240,255,0.3)] cursor-pointer">
                  ◀
                </button>
                <button id="vc-ctrl-right" type="button"
                  class="game-ctrl-btn w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-black/75 border-2 border-[#00F0FF]/80 text-[#00F0FF] font-bold text-xl flex items-center justify-center shadow-[0_0_14px_rgba(0,240,255,0.3)] cursor-pointer">
                  ▶
                </button>
              </div>

              <!-- Saltar / Frear / Acelerar -->
              <div class="flex flex-col items-end gap-1.5">
                <button id="vc-ctrl-jump" type="button"
                  class="game-ctrl-btn w-full px-3.5 py-2 rounded-xl bg-gradient-to-r from-yellow-500/85 to-orange-500/85 border border-yellow-300 text-black font-hud font-bold text-[11px] uppercase tracking-wider shadow-[0_0_12px_rgba(250,204,21,0.45)] cursor-pointer">
                  ⬆ Saltar
                </button>
                <div class="flex items-center gap-1.5">
                  <button id="vc-ctrl-brake" type="button"
                    class="game-ctrl-btn px-2.5 py-2.5 rounded-xl bg-red-600/75 border border-red-300/80 text-white font-hud font-bold text-[10px] uppercase cursor-pointer">
                    🛑 Frear
                  </button>
                  <button id="vc-ctrl-accel" type="button"
                    class="game-ctrl-btn px-3 py-2.5 rounded-xl bg-gradient-to-r from-[#FF2A85] to-[#FF7B54] border border-pink-300 text-white font-hud font-bold text-[10px] uppercase shadow-[0_0_14px_rgba(255,42,133,0.5)] cursor-pointer">
                    ⚡ Acelerar
                  </button>
                </div>
              </div>
            </div>

            <!-- Frase de Objetivo -->
            <div class="text-center">
              <span class="inline-block px-3 py-0.5 rounded-full bg-black/70 border border-white/10 font-hud text-[10px] sm:text-xs text-purple-100">
                ${esc(cfg.gameObjective || 'Leve a crew até a festa')}
              </span>
            </div>
          </div>

          <!-- OVERLAY DE RESULTADO (VITÓRIA OU DERROTA) -->
          <div id="vc-result-overlay" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center text-center p-5 bg-black/55 backdrop-blur-[2px]">
            <div id="vc-result-card" class="w-full max-w-xs space-y-3 animate-mission-zoom"></div>
          </div>
        </div>
      `;

      const canvas = container.querySelector('#vc-game-canvas');
      const ctx = canvas.getContext('2d');
      const elLives = container.querySelector('#vc-hud-lives');
      const elStars = container.querySelector('#vc-hud-stars');
      const elCash = container.querySelector('#vc-hud-cash');
      const elSpeed = container.querySelector('#vc-hud-speed');
      const elProg = container.querySelector('#vc-hud-prog');
      const elPct = container.querySelector('#vc-hud-pct');
      const elMapPlayer = container.querySelector('#vc-map-player');
      const elDamageFlash = container.querySelector('#vc-damage-flash');
      const elBridgeAlert = container.querySelector('#vc-bridge-alert');
      const elFloatMsg = container.querySelector('#vc-float-msg');
      const elHudBottom = container.querySelector('#vc-hud-bottom');
      const elResultOverlay = container.querySelector('#vc-result-overlay');
      const elResultCard = container.querySelector('#vc-result-card');

      // Carrega PNG personalizado do carro se informado
      let customCarImg = null;
      const carSrc = cfg.gameCarData || cfg.gameCarUrl;
      if (carSrc) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { customCarImg = img; };
        img.src = carSrc;
      }

      // Controles ativos
      const keys = { left: false, right: false, accel: false, brake: false };
      let rafId = null;
      let destroyed = false;
      let lastTime = performance.now();

      // Estado da corrida
      let g = {};
      function resetGame() {
        canvas.style.filter = 'none';
        elResultOverlay.classList.add('hidden');
        elHudBottom.classList.remove('hidden');
        elBridgeAlert.classList.add('hidden');

        g = {
          status: 'playing', // 'playing' | 'won' | 'lost'
          dist: 0,
          speed: 95,
          playerX: 0,        // -1 (faixa esq) a +1 (faixa dir)
          steerTilt: 0,
          jumpY: 0,          // altura do salto (0 = chão)
          jumpVy: 0,
          lives: 3,
          stars: 1,
          cash: 0,
          dodges: 0,
          invuln: 0,
          shake: 0,
          roadOffset: 0,
          spawnTimer: 0.9,
          obstacles: [],
          fireworks: [],
          bridgesTriggered: { b1: false, b2: false },
          failReason: ''
        };
        updateHUD();
      }

      function triggerFloatMsg(text, colorCls) {
        elFloatMsg.textContent = text;
        elFloatMsg.className = `pointer-events-none absolute top-[32%] left-1/2 -translate-x-1/2 z-20 font-gta text-lg sm:text-2xl ${colorCls || 'text-emerald-300'} opacity-100 -translate-y-2 transition-all duration-300 drop-shadow-[0_3px_0_#000]`;
        setTimeout(() => {
          if (destroyed) return;
          elFloatMsg.classList.remove('opacity-100', '-translate-y-2');
          elFloatMsg.classList.add('opacity-0', 'translate-y-0');
        }, 700);
      }

      function doJump() {
        if (g.status !== 'playing') return;
        if (g.jumpY <= 0.01) {
          g.jumpVy = 2.65;
          if (callbacks && callbacks.onSFX) callbacks.onSFX('jump');
        }
      }

      function updateHUD() {
        const hearts = '❤️'.repeat(Math.max(0, g.lives)) + '🖤'.repeat(Math.max(0, 3 - g.lives));
        elLives.textContent = hearts;
        const st = Math.min(5, Math.max(1, g.stars));
        elStars.textContent = '★'.repeat(st) + '☆'.repeat(5 - st);
        elCash.textContent = '$' + g.cash.toLocaleString('pt-BR');
        elSpeed.textContent = Math.round(g.speed);
        const pct = Math.min(100, Math.round((g.dist / diff.totalDist) * 100));
        elProg.style.width = pct + '%';
        elPct.textContent = pct + '% até a festa';
        // Atualiza posição do triângulo no minimapa
        const mapY = 10 + (pct / 100) * 58;
        elMapPlayer.style.bottom = mapY + '%';
        elMapPlayer.style.left = (50 + g.playerX * 16) + '%';
      }

      function resizeCanvas() {
        if (destroyed) return;
        const rect = container.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // Bind de Botões na Tela (Touch + Mouse)
      function bindHoldBtn(selector, keyName) {
        const btn = container.querySelector(selector);
        if (!btn) return;
        const onDown = (e) => {
          e.preventDefault();
          keys[keyName] = true;
          btn.classList.add('is-pressed');
        };
        const onUp = (e) => {
          e.preventDefault();
          keys[keyName] = false;
          btn.classList.remove('is-pressed');
        };
        btn.addEventListener('pointerdown', onDown);
        btn.addEventListener('pointerup', onUp);
        btn.addEventListener('pointerleave', onUp);
        btn.addEventListener('pointercancel', onUp);
      }

      bindHoldBtn('#vc-ctrl-left', 'left');
      bindHoldBtn('#vc-ctrl-right', 'right');
      bindHoldBtn('#vc-ctrl-accel', 'accel');
      bindHoldBtn('#vc-ctrl-brake', 'brake');

      const jumpBtn = container.querySelector('#vc-ctrl-jump');
      if (jumpBtn) {
        jumpBtn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          jumpBtn.classList.add('is-pressed');
          doJump();
        });
        jumpBtn.addEventListener('pointerup', () => jumpBtn.classList.remove('is-pressed'));
        jumpBtn.addEventListener('pointerleave', () => jumpBtn.classList.remove('is-pressed'));
      }

      const skipBtn = container.querySelector('#vc-btn-skip');
      if (skipBtn) {
        skipBtn.addEventListener('click', () => {
          if (callbacks && callbacks.onOpenInvite) callbacks.onOpenInvite();
        });
      }

      // Teclado Desktop (Setas / WASD / Espaço)
      function onKeyDown(e) {
        if (destroyed) return;
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; }
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { keys.accel = true; }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.brake = true; }
        if (e.code === 'Space') { e.preventDefault(); doJump(); }
      }
      function onKeyUp(e) {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = false; }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = false; }
        if (e.code === 'ArrowUp' || e.code === 'KeyW') { keys.accel = false; }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') { keys.brake = false; }
      }
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('resize', resizeCanvas);

      // Finaliza com Vitória ou Derrota
      function finishGame(won) {
        g.status = won ? 'won' : 'lost';
        elBridgeAlert.classList.add('hidden');
        elHudBottom.classList.add('hidden');
        elResultOverlay.classList.remove('hidden');

        if (won) {
          if (callbacks && callbacks.onSFX) callbacks.onSFX('mission');
          // Inicia fogos de artifício no Canvas
          for (let i = 0; i < 4; i++) spawnFirework();
          elResultCard.innerHTML = `
            <div class="py-4 px-4 rounded-2xl bg-black/75 backdrop-blur-md border-y-2 border-yellow-400 shadow-[0_0_30px_rgba(255,183,3,0.4)] space-y-2">
              <h2 class="mission-passed-text text-3xl sm:text-4xl uppercase leading-none">${esc(cfg.gameWinTitle || 'MISSÃO CUMPRIDA')}</h2>
              <p class="text-xs text-purple-100 leading-snug">${esc(cfg.gameWinSub || 'Você chegou com estilo!')}</p>
              <div class="flex items-center justify-center gap-3 text-[11px] font-hud text-yellow-300 pt-1">
                <span>🚗 Desvios: <strong>${g.dodges}</strong></span>
                <span>💵 <strong>$${g.cash.toLocaleString('pt-BR')}</strong></span>
              </div>
              <div class="inline-block px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/60 text-emerald-300 font-hud font-bold text-xs">
                + Convite desbloqueado
              </div>
            </div>
            <button id="vc-res-open" type="button"
              class="w-full py-3.5 px-5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:brightness-110 text-black font-hud font-bold text-sm uppercase tracking-wider shadow-lg shadow-emerald-500/40 cursor-pointer transition">
              🎉 Abrir Convite
            </button>
          `;
        } else {
          if (callbacks && callbacks.onSFX) callbacks.onSFX('fail');
          canvas.style.filter = 'grayscale(100%) brightness(0.45) contrast(1.2)';
          elResultCard.innerHTML = `
            <div class="py-4 px-4 rounded-2xl bg-black/80 backdrop-blur-md border-y-2 border-red-500 shadow-[0_0_30px_rgba(239,68,68,0.45)] space-y-2">
              <h2 class="mission-failed-text text-3xl sm:text-4xl uppercase leading-none">${esc(cfg.gameLoseTitle || 'MISSÃO FALHOU')}</h2>
              <p class="text-xs text-gray-200 leading-snug">${esc(cfg.gameLoseSub || 'O difícil é difícil mesmo. Mas relaxa, o convite é seu.')}</p>
              <div class="text-[11px] font-hud text-red-300">
                ${g.failReason ? esc(g.failReason) + ' • ' : ''}Desvios: <strong>${g.dodges}</strong>
              </div>
              <div class="inline-block px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 font-hud font-bold text-xs">
                + Convite desbloqueado
              </div>
            </div>
            <div class="space-y-2">
              <button id="vc-res-open" type="button"
                class="w-full py-3 px-5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:brightness-110 text-black font-hud font-bold text-xs sm:text-sm uppercase tracking-wider shadow-lg cursor-pointer transition">
                🎉 Abrir Convite
              </button>
              <button id="vc-res-retry" type="button"
                class="w-full py-2.5 px-4 rounded-xl bg-white/15 hover:bg-white/25 border border-white/25 text-white font-hud font-bold text-xs uppercase tracking-wider cursor-pointer transition">
                ↺ Tentar de Novo
              </button>
            </div>
          `;
        }

        const btnOpen = elResultCard.querySelector('#vc-res-open');
        if (btnOpen) btnOpen.onclick = () => { if (callbacks && callbacks.onOpenInvite) callbacks.onOpenInvite(); };
        const btnRetry = elResultCard.querySelector('#vc-res-retry');
        if (btnRetry) btnRetry.onclick = () => { resetGame(); };
      }

      function spawnFirework() {
        const w = canvas.clientWidth || 340;
        const h = canvas.clientHeight || 600;
        const cx = w * (0.2 + Math.random() * 0.6);
        const cy = h * (0.14 + Math.random() * 0.25);
        const palette = ['#FF2A85', '#00F0FF', '#FFB703', '#34D399', '#FFFFFF'];
        const color = palette[Math.floor(Math.random() * palette.length)];
        const parts = [];
        for (let i = 0; i < 24; i++) {
          const ang = (Math.PI * 2 * i) / 24;
          const spd = 40 + Math.random() * 90;
          parts.push({ x: cx, y: cy, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 1, color });
        }
        g.fireworks.push(parts);
      }

      // Geração de Obstáculos & Moedas
      function spawnEntity() {
        const lanes = [-0.68, 0, 0.68];
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        const roll = Math.random();
        let kind = 'car';
        if (roll < 0.28) kind = 'cash';
        else if (roll < 0.56) kind = 'police';
        else if (roll < 0.75) kind = 'barrier';
        g.obstacles.push({
          kind,
          lane,
          z: 1.0, // 1.0 = horizonte, 0.0 = linha do jogador
          passed: false,
          color: ['#00F0FF', '#FF7B54', '#A855F7', '#FACC15'][Math.floor(Math.random() * 4)]
        });
      }

      // Atualização Física (60fps independente de taxa)
      function update(dt) {
        if (g.status === 'won') {
          if (Math.random() < dt * 2.2) spawnFirework();
          g.fireworks.forEach((fw) => {
            fw.forEach((p) => {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy += 65 * dt;
              p.life -= dt * 0.85;
            });
          });
          g.fireworks = g.fireworks.filter((fw) => fw[0] && fw[0].life > 0);
          return;
        }
        if (g.status !== 'playing') return;

        // Velocidade (Cruzeiro ~95, Acelerar ~220, Frear ~45)
        let targetSpeed = 95;
        if (keys.accel) targetSpeed = 220;
        else if (keys.brake) targetSpeed = 45;
        g.speed += (targetSpeed - g.speed) * Math.min(1, dt * 4.5);

        // Movimento lateral fluido
        const steerSpeed = 2.15;
        let steerDir = 0;
        if (keys.left) steerDir -= 1;
        if (keys.right) steerDir += 1;
        g.playerX += steerDir * steerSpeed * dt;
        g.playerX = Math.max(-0.88, Math.min(0.88, g.playerX));
        g.steerTilt += (steerDir * 0.14 - g.steerTilt) * Math.min(1, dt * 10);

        // Física de Salto Parabólico
        if (g.jumpY > 0 || g.jumpVy > 0) {
          g.jumpY += g.jumpVy * dt;
          g.jumpVy -= 7.2 * dt;
          if (g.jumpY <= 0) {
            g.jumpY = 0;
            g.jumpVy = 0;
          }
        }

        if (g.invuln > 0) g.invuln -= dt;
        if (g.shake > 0) g.shake = Math.max(0, g.shake - dt * 18);

        // Avanço na pista
        const forward = (g.speed * diff.speedMult) * dt * 0.72;
        g.dist += forward;
        g.roadOffset = (g.roadOffset + forward * 0.045) % 1;

        // Marcos da Ponte Levadiça (~42% e ~78%)
        const pct = g.dist / diff.totalDist;
        if (!g.bridgesTriggered.b1 && pct >= 0.40) {
          g.bridgesTriggered.b1 = true;
          g.obstacles.push({ kind: 'bridge', lane: 0, z: 1.0, passed: false });
        }
        if (!g.bridgesTriggered.b2 && pct >= 0.76) {
          g.bridgesTriggered.b2 = true;
          g.obstacles.push({ kind: 'bridge', lane: 0, z: 1.0, passed: false });
        }

        // Spawn normal (pausa se ponte estiver vindo)
        const hasBridgeAhead = g.obstacles.some((o) => o.kind === 'bridge' && o.z > 0.02);
        elBridgeAlert.classList.toggle('hidden', !hasBridgeAhead);

        g.spawnTimer -= dt;
        if (g.spawnTimer <= 0 && !hasBridgeAhead && pct < 0.94) {
          spawnEntity();
          g.spawnTimer = diff.spawnRate * (0.75 + Math.random() * 0.5);
        }

        // Atualiza obstáculos e colisões
        const zSpeed = (g.speed / 135) * diff.speedMult * 0.62;
        for (let i = g.obstacles.length - 1; i >= 0; i--) {
          const ob = g.obstacles[i];
          ob.z -= zSpeed * dt;

          // Zona de colisão próxima ao carro (z entre 0.04 e 0.14)
          if (!ob.passed && ob.z <= 0.13 && ob.z >= 0.02) {
            if (ob.kind === 'bridge') {
              if (g.jumpY > 0.12) {
                ob.passed = true;
                g.cash += 300;
                g.dodges += 1;
                triggerFloatMsg('SALTO ÉPICO! +$300', 'text-yellow-300');
                if (callbacks && callbacks.onSFX) callbacks.onSFX('cash');
              } else if (ob.z <= 0.07) {
                ob.passed = true;
                g.failReason = 'Você caiu da ponte levadiça!';
                finishGame(false);
                return;
              }
            } else if (ob.kind === 'cash') {
              if (Math.abs(ob.lane - g.playerX) < 0.36) {
                ob.passed = true;
                g.cash += 250;
                triggerFloatMsg('+$250', 'text-emerald-300');
                if (callbacks && callbacks.onSFX) callbacks.onSFX('cash');
                g.obstacles.splice(i, 1);
                continue;
              }
            } else {
              // Obstáculo sólido (viatura, carro, bloqueio)
              if (g.jumpY < 0.18 && Math.abs(ob.lane - g.playerX) < 0.30 && g.invuln <= 0) {
                ob.passed = true;
                g.lives -= 1;
                g.stars = Math.min(5, g.stars + 1);
                g.invuln = 1.3;
                g.shake = 10;
                g.speed = Math.max(50, g.speed * 0.55);
                if (callbacks && callbacks.onSFX) callbacks.onSFX('hit');
                elDamageFlash.classList.replace('bg-red-600/0', 'bg-red-600/45');
                setTimeout(() => {
                  if (!destroyed) elDamageFlash.classList.replace('bg-red-600/45', 'bg-red-600/0');
                }, 180);

                if (g.lives <= 0) {
                  g.failReason = 'A polícia te cercou!';
                  finishGame(false);
                  return;
                }
              }
            }
          }

          if (!ob.passed && ob.z < 0.02) {
            ob.passed = true;
            if (ob.kind !== 'cash') {
              g.dodges += 1;
              g.cash += 50;
            }
          }

          if (ob.z < -0.18) {
            g.obstacles.splice(i, 1);
          }
        }

        // Verifica vitória (100%)
        if (g.dist >= diff.totalDist) {
          g.dist = diff.totalDist;
          updateHUD();
          finishGame(true);
          return;
        }

        updateHUD();
      }

      // ---------------------------------------------------------
      // RENDERIZAÇÃO 3D OUTRUN / VICE CITY NO CANVAS
      // ---------------------------------------------------------
      function draw(now) {
        const w = canvas.clientWidth || 360;
        const h = canvas.clientHeight || 640;
        const horizonY = h * 0.38;

        ctx.save();
        if (g.shake > 0) {
          ctx.translate((Math.random() - 0.5) * g.shake, (Math.random() - 0.5) * g.shake);
        }

        // 1. Céu Pôr do Sol Neon
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0, '#130724');
        skyGrad.addColorStop(0.42, '#4A154B');
        skyGrad.addColorStop(0.78, '#FF2A85');
        skyGrad.addColorStop(1, '#FF7B54');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, horizonY + 2);

        // 2. Sol Listrado Retrowave
        const sunR = Math.min(w, h) * 0.14;
        const sunX = w * 0.5;
        const sunY = horizonY - sunR * 0.35;
        ctx.save();
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
        ctx.clip();
        const sunGrad = ctx.createLinearGradient(sunX, sunY - sunR, sunX, sunY + sunR);
        sunGrad.addColorStop(0, '#FFF3B0');
        sunGrad.addColorStop(0.5, '#FF9F1C');
        sunGrad.addColorStop(1, '#FF2A85');
        ctx.fillStyle = sunGrad;
        ctx.fillRect(sunX - sunR, sunY - sunR, sunR * 2, sunR * 2);
        ctx.fillStyle = '#4A154B';
        for (let sy = sunY + 4; sy < sunY + sunR; sy += 9) {
          ctx.fillRect(sunX - sunR, sy, sunR * 2, 3);
        }
        ctx.restore();

        // 3. Skyline de Arranha-Céus
        ctx.fillStyle = '#140826';
        const bCount = 14;
        const bw = w / bCount;
        for (let i = 0; i < bCount; i++) {
          const bh = 20 + ((i * 37) % 52);
          ctx.fillRect(i * bw, horizonY - bh, bw + 1, bh + 2);
          ctx.fillStyle = i % 2 === 0 ? 'rgba(0,240,255,0.45)' : 'rgba(255,42,133,0.45)';
          ctx.fillRect(i * bw + bw * 0.3, horizonY - bh + 6, bw * 0.25, bh * 0.45);
          ctx.fillStyle = '#140826';
        }

        // 4. Chão Lateral (Orla / Gramado Neon Escuro)
        const groundGrad = ctx.createLinearGradient(0, horizonY, 0, h);
        groundGrad.addColorStop(0, '#1B0B2E');
        groundGrad.addColorStop(1, '#090612');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, horizonY, w, h - horizonY);

        // 5. Pista em Perspectiva Trapezoidal
        const roadTopW = w * 0.14;
        const roadBotW = w * 0.94;
        const centerX = w * 0.5 - g.playerX * (w * 0.08);

        ctx.beginPath();
        ctx.moveTo(centerX - roadTopW * 0.5, horizonY);
        ctx.lineTo(centerX + roadTopW * 0.5, horizonY);
        ctx.lineTo(centerX + roadBotW * 0.5, h);
        ctx.lineTo(centerX - roadBotW * 0.5, h);
        ctx.closePath();
        const roadGrad = ctx.createLinearGradient(0, horizonY, 0, h);
        roadGrad.addColorStop(0, '#1B112B');
        roadGrad.addColorStop(0.5, '#151221');
        roadGrad.addColorStop(1, '#0E0C18');
        ctx.fillStyle = roadGrad;
        ctx.fill();

        // Reflexos Molhados Neon no Asfalto
        const stripes = 14;
        for (let s = 0; s < stripes; s++) {
          const t1 = ((s + g.roadOffset) / stripes);
          const t2 = Math.min(1, ((s + 0.55 + g.roadOffset) / stripes));
          const p1 = t1 * t1;
          const p2 = t2 * t2;
          const y1 = horizonY + p1 * (h - horizonY);
          const y2 = horizonY + p2 * (h - horizonY);
          const rw1 = roadTopW + p1 * (roadBotW - roadTopW);
          const rw2 = roadTopW + p2 * (roadBotW - roadTopW);

          // Guias laterais neon alternadas (Rosa / Ciano)
          ctx.fillStyle = s % 2 === 0 ? '#FF2A85' : '#00F0FF';
          const curb1 = Math.max(2, rw1 * 0.035);
          const curb2 = Math.max(3, rw2 * 0.035);
          // Esquerda
          ctx.beginPath();
          ctx.moveTo(centerX - rw1 * 0.5 - curb1, y1);
          ctx.lineTo(centerX - rw1 * 0.5, y1);
          ctx.lineTo(centerX - rw2 * 0.5, y2);
          ctx.lineTo(centerX - rw2 * 0.5 - curb2, y2);
          ctx.fill();
          // Direita
          ctx.beginPath();
          ctx.moveTo(centerX + rw1 * 0.5, y1);
          ctx.lineTo(centerX + rw1 * 0.5 + curb1, y1);
          ctx.lineTo(centerX + rw2 * 0.5 + curb2, y2);
          ctx.lineTo(centerX + rw2 * 0.5, y2);
          ctx.fill();

          // Reflexo úmido na pista
          ctx.fillStyle = s % 2 === 0 ? 'rgba(255,42,133,0.10)' : 'rgba(0,240,255,0.08)';
          ctx.beginPath();
          ctx.moveTo(centerX - rw1 * 0.45, y1);
          ctx.lineTo(centerX + rw1 * 0.45, y1);
          ctx.lineTo(centerX + rw2 * 0.45, y2);
          ctx.lineTo(centerX - rw2 * 0.45, y2);
          ctx.fill();

          // Divisórias das 3 faixas
          if (s % 2 === 0) {
            ctx.strokeStyle = 'rgba(255,255,255,0.45)';
            ctx.lineWidth = Math.max(1.2, p2 * 4);
            [-0.166, 0.166].forEach((offset) => {
              ctx.beginPath();
              ctx.moveTo(centerX + rw1 * offset, y1);
              ctx.lineTo(centerX + rw2 * offset, y2);
              ctx.stroke();
            });
          }

          // Palmeiras e Postes Neon Laterais
          if (s % 2 === 1 && p1 > 0.03) {
            const treeScale = 0.25 + p1 * 1.15;
            drawPalmTree(centerX - rw1 * 0.62 - 14 * treeScale, y1, treeScale, -1);
            drawPalmTree(centerX + rw1 * 0.62 + 14 * treeScale, y1, treeScale, 1);
          }
        }

        // Helper para projeção de Z (1 = horizonte, 0 = base)
        function project(lane, z) {
          const depth = Math.max(0, 1 - z);
          const p = depth * depth;
          const y = horizonY + p * (h - horizonY);
          const rw = roadTopW + p * (roadBotW - roadTopW);
          const x = centerX + lane * (rw * 0.34);
          return { x, y, rw, scale: 0.18 + p * 0.95 };
        }

        // 6. Desenha Obstáculos e Pontes (do mais distante para o mais próximo)
        const sortedObs = [...g.obstacles].sort((a, b) => b.z - a.z);
        sortedObs.forEach((ob) => {
          if (ob.z > 1 || ob.z < -0.1) return;
          const proj = project(ob.lane, ob.z);

          if (ob.kind === 'bridge') {
            // Lacuna de água neon + Rampa amarela de salto
            const gapH = Math.max(12, proj.scale * diff.bridgeGap);
            ctx.fillStyle = '#062847';
            ctx.fillRect(centerX - proj.rw * 0.52, proj.y - gapH * 0.6, proj.rw * 1.04, gapH);
            ctx.fillStyle = 'rgba(0,240,255,0.45)';
            ctx.fillRect(centerX - proj.rw * 0.48, proj.y - gapH * 0.3, proj.rw * 0.96, gapH * 0.15);

            // Rampa brilhante na borda inferior
            const rampGrad = ctx.createLinearGradient(0, proj.y, 0, proj.y + gapH * 0.45);
            rampGrad.addColorStop(0, '#FACC15');
            rampGrad.addColorStop(1, '#FF7B54');
            ctx.fillStyle = rampGrad;
            ctx.fillRect(centerX - proj.rw * 0.5, proj.y + gapH * 0.25, proj.rw, Math.max(6, gapH * 0.32));
          } else if (ob.kind === 'cash') {
            const r = 16 * proj.scale;
            ctx.save();
            ctx.translate(proj.x, proj.y - r * 1.4 - Math.sin(now * 0.008) * 4);
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = '#10B981';
            ctx.shadowColor = '#34D399';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.lineWidth = Math.max(1.5, 2.5 * proj.scale);
            ctx.strokeStyle = '#FEF08A';
            ctx.stroke();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `bold ${Math.max(10, Math.round(r * 1.25))}px "Chakra Petch", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 1);
            ctx.restore();
          } else if (ob.kind === 'barrier') {
            const bw2 = 54 * proj.scale;
            const bh2 = 22 * proj.scale;
            ctx.save();
            ctx.translate(proj.x, proj.y);
            ctx.fillStyle = '#1F1630';
            ctx.fillRect(-bw2 / 2, -bh2, bw2, bh2);
            ctx.fillStyle = '#FF2A85';
            ctx.fillRect(-bw2 / 2, -bh2, bw2, bh2 * 0.35);
            ctx.fillStyle = '#FACC15';
            for (let bx = -bw2 / 2 + 4; bx < bw2 / 2 - 4; bx += 14 * proj.scale) {
              ctx.fillRect(bx, -bh2 + 2, 6 * proj.scale, bh2 * 0.35 - 4);
            }
            ctx.restore();
          } else {
            // Viatura Policial ou Carro de Trânsito
            drawTrafficCar(proj.x, proj.y, proj.scale, ob.kind === 'police', ob.color, now);
          }
        });

        // 7. Linhas de Velocidade ao Acelerar (Nitro)
        if (g.speed > 155 && g.status === 'playing') {
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
          ctx.lineWidth = 2;
          for (let l = 0; l < 8; l++) {
            const lx = (l < 4 ? w * 0.08 * (l + 1) : w - w * 0.08 * (l - 3));
            const ly = ((now * 0.8 + l * 95) % (h - horizonY)) + horizonY;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx + (lx < w / 2 ? -12 : 12), ly + 42);
            ctx.stroke();
          }
        }

        // 8. Carro do Jogador
        const playerProj = project(g.playerX, 0.08);
        const blinkSkip = g.invuln > 0 && Math.floor(now / 80) % 2 === 0;
        if (!blinkSkip) {
          drawPlayerCar(playerProj.x, playerProj.y, Math.min(w / 340, 1.35), now);
        }

        // 9. Fogos de Artifício na Vitória
        if (g.status === 'won') {
          g.fireworks.forEach((fw) => {
            fw.forEach((p) => {
              ctx.globalAlpha = Math.max(0, p.life);
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
              ctx.fill();
            });
          });
          ctx.globalAlpha = 1;
        }

        ctx.restore();
      }

      function drawPalmTree(x, y, s, side) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s * side, s);
        ctx.fillStyle = '#090412';
        ctx.beginPath();
        ctx.moveTo(-3, 0);
        ctx.quadraticCurveTo(6, -34, 12, -62);
        ctx.lineTo(16, -60);
        ctx.quadraticCurveTo(10, -32, 3, 0);
        ctx.fill();
        // Folhas
        ctx.beginPath();
        ctx.moveTo(14, -61);
        ctx.quadraticCurveTo(-8, -72, -18, -56);
        ctx.quadraticCurveTo(-4, -62, 14, -58);
        ctx.moveTo(14, -61);
        ctx.quadraticCurveTo(28, -76, 40, -60);
        ctx.quadraticCurveTo(26, -64, 14, -58);
        ctx.moveTo(14, -61);
        ctx.quadraticCurveTo(12, -84, -4, -84);
        ctx.quadraticCurveTo(10, -72, 14, -58);
        ctx.fill();
        ctx.restore();
      }

      function drawTrafficCar(x, y, s, isPolice, color, now) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        // Sombra
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.ellipse(0, 2, 36, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        // Rodas
        ctx.fillStyle = '#09090B';
        ctx.fillRect(-32, -12, 10, 14);
        ctx.fillRect(22, -12, 10, 14);
        // Carroceria
        ctx.fillStyle = isPolice ? '#1E293B' : color;
        ctx.beginPath();
        ctx.roundRect(-34, -28, 68, 22, 6);
        ctx.fill();
        // Cabine
        ctx.fillStyle = isPolice ? '#F8FAFC' : '#1E1B4B';
        ctx.beginPath();
        ctx.roundRect(-22, -44, 44, 18, 5);
        ctx.fill();
        // Vidro
        ctx.fillStyle = '#0F172A';
        ctx.fillRect(-18, -41, 36, 12);
        // Lanternas
        ctx.fillStyle = '#EF4444';
        ctx.fillRect(-30, -22, 14, 5);
        ctx.fillRect(16, -22, 14, 5);
        // Giroflex Policial
        if (isPolice) {
          const flash = Math.floor(now / 120) % 2 === 0;
          ctx.fillStyle = flash ? '#EF4444' : '#3B82F6';
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 14;
          ctx.fillRect(-10, -49, 10, 5);
          ctx.fillStyle = flash ? '#3B82F6' : '#EF4444';
          ctx.shadowColor = ctx.fillStyle;
          ctx.fillRect(0, -49, 10, 5);
          ctx.shadowBlur = 0;
        }
        ctx.restore();
      }

      function drawPlayerCar(x, y, baseScale, now) {
        const jumpLift = g.jumpY * 145;
        const jumpScale = 1 + g.jumpY * 0.45;

        // Sombra no chão (diminui conforme sobe)
        ctx.save();
        ctx.translate(x, y + 6);
        const shScale = Math.max(0.45, 1 - g.jumpY * 0.55) * baseScale;
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 52 * shScale, 13 * shScale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(x, y - jumpLift);
        ctx.rotate(g.steerTilt);
        ctx.scale(baseScale * jumpScale, baseScale * jumpScale);

        // Chamas Azuis de Nitro ao Acelerar
        if (keys.accel && g.status === 'playing') {
          const fLen = 14 + Math.sin(now * 0.05) * 8;
          [-22, 22].forEach((ex) => {
            ctx.fillStyle = '#00F0FF';
            ctx.shadowColor = '#00F0FF';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.moveTo(ex - 5, -2);
            ctx.lineTo(ex + 5, -2);
            ctx.lineTo(ex, fLen);
            ctx.closePath();
            ctx.fill();
          });
          ctx.shadowBlur = 0;
        }

        if (customCarImg) {
          const cw = 112;
          const ch = (customCarImg.height / customCarImg.width) * cw;
          ctx.drawImage(customCarImg, -cw / 2, -ch + 8, cw, ch);
        } else {
          // Esportivo Retrô Anos 80 (Estilo DeLorean / Testarossa)
          // Rodas
          ctx.fillStyle = '#09090B';
          ctx.fillRect(-46, -15, 14, 18);
          ctx.fillRect(32, -15, 14, 18);

          // Corpo inferior metálico
          const bodyGrad = ctx.createLinearGradient(0, -40, 0, -4);
          bodyGrad.addColorStop(0, '#E2E8F0');
          bodyGrad.addColorStop(0.5, '#94A3B8');
          bodyGrad.addColorStop(1, '#334155');
          ctx.fillStyle = bodyGrad;
          ctx.beginPath();
          ctx.moveTo(-48, -10);
          ctx.lineTo(-44, -34);
          ctx.lineTo(44, -34);
          ctx.lineTo(48, -10);
          ctx.closePath();
          ctx.fill();

          // Teto / Cabine Traseira
          ctx.fillStyle = '#CBD5E1';
          ctx.beginPath();
          ctx.moveTo(-34, -34);
          ctx.lineTo(-24, -52);
          ctx.lineTo(24, -52);
          ctx.lineTo(34, -34);
          ctx.closePath();
          ctx.fill();

          // Vidro traseiro com venezianas pretas
          ctx.fillStyle = '#0F172A';
          ctx.beginPath();
          ctx.moveTo(-28, -35);
          ctx.lineTo(-20, -49);
          ctx.lineTo(20, -49);
          ctx.lineTo(28, -35);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 1.6;
          for (let ly = -46; ly <= -37; ly += 3) {
            ctx.beginPath();
            ctx.moveTo(-23, ly);
            ctx.lineTo(23, ly);
            ctx.stroke();
          }

          // Aerofólio Neon
          ctx.fillStyle = '#1E1B4B';
          ctx.fillRect(-45, -36, 90, 4);
          ctx.fillStyle = '#FF2A85';
          ctx.fillRect(-44, -35, 88, 1.5);

          // Painel traseiro escuro + Lanternas Vermelhas Horizontais
          ctx.fillStyle = '#111827';
          ctx.fillRect(-43, -29, 86, 13);

          const brakeBoost = keys.brake ? 26 : 12;
          ctx.fillStyle = keys.brake ? '#FF3B3B' : '#EF4444';
          ctx.shadowColor = '#FF1E42';
          ctx.shadowBlur = brakeBoost;
          // Listras de lanterna esquerda e direita
          ctx.fillRect(-41, -27, 25, 3);
          ctx.fillRect(-41, -22, 25, 3);
          ctx.fillRect(16, -27, 25, 3);
          ctx.fillRect(16, -22, 25, 3);
          ctx.shadowBlur = 0;

          // Placa Neon "VICE"
          ctx.fillStyle = '#0D0B14';
          ctx.fillRect(-12, -26, 24, 9);
          ctx.strokeStyle = '#00F0FF';
          ctx.lineWidth = 1;
          ctx.strokeRect(-12, -26, 24, 9);
          ctx.fillStyle = '#00F0FF';
          ctx.font = 'bold 6px "Chakra Petch", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('VICE', 0, -19.5);
        }

        ctx.restore();
      }

      // Loop 60 FPS
      function loop(now) {
        if (destroyed) return;
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        draw(now);
        rafId = requestAnimationFrame(loop);
      }

      resizeCanvas();
      resetGame();
      lastTime = performance.now();
      rafId = requestAnimationFrame(loop);

      return {
        destroy() {
          destroyed = true;
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);
          window.removeEventListener('resize', resizeCanvas);
        }
      };
    }
    function createViceCityQTEGame(container, cfg, callbacks) {
      'use strict';

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      const defaultCommands = [
        { start: 3.5, end: 5.8, type: 'left', text: 'Bloqueio policial! Aperte X (Esquerda)!' },
        { start: 7.2, end: 9.2, type: 'right', text: 'Trânsito na contramão! Aperte B (Direita)!' },
        { start: 9.6, end: 11.8, type: 'nitro', text: 'Reta livre! Dê 2× cliques em A para o Nitro!' },
        { start: 12.4, end: 14.2, type: 'final', text: 'Galpão à vista! Dê 3× cliques em A para o Turbo!' }
      ];

      const commands = (Array.isArray(cfg.qteCommands) && cfg.qteCommands.length === 4)
        ? cfg.qteCommands.map((c, idx) => ({
            start: Number(c.start) || defaultCommands[idx].start,
            end: Number(c.end) || defaultCommands[idx].end,
            type: c.type || defaultCommands[idx].type,
            text: c.text || defaultCommands[idx].text
          }))
        : defaultCommands;

      const metaByType = {
        left:  { icon: 'X', badge: 'APERTE X • ESQUERDA', border: 'border-sky-400', bg: 'from-[#0C254A]/95 to-[#2563EB]/85', glow: 'rgba(56,189,248,0.8)', btnId: '#qte-btn-x' },

      const mediaWrap = container.querySelector('#qte-media-wrap');

      const allHighlightable = [btnA, btnB, btnX, btnY];

      let destroyed = false;
      let rafId = null;
      let lastFrame = performance.now();
      let simTime = 0;
      let roadOffset = 0;
      let activeIdx = -1;
      let finished = false;
      let hits = 0;
      let stars = 1;
      let cash = 0;
      let currentSpeed = 0;
      let boostTimer = 0;

      let cmdStatus = commands.map(() => 'pending');

      function clearQteHighlights() {
        allHighlightable.forEach((b) => { if (b) b.classList.remove('qte-highlight'); });
      }

      function resizeSim() {
        if (!simCanvas || destroyed) return;
        const rect = container.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        simCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
        simCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
        simCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function drawSimRoad(dt, t, advancingRate) {
        if (!simCtx || !simCanvas) return;
        const w = simCanvas.clientWidth || 360;
        const h = simCanvas.clientHeight || 640;
        const horizonY = h * 0.38;
        if (advancingRate > 0) {
          roadOffset = (roadOffset + (Math.max(25, currentSpeed) / 68) * advancingRate * dt) % 1;
        }

        const sky = simCtx.createLinearGradient(0, 0, 0, horizonY);
        sky.addColorStop(0, '#130724');
        sky.addColorStop(0.5, '#4A154B');
        sky.addColorStop(0.85, '#FF2A85');
        sky.addColorStop(1, '#FF7B54');
        simCtx.fillStyle = sky;
        simCtx.fillRect(0, 0, w, horizonY + 2);

        const sunR = Math.min(w, h) * 0.13;
        simCtx.save();
        simCtx.beginPath();
        simCtx.arc(w * 0.5, horizonY - sunR * 0.3, sunR, 0, Math.PI * 2);
        simCtx.fillStyle = '#FF9F1C';
        simCtx.fill();
        simCtx.restore();

        simCtx.fillStyle = '#140924';
        simCtx.fillRect(0, horizonY, w, h - horizonY);

        const rwTop = w * 0.14;
        const rwBot = w * 0.96;
        const cx = w * 0.5 + Math.sin(t * 0.9) * (w * 0.04);

        simCtx.beginPath();
        simCtx.moveTo(cx - rwTop * 0.5, horizonY);
        simCtx.lineTo(cx + rwTop * 0.5, horizonY);
        simCtx.lineTo(cx + rwBot * 0.5, h);
        simCtx.lineTo(cx - rwBot * 0.5, h);
        simCtx.closePath();
        simCtx.fillStyle = '#151024';
        simCtx.fill();

        for (let s = 0; s < 14; s++) {
          const p1 = Math.pow((s + roadOffset) / 14, 2);
          const p2 = Math.pow(Math.min(1, (s + 0.5 + roadOffset) / 14), 2);
          const y1 = horizonY + p1 * (h - horizonY);
          const y2 = horizonY + p2 * (h - horizonY);
          const w1 = rwTop + p1 * (rwBot - rwTop);
          const w2 = rwTop + p2 * (rwBot - rwTop);

          simCtx.fillStyle = s % 2 === 0 ? '#FF2A85' : '#00F0FF';
          simCtx.fillRect(cx - w1 * 0.5 - 4, y1, 4, Math.max(2, y2 - y1));
          simCtx.fillRect(cx + w1 * 0.5, y1, 4, Math.max(2, y2 - y1));

          if (s % 2 === 0) {
            simCtx.strokeStyle = 'rgba(255,255,255,0.45)';
            simCtx.lineWidth = Math.max(1.5, p2 * 4);
            simCtx.beginPath();
            simCtx.moveTo(cx, y1);
            simCtx.lineTo(cx, y2);
            simCtx.stroke();
          }
        }
      }

      function showFloat(txt, cls) {
        floatMsg.textContent = txt;
        floatMsg.className = `pointer-events-none absolute top-[38%] left-1/2 -translate-x-1/2 z-30 font-gta text-2xl sm:text-3xl ${cls} opacity-100 -translate-y-3 transition-all duration-300 drop-shadow-[0_3px_0_#000] whitespace-nowrap`;
        setTimeout(() => {
          if (destroyed) return;
          floatMsg.classList.remove('opacity-100', '-translate-y-3');
          floatMsg.classList.add('opacity-0', 'translate-y-0');
        }, 750);
      }

      function updateHUD(t, dur) {
        const st = Math.min(5, Math.max(1, stars));
        elStars.textContent = '★'.repeat(st) + '☆'.repeat(5 - st);
        elCash.textContent = '$' + cash.toLocaleString('pt-BR');
        elSpeed.textContent = Math.round(currentSpeed);
        const pct = Math.min(100, Math.max(0, (t / Math.max(1, dur)) * 100));
        if (topProg) topProg.style.width = pct + '%';
        elTime.textContent = `${t.toFixed(1)}s / ${dur.toFixed(1)}s`;
        elMapPlayer.style.bottom = (10 + (pct / 100) * 58) + '%';
        elMapPlayer.style.left = (50 + mapLaneX * 14) + '%';
      }

      function triggerActionEffect(actionType, fromQteHit) {
        mediaWrap.classList.remove('animate-qte-shake');
        if (actionType === 'left') {
          mapLaneX = -1;
          mediaWrap.style.transform = 'scale(1.06) rotate(-3.5deg) translateX(-10px)';
          if (fromQteHit) showFloat('DESVIO PERFEITO! +$500', 'text-[#00F0FF]');
          setTimeout(() => { if (!destroyed) { mediaWrap.style.transform = ''; mapLaneX = 0; } }, 550);
        } else if (actionType === 'right') {
          mapLaneX = 1;
          mediaWrap.style.transform = 'scale(1.06) rotate(3.5deg) translateX(10px)';
          if (fromQteHit) showFloat('MANOBRA INSANA! +$500', 'text-[#00F0FF]');
          setTimeout(() => { if (!destroyed) { mediaWrap.style.transform = ''; mapLaneX = 0; } }, 550);
        } else if (actionType === 'nitro') {
          boostTimer = 1.4;
          currentSpeed = Math.max(currentSpeed, 210);
          mediaWrap.classList.add('animate-qte-shake');
          speedFx.style.opacity = '1';
          if (fromQteHit) showFloat('NITRO ATIVADO! +$500', 'text-sky-300');
          setTimeout(() => {
            if (!destroyed) {
              mediaWrap.classList.remove('animate-qte-shake');
              speedFx.style.opacity = '0';
            }
          }, 850);
        } else if (actionType === 'final') {
          boostTimer = 1.6;
          currentSpeed = Math.max(currentSpeed, 238);
          mediaWrap.style.transform = 'scale(1.1) translateY(-6px)';
          speedFx.style.opacity = '1';
          if (fromQteHit) showFloat('TURBO FINAL! +$500', 'text-yellow-300');
          setTimeout(() => {
            if (!destroyed) {
              mediaWrap.style.transform = '';
              speedFx.style.opacity = '0';
            }
          }, 900);
        }
      }

      function triggerHit(idx) {
        if (finished || idx < 0 || cmdStatus[idx] !== 'pending') return;
        const cmd = commands[idx];
        cmdStatus[idx] = 'hit';
        hits += 1;
        cash += 500;
        activeIdx = -1;
        promptBox.classList.add('hidden');
        clearQteHighlights();

        // Fluidez para uso com 1 mão no celular (impulso de 0.9s no modo Segurar A)
        if (accelMode === 'hold') {
          coastTimer = 0.9;
        }

        if (callbacks && callbacks.onSFX) {
          callbacks.onSFX(cmd.type === 'nitro' || cmd.type === 'final' ? 'start' : 'cash');
        }
        triggerActionEffect(cmd.type, true);
      }

      function triggerMiss(idx) {
        if (finished || cmdStatus[idx] !== 'pending') return;
        cmdStatus[idx] = 'miss';
        stars = Math.min(5, stars + 1);
        activeIdx = -1;
        promptBox.classList.add('hidden');
        clearQteHighlights();
        if (callbacks && callbacks.onSFX) callbacks.onSFX('hit');
        showFloat('ALERTA POLICIAL!', 'text-red-400');
        flashEl.classList.replace('bg-red-600/0', 'bg-red-600/45');
        setTimeout(() => {
          if (!destroyed) flashEl.classList.replace('bg-red-600/45', 'bg-red-600/0');
        }, 240);
      }

      function handleControlInput(type) {
        if (finished) return;
        if (activeIdx >= 0 && commands[activeIdx] && commands[activeIdx].type === type) {
          triggerHit(activeIdx);
          return;
        }
        // Fora da janela QTE: ainda dá feedback visual/sonoro tátil para sensação de controle real
        if (callbacks && callbacks.onSFX) {
          callbacks.onSFX(type === 'nitro' || type === 'final' ? 'jump' : 'click');
        }
        triggerActionEffect(type, false);
      }

      function showResult() {
        if (finished) return;
        finished = true;
        isHoldingA = false;
        isHoldingX = false;
        isHoldingB = false;
        isHoldingY = false;
        promptBox.classList.add('hidden');
        holdHint.classList.add('hidden');
        hudBottom.classList.add('hidden');
        clearQteHighlights();
        resultOverlay.classList.remove('hidden');

        if (videoEl) {
          try { videoEl.pause(); } catch (e) {}
        }

        const won = hits >= 2;
        resultBg.innerHTML = '';

        if (won) {
          if (callbacks && callbacks.onSFX) callbacks.onSFX('mission');
          const winSrc = cfg.gameWinBgData || cfg.gameWinBgUrl;
          if (winSrc) {
            const isV = cfg.gameWinMediaType === 'video' || /^data:video\//i.test(winSrc) || /\.(mp4|webm|ogg)(\?.*)?$/i.test(winSrc);
            resultBg.innerHTML = isV
              ? `<video src="${esc(winSrc)}" autoplay muted playsinline webkit-playsinline loop class="w-full h-full object-cover opacity-80"></video>`
              : `<img src="${esc(winSrc)}" class="w-full h-full object-cover opacity-80" />`;

      function restartQTE() {
        finished = false;
        hits = 0;
        stars = 1;
        cash = 0;

        boostTimer = 0;
        coastTimer = 0;

        isHoldingX = false;
        isHoldingB = false;
        isHoldingY = false;

            videoEl.play().catch(() => {
              videoEl.muted = true;
              videoEl.play().catch(() => {});
            });
          } else {
            videoEl.pause();
          }
        }
        lastFrame = performance.now();
      }

      function ensureVideoPlaying() {
        if (videoEl && videoEl.paused) {
          videoEl.muted = Boolean(callbacks && callbacks.isMuted && callbacks.isMuted());
          videoEl.play().catch(() => {
            videoEl.muted = true;

          });

      // Botão Verde A: Segurar = Acelerar | 2x Cliques = NITRO | 3x Cliques = TURBO FINAL
      function startHoldA(e) {
        if (e) e.preventDefault();
        if (finished) return;
        isHoldingA = true;
        btnA.classList.add('is-pressed');
        ensureVideoPlaying();

        const nowMs = performance.now();
        aTapCount = (nowMs - aLastTap <= 450) ? (aTapCount + 1) : 1;
        aLastTap = nowMs;

        if (aTapCount === 2) {
          if (activeIdx >= 0 && commands[activeIdx].type === 'final') {
            showFloat('🔥 2/3... MAIS 1!', 'text-yellow-300');
            if (callbacks && callbacks.onSFX) callbacks.onSFX('click');
          } else {
            handleControlInput('nitro');
          }
        } else if (aTapCount >= 3) {
          aTapCount = 0;
          handleControlInput('final');
        }
      }
      function stopHoldA(e) {
        if (e) e.preventDefault();
        isHoldingA = false;
        btnA.classList.remove('is-pressed');
      }
      btnA.addEventListener('pointerdown', startHoldA);
      btnA.addEventListener('pointerup', stopHoldA);
      btnA.addEventListener('pointerleave', stopHoldA);
      btnA.addEventListener('pointercancel', stopHoldA);

      // Botão Azul X: Esquerda + Acelera
      function startHoldX(e) {
        if (e) e.preventDefault();
        if (finished) return;
        isHoldingX = true;
        btnX.classList.add('is-pressed');
        ensureVideoPlaying();
        handleControlInput('left');

      function stopHoldX(e) {
        if (e) e.preventDefault();
        isHoldingX = false;

      btnX.addEventListener('pointerdown', startHoldX);
      btnX.addEventListener('pointerup', stopHoldX);
      btnX.addEventListener('pointerleave', stopHoldX);

      // Botão Vermelho B: Direita + Acelera

        ensureVideoPlaying();

      // Teclado Desktop (W/Up/Space = A, S/Down/Y = Frear Y, A/Left/X = Esquerda X, D/Right/B = Direita B)
      function onKeyDown(e) {

        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

          e.preventDefault(); startHoldY();
        } else if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyX') {
          e.preventDefault(); startHoldX();
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'KeyB') {
          e.preventDefault(); startHoldB();
        }
      }
      function onKeyUp(e) {
        if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') stopHoldA();
        if (e.code === 'KeyS' || e.code === 'ArrowDown' || e.code === 'KeyY') stopHoldY();
        if (e.code === 'ArrowLeft' || e.code === 'KeyA' || e.code === 'KeyX') stopHoldX();
        if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'KeyB') stopHoldB();

      function loop(now) {
        if (destroyed) return;
        const dt = Math.min(0.05, (now - lastFrame) / 1000);
        lastFrame = now;

        if (!finished) {
          if (coastTimer > 0) coastTimer = Math.max(0, coastTimer - dt);

          const isDriving = isHoldingA || isHoldingX || isHoldingB;
          const shouldPlay = accelMode === 'auto' || isDriving || coastTimer > 0;
          let playRate = 1.0;
          if (isHoldingY) playRate = 0.5;
          else if ((accelMode === 'auto' && isDriving) || boostTimer > 0) playRate = 1.35;

          // Exibe dica pulsante se estiver parado no modo Segurar A

          let dur = 16;

            if (shouldPlay) {

              }
              if (videoEl.paused) {

            dur = (videoEl.duration && isFinite(videoEl.duration)) ? videoEl.duration : 16;
          } else {
            if (shouldPlay) simTime += dt * playRate;
            t = simTime;
            dur = 16;
            drawSimRoad(dt, t, shouldPlay ? playRate : 0);
          }

          // Velocímetro suave acompanhando aceleração / freio / pausa
          let targetSpd = 0;
          if (shouldPlay) {
            targetSpd = t < 2.5 ? 68 + t * 18 : 118;
            if (t >= 9.5 && t <= 14.8) targetSpd = 188;

            if (isHoldingY) targetSpd = 46;
            if (boostTimer > 0) {
              boostTimer = Math.max(0, boostTimer - dt);
              targetSpd = Math.max(targetSpd, 228);
            }
          }
          currentSpeed += (targetSpd - currentSpeed) * Math.min(1, dt * (shouldPlay ? 5.5 : 4.2));
          if (!shouldPlay && currentSpeed < 1) currentSpeed = 0;

          // Verifica janelas dos comandos QTE
          let foundActive = -1;
          for (let i = 0; i < commands.length; i++) {
            const c = commands[i];
            if (cmdStatus[i] === 'pending') {
              if (t >= c.start && t <= c.end) {
                foundActive = i;
              } else if (t > c.end) {
                triggerMiss(i);
              }
            }
          }

          if (foundActive >= 0) {
            const c = commands[foundActive];
            if (activeIdx !== foundActive) {
              activeIdx = foundActive;
              const m = metaByType[c.type] || metaByType.nitro;
              bannerBtn.className = `animate-qte-pop w-full max-w-[290px] rounded-2xl bg-gradient-to-b ${m.bg} border-2 ${m.border} px-3.5 py-2.5 text-white cursor-pointer active:scale-95 transition-transform gamepad-no-select`;
              bannerBtn.style.boxShadow = `0 0 24px ${m.glow}`;
              actionIcon.textContent = m.icon;
              actionBadge.textContent = m.badge;
              actionText.textContent = c.text;
              promptBox.classList.remove('hidden');

              clearQteHighlights();
              const targetBtn = container.querySelector(m.btnId);
              if (targetBtn) targetBtn.classList.add('qte-highlight');
            }
            const frac = Math.max(0, Math.min(1, (c.end - t) / Math.max(0.1, c.end - c.start)));
            timerBar.style.width = (frac * 100) + '%';
          } else if (activeIdx >= 0) {
            activeIdx = -1;
            promptBox.classList.add('hidden');
            clearQteHighlights();
          }

          updateHUD(t, dur);

          if (t >= Math.max(15.5, dur - 0.12)) {
            showResult();
          }
        }

        rafId = requestAnimationFrame(loop);
      }

      resizeSim();
      restartQTE();
      rafId = requestAnimationFrame(loop);

      return {
        destroy() {
          destroyed = true;
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('keyup', onKeyUp);
          window.removeEventListener('resize', resizeSim);
          if (videoEl) {
            try { videoEl.pause(); } catch (e) {}
          }
        }
      };
    }
