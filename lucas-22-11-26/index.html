            (c.isChild?'<input type="text" data-ca="'+i+'" value="'+esc(c.age)+'" placeholder="Idade (ex: 8 anos)" class="w-32 bg-[#0D0B14] border border-[#FF2A85]/50 rounded-lg px-2 py-1 text-xs text-white"/>':'')+'</div></div>'
        ).join('');
        return '<div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4"><div class="hud-glass rounded-2xl p-5 w-full max-w-md max-h-[92vh] flex flex-col border-[#00F0FF]/60">'+
          '<div class="flex items-center justify-between border-b border-white/10 pb-2.5 mb-3"><div><h3 class="font-bold text-sm uppercase text-[#00F0FF]">✅ Confirmar Presença</h3><p class="text-[11px] text-purple-200/70">Preencha para enviar no WhatsApp</p></div><button id="r-close" class="w-8 h-8 rounded-full bg-white/10 text-white text-xs cursor-pointer">✕</button></div>'+
          '<div class="flex-1 overflow-y-auto space-y-3 pr-1 text-left"><div id="r-err" class="'+(rsvp.error?'':'hidden ')+'p-2 rounded-lg bg-red-500/20 border border-red-400/50 text-red-200 text-xs font-semibold">'+esc(rsvp.error)+'</div>'+
          '<div><label class="block text-[11px] uppercase text-purple-200 mb-1">Seu Nome Completo *</label><input id="r-name" type="text" value="'+esc(rsvp.guestName)+'" placeholder="Digite seu nome..." class="w-full bg-[#0D0B14] border border-white/20 rounded-xl px-3 py-2.5 text-sm text-white"/></div>'+
          '<div><label class="block text-[11px] uppercase text-purple-200 mb-1">Vai ao evento?</label><div class="grid grid-cols-2 gap-2"><button id="r-sim" type="button" class="py-2.5 rounded-xl text-xs font-bold border cursor-pointer '+(isSim?'bg-emerald-500/25 border-emerald-400 text-emerald-200':'bg-black/40 border-white/15 text-purple-200/70')+'">✅ Sim, vou!</button><button id="r-nao" type="button" class="py-2.5 rounded-xl text-xs font-bold border cursor-pointer '+(!isSim?'bg-red-500/25 border-red-400 text-red-200':'bg-black/40 border-white/15 text-purple-200/70')+'">❌ Não poderei ir</button></div></div>'+
          (isSim?'<div class="space-y-2 pt-1"><div class="flex items-center justify-between"><label class="text-[11px] uppercase text-purple-200">Acompanhantes ('+rsvp.companions.length+')</label><button id="r-add" type="button" class="px-2.5 py-1 rounded-lg bg-[#FF2A85]/25 border border-[#FF2A85]/60 text-pink-200 text-xs font-bold cursor-pointer">+ Adicionar</button></div><div class="space-y-2">'+(comps||'<p class="text-xs text-purple-300/50 italic">Nenhum acompanhante adicionado.</p>')+'</div></div>':'')+
          '<div><label class="block text-[11px] uppercase text-purple-200 mb-1">Recado (Opcional)</label><textarea id="r-note" rows="2" class="w-full bg-[#0D0B14] border border-white/20 rounded-xl px-3 py-2 text-xs text-white">'+esc(rsvp.note)+'</textarea></div></div>'+
          '<div class="pt-3 mt-2 border-t border-white/10"><button id="r-send" type="button" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-black font-bold text-xs uppercase cursor-pointer">📲 Enviar Confirmação no WhatsApp</button></div></div></div>';
      }

      function sendWA(){
        const name = (rsvp.guestName||'').trim();
        if(!name){ rsvp.error='Por favor, digite seu nome completo.'; const b=document.getElementById('r-err'); if(b){b.textContent=rsvp.error;b.classList.remove('hidden');} return; }
        rsvp.error='';
        const num = (state.s3Whatsapp||'').replace(/\D/g,'');
        const lines = ['🌴 *CONFIRMAÇÃO DE PRESENÇA* 🌴','🎉 *Evento:* '+state.eventName+(state.eventSubtitle?' ('+state.eventSubtitle+')':''),'━━━━━━━━━━━━━━━━━━━━','👤 *Convidado:* '+name,'📌 *Presença:* '+(rsvp.attending==='sim'?'✅ Sim, vou!':'❌ Não poderei ir')];
        if(rsvp.attending==='sim'){
          const valid = rsvp.companions.filter(c=>(c.name||'').trim()!=='');
          if(valid.length>0){
            lines.push('','👥 *Acompanhantes:*');
            valid.forEach((c,i)=>{ const ag=(c.age||'').trim(); const tag=c.isChild?'(Criança'+(ag?' - '+(/ano/i.test(ag)?ag:ag+' anos'):'')+')':'(Adulto)'; lines.push((i+1)+'. '+c.name.trim()+' '+tag); });
            lines.push('','🔢 *Total de pessoas confirmadas:* '+(1+valid.length));
          } else lines.push('🔢 *Total de pessoas confirmadas:* 1 (Apenas eu)');
        }
        if((rsvp.note||'').trim()) lines.push('','💬 *Recado:* '+rsvp.note.trim());
        window.open((num?'https://wa.me/'+num+'?text=':'https://wa.me/?text=')+encodeURIComponent(lines.join('\n')),'_blank','noopener,noreferrer');
      }

      function render(){
        if(s2Timer){ clearTimeout(s2Timer); s2Timer=null; }
        if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
        if(gameInst){ gameInst.destroy(); gameInst=null; }

        const app = document.getElementById('app');
        const soundBtn = '<button id="btn-sound" class="absolute top-4 right-4 z-50 w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-[#00F0FF]/60 flex items-center justify-center text-base cursor-pointer">'+(isMuted?'🔇':'🔊')+'</button>';
        const logoSrc = state.logoData || state.logoUrl;
        const logoPx = Number(state.logoSize) || 220;
        let html = '';

        if(currentScene==='1'){
          const bg = mediaLayer(state.s1BgData||state.s1BgUrl, state.s1MediaType, 1, '', overlayLayer(state.s1OverlayOn, state.s1OverlayOpacity));
          const topBlock = (state.titleMode==='image' && logoSrc)
            ? '<div class="relative z-10 mt-4 flex flex-col items-center"><img src="'+esc(logoSrc)+'" style="width:'+logoPx+'px;max-width:88%;height:auto;" class="logo-png-shadow object-contain"/></div>'
            : '<div class="relative z-10 mt-4 flex flex-col items-center justify-center gap-1.5 px-2">'+(state.eventSubtitle?'<div class="gta-badge-text text-5xl leading-none">'+esc(state.eventSubtitle)+'</div>':'')+(state.s1TopText?'<div class="gta-title text-3xl text-white leading-tight">'+esc(state.s1TopText)+'</div>':'')+(state.eventName?'<div class="neon-script text-4xl leading-tight">'+esc(state.eventName)+'</div>':'')+'</div>';
          html = '<div class="relative w-full h-full flex flex-col justify-between items-center text-center p-6 py-12">'+bg+topBlock+
            '<div class="relative z-10 w-full max-w-sm space-y-4"><p class="text-xs sm:text-sm tracking-wider uppercase bg-black/45 backdrop-blur-sm py-2 px-4 rounded-full border border-white/10 inline-block">'+esc(state.s1Subtitle)+'</p><div><button id="btn-start" class="btn-neon-pulse w-full py-4 px-6 rounded-xl bg-[#0B132B]/90 border-2 border-[#00F0FF] text-white font-bold text-sm uppercase tracking-[0.15em] cursor-pointer">▶ '+esc(state.s1BtnText)+'</button></div></div></div>';
        } else if(currentScene==='2'){
          const bg = mediaLayer(state.s2MediaData||state.s2MediaUrl, state.s2MediaType, 2, '', overlayLayer(state.s2OverlayOn, state.s2OverlayOpacity));
          const dur = Number(state.s2Duration)||5;
          html = '<div class="relative w-full h-full flex flex-col justify-between p-6 py-10 overflow-hidden">'+bg+
            '<div class="relative z-20 flex items-center justify-between gap-3 pr-14"><div class="flex-1 h-1.5 bg-white/15 rounded-full overflow-hidden"><div id="s2-bar" class="h-full bg-gradient-to-r from-[#00F0FF] via-[#FF2A85] to-[#FF7B54] w-0 transition-all ease-linear" style="transition-duration:'+dur+'s"></div></div><button id="btn-skip" class="px-3 py-1 rounded-full bg-black/60 border border-white/25 text-xs uppercase cursor-pointer">Pular >></button></div>'+
            '<div class="relative z-20 my-auto text-center space-y-4 px-2"><div class="animate-glitch-in inline-block px-3 py-1 rounded bg-black/65 border-l-4 border-[#FF7B54] font-bold text-sm tracking-[0.2em] uppercase text-yellow-300">'+esc(state.s2Cap1)+'</div><h2 class="animate-glitch-in gta-title text-3xl text-white mx-auto leading-tight">'+esc(state.s2Cap2)+'</h2></div>'+
            '<div class="relative z-20 text-center text-[11px] uppercase tracking-[0.25em] text-[#00F0FF]/80">Carregando missão...</div></div>';
        } else if(currentScene==='briefing'){
          const bg = mediaLayer(state.briefBgData||state.briefBgUrl, state.briefMediaType, 5, '', overlayLayer(state.gameIntroOverlayOn, state.gameIntroOverlayOpacity));
          html = '<div class="relative w-full h-full flex flex-col justify-between items-center text-center p-5 py-10 overflow-hidden">'+bg+
            '<div class="relative z-10 w-full pr-12"><div class="px-4 py-2.5 rounded-xl bg-black/75 border border-[#00F0FF]/60 text-left"><div class="flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-widest text-[#00F0FF]"><span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>TRANSMISSÃO RECEBIDA</div><p class="text-xs sm:text-sm text-white mt-0.5">'+esc(state.briefTransmission)+'</p></div></div>'+
            '<div class="relative z-10 my-auto flex flex-col items-center justify-center px-2"><div class="relative flex items-center justify-center py-6 px-4"><div class="pointer-events-none absolute w-52 h-52 rounded-full border-2 border-[#FF2A85]/55 animate-spin-slow"></div><div class="relative z-10 space-y-2"><h2 class="gta-title text-3xl text-white leading-tight">'+esc(state.briefTitle)+'</h2><p class="text-xs uppercase tracking-widest text-yellow-300 bg-black/60 px-3 py-0.5 rounded-full inline-block border border-yellow-400/40">🏎️ Corrida em Vice City</p></div></div></div>'+
            '<div class="relative z-10 w-full grid grid-cols-2 gap-3"><button id="btn-acc" class="py-3.5 px-3 rounded-xl bg-black/80 border-2 border-emerald-400 text-emerald-300 font-bold text-sm uppercase cursor-pointer">✔ '+esc(state.briefAccept)+'</button><button id="btn-dec" class="py-3.5 px-3 rounded-xl bg-black/80 border-2 border-[#FF2A85] text-pink-300 font-bold text-sm uppercase cursor-pointer">✖ '+esc(state.briefDecline)+'</button></div></div>';
        } else if(currentScene==='game'){
          html = '<div id="game-stage" class="w-full h-full relative"></div>';
        } else if(currentScene==='3'){
          const bg = mediaLayer(state.s3BgData||state.s3BgUrl, state.s3MediaType, 3, state.s3BlurOn ? 'blur-[3px] scale-105' : '', overlayLayer(state.s3OverlayOn, state.s3OverlayOpacity));
          html = '<div class="relative w-full h-full flex flex-col justify-center items-center p-4 overflow-y-auto">'+bg+
            '<div class="relative z-10 w-full space-y-3 my-auto"><div class="flex items-center justify-between px-1 pr-12"><div class="flex gap-1 text-yellow-400 text-base">★★★★★</div><span class="text-[11px] uppercase tracking-widest text-[#00F0FF] bg-black/50 px-3 py-0.5 rounded-full border border-[#00F0FF]/30">HUD • MISSÃO</span></div>'+
            '<div class="hud-glass rounded-2xl p-5 space-y-4"><div class="text-center border-b border-white/10 pb-2.5"><h2 class="gta-title text-2xl text-white">'+esc(state.s3Title)+'</h2></div>'+
            '<div class="grid grid-cols-4 gap-2 text-center"><div class="bg-black/50 rounded-xl py-2 border border-[#FF2A85]/30"><div id="cd-d" class="font-bold text-lg text-[#00F0FF]">00</div><div class="text-[10px] uppercase text-purple-200/70">Dias</div></div><div class="bg-black/50 rounded-xl py-2 border border-[#FF2A85]/30"><div id="cd-h" class="font-bold text-lg text-[#00F0FF]">00</div><div class="text-[10px] uppercase text-purple-200/70">Horas</div></div><div class="bg-black/50 rounded-xl py-2 border border-[#FF2A85]/30"><div id="cd-m" class="font-bold text-lg text-[#00F0FF]">00</div><div class="text-[10px] uppercase text-purple-200/70">Min</div></div><div class="bg-black/50 rounded-xl py-2 border border-[#FF2A85]/30"><div id="cd-s" class="font-bold text-lg text-[#FF2A85]">00</div><div class="text-[10px] uppercase text-purple-200/70">Seg</div></div></div>'+
            '<div class="space-y-2 text-xs sm:text-sm"><div class="bg-white/5 p-2.5 rounded-xl">📅 <strong>'+esc(state.s3DateText)+' • '+esc(state.s3TimeText)+'</strong></div><div class="bg-white/5 p-2.5 rounded-xl">📍 <strong>'+esc(state.s3Venue)+'</strong><div class="text-purple-200/80 text-xs">'+esc(state.s3Address)+'</div></div><div class="bg-white/5 p-2.5 rounded-xl">🕶️ <strong>Traje:</strong> '+esc(state.s3Dress)+'</div></div>'+
            '<div class="grid grid-cols-2 gap-2.5"><a href="'+esc(state.s3Maps||'#')+'" target="_blank" rel="noopener" class="py-3 px-2 rounded-xl bg-[#00F0FF]/15 border border-[#00F0FF]/50 text-[#00F0FF] font-bold text-xs uppercase text-center">📍 Como Chegar</a><button id="btn-rsvp" class="py-3 px-2 rounded-xl bg-emerald-500/20 border border-emerald-400/50 text-emerald-300 font-bold text-xs uppercase text-center cursor-pointer">✅ Confirmar</button><button id="btn-gifts" class="py-3 px-2 rounded-xl bg-[#FF2A85]/20 border border-[#FF2A85]/50 text-pink-200 font-bold text-xs uppercase text-center cursor-pointer">🎁 Presentes</button><button id="btn-s4" class="py-3 px-2 rounded-xl bg-gradient-to-r from-[#FF2A85] to-[#FF7B54] text-white font-bold text-xs uppercase text-center cursor-pointer">🎵 Avançar >></button></div></div></div></div>';
        } else {
          const bg = mediaLayer(state.s4BgData||state.s4BgUrl, state.s4MediaType, 4, '', overlayLayer(state.s4OverlayOn, state.s4OverlayOpacity));
          const brandTop = (state.titleMode==='image' && logoSrc) ? '<img src="'+esc(logoSrc)+'" style="width:'+Math.min(Math.round(logoPx*0.62),170)+'px;max-width:75%;height:auto;" class="logo-png-shadow object-contain mx-auto"/>' : '<span class="neon-script text-3xl">'+esc(state.eventName)+'</span>';
          html = '<div class="relative w-full h-full flex flex-col justify-between items-center text-center p-6 py-12 overflow-hidden">'+bg+
            '<div class="relative z-10">'+brandTop+'</div>'+
            '<div class="relative z-10 w-full space-y-4 animate-mission-zoom my-auto"><div class="py-5 px-5 rounded-2xl bg-black/55 backdrop-blur-md border-y-2 border-yellow-400/70"><h2 class="mission-passed-text text-4xl uppercase">'+esc(state.s4Banner)+'</h2><p class="font-bold text-sm tracking-[0.22em] uppercase text-white mt-1.5">'+esc(state.s4Sub)+'</p></div><p class="text-sm text-purple-100 bg-black/45 p-4 rounded-xl border border-white/10">'+esc(state.s4Message)+'</p></div>'+
            '<div class="relative z-10 w-full max-w-xs space-y-2.5"><button id="btn-rsvp" class="w-full py-3.5 px-5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-black font-bold text-sm uppercase cursor-pointer">💬 Confirmar no WhatsApp</button><button id="btn-replay" class="w-full py-2.5 px-4 rounded-xl bg-white/10 border border-white/20 text-white font-semibold text-xs uppercase cursor-pointer">↺ Rever Convite</button></div></div>';
        }

        const gModal = giftModalOpen ? '<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-5"><div class="hud-glass rounded-2xl p-5 w-full max-w-sm space-y-3"><div class="flex justify-between items-center border-b border-white/10 pb-2"><strong class="text-[#FF2A85] uppercase text-sm">🎁 Lista de Presentes</strong><button id="close-gift" class="text-white cursor-pointer">✕</button></div><div class="text-sm text-purple-100 whitespace-pre-line max-h-60 overflow-y-auto">'+esc(state.s3Gifts)+'</div><button id="close-gift-2" class="w-full py-2.5 rounded-xl bg-[#FF2A85] text-white font-bold text-xs uppercase cursor-pointer">Fechar</button></div></div>' : '';
        const rModal = rsvpModalOpen ? rsvpModalHtml() : '';

        app.innerHTML = soundBtn + html + gModal + rModal;

        document.getElementById('btn-sound').onclick = () => { isMuted=!isMuted; syncAudio(!isMuted); document.getElementById('btn-sound').textContent=isMuted?'🔇':'🔊'; };
        const bStart=document.getElementById('btn-start'); if(bStart) bStart.onclick=()=>{ playSFX('start'); syncAudio(true); currentScene='2'; render(); };
        const bSkip=document.getElementById('btn-skip'); if(bSkip) bSkip.onclick=()=>{ currentScene=state.gameEnabled?'briefing':'3'; render(); };
        const bAcc=document.getElementById('btn-acc'); if(bAcc) bAcc.onclick=()=>{ playSFX('start'); currentScene='game'; render(); };
        const bDec=document.getElementById('btn-dec'); if(bDec) bDec.onclick=()=>{ currentScene='3'; render(); };
        const bS4=document.getElementById('btn-s4'); if(bS4) bS4.onclick=()=>{ playSFX('mission'); currentScene='4'; render(); };
        const bRep=document.getElementById('btn-replay'); if(bRep) bRep.onclick=()=>{ currentScene='1'; render(); };
        const bRsvp=document.getElementById('btn-rsvp'); if(bRsvp) bRsvp.onclick=()=>{ rsvp.error=''; rsvpModalOpen=true; render(); };
        const bGif=document.getElementById('btn-gifts'); if(bGif) bGif.onclick=()=>{ const v=(state.s3Gifts||'').trim(); if(/^https?:\/\//i.test(v)) window.open(v,'_blank','noopener'); else { giftModalOpen=true; render(); } };
        const c1=document.getElementById('close-gift'); if(c1) c1.onclick=()=>{ giftModalOpen=false; render(); };
        const c2=document.getElementById('close-gift-2'); if(c2) c2.onclick=()=>{ giftModalOpen=false; render(); };

        if(currentScene==='game'){
          const gCallbacks = {
            onSFX: playSFX,
            isMuted: () => isMuted,
            onOpenInvite: ()=>{ currentScene='3'; render(); }
          };
          gameInst = state.gameMode === 'canvas'
            ? createViceCityGame(document.getElementById('game-stage'), state, gCallbacks)
            : createViceCityQTEGame(document.getElementById('game-stage'), state, gCallbacks);
        }
        if(rsvpModalOpen){
          document.getElementById('r-close').onclick=()=>{ rsvpModalOpen=false; render(); };
          document.getElementById('r-name').oninput=e=>{ rsvp.guestName=e.target.value; };
          document.getElementById('r-note').oninput=e=>{ rsvp.note=e.target.value; };
          document.getElementById('r-sim').onclick=()=>{ rsvp.attending='sim'; render(); };
          document.getElementById('r-nao').onclick=()=>{ rsvp.attending='nao'; render(); };
          const rAdd=document.getElementById('r-add'); if(rAdd) rAdd.onclick=()=>{ rsvp.companions.push({name:'',isChild:false,age:''}); render(); };
          document.querySelectorAll('[data-cn]').forEach(el=>{ el.oninput=e=>{ rsvp.companions[Number(el.dataset.cn)].name=e.target.value; }; });
          document.querySelectorAll('[data-ca]').forEach(el=>{ el.oninput=e=>{ rsvp.companions[Number(el.dataset.ca)].age=e.target.value; }; });
          document.querySelectorAll('[data-cc]').forEach(el=>{ el.onchange=e=>{ const i=Number(el.dataset.cc); rsvp.companions[i].isChild=e.target.checked; if(!e.target.checked) rsvp.companions[i].age=''; render(); }; });
          document.querySelectorAll('[data-cr]').forEach(el=>{ el.onclick=()=>{ rsvp.companions.splice(Number(el.dataset.cr),1); render(); }; });
          document.getElementById('r-send').onclick=sendWA;
        }
        if(currentScene==='2'){
          const bar=document.getElementById('s2-bar');
          if(bar) requestAnimationFrame(()=>requestAnimationFrame(()=>{ bar.style.width='100%'; }));
          s2Timer = setTimeout(()=>{ currentScene=state.gameEnabled?'briefing':'3'; render(); }, (Number(state.s2Duration)||5)*1000);
        }
        if(currentScene==='3'){
          const upd=()=>{
            const diff=Math.max(0,new Date(state.s3Countdown).getTime()-Date.now());
            const pad=n=>String(Math.floor(n)).padStart(2,'0');
            if(!document.getElementById('cd-d')) return;
            document.getElementById('cd-d').textContent=pad(diff/86400000);
            document.getElementById('cd-h').textContent=pad((diff/3600000)%24);
            document.getElementById('cd-m').textContent=pad((diff/60000)%60);
            document.getElementById('cd-s').textContent=pad((diff/1000)%60);
          };
          upd(); cdTimer=setInterval(upd,1000);
        }
      }
      render();
    })();
  </script>
</body>
</html>
