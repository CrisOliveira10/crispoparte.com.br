<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Tela de Início (Overlay) */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; color: white;
            cursor: pointer; text-align: center;
        }

        .play-icon {
            width: 70px; height: 70px;
            background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 25px; margin-bottom: 20px;
        }

        /* Botão Controle Canto Superior */
        #controlBtn {
            position: absolute;
            top: 20px; left: 20px;
            width: 45px; height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: none; cursor: pointer;
            z-index: 10; font-size: 18px; color: #fff;
            display: none; align-items: center; justify-content: center;
        }

        .video-container {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        /* Hotspots (Botões de Clique no Final) */
        .hotspots {
            position: absolute;
            bottom: 15%; 
            width: 100%;
            display: none; 
            justify-content: space-around;
            padding: 0 10%; box-sizing: border-box;
            z-index: 20;
        }

        .btn-interativo {
            width: 110px; height: 110px;
            background: transparent; cursor: pointer;
            /* border: 1px solid red; */ /* Remova o comentário desta linha se quiser ver a área do botão para testar */
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="iniciarConvite()">
        <div class="play-icon">▶</div>
        <h2 style="font-weight: 300;">Ative o play para a<br>magia acontecer!</h2>
    </div>

    <div class="video-container">
        <button id="controlBtn">⏸</button>

        <video id="meuVideo" playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>

        <audio id="meuAudio">
            <source src="audio.mp3" type="audio/mpeg">
        </audio>

        <div class="hotspots" id="hotspotsContainer">
            <div class="btn-interativo" onclick="confirmar()"></div>
            <div class="btn-interativo" onclick="mapa()"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('meuVideo');
        const audio = document.getElementById('meuAudio');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('controlBtn');
        const hotspots = document.getElementById('hotspotsContainer');

        function iniciarConvite() {
            overlay.style.display = 'none';
            btn.style.display = 'flex';
            
            // Inicia ambos simultaneamente
            video.play();
            audio.play();
        }

        // Lógica unificada de Play/Pause (afeta vídeo e áudio)
        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                audio.play();
                btn.innerHTML = '⏸';
            } else {
                video.pause();
                audio.pause();
                btn.innerHTML = '▶';
            }
        });

        // Quando o vídeo termina
        video.onended = function() {
            audio.pause(); // Garante que o som para se for maior que o vídeo
            hotspots.style.display = 'flex';
        };

        function confirmar() {
            window.open('https://wa.me/5571993233142', '_blank');
        }

        function mapa() {
            window.open('https://maps.app.goo.gl/WVu3tAX2YhUYnWos7', '_blank');
        }
    </script>
</body>
</html>
