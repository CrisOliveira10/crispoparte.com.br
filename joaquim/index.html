<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Convite Joaquim</title>
    <style>
        :root {
            --cor-botao: #FFFFFF;
            --cor-icone: #000000;
            --cor-texto: #FFFFFF;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; 
            /* Uso de dvh (Dynamic Viewport Height) para evitar problemas com a barra do Safari/Chrome */
            height: 100dvh; 
            overflow: hidden; 
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- CONTAINER PRINCIPAL --- */
        .video-container {
            position: relative;
            width: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- MEDIA WRAPPER (Mantém a proporção 9:16 da arte) --- */
        .media-wrapper {
            position: relative;
            height: 100dvh; /* Garante que preencha a altura total disponível */
            aspect-ratio: 9 / 16; 
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video {
            width: 100%;
            height: 100%;
            /* object-fit: contain garante que a arte nunca seja cortada nas laterais */
            object-fit: contain; 
            z-index: 1;
        }

        /* --- TELA DE INÍCIO (OVERLAY) --- */
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; cursor: pointer; text-align: center;
        }

        #overlay h2 { 
            font-weight: bold; 
            text-shadow: 2px 2px 4px #000000;
            color: var(--cor-texto); 
            padding: 0 20px;
        }

        .play-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 20px;
            background-color: var(--cor-botao);
            color: var(--cor-icone);
        }

        /* --- BOTÃO CONTROLE CANTO SUPERIOR --- */
        #controlBtn {
            position: absolute;
            /* Usando env(safe-area-inset-top) para não ficar embaixo da câmera do iPhone */
            top: calc(10px + env(safe-area-inset-top)); 
            left: 20px; 
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none; cursor: pointer;
            z-index: 110; font-size: 18px; 
            display: none; align-items: center; justify-content: center;
            background-color: var(--cor-botao);
            color: var(--cor-icone);
            opacity: 0.8;
        }

        /* --- HOTSPOTS RELATIVOS À ARTE --- */
        .hotspots {
            position: absolute;
            /* Posicionamento em % relativo ao media-wrapper */
            bottom: 12%; 
            width: 100%;
            display: none; 
            justify-content: space-around;
            padding: 0 5%;
            box-sizing: border-box;
            z-index: 20;
        }

        .btn-interativo {
            width: 35%; /* Ajuste conforme o tamanho dos ícones na sua arte */
            aspect-ratio: 1 / 1;
            background: transparent; 
            cursor: pointer;
            /* border: 2px solid red; */ /* Remova o comentário para calibrar a posição */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <button id="controlBtn">⏸</button>

        <div class="media-wrapper">
            <div id="overlay" onclick="iniciarConvite()">
                <div class="play-icon">▶</div>
                <h2>Ative o play para a<br>magia acontecer!</h2>
            </div>

            <video id="meuVideo" playsinline preload="auto" muted>
                <source src="video.mp4" type="video/mp4">
            </video>

            <audio id="meuAudio">
                <source src="audio.mp3" type="audio/mpeg">
            </audio>

            <div class="hotspots" id="hotspotsContainer">
                <div class="btn-interativo" onclick="confirmar()" aria-label="Confirmar Presença"></div>
                <div class="btn-interativo" onclick="mapa()" aria-label="Ver Mapa"></div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('meuVideo');
        const audio = document.getElementById('meuAudio');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('controlBtn');
        const hotspots = document.getElementById('hotspotsContainer');

        function iniciarConvite() {
            overlay.style.display = 'none';
            btn.style.display = 'flex';
            
            // Em alguns navegadores, o vídeo precisa estar mudo para dar play automático via JS, 
            // mas como houve interação (clique), desativamos o mute.
            video.muted = false;
            video.play();
            audio.play().catch(e => console.log("Áudio aguardando interação"));
        }

        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                audio.play();
                btn.innerHTML = '⏸';
            } else {
                video.pause();
                audio.pause();
                btn.innerHTML = '▶';
            }
        });

        video.onended = function() {
            // Se houver áudio separado, paramos ele também
            audio.pause(); 
            hotspots.style.display = 'flex';
        };

        function confirmar() {
            window.open('https://crispoparte.com.br/formulariojoaquim', '_blank');
        }

        function mapa() {
            window.open('https://www.google.com/maps', '_blank');
        }
    </script>
</body>
</html>
