<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- TELA DE INÍCIO (AQUI O VÍDEO APARECE AO FUNDO) --- */
        #overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* ABAIXO: Fundo transparente para ver o vídeo atrás */
            background: transparent; 
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; 
            cursor: pointer; text-align: center;
        }

        /* --- CONFIGURAÇÃO DO TEXTO INICIAL --- */
        #overlay h2 { 
            font-weight: bold; 
            text-shadow: 2px 2px 4px #000000; /* Sombra para ler melhor sobre o vídeo */
            /* ALUNA: ALTERAR COR DO TEXTO ABAIXO */
            color: #FFFFFF; 
        }

        /* --- BOTÃO DE PLAY GRANDE (TELA INICIAL) --- */
        .play-icon {
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin-bottom: 20px;
            /* ALUNA: ALTERAR CORES DO BOTÃO DE INÍCIO ABAIXO */
            background-color: #FFFFFF; /* Cor da bola */
            color: #000000;            /* Cor do triângulo */
        }

        /* --- BOTÃO PLAY/PAUSE CANTO SUPERIOR --- */
        #controlBtn {
            position: absolute;
            top: 20px; left: 20px;
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none; cursor: pointer;
            z-index: 10; font-size: 18px; 
            display: none; align-items: center; justify-content: center;
            /* ALUNA: ALTERAR CORES DO BOTÃO SUPERIOR ABAIXO */
            background-color: #FFFFFF; /* Cor da bola */
            color: #000000;            /* Cor do ícone */
            opacity: 0.7;              /* Transparência do botão */
        }

        .video-container {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        video { width: 100%; height: 100%; object-fit: contain; }

        /* --- ÁREAS DE CLIQUE (HOTSPOTS) NO FINAL --- */
        .hotspots {
            position: absolute;
            bottom: 15%; 
            width: 100%;
            display: none; 
            justify-content: space-around;
            padding: 0 10%; box-sizing: border-box;
            z-index: 20;
        }

        .btn-interativo {
            width: 110px; height: 110px;
            background: transparent; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="iniciarConvite()">
        <div class="play-icon">▶</div>
        <h2>Ative o play para a<br>magia acontecer!</h2>
    </div>

    <div class="video-container">
        <button id="controlBtn">⏸</button>

        <video id="meuVideo" playsinline preload="auto">
            <source src="video.mp4" type="video/mp4">
        </video>

        <audio id="meuAudio">
            <source src="audio.mp3" type="audio/mpeg">
        </audio>

        <div class="hotspots" id="hotspotsContainer">
            <div class="btn-interativo" onclick="confirmar()"></div>
            <div class="btn-interativo" onclick="mapa()"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('meuVideo');
        const audio = document.getElementById('meuAudio');
        const overlay = document.getElementById('overlay');
        const btn = document.getElementById('controlBtn');
        const hotspots = document.getElementById('hotspotsContainer');

        function iniciarConvite() {
            overlay.style.display = 'none';
            btn.style.display = 'flex';
            video.play();
            audio.play();
        }

        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                audio.play();
                btn.innerHTML = '⏸';
            } else {
                video.pause();
                audio.pause();
                btn.innerHTML = '▶';
            }
        });

        video.onended = function() {
            audio.pause();
            hotspots.style.display = 'flex';
        };

        function confirmar() {
            window.open('https://wa.me/5571993233142', '_blank');
        }

        function mapa() {
            window.open('https://maps.app.goo.gl/WVu3tAX2YhUYnWos7', '_blank');
        }
    </script>
</body>
</html>
