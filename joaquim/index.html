<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Interativo</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: sans-serif;
        }

        /* Container do Vídeo */
        .video-container {
            position: relative;
            width: 100vw; height: 100vh;
        }

        video {
            width: 100%; height: 100%;
            object-fit: cover; /* Ajusta o vídeo à tela */
        }

        /* Botão Play/Pause Superior Esquerdo */
        #controlBtn {
            position: absolute;
            top: 20px; left: 20px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            border: none; cursor: pointer;
            z-index: 10; display: flex;
            align-items: center; justify-content: center;
            font-size: 20px;
        }

        /* Área dos Hotspots (Invisível até o fim) */
        .hotspots {
            position: absolute;
            bottom: 15%; /* Ajustado conforme sua imagem */
            width: 100%;
            display: none; /* Escondido inicialmente */
            justify-content: space-around;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .btn-interativo {
            width: 120px; height: 120px;
            background: transparent;
            cursor: pointer;
            border-radius: 50%;
            /* Borda apenas para você visualizar onde clicar, remova se quiser */
            border: 2px dashed rgba(255,255,255,0.3); 
        }

        .btn-label {
            color: white; text-align: center;
            font-weight: bold; text-shadow: 1px 1px 2px #000;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <button id="controlBtn">⏸</button>

        <video id="meuVideo" playsinline>
            <source src="video.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>

        <div class="hotspots" id="hotspotsContainer">
            <div onclick="confirmarPresenca()">
                <div class="btn-interativo"></div>
                <div class="btn-label">Confirmar Presença</div>
            </div>
            <div onclick="verMapa()">
                <div class="btn-interativo"></div>
                <div class="btn-label">Ver Mapa</div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('meuVideo');
        const btn = document.getElementById('controlBtn');
        const hotspots = document.getElementById('hotspotsContainer');

        // Lógica de Play/Pause
        btn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                btn.innerHTML = '⏸';
            } else {
                video.pause();
                btn.innerHTML = '▶';
            }
        });

        // Quando o vídeo terminar
        video.onended = function() {
            // O vídeo para no último frame automaticamente
            hotspots.style.display = 'flex'; // Mostra os botões
        };

        function confirmarPresenca() {
            window.open('https://wa.me/5571993233142?text=Olá! Confirmo minha presença no evento.', '_blank');
        }

        function verMapa() {
            window.open('http://maps.google.com/?q=Localizacao', '_blank');
        }
    </script>
</body>
</html>
