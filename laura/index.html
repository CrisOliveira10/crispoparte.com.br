<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Laura filtro</title>
    <style>
        :root { --accent: #25D366; --record: #ff0000; --boom: #e1306c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; color: #fff; overflow: hidden; width: 100vw; height: 100dvh; font-family: sans-serif; }
        
        .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
        #camera { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        #editorCanvas, #canvasPreview, #videoPreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: black; display: none; z-index: 10; }
        #iosImageResult { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 20; display: none; }
        #molduraImagePreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 15; display: none; }
        #canvasFinal { display: none; }
        
        .ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px; }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        
        #videoTimer { background: rgba(255, 0, 0, 0.7); padding: 5px 15px; border-radius: 10px; font-weight: bold; display: none; margin-bottom: 10px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        .boom-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 25px; border-radius: 20px; display: none; z-index: 100; border: 2px solid var(--boom); text-align: center; }
        
        /* Ajuste de Hotspots - Estilo Lateral */
        .controls-bottom { display: flex; flex-direction: column; align-items: center; pointer-events: auto; width: 100%; }
        .custom-controls-wrapper { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; min-height: 150px; }
        .arte-botoes-bg { position: absolute; bottom: -20px; width: 100vw; height: auto; max-width: 500px; pointer-events: none; z-index: 1; }
        .capture-controls { position: relative; z-index: 2; display: flex; gap: 10px; align-items: center; }

        .btn-photo, .btn-boom, .btn-gallery, .btn-video { opacity: 0 !important; border: none !important; background: transparent !important; cursor: pointer; }
        .btn-gallery { width: 55px; height: 55px; }
        .btn-photo { width: 75px; height: 75px; }
        .btn-video { width: 90px; height: 90px; }
        .btn-boom { width: 65px; height: 65px; }
        
        #resultUI { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; z-index: 40; background: rgba(0,0,0,0.85); }
        .actions-box { display: flex; flex-direction: column; gap: 10px; width: 85%; pointer-events: auto; }
        .btn-res { padding: 18px; border-radius: 15px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; color: #fff; text-decoration: none; }
        
        #startScreen { position: absolute; inset: 0; background: #000 center/cover no-repeat; display: flex; align-items: center; justify-content: center; z-index: 100; }
        #startBtn { padding: 20px 40px; font-weight: bold; border: none; background: #FF5722; color: #fff; border-radius: 50px; }
    </style>
</head>
<body>

<div class="stage" id="mainStage">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="canvasFinal"></canvas>
    <video id="videoPreview" playsinline controls loop muted></video>
    <img id="iosImageResult" />
    <img id="molduraImagePreview" src="" />
    
    <div class="boom-loading" id="boomLoading">🚀 Criando seu Boomerang...</div>

    <div class="ui-layer" id="cameraUI" style="display:none;">
        <div class="top-bar"><button id="switchBtn" style="padding:10px; border-radius:20px; background:rgba(0,0,0,0.6); color:#fff; border:1px solid #fff;">🔄 INVERTER</button></div>
        <div class="controls-bottom">
            <div id="videoTimer">00:00</div>
            <div class="custom-controls-wrapper">
                <img src="botoes.png" class="arte-botoes-bg">
                <div class="capture-controls">
                    <button id="galleryBtn" class="btn-gallery"></button>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                    <button id="capturePhotoBtn" class="btn-photo"></button>
                    <button id="captureVideoBtn" class="btn-video"></button>
                    <button id="boomerangBtn" class="btn-boom"></button>
                </div>
            </div>
        </div>
    </div>

    <div id="resultUI">
        <div class="actions-box">
            <button id="downloadBtn" class="btn-res" style="background:var(--accent);">📤 COMPARTILHAR / SALVAR</button>
            <button id="newBtn" class="btn-res" style="background:#444;">🔄 VOLTAR</button>
        </div>
    </div>

    <div id="startScreen"><button id="startBtn">INICIAR CÂMERA</button></div>
</div>

<script>
// Configurações baseadas no Código 2
const CLIENTE = {
    nomeEvento: "Meu Registro",
    arquivoMoldura: "moldura1.png",
    arquivoCapa: "capajpg.jpg"
};

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
let usingFrontCamera = true, stream = null, isRecording = false, mediaRecorder = null, recordedChunks = [];
let currentFileUrl = null, boomFrames = [], currentType = 'image';

const video = document.getElementById('camera'),
      canvasFinal = document.getElementById('canvasFinal'),
      ctxFinal = canvasFinal.getContext('2d'),
      videoPreview = document.getElementById('videoPreview'),
      iosImageResult = document.getElementById('iosImageResult'),
      molduraImg = document.getElementById('molduraImagePreview');

document.getElementById('startBtn').onclick = initCamera;
document.getElementById('switchBtn').onclick = () => { usingFrontCamera = !usingFrontCamera; initCamera(); };
document.getElementById('capturePhotoBtn').onclick = takePhoto;
document.getElementById('captureVideoBtn').onclick = () => isRecording ? stopRecording() : startRecording(false);
document.getElementById('boomerangBtn').onclick = () => startRecording(true);
document.getElementById('newBtn').onclick = () => location.reload();

async function initCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: usingFrontCamera ? 'user' : 'environment', width: 1280, height: 720 },
            audio: true
        });
        video.srcObject = stream;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('cameraUI').style.display = 'flex';
        molduraImg.src = CLIENTE.arquivoMoldura;
        molduraImg.style.display = 'block';
    } catch (e) { alert("Acesso à câmera negado."); }
}

function drawFrame(ctx, w, h) {
    ctx.save();
    if (usingFrontCamera) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, w, h);
    ctx.restore();
    if (molduraImg.complete) ctx.drawImage(molduraImg, 0, 0, w, h);
}

// FUNÇÃO CHAVE: Correção para salvar no iPhone
async function handleShare(url, type) {
    try {
        const response = await fetch(url);
        const blob = await response.blob();
        const ext = type === 'image' ? 'jpg' : 'mp4';
        const mime = type === 'image' ? 'image/jpeg' : 'video/mp4';
        const file = new File([blob], `registro_${Date.now()}.${ext}`, { type: mime });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: CLIENTE.nomeEvento });
        } else {
            const a = document.createElement('a');
            a.href = url;
            a.download = `registro.${ext}`;
            a.click();
        }
    } catch (err) { alert("Use o botão de compartilhamento do navegador."); }
}

function showResult(url, type) {
    currentType = type;
    currentFileUrl = url;
    document.getElementById('resultUI').style.display = 'flex';
    document.getElementById('cameraUI').style.display = 'none';
    
    if (type === 'image') {
        iosImageResult.src = url;
        iosImageResult.style.display = 'block';
    } else {
        videoPreview.src = url;
        videoPreview.style.display = 'block';
        videoPreview.play();
    }
    document.getElementById('downloadBtn').onclick = () => handleShare(currentFileUrl, currentType);
}

function takePhoto() {
    canvasFinal.width = 1080; canvasFinal.height = 1920;
    drawFrame(ctxFinal, 1080, 1920);
    showResult(canvasFinal.toDataURL('image/jpeg', 0.95), 'image');
}

function startRecording(isBoom) {
    isRecording = true; recordedChunks = []; boomFrames = [];
    if (isBoom) {
        captureBoomerang();
    } else {
        canvasFinal.width = 720; canvasFinal.height = 1280;
        const canvasStream = canvasFinal.captureStream(30);
        // Garante suporte ao MP4 se disponível, senão WebM (o handleShare tentará converter/tratar)
        const options = { mimeType: MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm' };
        mediaRecorder = new MediaRecorder(canvasStream, options);
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/mp4' });
            showResult(URL.createObjectURL(blob), 'video');
        };
        mediaRecorder.start();
        const loop = () => { if(isRecording) { drawFrame(ctxFinal, 720, 1280); requestAnimationFrame(loop); } };
        loop();
        document.getElementById('videoTimer').style.display = 'block';
    }
}

function stopRecording() { 
    isRecording = false; 
    if(mediaRecorder) mediaRecorder.stop(); 
    document.getElementById('videoTimer').style.display = 'none';
}

function captureBoomerang() {
    const start = Date.now();
    const interval = setInterval(() => {
        if (Date.now() - start >= 1200) {
            clearInterval(interval); 
            processBoomerang();
        } else {
            const fCanvas = document.createElement('canvas');
            fCanvas.width = 720; fCanvas.height = 1280;
            fCanvas.getContext('2d').drawImage(video, 0, 0, 720, 1280);
            boomFrames.push(fCanvas);
        }
    }, 40);
}

function processBoomerang() {
    document.getElementById('boomLoading').style.display = 'block';
    const pingPong = [...boomFrames, ...[...boomFrames].reverse()];
    canvasFinal.width = 720; canvasFinal.height = 1280;
    const streamBoom = canvasFinal.captureStream(30);
    const rec = new MediaRecorder(streamBoom, { mimeType: 'video/mp4' });
    rec.ondataavailable = e => recordedChunks.push(e.data);
    rec.onstop = () => {
        document.getElementById('boomLoading').style.display = 'none';
        showResult(URL.createObjectURL(new Blob(recordedChunks, { type: 'video/mp4' })), 'video');
    };
    rec.start();
    let idx = 0;
    const play = setInterval(() => {
        if (idx >= pingPong.length) { clearInterval(play); rec.stop(); }
        else {
            ctxFinal.drawImage(pingPong[idx], 0, 0, 720, 1280);
            if (molduraImg.complete) ctxFinal.drawImage(molduraImg, 0, 0, 720, 1280);
            idx++;
        }
    }, 33);
}
</script>
</body>
</html>
