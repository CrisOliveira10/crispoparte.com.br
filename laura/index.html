<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Laura</title>
    <style>
        :root { --accent: #25D366; --record: #ff0000; --boom: #e1306c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; color: #fff; overflow: hidden; width: 100vw; height: 100dvh; font-family: sans-serif; }
        
        .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
        #camera { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        #editorCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 7; background: #000; display: none; }
        #canvasPreview, #videoPreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: black; display: none; z-index: 10; }
        #iosImageResult { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 20; display: none; pointer-events: auto; }
        #molduraImagePreview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 15; display: none; }
        #canvasFinal { display: none; }
        
        .ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 30; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 20px; }
        .top-bar { pointer-events: auto; }
        
        /* --- CONTAINER DA BARRA LATERAL --- */
        .controls-side-wrapper {
            position: absolute;
            right: 10px;    /* Distância da borda direita */
            top: 50%;       /* Centraliza verticalmente */
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
        }

        /* Imagem da arte lateral */
        .arte-botoes-bg {
            position: absolute;
            width: 100px; /* Ajuste o tamanho da largura da sua arte */
            height: auto;
            z-index: -1;
        }

        /* Grupo de botões em coluna */
        .capture-controls {
            display: flex;
            flex-direction: column; /* Ficam um embaixo do outro */
            gap: 25px;             /* Espaço entre um botão e outro */
            align-items: center;
        }

        /* --- ESTADO VISÍVEL DOS BOTÕES (MODO TESTE) --- */
        /* QUANDO TERMINAR, MUDE OPACITY PARA 0 */
        .btn-photo, .btn-boom, .btn-gallery, .btn-video { 
            opacity: 0.7 !important; 
            background: red !important; 
            border: 2px solid yellow !important;
            cursor: pointer;
            outline: none;
        }

        /* Tamanhos individuais para facilitar o ajuste */
        .btn-gallery { width: 55px; height: 55px; border-radius: 50%; }
        .btn-photo   { width: 75px; height: 75px; border-radius: 50%; }
        .btn-video   { width: 75px; height: 75px; border-radius: 50%; }
        .btn-boom    { width: 65px; height: 65px; border-radius: 50%; }

        /* Outros estilos */
        #videoTimer { background: rgba(255, 0, 0, 0.7); padding: 5px 15px; border-radius: 10px; font-weight: bold; display: none; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); }
        #resultUI { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 50px; z-index: 40; background: rgba(0,0,0,0.85); }
        .actions-box { display: flex; flex-direction: column; gap: 10px; width: 85%; pointer-events: auto; }
        .btn-res { padding: 18px; border-radius: 15px; border: none; font-weight: bold; color: #fff; cursor: pointer; text-align: center; text-decoration: none; }
        #startScreen { position: absolute; inset: 0; background-size: cover; display: flex; align-items: center; justify-content: center; z-index: 100; }
        #startBtn { padding: 20px 40px; background: #FF5722; color: #fff; border-radius: 50px; border: none; font-weight: bold; }
        .boom-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 25px; border-radius: 20px; display: none; z-index: 100; border: 2px solid var(--boom); }
    </style>
</head>
<body>

<div class="stage" id="mainStage">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="editorCanvas"></canvas>
    <canvas id="canvasFinal"></canvas>
    <video id="videoPreview" playsinline controls loop muted></video>
    <img id="iosImageResult" />
    <img id="molduraImagePreview" />
    
    <div class="boom-loading" id="boomLoading">🚀 Criando seu Boomerang...</div>

    <div class="ui-layer" id="cameraUI" style="display:none;">
        <div class="top-bar">
            <button id="switchBtn" style="padding:10px 20px; background: rgba(0,0,0,0.6); border: 1px solid #fff; border-radius: 20px; color: #fff;">🔄 INVERTER</button>
        </div>
        
        <div id="videoTimer">00:00</div>

        <div class="controls-side-wrapper">
            <img src="botoes.png" class="arte-botoes-bg">
            <div class="capture-controls">
                <button id="galleryBtn" class="btn-gallery">G</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
                <button id="capturePhotoBtn" class="btn-photo">P</button>
                <button id="captureVideoBtn" class="btn-video">V</button>
                <button id="boomerangBtn" class="btn-boom">B</button>
            </div>
        </div>
    </div>

    <div id="resultUI">
        <div class="actions-box">
            <button id="downloadBtn" class="btn-res" style="background:var(--accent);">📤 COMPARTILHAR / SALVAR</button>
            <button id="newBtn" class="btn-res" style="background:#444;">🔄 VOLTAR</button>
        </div>
    </div>

    <div id="startScreen"><button id="startBtn">INICIAR CÂMERA</button></div>
</div>

<script>
// Lógica preservada
const CLIENTE = {
    nomeEvento: "Laura",
    tituloPagina: "Laura",
    arquivoMoldura: "moldura1.png",
    arquivoCapa: "capajpg.jpg"
};

document.title = CLIENTE.tituloPagina;
document.getElementById('startScreen').style.backgroundImage = `url('${CLIENTE.arquivoCapa}')`;

let usingFrontCamera = true, stream = null, isRecording = false, mediaRecorder = null, recordedChunks = [];
let currentFileUrl = null, currentType = 'image';

const video = document.getElementById('camera'), 
      canvasFinal = document.getElementById('canvasFinal'),
      videoPreview = document.getElementById('videoPreview'),
      iosImageResult = document.getElementById('iosImageResult'),
      molduraImg = document.getElementById('molduraImagePreview'),
      fileInput = document.getElementById('fileInput');

document.getElementById('startBtn').onclick = initCamera;
document.getElementById('switchBtn').onclick = switchCamera;
document.getElementById('capturePhotoBtn').onclick = takePhoto;
document.getElementById('captureVideoBtn').onclick = () => isRecording ? stopRecording() : startRecording(false);
document.getElementById('boomerangBtn').onclick = () => startRecording(true);
document.getElementById('newBtn').onclick = resetAll;
document.getElementById('galleryBtn').onclick = () => fileInput.click();

async function initCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: usingFrontCamera ? 'user' : 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: true
        });
        video.srcObject = stream;
        video.play();
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('cameraUI').style.display = 'block';
        molduraImg.src = CLIENTE.arquivoMoldura; 
        molduraImg.style.display = 'block';
    } catch (e) { alert("Câmera não disponível."); }
}

function takePhoto() {
    canvasFinal.width = 1080; canvasFinal.height = 1920;
    const ctx = canvasFinal.getContext('2d');
    ctx.save();
    if(usingFrontCamera){ ctx.translate(1080,0); ctx.scale(-1,1); }
    ctx.drawImage(video, 0, 0, 1080, 1920);
    ctx.restore();
    if(molduraImg.complete) ctx.drawImage(molduraImg, 0, 0, 1080, 1920);
    showResult(canvasFinal.toDataURL('image/jpeg', 0.95), 'image');
}

function startRecording(isBoom) {
    isRecording = true; recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        showResult(URL.createObjectURL(blob), 'video');
    };
    mediaRecorder.start();
    if(isBoom) setTimeout(() => stopRecording(), 1500);
}

function stopRecording() { isRecording = false; if(mediaRecorder) mediaRecorder.stop(); }

function showResult(url, type) {
    document.getElementById('resultUI').style.display = 'flex';
    document.getElementById('cameraUI').style.display = 'none';
    currentType = type; currentFileUrl = url;
    if(type === 'image') { iosImageResult.src = url; iosImageResult.style.display = 'block'; videoPreview.style.display = 'none'; }
    else { videoPreview.src = url; videoPreview.style.display = 'block'; iosImageResult.style.display = 'none'; videoPreview.play(); }
    document.getElementById('downloadBtn').onclick = () => handleShare(currentFileUrl, currentType);
}

async function handleShare(url, type) {
    const response = await fetch(url);
    const blob = await response.blob();
    const file = new File([blob], `registro.${type==='image'?'jpg':'mp4'}`, {type: type==='image'?'image/jpeg':'video/mp4'});
    if (navigator.share) {
        await navigator.share({ files: [file] });
    } else {
        const a = document.createElement('a'); a.href = url; a.download = "registro"; a.click();
    }
}

function resetAll() {
    document.getElementById('resultUI').style.display = 'none';
    document.getElementById('cameraUI').style.display = 'block';
    videoPreview.pause();
}

function switchCamera() { usingFrontCamera = !usingFrontCamera; initCamera(); }
</script>
</body>
</html>
