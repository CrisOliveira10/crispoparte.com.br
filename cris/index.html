<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Filtro God is Good</title>
    <style>
        :root {
            --accent: #25D366;
            --record: #ff0000;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background: #000; color: #fff; overflow: hidden;
            width: 100vw; height: 100dvh;
            font-family: sans-serif;
        }

        .frame { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }

        #camera {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1;
        }
        #camera.mirrored { transform: scaleX(-1); }

        /* Camadas de Preview e Edição */
        #editorCanvas, #canvasPreview, #videoPreview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: contain; z-index: 6; background: #000; display: none;
        }
        
        #molduraImagePreview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; object-position: bottom; 
            pointer-events: none; z-index: 5; display: none;
        }
        
        #canvasFinal { display: none; } 

        .ui-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 20;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; pointer-events: auto; }
        
        .controls-bottom {
            display: flex; flex-direction: column; align-items: center; 
            gap: 25px; pointer-events: auto; padding-bottom: 30px;
        }

        .btn {
            padding: 12px 20px; font-size: 14px; font-weight: bold;
            border: 2px solid rgba(255,255,255,0.4); border-radius: 25px;
            background: rgba(0, 0, 0, 0.7); color: #fff; cursor: pointer;
        }
        .btn-frame { border-color: var(--accent); color: var(--accent); }

        /* UI de Edição (Galeria) */
        #editUI { display: none; z-index: 30; background: transparent; }
        .actions-edit { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; pointer-events: auto; }
        
        .action-btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-confirm { background: var(--accent); }
        .btn-cancel { background: #444; }

        .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.1s; }
        .tip { position: absolute; top: 60px; width: 100%; text-align: center; text-shadow: 0 2px 4px #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="frame">
        <div class="stage" id="stage">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="editorCanvas"></canvas>
            <canvas id="canvasPreview"></canvas>
            <canvas id="canvasFinal"></canvas>
            <video id="videoPreview" playsinline controls></video>
            
            <img id="molduraImagePreview" src="" />
            <div class="flash" id="flash"></div>

            <div class="ui-layer" id="editUI">
                <div class="tip">Arraste e use dois dedos (pinça)</div>
                <div style="flex:1"></div>
                <div class="actions-edit">
                    <button id="confirmBtn" class="action-btn btn-confirm">✅ Confirmar Ajuste</button>
                    <button id="cancelBtn" class="action-btn btn-cancel">❌ Cancelar</button>
                </div>
            </div>

            <div class="ui-layer" id="cameraUI" style="display: none;">
                <div class="top-bar">
                    <button class="btn" id="switchBtn">🔄 Inverter</button>
                </div>
                <div class="controls-bottom">
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-frame" id="m1Btn">Foto 1</button>
                        <button class="btn" id="m2Btn">Foto 2</button>
                    </div>
                    <div style="display:flex; align-items:center; gap:30px;">
                        <button id="galleryBtn" class="btn" style="font-size: 24px; border-radius: 50%; width: 60px; height: 60px;">🖼️</button>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        <button id="captureBtn" class="btn" style="font-size: 24px; border-radius: 50%; width: 60px; height: 60px;">📷</button>
                    </div>
                </div>
            </div>

            <div class="ui-layer" id="resultUI" style="display: none; justify-content: flex-end; align-items: center;">
                <div class="actions-edit">
                    <a id="downloadBtn" class="action-btn btn-confirm" style="text-decoration: none; text-align: center;">📥 Baixar Foto</a>
                    <button id="newBtn" class="action-btn btn-cancel">🔄 Nova Foto</button>
                </div>
            </div>
        </div>
    </div>

    <div id="startScreen" style="position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:100;">
        <button id="startBtn" class="btn" style="padding: 20px 40px; font-size: 18px;">INICIAR CÂMERA</button>
    </div>

    <script>
        const MOLDURAS = { 'm1': 'moldura1.png', 'm2': 'moldura2.png' };
        let currentKey = 'm1', isFront = true, stream = null;
        let galleryImg = new Image(), transform = { x: 0, y: 0, sc: 1, lx: 0, ly: 0, ld: 0 };
        let editing = false, animId = null;

        const video = document.getElementById('camera'), editor = document.getElementById('editorCanvas'), eCtx = editor.getContext('2d');
        const cFinal = document.getElementById('canvasFinal'), ctxF = cFinal.getContext('2d');
        const cPre = document.getElementById('canvasPreview'), ctxP = cPre.getContext('2d');
        const molduraImg = document.getElementById('molduraImagePreview'), fileInput = document.getElementById('fileInput');

        // EVENTOS
        document.getElementById('startBtn').onclick = () => initCamera();
        document.getElementById('switchBtn').onclick = () => { isFront = !isFront; initCamera(); };
        document.getElementById('m1Btn').onclick = (e) => setMoldura(e.target, 'm1');
        document.getElementById('m2Btn').onclick = (e) => setMoldura(e.target, 'm2');
        document.getElementById('galleryBtn').onclick = () => fileInput.click();
        document.getElementById('captureBtn').onclick = takePhoto;
        document.getElementById('confirmBtn').onclick = confirmEdit;
        document.getElementById('cancelBtn').onclick = reset;
        document.getElementById('newBtn').onclick = reset;

        fileInput.onchange = e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    galleryImg = new Image();
                    galleryImg.onload = () => {
                        editing = true;
                        video.style.display = 'none';
                        document.getElementById('cameraUI').style.display = 'none';
                        document.getElementById('editUI').style.display = 'flex';
                        editor.style.display = 'block';
                        editor.width = stage.clientWidth;
                        editor.height = stage.clientHeight;
                        
                        transform.sc = editor.width / galleryImg.width;
                        transform.x = 0;
                        transform.y = (editor.height - (galleryImg.height * transform.sc)) / 2;
                        renderEditor();
                    };
                    galleryImg.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        };

        function renderEditor() {
            if (!editing) return;
            eCtx.fillStyle = "#000";
            eCtx.fillRect(0, 0, editor.width, editor.height);
            
            // Desenha Foto (Atrás)
            eCtx.save();
            eCtx.translate(transform.x, transform.y);
            eCtx.scale(transform.sc, transform.sc);
            eCtx.imageSmoothingEnabled = true;
            eCtx.drawImage(galleryImg, 0, 0);
            eCtx.restore();

            // Desenha Moldura (FRENTE - FIXA)
            const ratio = molduraImg.naturalWidth / molduraImg.naturalHeight;
            const th = editor.width / ratio;
            eCtx.drawImage(molduraImg, 0, editor.height - th, editor.width, th);
            
            animId = requestAnimationFrame(renderEditor);
        }

        // CONTROLES DE TOQUE (SUAVES)
        editor.ontouchstart = e => {
            if (e.touches.length === 1) {
                transform.lx = e.touches[0].clientX - transform.x;
                transform.ly = e.touches[0].clientY - transform.y;
            } else if (e.touches.length === 2) {
                transform.ld = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        };

        editor.ontouchmove = e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                transform.x = e.touches[0].clientX - transform.lx;
                transform.y = e.touches[0].clientY - transform.ly;
            } else if (e.touches.length === 2) {
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const factor = (d - transform.ld) * 0.005; // Sensibilidade reduzida
                transform.sc += factor;
                if (transform.sc < 0.05) transform.sc = 0.05;
                transform.ld = d;
            }
        };

        function confirmEdit() {
            editing = false;
            flash();
            cFinal.width = 1080; cFinal.height = 1920;
            const s = 1080 / editor.width;
            
            ctxF.fillStyle = "#000"; ctxF.fillRect(0,0,1080,1920);
            ctxF.save();
            ctxF.translate(transform.x * s, transform.y * s);
            ctxF.scale(transform.sc * s, transform.sc * s);
            ctxF.drawImage(galleryImg, 0, 0);
            ctxF.restore();

            const th = 1080 / (molduraImg.naturalWidth / molduraImg.naturalHeight);
            ctxF.drawImage(molduraImg, 0, 1920 - th, 1080, th);
            finish();
        }

        function takePhoto() {
            flash();
            cFinal.width = 1080; cFinal.height = 1920;
            ctxF.save();
            if(isFront) { ctxF.translate(1080, 0); ctxF.scale(-1, 1); }
            const r = video.videoWidth / video.videoHeight;
            let dw, dh;
            if (r > (1080/1920)) { dh = 1920; dw = 1920 * r; } else { dw = 1080; dh = 1080 / r; }
            ctxF.drawImage(video, (1080-dw)/2, (1920-dh)/2, dw, dh);
            ctxF.restore();
            
            const th = 1080 / (molduraImg.naturalWidth / molduraImg.naturalHeight);
            ctxF.drawImage(molduraImg, 0, 1920 - th, 1080, th);
            finish();
        }

        function finish() {
            cFinal.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                editor.style.display = 'none'; video.style.display = 'none';
                document.getElementById('cameraUI').style.display = 'none';
                document.getElementById('editUI').style.display = 'none';
                cPre.style.display = 'block';
                document.getElementById('resultUI').style.display = 'flex';
                document.querySelector('#resultUI .actions-edit').style.display = 'flex';
                
                cPre.width = stage.clientWidth; cPre.height = stage.clientHeight;
                ctxP.drawImage(cFinal, 0, 0, cPre.width, cPre.height);
                document.getElementById('downloadBtn').href = url;
                document.getElementById('downloadBtn').download = `foto_${Date.now()}.png`;
            }, 'image/png');
        }

        function reset() {
            editing = false; cancelAnimationFrame(animId);
            editor.style.display = 'none'; cPre.style.display = 'none';
            document.getElementById('resultUI').style.display = 'none';
            document.getElementById('editUI').style.display = 'none';
            video.style.display = 'block';
            document.getElementById('cameraUI').style.display = 'flex';
            fileInput.value = "";
        }

        function setMoldura(btn, key) {
            document.querySelectorAll('.btn-frame').forEach(b => b.classList.remove('btn-frame'));
            btn.classList.add('btn-frame');
            currentKey = key; molduraImg.src = MOLDURAS[key];
            molduraImg.style.display = 'block';
        }

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: isFront ? 'user' : 'environment' } });
                video.srcObject = stream;
                video.classList.toggle('mirrored', isFront);
                document.getElementById('startScreen').style.display = 'none';
                document.getElementById('cameraUI').style.display = 'flex';
                setMoldura(document.getElementById('m1Btn'), 'm1');
            } catch (e) { alert("Permita o acesso à câmera."); }
        }

        function flash() {
            const f = document.getElementById('flash');
            f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 150);
        }
    </script>
</body>
</html>
