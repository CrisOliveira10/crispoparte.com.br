<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Filtro God is Good</title>
    <style>
        :root {
            --accent: #25D366;
            --record: #ff0000;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background: #000; color: #fff; overflow: hidden;
            width: 100vw; height: 100dvh;
            font-family: sans-serif;
        }

        .frame { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #111; }

        /* A câmera fica atrás da moldura */
        #camera {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 1;
        }
        #camera.mirrored { transform: scaleX(-1); }

        #canvasPreview, #videoPreview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: contain; 
            z-index: 10; background: #000; display: none;
        }
        
        /* A moldura visual sempre na frente da câmera */
        #molduraImagePreview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: bottom; 
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        
        #canvasFinal { display: none; } 

        /* UI */
        .ui-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 20;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        
        .controls-bottom {
            display: flex; flex-direction: column; align-items: center; 
            gap: 25px; pointer-events: auto; padding-bottom: 30px;
        }
        
        .btn {
            padding: 10px 16px; font-size: 14px; font-weight: 600;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 20px;
            background: rgba(0, 0, 0, 0.65); color: #fff; cursor: pointer;
        }
        .btn-frame { border-color: var(--accent); background: var(--accent); } 
        
        .capture-controls { display: flex; align-items: center; gap: 20px; }
        
        .action-btn-mini {
            width: 55px; height: 55px; border-radius: 50%; border: 2px solid #fff;
            background: rgba(0, 0, 0, 0.5); font-size: 24px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; color: #fff;
        }

        .action-btn-large {
            width: 80px; height: 80px; border-radius: 50%; border: 4px solid #fff;
            background: rgba(255, 255, 255, 0.2); cursor: pointer;
            transition: all 0.2s;
        }

        #startScreen {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: url('capajpg.jpg') center/cover;
        }
        #startBtn { padding: 18px 32px; font-size: 20px; background: #FF5722; color: white; border: none; border-radius: 50px; cursor: pointer; }

        .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 100; }

        #resultUI .actions { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; pointer-events: auto; }
        .action-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; color: #fff; text-align: center; }
        .btn-save { background: var(--accent); }
        .btn-new { background: #555; }
    </style>
</head>
<body>

    <div class="frame">
        <div class="stage" id="stage">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="canvasPreview"></canvas> 
            <canvas id="canvasFinal"></canvas>
            <video id="videoPreview" playsinline controls></video>
            
            <img id="molduraImagePreview" src="" /> 
            
            <div class="flash" id="flash"></div>

            <div class="ui-layer" id="cameraUI" style="display: none;">
                <div class="top-bar">
                    <button class="btn" id="switchBtn">🔄 Inverter</button>
                    <div id="recordingTimer" style="display:none; color:red; font-weight:bold;">00:00</div>
                </div>

                <div class="controls-bottom">
                    <div class="frame-selector" style="display:flex; gap:10px;">
                        <button class="btn btn-frame" id="m1Btn">Estilo 1</button> 
                        <button class="btn" id="m2Btn">Estilo 2</button> 
                    </div>

                    <div class="capture-controls">
                        <button id="galleryBtn" class="action-btn-mini" title="Pegar da Galeria">🖼️</button>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">

                        <button id="capturePhotoBtn" class="action-btn-mini">📷</button>
                        
                        <button id="captureVideoBtn" class="action-btn-large"></button>
                    </div>
                </div>
            </div>

            <div class="ui-layer" id="resultUI" style="display: none; justify-content: center; align-items: flex-end;">
                <div class="actions">
                    <a id="downloadBtn" class="action-btn btn-save">📥 Salvar Resultado</a>
                    <button id="newPhotoBtn" class="action-btn btn-new">🔄 Tirar Outra</button>
                </div>
            </div>
        </div>
    </div>

    <div id="startScreen">
        <button id="startBtn">INICIAR FILTRO</button>
    </div>

    <script>
        const MOLDURAS = { 
            'm1': 'moldura1.png', 
            'm2': 'moldura2.png' 
        };
        
        let currentMolduraKey = 'm1';
        let usingFrontCamera = true;
        let stream = null;
        let currentDownloadData = { url: null, filename: null };

        const video = document.getElementById('camera');
        const videoPreview = document.getElementById('videoPreview');
        const canvasPreview = document.getElementById('canvasPreview');
        const ctxPreview = canvasPreview.getContext('2d');
        const canvasFinal = document.getElementById('canvasFinal');
        const ctxFinal = canvasFinal.getContext('2d'); 
        const molduraImagePreview = document.getElementById('molduraImagePreview');
        const cameraUI = document.getElementById('cameraUI');
        const resultUI = document.getElementById('resultUI');
        const fileInput = document.getElementById('fileInput');

        // Selecionar Moldura
        function setMoldura(btn, key) {
            document.querySelectorAll('.frame-selector .btn').forEach(b => b.classList.remove('btn-frame'));
            if(btn) btn.classList.add('btn-frame');
            currentMolduraKey = key;
            molduraImagePreview.src = MOLDURAS[key];
            molduraImagePreview.style.display = 'block';
        }

        document.getElementById('m1Btn').addEventListener('click', (e) => setMoldura(e.target, 'm1'));
        document.getElementById('m2Btn').addEventListener('click', (e) => setMoldura(e.target, 'm2'));

        // Abrir Galeria
        document.getElementById('galleryBtn').addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        drawFinalImage(img); // Desenha a imagem da galeria
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // Tirar Foto da Câmera
        document.getElementById('capturePhotoBtn').addEventListener('click', () => {
            drawFinalImage(video, true); // Desenha o que está no vídeo
        });

        // FUNÇÃO MESTRE: Desenha a foto POR BAIXO e a moldura POR CIMA
        function drawFinalImage(source, isVideo = false) {
            flashEffect();
            
            // Definição de alta qualidade (Full HD Proporcional)
            canvasFinal.width = 1080; 
            canvasFinal.height = 1920;

            // 1. DESENHAR A FOTO (Fundo)
            ctxFinal.save();
            if (isVideo && usingFrontCamera) {
                // Espelha apenas se for foto da câmera frontal
                ctxFinal.translate(canvasFinal.width, 0);
                ctxFinal.scale(-1, 1);
            }

            const srcW = isVideo ? source.videoWidth : source.width;
            const srcH = isVideo ? source.videoHeight : source.height;
            
            const ratio = srcW / srcH;
            const targetRatio = canvasFinal.width / canvasFinal.height;
            
            let dw, dh, dx, dy;
            if (ratio > targetRatio) {
                dh = canvasFinal.height; dw = dh * ratio;
                dx = (canvasFinal.width - dw) / 2; dy = 0;
            } else {
                dw = canvasFinal.width; dh = dw / ratio;
                dx = 0; dy = (canvasFinal.height - dh) / 2;
            }
            
            ctxFinal.drawImage(source, dx, dy, dw, dh);
            ctxFinal.restore();

            // 2. DESENHAR A MOLDURA (Frente)
            // A moldura é desenhada depois, logo fica por cima de tudo
            const mW = molduraImagePreview.naturalWidth;
            const mH = molduraImagePreview.naturalHeight;
            const mTargetH = canvasFinal.width / (mW / mH);
            
            ctxFinal.drawImage(molduraImagePreview, 0, canvasFinal.height - mTargetH, canvasFinal.width, mTargetH);

            // Mostrar Preview
            canvasPreview.width = stage.clientWidth;
            canvasPreview.height = stage.clientHeight;
            ctxPreview.drawImage(canvasFinal, 0, 0, canvasPreview.width, canvasPreview.height);

            canvasFinal.toBlob(blob => {
                showResult(blob);
            }, 'image/png');
        }

        function showResult(blob) {
            const url = URL.createObjectURL(blob);
            currentDownloadData = { url, filename: `godisgood_${Date.now()}.png` };
            
            video.style.display = 'none';
            molduraImagePreview.style.display = 'none';
            cameraUI.style.display = 'none';
            
            canvasPreview.style.display = 'block';
            resultUI.style.display = 'flex';
            document.querySelector('#resultUI .actions').style.display = 'flex';
            
            document.getElementById('downloadBtn').href = url;
            document.getElementById('downloadBtn').download = currentDownloadData.filename;
        }

        function resetCamera() {
            canvasPreview.style.display = 'none';
            resultUI.style.display = 'none';
            video.style.display = 'block';
            cameraUI.style.display = 'flex';
            setMoldura(null, currentMolduraKey);
            fileInput.value = "";
        }

        // Inicialização e Câmera
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            initCamera();
        });

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: usingFrontCamera ? 'user' : 'environment', width: 1280, height: 720 },
                audio: false
            });
            video.srcObject = stream;
            video.classList.toggle('mirrored', usingFrontCamera);
            cameraUI.style.display = 'flex';
            setMoldura(document.getElementById('m1Btn'), 'm1');
        }

        document.getElementById('switchBtn').addEventListener('click', () => {
            usingFrontCamera = !usingFrontCamera;
            initCamera();
        });

        document.getElementById('newPhotoBtn').addEventListener('click', resetCamera);

        function flashEffect() {
            const f = document.getElementById('flash');
            f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 150);
        }
    </script>
</body>
</html>
