<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Filtro God is Good</title>
    <style>
        :root {
            --accent: #25D366;
            --record: #ff0000;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background: #000; color: #fff; overflow: hidden;
            width: 100vw; height: 100dvh;
            font-family: sans-serif;
        }

        .frame { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #111; }

        #camera {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: 1;
        }
        #camera.mirrored { transform: scaleX(-1); }

        #canvasPreview, #videoPreview, #editorCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: contain; 
            z-index: 6; background: #000; display: none;
        }
        
        /* Moldura visual na frente da camera */
        #molduraImagePreview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: bottom; 
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        
        #canvasFinal { display: none; } 

        .ui-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 20;
            display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; }
        
        .controls-bottom {
            display: flex; flex-direction: column; align-items: center; 
            gap: 30px; pointer-events: auto; padding-bottom: 20px;
        }
        .btn {
            padding: 10px 16px; font-size: 14px; font-weight: 600;
            border: 2px solid rgba(255,255,255,0.3); border-radius: 20px;
            background: rgba(0, 0, 0, 0.65); color: #fff; cursor: pointer;
        }
        .btn-frame { border-color: var(--accent); } 
        
        #editUI { display: none; z-index: 30; background: transparent; } /* Fundo transparente para nitidez */

        #resultUI .actions, #editUI .actions { display: none; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; pointer-events: auto; }
        .action-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; color: #fff; }
        .btn-save { background: var(--accent); }
        .btn-new { background: #555; }
        .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 100; }
        
        .tip-edit { position: absolute; top: 10%; width: 100%; text-align: center; color: #fff; font-size: 16px; font-weight: bold; text-shadow: 0 2px 4px #000; pointer-events: none; }
    </style>
</head>
<body>

    <div class="frame">
        <div class="stage" id="stage">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="editorCanvas"></canvas>
            <canvas id="canvasPreview"></canvas> 
            <canvas id="canvasFinal"></canvas>
            <video id="videoPreview" playsinline controls></video>
            
            <img id="molduraImagePreview" src="" /> 
            <div class="flash" id="flash"></div>

            <div class="ui-layer" id="editUI">
                <div class="tip-edit">Ajuste sua foto na moldura</div>
                <div style="flex:1"></div>
                <div class="actions" style="display: flex;">
                    <button id="confirmEditBtn" class="action-btn btn-save">✅ Confirmar Agora</button>
                    <button id="cancelEditBtn" class="action-btn btn-new">❌ Cancelar</button>
                </div>
            </div>

            <div class="ui-layer" id="cameraUI" style="display: none;">
                <div class="top-bar">
                    <button class="btn" id="switchBtn">🔄 Inverter</button>
                    <div id="recordingTimer" style="display:none; color:red; font-weight:bold;">00:00</div>
                </div>
                <div class="controls-bottom">
                    <div class="frame-selector" style="display:flex; gap:10px;">
                        <button class="btn btn-frame" id="m1Btn">Estilo 1</button> 
                        <button class="btn" id="m2Btn">Estilo 2</button> 
                    </div>
                    <div class="capture-controls" style="display:flex; align-items:center; gap:20px; pointer-events:auto;">
                        <button id="galleryBtn" class="btn" style="font-size: 24px;">🖼️</button>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        <button id="capturePhotoBtn" class="btn" style="font-size: 24px;">📷</button>
                    </div>
                </div>
            </div>

            <div class="ui-layer" id="resultUI" style="display: none; justify-content: center; align-items: flex-end;">
                <div class="actions">
                    <a id="downloadBtn" class="action-btn btn-save">📥 Salvar na Galeria</a>
                    <button id="newPhotoBtn" class="action-btn btn-new">🔄 Outra Foto</button>
                </div>
            </div>
        </div>
    </div>

    <div id="startScreen" style="position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:100;">
        <button id="startBtn" class="btn" style="padding: 20px 40px; font-size: 20px;">ABRIR CÂMERA</button>
    </div>

    <script>
        const MOLDURAS = { 'm1': 'moldura1.png', 'm2': 'moldura2.png' };
        let currentMolduraKey = 'm1', usingFrontCamera = true, stream = null;
        let galleryImg = new Image(), imgTransform = { x: 0, y: 0, scale: 1, lastX: 0, lastY: 0, lastDist: 0 };
        let isEditing = false, animationFrameId = null;

        const video = document.getElementById('camera'), editorCanvas = document.getElementById('editorCanvas'), editorCtx = editorCanvas.getContext('2d');
        const canvasPreview = document.getElementById('canvasPreview'), ctxPreview = canvasPreview.getContext('2d');
        const canvasFinal = document.getElementById('canvasFinal'), ctxFinal = canvasFinal.getContext('2d');
        const molduraImagePreview = document.getElementById('molduraImagePreview'), cameraUI = document.getElementById('cameraUI');
        const editUI = document.getElementById('editUI'), resultUI = document.getElementById('resultUI'), fileInput = document.getElementById('fileInput');

        document.getElementById('startBtn').addEventListener('click', () => initCamera());
        document.getElementById('switchBtn').addEventListener('click', () => { usingFrontCamera = !usingFrontCamera; initCamera(); });
        document.getElementById('m1Btn').addEventListener('click', (e) => setMoldura(e.target, 'm1'));
        document.getElementById('m2Btn').addEventListener('click', (e) => setMoldura(e.target, 'm2'));
        document.getElementById('galleryBtn').addEventListener('click', () => fileInput.click());
        document.getElementById('capturePhotoBtn').addEventListener('click', takePhoto);
        document.getElementById('confirmEditBtn').addEventListener('click', confirmEdit);
        document.getElementById('cancelEditBtn').addEventListener('click', resetCamera);
        document.getElementById('newPhotoBtn').addEventListener('click', resetCamera);

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    galleryImg = new Image();
                    galleryImg.onload = startEditor;
                    galleryImg.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        function startEditor() {
            isEditing = true;
            cameraUI.style.display = 'none';
            editUI.style.display = 'flex';
            editorCanvas.style.display = 'block';
            video.style.display = 'none';
            editorCanvas.width = stage.clientWidth;
            editorCanvas.height = stage.clientHeight;

            const ratio = galleryImg.width / galleryImg.height;
            imgTransform.scale = editorCanvas.width / galleryImg.width;
            imgTransform.x = 0;
            imgTransform.y = (editorCanvas.height - (galleryImg.height * imgTransform.scale)) / 2;
            drawEditor();
        }

        function drawEditor() {
            if (!isEditing) return;
            editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
            editorCtx.imageSmoothingEnabled = true;
            
            editorCtx.save();
            editorCtx.translate(imgTransform.x, imgTransform.y);
            editorCtx.scale(imgTransform.scale, imgTransform.scale);
            editorCtx.drawImage(galleryImg, 0, 0);
            editorCtx.restore();

            const mRatio = molduraImagePreview.naturalWidth / molduraImagePreview.naturalHeight;
            const th = editorCanvas.width / mRatio;
            editorCtx.drawImage(molduraImagePreview, 0, editorCanvas.height - th, editorCanvas.width, th);
            
            animationFrameId = requestAnimationFrame(drawEditor);
        }

        // TOUCH CONTROLS
        editorCanvas.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                imgTransform.lastX = e.touches[0].clientX - imgTransform.x;
                imgTransform.lastY = e.touches[0].clientY - imgTransform.y;
            } else if (e.touches.length === 2) {
                imgTransform.lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        });
        editorCanvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 1) {
                imgTransform.x = e.touches[0].clientX - imgTransform.lastX;
                imgTransform.y = e.touches[0].clientY - imgTransform.lastY;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                imgTransform.scale *= (dist / imgTransform.lastDist);
                imgTransform.lastDist = dist;
            }
        }, { passive: false });

        function confirmEdit() {
            isEditing = false;
            cancelAnimationFrame(animationFrameId);
            flashEffect();
            canvasFinal.width = 1080; canvasFinal.height = 1920;
            const fScale = 1080 / editorCanvas.width;
            
            ctxFinal.fillStyle = "#000"; ctxFinal.fillRect(0,0,1080,1920);
            ctxFinal.save();
            ctxFinal.translate(imgTransform.x * fScale, imgTransform.y * fScale);
            ctxFinal.scale(imgTransform.scale * fScale, imgTransform.scale * fScale);
            ctxFinal.drawImage(galleryImg, 0, 0);
            ctxFinal.restore();

            const mRatio = molduraImagePreview.naturalWidth / molduraImagePreview.naturalHeight;
            const th = 1080 / mRatio;
            ctxFinal.drawImage(molduraImagePreview, 0, 1920 - th, 1080, th);
            
            canvasFinal.toBlob(blob => showResult(blob), 'image/png');
        }

        function takePhoto() {
            flashEffect();
            canvasFinal.width = 1080; canvasFinal.height = 1920;
            ctxFinal.save();
            if(usingFrontCamera) { ctxFinal.translate(1080, 0); ctxFinal.scale(-1, 1); }
            const ratio = video.videoWidth / video.videoHeight;
            let dw, dh;
            if (ratio > (1080/1920)) { dh = 1920; dw = 1920 * ratio; } else { dw = 1080; dh = 1080 / ratio; }
            ctxFinal.drawImage(video, (1080-dw)/2, (1920-dh)/2, dw, dh);
            ctxFinal.restore();
            
            const mRatio = molduraImagePreview.naturalWidth / molduraImagePreview.naturalHeight;
            const th = 1080 / mRatio;
            ctxFinal.drawImage(molduraImagePreview, 0, 1920 - th, 1080, th);
            canvasFinal.toBlob(blob => showResult(blob), 'image/png');
        }

        function showResult(blob) {
            const url = URL.createObjectURL(blob);
            editorCanvas.style.display = 'none'; video.style.display = 'none';
            cameraUI.style.display = 'none'; editUI.style.display = 'none';
            canvasPreview.style.display = 'block'; resultUI.style.display = 'flex';
            document.querySelector('#resultUI .actions').style.display = 'flex';
            canvasPreview.width = stage.clientWidth; canvasPreview.height = stage.clientHeight;
            ctxPreview.drawImage(canvasFinal, 0, 0, canvasPreview.width, canvasPreview.height);
            document.getElementById('downloadBtn').href = url;
            document.getElementById('downloadBtn').download = `filtro_${Date.now()}.png`;
        }

        function resetCamera() {
            isEditing = false; cancelAnimationFrame(animationFrameId);
            editorCanvas.style.display = 'none'; canvasPreview.style.display = 'none';
            resultUI.style.display = 'none'; editUI.style.display = 'none';
            video.style.display = 'block'; cameraUI.style.display = 'flex';
            fileInput.value = "";
        }

        function setMoldura(btn, key) {
            document.querySelectorAll('.btn-frame').forEach(b => b.classList.remove('btn-frame'));
            if(btn) btn.classList.add('btn-frame');
            currentMolduraKey = key; molduraImagePreview.src = MOLDURAS[key];
            molduraImagePreview.style.display = 'block';
        }

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: usingFrontCamera ? 'user' : 'environment' }, audio: false });
            video.srcObject = stream;
            document.getElementById('startScreen').style.display = 'none';
            cameraUI.style.display = 'flex';
            setMoldura(document.getElementById('m1Btn'), 'm1');
        }

        function flashEffect() {
            const f = document.getElementById('flash');
            f.style.opacity = '1'; setTimeout(() => f.style.opacity = '0', 150);
        }
    </script>
</body>
</html>
