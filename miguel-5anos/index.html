<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Convite Miguel 5 Anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

/* ===== CENAS ===== */
.cena{
  position:absolute;
  inset:0;
  display:none;
  z-index: 1;
}

.cena.active{
  display:block;
}

video,img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== HOTSPOTS GERAIS ===== */
.hotspot{
  position:absolute;
  cursor:pointer;
  z-index: 5;
}

.hotspot-full{
  inset:0;
  background: transparent;
}

/* ===== MENU LATERAL ===== */
.menu-container{
  position:absolute;
  right:0;              
  top:55%; 
  transform:translateY(-50%);
  width: 350px;        
  z-index:20;
  display: none;        
  flex-direction: column;
  gap: 25px; 
  align-items: flex-end;

  background-image: url("media/menu-botoes.png");
  background-size: 140%; 
  background-repeat: no-repeat;
  background-position: right center;
}

.menu-btn{
  width: 350px;        
  height: 150px; 
  cursor: pointer;
  display: block;
}

/* ===== TOPO E CRONÔMETRO (ATUALIZADO PARA ALINHAMENTO) ===== */
.top-bar{
  position:absolute;
  top:0;
  width:100%;
  height:120px; /* Aumentado ligeiramente para acomodar o cronômetro complexo */
  z-index:10;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
}

.hotspot-audio, .hotspot-menu, .hotspot-back{
  pointer-events: auto;
}

.hotspot-audio, .hotspot-menu{
  width:80px;
  height:80px;
}

/* Estrutura refinada do cronômetro */
#timer-complex {
  width: 100%;
  max-width: 400px; /* Limitar largura */
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
  z-index: 15;
  pointer-events: none;
  background: rgba(139, 0, 0, 0.7); /* Fundo sutil para destacar a área */
  border-radius: 15px;
  padding: 10px 0;
}

#timer-complex .timer-title {
  font-size: 14px;
  margin-bottom: 10px;
}

#timer-complex .timer-blocks-container {
  display: flex;
  width: 100%;
  justify-content: space-around;
  align-items: flex-start; /* Alinhar números no topo */
}

#timer-complex .timer-block {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#timer-complex .timer-num {
  font-size: 36px;
  font-weight: bold;
}

#timer-complex .timer-label {
  font-size: 10px;
  text-transform: uppercase;
  margin-top: 5px; /* REBAIXAMENTO DAS LEGENDAS */
}

/* Antigo timer de fallback, agora escondido */
#timer{
  display: none;
}

/* ===== RODAPÉ ===== */
.bottom-bar{
  position:absolute;
  bottom:0;
  width:100%;
  height:120px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

.bottom-bar a{
  width:120px;
  height:120px;
}

.hotspot-back{
  top:0;
  right:120px;
  width:120px;
  height:120px;
}

@media(max-width:768px){
  .top-bar { height: 100px; }
  #timer-complex { max-width: 320px; }
  #timer-complex .timer-num { font-size: 30px; }
  .hotspot-menu, .hotspot-back{ right:50px; }
  .menu-container { width: 300px; }
  .menu-btn { width: 300px; height: 110px; }
}
</style>
</head>

<body>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<section id="cena1" class="cena active">
  <video src="media/video1.mp4" autoplay muted playsinline loop></video>
  <div class="hotspot hotspot-full" onclick="iniciarTudo()"></div>
</section>

<section id="cena2" class="cena">
  <video id="video2" src="media/video2.mp4" autoplay muted playsinline></video>

  <div class="top-bar">
    <div class="hotspot hotspot-audio" onclick="toggleAudio()"></div>
    
    <div id="timer-complex">
        <div class="timer-title">Nossa diversão começa em:</div>
        <div class="timer-blocks-container">
            <div class="timer-block">
                <span class="timer-num" id="dias-num">00</span>
                <span class="timer-label">DIAS</span>
            </div>
            <div class="timer-block">
                <span class="timer-num" id="horas-num">00</span>
                <span class="timer-label">HORAS</span>
            </div>
            <div class="timer-block">
                <span class="timer-num" id="min-num">00</span>
                <span class="timer-label">MIN</span>
            </div>
            <div class="timer-block">
                <span class="timer-num" id="seg-num">00</span>
                <span class="timer-label">SEG</span>
            </div>
        </div>
    </div>
    
    <div id="timer"></div> 
    
    <div class="hotspot hotspot-menu" onclick="toggleMenu()"></div>
  </div>

  <div id="menu" class="menu-container">
    <a class="menu-btn" href="https://maps.app.goo.gl/jmbXcW447N8cxpAK7" target="_blank"></a>
    <div class="menu-btn" onclick="goToCena(3)"></div>
    <div class="menu-btn" onclick="goToCena(4)"></div>
  </div>

  <div class="bottom-bar">
    <a href="https://forms.gle/ywTGBg1NVGu73hKA6" target="_blank"></a>
    <a href="https://forms.gle/ZraNk1GqcFL4MaSR9" target="_blank"></a>
  </div>
</section>

<section id="cena3" class="cena">
  <img src="media/cena3.png">
  <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
</section>

<section id="cena4" class="cena">
  <img src="media/cena4.png">
  <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
</section>

<script>
// --- FUNÇÕES DO CONVITE ---
const audio = document.getElementById("bgAudio");
let audioStarted = false;

function iniciarTudo() {
  audio.play().then(() => { audioStarted = true; }).catch(e => console.log(e));
  goToCena(2);
}

function goToCena(n, voltarFinal = false){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".cena").forEach(c => c.classList.remove("active"));
  document.getElementById("cena"+n).classList.add("active");

  const v2 = document.getElementById("video2");
  if(n === 2) {
    if(voltarFinal) {
      v2.currentTime = 6; 
      // Não precisamos mais do bloco timer simples, mas para fallback...
      document.getElementById("timer").style.display = "none"; 
    } else {
      v2.currentTime = 0;
    }
    v2.play();
  } else {
    v2.pause();
  }
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  if (menu.style.display === "none" || menu.style.display === "") {
    menu.style.display = "flex";
  } else {
    menu.style.display = "none";
  }
}

function toggleAudio(){
  audio.paused ? audio.play() : audio.pause();
}

const eventDate = new Date("2026-09-08T16:30:00");
// Elementos do novo cronômetro complexo
const segNum = document.getElementById("seg-num");
const minNum = document.getElementById("min-num");
const horasNum = document.getElementById("horas-num");
const diasNum = document.getElementById("dias-num");

setInterval(()=>{
  const now = new Date();
  const diff = eventDate - now;
  if(diff <= 0){
    // Tratar o fim da contagem regressiva se necessário
    segNum.innerText = "00";
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff/3600000)%24;
  const m = Math.floor(diff/60000)%60;
  const s = Math.floor(diff/1000)%60;
  
  // Atualizar os elementos complexos
  diasNum.innerText = d.toString().padStart(2, '0');
  horasNum.innerText = h.toString().padStart(2, '0');
  minNum.innerText = m.toString().padStart(2, '0');
  segNum.innerText = s.toString().padStart(2, '0');
  
}, 1000);

// Segurança
(function() {
    // Bloqueia clique direito
    document.addEventListener('contextmenu', e => e.preventDefault());
    
    // Bloqueia F12, Ctrl+U, Ctrl+Shift+I, Ctrl+C e Ctrl+S
    document.addEventListener('keydown', function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85) || 
           (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
           (e.ctrlKey && e.keyCode == 67) || (e.ctrlKey && e.keyCode == 83)) {
            e.preventDefault();
            return false;
        }
    });

    // Mensagem de alerta no Console
    console.log("%c Protegido pela Lei 9.610/98 - Autoria: Cristiane Oliveira ", "color: white; background: red; font-weight: bold; font-size: 14px;");
    console.log("A cópia não autorizada deste código é proibida.");
})();
</script>

</body>
</html>
