<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Miguel 5 anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== CONTAINER 9:16 ===== */
.media-wrapper {
  position: relative;
  height: 100dvh;
  width: 56.25dvh; 
  max-width: 100vw;
  max-height: 177.77vw; 
  background: #000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cena {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 1;
}

.cena.active {
  display: block;
}

video, img {
  width: 100%;
  height: 100%;
  object-fit: contain; 
  pointer-events: none;
}

/* ===== HOTSPOTS ===== */
.hotspot {
  position: absolute;
  cursor: pointer;
  z-index: 10;
}

.hotspot-full {
  inset: 0;
  z-index: 5;
}

/* ===== TOPO ===== */
.top-bar {
  position: absolute;
  top: 0;
  width: 100%;
  height: 15%;
  z-index: 15;
  pointer-events: none;
}

.hotspot-audio {
  left: 0;
  top: 0;
  width: 25%;
  height: 100%;
  pointer-events: auto;
}

.hotspot-menu {
  right: 0;
  top: 0;
  width: 25%;
  height: 100%;
  pointer-events: auto;
}

/* ===== CRONÔMETRO CIRÚRGICO ===== */
#timer {
  position: absolute;
  /* 1. CONTROLA A ALTURA DE TUDO JUNTO */
  /* Aumente este valor (ex: 8%, 9%, 10%) para descer TODO o bloco para dentro da faixa vermelha */
  top: 10%; 
  left: 50%;
  transform: translateX(-50%);
  width: 65%; 
  color: #fff;
  text-align: center;
  z-index: 20;
  display: none; 
}

.t-title {
  font-size: 1.8vw; /* Texto menor para caber na pílula */
  font-weight: normal;
  margin-bottom: 0; /* Zerei o espaço para ficar colado nos números */
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

.t-nums {
  font-size: 5vw; /* Números ligeiramente menores para dar espaço ao título */
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}

.t-labels {
  font-size: 1.5vw; /* Legendas delicadas */
  display: flex;
  justify-content: space-around;
  width: 85%;
  margin: 0 auto; /* Zerei a margem para ficar colado embaixo dos números */
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  opacity: 0.9;
}
/* ===== MENU LATERAL COLADO NA DIREITA ===== */
.menu-container {
  position: absolute;
  right: 0; /* Colado perfeitamente na borda direita */
  top: 50%;
  transform: translateY(-50%);
  width: 60%; /* Largura ajustada para englobar os botões */
  height: 60%; 
  z-index: 30;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  
  background-image: url("media/menu-botoes.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center right; /* Imagem travada na direita */
}

/* Áreas de clique invisíveis dos botões do menu */
.menu-btn {
  width: 100%;
  height: 25%; 
  margin-bottom: 5%;
  cursor: pointer;
}
.menu-btn:last-child {
  margin-bottom: 0;
}

/* ===== RODAPÉ ===== */
.bottom-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 15%;
  display: flex;
  justify-content: space-between;
  z-index: 15;
}

.bottom-bar a {
  width: 30%;
  height: 100%;
}

.hotspot-back {
  top: 5%;
  right: 5%;
  width: 20%;
  height: 10%;
}

@media (min-width: 769px) {
  .t-title { font-size: 12px; }
  .t-nums { font-size: 26px; }
  .t-labels { font-size: 10px; }
}
</style>
</head>

<body>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<div class="media-wrapper">
  
  <section id="cena1" class="cena active">
    <video src="media/video1.mp4" autoplay muted playsinline loop></video>
    <div class="hotspot hotspot-full" onclick="iniciarTudo()"></div>
  </section>

  <section id="cena2" class="cena">
    <video id="video2" src="media/video2.mp4" playsinline></video>

    <div class="top-bar">
      <div class="hotspot hotspot-audio" onclick="toggleAudio()"></div>
      <div id="timer"></div>
      <div class="hotspot hotspot-menu" onclick="toggleMenu()"></div>
    </div>

    <div id="menu" class="menu-container">
      <a class="menu-btn" href="https://maps.app.goo.gl/AZBjKdxYEqVsC6N38" target="_blank"></a>
      <div class="menu-btn" onclick="goToCena(3)"></div>
      <div class="menu-btn" onclick="goToCena(4)"></div>
    </div>

    <div class="bottom-bar">
      <a href="https://forms.gle/j1xWuV1bQKevcKWZ8" target="_blank"></a>
      <a href="https://forms.gle/gCTygBPyy5mx22aZA" target="_blank"></a>
    </div>
  </section>

  <section id="cena3" class="cena">
    <img src="media/cena3.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

  <section id="cena4" class="cena">
    <img src="media/cena4.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

</div>

<script>
const audio = document.getElementById("bgAudio");
const video2 = document.getElementById("video2");
const timerDiv = document.getElementById("timer");

// ATENÇÃO: Ajuste a data para o futuro para o cronômetro funcionar
const eventDate = new Date("2026-12-31T17:00:00"); 

function iniciarTudo() {
  audio.volume = 1.0;
  audio.play().then(() => { 
    goToCena(2);
  }).catch(() => {
    goToCena(2); 
  });
}

function goToCena(n, voltarFinal = false){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".cena").forEach(c => c.classList.remove("active"));
  document.getElementById("cena"+n).classList.add("active");

  if(n === 2) {
    if(voltarFinal) {
      video2.currentTime = 6; 
      timerDiv.style.display = "block";
      audio.volume = 1.0;
    } else {
      video2.currentTime = 0;
      video2.play().catch(e => console.log(e));
      timerDiv.style.display = "none";
      audio.volume = 0.2;
    }
  } else {
    video2.pause();
    audio.volume = 1.0;
  }
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "flex" : "none";
}

function toggleAudio(){
  audio.paused ? audio.play() : audio.pause();
}

video2.addEventListener("ended", () => {
  timerDiv.style.display = "block";
  audio.volume = 1.0; 
});

// --- LÓGICA DO CRONÔMETRO COM AS 3 LINHAS ---
setInterval(()=>{
  const now = new Date();
  const diff = eventDate - now;
  
  if(diff <= 0){
    timerDiv.innerHTML = "<div class='t-title' style='font-size: 4vw; font-weight: bold; margin-top:2vh;'>A diversão já começou!</div>";
    return;
  }
  
  // O .padStart(2, '0') garante que sempre tenha 2 dígitos (ex: 03 em vez de apenas 3)
  const d = Math.floor(diff/86400000).toString().padStart(2, '0');
  const h = Math.floor((diff/3600000)%24).toString().padStart(2, '0');
  const m = Math.floor((diff/60000)%60).toString().padStart(2, '0');
  const s = Math.floor((diff/1000)%60).toString().padStart(2, '0');
  
  // Injeta o HTML delicado no timer
  timerDiv.innerHTML = `
    <div class="t-title">Nossa diversão começa em:</div>
    <div class="t-nums">${d} : ${h} : ${m} : ${s}</div>
    <div class="t-labels">
      <span>DIAS</span>
      <span>HORAS</span>
      <span>MIN</span>
      <span>SEG</span>
    </div>
  `;
}, 1000);

// Segurança
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) e.preventDefault();
    });
})();
</script>

</body>
</html>
