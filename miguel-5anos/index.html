<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Miguel 5 anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body {
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== CONTAINER 9:16 (O SEGREDO DO ENCAIXE) ===== */
.media-wrapper {
  position: relative;
  /* Garante que o container seja sempre 9:16 baseado na altura disponível */
  height: 100dvh;
  width: 56.25dvh; /* (9 / 16) * 100 */
  max-width: 100vw;
  max-height: 177.77vw; /* (16 / 9) * 100 */
  background: #000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cena {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 1;
}

.cena.active {
  display: block;
}

video, img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* Garante que a arte não corte */
  pointer-events: none;
}

/* ===== HOTSPOTS EM % (RELATIVOS AO WRAPPER) ===== */
.hotspot {
  position: absolute;
  cursor: pointer;
  z-index: 10;
  /* background: rgba(255,0,0,0.3); /* Remova o comentário para testar o posicionamento */
}

.hotspot-full {
  inset: 0;
  z-index: 5;
}

/* Top Bar e Cronómetro */
.top-bar {
  position: absolute;
  top: 0;
  width: 100%;
  height: 15%;
  z-index: 15;
  pointer-events: none;
}

.hotspot-audio {
  left: 0;
  top: 0;
  width: 25%;
  height: 100%;
  pointer-events: auto;
}

.hotspot-menu {
  right: 0;
  top: 0;
  width: 25%;
  height: 100%;
  pointer-events: auto;
}

#timer {
  position: absolute;
  top: 40%; /* Ajustado para centralizar na área do topo */
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 5.5vw; /* Tamanho responsivo */
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  z-index: 20;
  display: none; /* Aparece via JS */
  white-space: nowrap;
}

/* ===== MENU LATERAL CORRIGIDO ===== */
.menu-container {
  position: absolute;
  right: 2%;
  top: 50%;
  transform: translateY(-50%);
  width: 65%;
  height: 45%; /* Altura definida para a imagem aparecer */
  z-index: 30;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  gap: 2%;
  
  background-image: url("media/menu-botoes.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center right;
}

.menu-btn {
  width: 90%;
  height: 28%; /* Divide o espaço entre os botões da imagem */
  cursor: pointer;
}

/* Rodapé */
.bottom-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 15%;
  display: flex;
  justify-content: space-between;
  z-index: 15;
}

.bottom-bar a {
  width: 30%;
  height: 100%;
}

.hotspot-back {
  top: 5%;
  right: 5%;
  width: 20%;
  height: 10%;
}

@media (min-width: 769px) {
  #timer { font-size: 24px; }
}
</style>
</head>

<body>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<div class="media-wrapper">
  
  <section id="cena1" class="cena active">
    <video src="media/video1.mp4" autoplay muted playsinline loop></video>
    <div class="hotspot hotspot-full" onclick="iniciarTudo()"></div>
  </section>

  <section id="cena2" class="cena">
    <video id="video2" src="media/video2.mp4" playsinline></video>

    <div class="top-bar">
      <div class="hotspot hotspot-audio" onclick="toggleAudio()"></div>
      <div id="timer"></div>
      <div class="hotspot hotspot-menu" onclick="toggleMenu()"></div>
    </div>

    <div id="menu" class="menu-container">
      <a class="menu-btn" href="https://maps.google.com" target="_blank"></a>
      <div class="menu-btn" onclick="goToCena(3)"></div>
      <div class="menu-btn" onclick="goToCena(4)"></div>
    </div>

    <div class="bottom-bar">
      <a href="https://forms.gle/j1xWuV1bQKevcKWZ8" target="_blank"></a>
      <a href="https://forms.gle/gCTygBPyy5mx22aZA" target="_blank"></a>
    </div>
  </section>

  <section id="cena3" class="cena">
    <img src="media/cena3.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

  <section id="cena4" class="cena">
    <img src="media/cena4.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

</div>

<script>
const audio = document.getElementById("bgAudio");
const video2 = document.getElementById("video2");
const timerDiv = document.getElementById("timer");

// ATENÇÃO: Ajustei a data para o futuro para o cronómetro funcionar no teste
const eventDate = new Date("2026-12-31T17:00:00"); 

function iniciarTudo() {
  audio.volume = 1.0;
  audio.play().then(() => { 
    goToCena(2);
  }).catch(() => {
    goToCena(2); 
  });
}

function goToCena(n, voltarFinal = false){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".cena").forEach(c => c.classList.remove("active"));
  document.getElementById("cena"+n).classList.add("active");

  if(n === 2) {
    if(voltarFinal) {
      video2.currentTime = 6; 
      timerDiv.style.display = "block";
      audio.volume = 1.0;
    } else {
      video2.currentTime = 0;
      video2.play().catch(e => console.log(e));
      timerDiv.style.display = "none"; // Esconde enquanto o personagem fala
      audio.volume = 0.2;
    }
  } else {
    video2.pause();
    audio.volume = 1.0;
  }
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "flex" : "none";
}

function toggleAudio(){
  audio.paused ? audio.play() : audio.pause();
}

video2.addEventListener("ended", () => {
  timerDiv.style.display = "block";
  audio.volume = 1.0; 
});

// Lógica do Cronómetro
setInterval(()=>{
  const now = new Date();
  const diff = eventDate - now;
  if(diff <= 0){
    timerDiv.innerText = "É hoje!";
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff/3600000)%24;
  const m = Math.floor(diff/60000)%60;
  const s = Math.floor(diff/1000)%60;
  timerDiv.innerText = `${d}d ${h}h ${m}m ${s}s`;
}, 1000);

// Segurança
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) e.preventDefault();
    });
})();
</script>

</body>
</html>
