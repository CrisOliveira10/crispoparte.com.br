<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Convite Miguel 5 Anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body {
  width: 100%;
  /* Uso de dvh para evitar cortes no Safari mobile */
  height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== CONTAINER 9:16 (O SEGREDO DA RESPONSIVIDADE) ===== */
.media-wrapper {
  position: relative;
  height: 100dvh;
  width: 56.25dvh; 
  max-width: 100vw;
  max-height: 177.77vw;
  background: #000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cena {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 1;
}

.cena.active {
  display: block;
}

/* Object-fit contain para a arte nunca ser cortada */
video, img {
  width: 100%;
  height: 100%;
  object-fit: contain; 
  pointer-events: none;
}

/* ===== HOTSPOTS EM % ===== */
.hotspot {
  position: absolute;
  cursor: pointer;
  z-index: 10;
}

.hotspot-full {
  inset: 0;
  z-index: 5;
}

/* ===== TOPO E BOTÕES ===== */
.top-bar {
  position: absolute;
  top: 0;
  width: 100%;
  height: 15%; 
  z-index: 25; 
  pointer-events: none;
}

.hotspot-audio, .hotspot-menu, .hotspot-back {
  pointer-events: auto;
}

.hotspot-audio {
  left: 0;
  top: 0;
  width: 25%; 
  height: 100%;
}

.hotspot-menu {
  right: 0; 
  top: 0;
  width: 25%; 
  height: 100%;
}

/* ===== CRONÔMETRO LIMPO E CENTRALIZADO ===== */
#timer-complex {
  position: absolute;
  top: 20%; /* Ajuste aqui para subir ou baixar o bloco no topo */
  left: 50%;
  transform: translateX(-50%);
  width: 60%; 
  display: none; /* Só aparece após o vídeo */
  flex-direction: column;
  align-items: center;
  color: #fff;
  z-index: 20;
  pointer-events: none;
}

#timer-complex .timer-blocks-container {
  display: flex;
  width: 100%;
  /* Centraliza e junta os números */
  justify-content: center; 
  gap: 6%; /* Aumente ou diminua aqui para separar ou juntar mais os números */
}

#timer-complex .timer-block {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#timer-complex .timer-num {
  /* Fonte inteligente: cresce no telemóvel, trava no PC */
  font-size: clamp(18px, 5.5vw, 3dvh); 
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}

#timer-complex .timer-label {
  font-size: clamp(8px, 1.5vw, 1.2dvh);
  margin-top: 1px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  opacity: 0.9;
}

/* ===== MENU LATERAL COLADO NA DIREITA ===== */
.menu-container {
  position: absolute;
  right: 0; 
  top: 50%; 
  transform: translateY(-50%);
  width: 60%; 
  height: 60%; 
  z-index: 30;
  display: none;        
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  gap: 2%;

  background-image: url("media/menu-botoes.png");
  background-size: contain; 
  background-repeat: no-repeat;
  background-position: right center;
}

.menu-btn {
  width: 100%;        
  height: 25%; 
  cursor: pointer;
}

/* ===== RODAPÉ ===== */
.bottom-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 12%;
  display: flex;
  justify-content: space-between;
  z-index: 15;
}

.bottom-bar a {
  width: 30%;
  height: 100%;
}

.hotspot-back {
  top: 5%;
  right: 5%;
  width: 20%;
  height: 10%;
}
</style>
</head>

<body>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<div class="media-wrapper">

  <section id="cena1" class="cena active">
    <video src="media/video1.mp4" autoplay muted playsinline loop></video>
    <div class="hotspot hotspot-full" onclick="iniciarTudo()"></div>
  </section>

  <section id="cena2" class="cena">
    <video id="video2" src="media/video2.mp4" playsinline></video>

    <div class="top-bar">
      <div class="hotspot hotspot-audio" onclick="toggleAudio()"></div>
      
      <div id="timer-complex">
          <div class="timer-blocks-container">
              <div class="timer-block">
                  <span class="timer-num" id="dias-num">00</span>
                  <span class="timer-label">DIAS</span>
              </div>
              <div class="timer-block">
                  <span class="timer-num" id="horas-num">00</span>
                  <span class="timer-label">HORAS</span>
              </div>
              <div class="timer-block">
                  <span class="timer-num" id="min-num">00</span>
                  <span class="timer-label">MIN</span>
              </div>
              <div class="timer-block">
                  <span class="timer-num" id="seg-num">00</span>
                  <span class="timer-label">SEG</span>
              </div>
          </div>
      </div>

      <div class="hotspot hotspot-menu" onclick="toggleMenu()"></div>
    </div>

    <div id="menu" class="menu-container">
      <a class="menu-btn" href="https://maps.app.goo.gl/jmbXcW447N8cxpAK7" target="_blank"></a>
      <div class="menu-btn" onclick="goToCena(3)"></div>
      <div class="menu-btn" onclick="goToCena(4)"></div>
    </div>

    <div class="bottom-bar">
      <a href="https://forms.gle/ywTGBg1NVGu73hKA6" target="_blank"></a>
      <a href="https://forms.gle/ZraNk1GqcFL4MaSR9" target="_blank"></a>
    </div>
  </section>

  <section id="cena3" class="cena">
    <img src="media/cena3.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

  <section id="cena4" class="cena">
    <img src="media/cena4.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

</div>

<script>
// --- CONTROLO GERAL ---
const audio = document.getElementById("bgAudio");
const video2 = document.getElementById("video2");
const timerWrap = document.getElementById("timer-complex");
let audioStarted = false;

function iniciarTudo() {
  audio.play().then(() => { audioStarted = true; }).catch(e => console.log(e));
  goToCena(2);
}

function goToCena(n, voltarFinal = false){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".cena").forEach(c => c.classList.remove("active"));
  document.getElementById("cena"+n).classList.add("active");

  if(n === 2) {
    if(voltarFinal) {
      video2.currentTime = 6; 
      timerWrap.style.display = "flex"; 
      audio.volume = 1.0;
    } else {
      video2.currentTime = 0;
      timerWrap.style.display = "none"; // Esconde durante a fala
      audio.volume = 0.2;
    }
    video2.play().catch(e => console.log(e));
  } else {
    video2.pause();
    audio.volume = 1.0;
  }
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "flex" : "none";
}

function toggleAudio(){
  audio.paused ? audio.play() : audio.pause();
}

// Exibe cronómetro quando o vídeo acaba
video2.addEventListener("ended", () => {
  timerWrap.style.display = "flex";
  audio.volume = 1.0;
});

// --- LÓGICA DO CRONÓMETRO ---
const eventDate = new Date("2026-12-31T17:00:00"); // Ajuste a data aqui
const segNum = document.getElementById("seg-num");
const minNum = document.getElementById("min-num");
const horasNum = document.getElementById("horas-num");
const diasNum = document.getElementById("dias-num");

setInterval(()=>{
  const now = new Date();
  const diff = eventDate - now;
  
  if(diff <= 0){
    diasNum.innerText = "00"; horasNum.innerText = "00";
    minNum.innerText = "00"; segNum.innerText = "00";
    return;
  }
  
  const d = Math.floor(diff/86400000).toString().padStart(2, '0');
  const h = Math.floor((diff/3600000)%24).toString().padStart(2, '0');
  const m = Math.floor((diff/60000)%60).toString().padStart(2, '0');
  const s = Math.floor((diff/1000)%60).toString().padStart(2, '0');
  
  diasNum.innerText = d;
  horasNum.innerText = h;
  minNum.innerText = m;
  segNum.innerText = s;
}, 1000);

// --- SEGURANÇA ---
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) e.preventDefault();
    });
})();
</script>

</body>
</html>
