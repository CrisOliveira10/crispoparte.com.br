<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Convite Miguel 5 anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body {
  width: 100%;
  /* 2. DVH APLICADO PARA O SAFARI */
  height: 100dvh;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 3. MEDIA-WRAPPER PARA TRAVAR A ARTE E NÃO CORTAR LATERAIS */
.media-wrapper {
  position: relative;
  height: 100dvh;
  width: 56.25dvh; 
  max-width: 100vw;
  max-height: 177.77vw;
  background: #000;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.cena {
  position: absolute;
  inset: 0;
  display: none;
  z-index: 1;
}

.cena.active {
  display: block;
}

/* 4. OBJECT-FIT CONTAIN APLICADO */
video, img {
  width: 100%;
  height: 100%;
  object-fit: contain; 
  pointer-events: none;
}

/* 5. HOTSPOTS EM PORCENTAGEM (GARANTIA DE NÃO SAIR DO LUGAR) */
.hotspot {
  position: absolute;
  cursor: pointer;
  z-index: 10;
}

.hotspot-full {
  inset: 0;
  z-index: 5;
}

/* ===== TOPO E BOTÕES ===== */
.top-bar {
  position: absolute;
  top: 0;
  width: 100%;
  height: 15%; 
  z-index: 25; 
  pointer-events: none;
}

.hotspot-audio, .hotspot-menu, .hotspot-back {
  pointer-events: auto;
}

.hotspot-audio {
  left: 0;
  top: 0;
  width: 25%; 
  height: 100%;
}

.hotspot-menu {
  right: 0; 
  top: 0;
  width: 25%; 
  height: 100%;
}

/* ===== CRONÔMETRO LIMPO E CENTRALIZADO (SEM FUNDO VERMELHO) ===== */
#timer-complex {
  position: absolute;
  top: 6%; /* Altura geral do cronômetro */
  left: 50%;
  transform: translateX(-50%);
  width: 55%; 
  display: none; /* Escondido durante o vídeo */
  flex-direction: column;
  align-items: center;
  color: #fff;
  z-index: 20;
  pointer-events: none;
}

#timer-complex .timer-title {
  font-size: clamp(10px, 2.2vw, 1.5dvh);
  margin-bottom: 2px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  white-space: nowrap;
}

#timer-complex .timer-blocks-container {
  display: flex;
  width: 100%;
  justify-content: space-between; 
}

#timer-complex .timer-block {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#timer-complex .timer-num {
  font-size: clamp(18px, 5.5vw, 3dvh); 
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}

#timer-complex .timer-label {
  font-size: clamp(8px, 1.5vw, 1.2dvh);
  margin-top: 2px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
}

/* ===== MENU LATERAL COLADO NA DIREITA ===== */
.menu-container {
  position: absolute;
  right: 0; 
  top: 50%; 
  transform: translateY(-50%);
  width: 60%; 
  height: 60%; 
  z-index: 30;
  display: none;        
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  gap: 2%;

  background-image: url("media/menu-botoes.png");
  background-size: contain; 
  background-repeat: no-repeat;
  background-position: right center;
}

.menu-btn {
  width: 100%;        
  height: 25%; 
  cursor: pointer;
  display: block;
}

/* ===== RODAPÉ ===== */
.bottom-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 12%;
  display: flex;
  justify-content: space-between;
  z-index: 15;
}

.bottom-bar a {
  width: 30%;
  height: 100%;
}

.hotspot-back {
  top: 5%;
  right: 5%;
  width: 20%;
  height: 10%;
}
</style>
</head>

<body>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<div class="media-wrapper">

  <section id="cena1" class="cena active">
    <video src="media/video1.mp4" autoplay muted playsinline loop></video>
    <div class="hotspot hotspot-full" onclick="iniciarTudo()"></div>
  </section>

  <section id="cena2" class="cena">
    <video id="video2" src="media/video2.mp4" playsinline></video>

    <div class="top-bar">
      <div class="hotspot hotspot-audio" onclick="toggleAudio()"></div>
      
      <div id="timer-complex">
          <div class="timer-title">Nossa diversão começa em:</div>
          <div class="timer-blocks-container">
              <div class="timer-block">
                  <span class="timer-num" id="dias-num">00</span>
                  <span class="timer-label">DIAS</span>
              </div>
              <div class="timer-block">
                  <span class="timer-num" id="horas-num">00</span>
                  <span class="timer-label">HORAS</span>
              </div>
              <div class="timer-block">
                  <span class="timer-num" id="min-num">00</span>
                  <span class="timer-label">MIN</span>
              </div>
              <div class="timer-block">
                  <span class="timer-num" id="seg-num">00</span>
                  <span class="timer-label">SEG</span>
              </div>
          </div>
      </div>

      <div class="hotspot hotspot-menu" onclick="toggleMenu()"></div>
    </div>

    <div id="menu" class="menu-container">
      <a class="menu-btn" href="https://maps.app.goo.gl/jmbXcW447N8cxpAK7" target="_blank"></a>
      <div class="menu-btn" onclick="goToCena(3)"></div>
      <div class="menu-btn" onclick="goToCena(4)"></div>
    </div>

    <div class="bottom-bar">
      <a href="https://forms.gle/ywTGBg1NVGu73hKA6" target="_blank"></a>
      <a href="https://forms.gle/ZraNk1GqcFL4MaSR9" target="_blank"></a>
    </div>
  </section>

  <section id="cena3" class="cena">
    <img src="media/cena3.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

  <section id="cena4" class="cena">
    <img src="media/cena4.png">
    <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
  </section>

</div>

<script>
// --- FUNÇÕES DO CONVITE ---
const audio = document.getElementById("bgAudio");
let audioStarted = false;

function iniciarTudo() {
  audio.play().then(() => { audioStarted = true; }).catch(e => console.log(e));
  goToCena(2);
}

function goToCena(n, voltarFinal = false){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".cena").forEach(c => c.classList.remove("active"));
  document.getElementById("cena"+n).classList.add("active");

  const v2 = document.getElementById("video2");
  if(n === 2) {
    if(voltarFinal) {
      v2.currentTime = 6; 
      document.getElementById("timer-complex").style.display = "flex"; 
    } else {
      v2.currentTime = 0;
      // Garante que o cronômetro fica INVISÍVEL enquanto o vídeo roda
      document.getElementById("timer-complex").style.display = "none";
    }
    v2.play().catch(e => console.log(e));
  } else {
    v2.pause();
  }
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  if (menu.style.display === "none" || menu.style.display === "") {
    menu.style.display = "flex";
  } else {
    menu.style.display = "none";
  }
}

function toggleAudio(){
  audio.paused ? audio.play() : audio.pause();
}

// Só exibe o cronômetro quando o vídeo termina
document.getElementById("video2").addEventListener("ended", () => {
  document.getElementById("timer-complex").style.display = "flex";
});

// --- LÓGICA DO CRONÔMETRO ---
const eventDate = new Date("2026-09-08T16:30:00");
const segNum = document.getElementById("seg-num");
const minNum = document.getElementById("min-num");
const horasNum = document.getElementById("horas-num");
const diasNum = document.getElementById("dias-num");

setInterval(()=>{
  const now = new Date();
  const diff = eventDate - now;
  
  
    segNum.innerText = "00";
    minNum.innerText = "00";
    horasNum.innerText = "00";
    diasNum.innerText = "00";
    document.querySelector(".timer-title").innerText = "A diversão já começou!";
    return;
  }
  
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff/3600000)%24;
  const m = Math.floor(diff/60000)%60;
  const s = Math.floor(diff/1000)%60;
  
  diasNum.innerText = d.toString().padStart(2, '0');
  horasNum.innerText = h.toString().padStart(2, '0');
  minNum.innerText = m.toString().padStart(2, '0');
  segNum.innerText = s.toString().padStart(2, '0');
}, 1000);

// --- SCRIPT DE SEGURANÇA E DIREITOS AUTORAIS ---
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85) || 
           (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
           (e.ctrlKey && e.keyCode == 67) || (e.ctrlKey && e.keyCode == 83)) {
            e.preventDefault();
            return false;
        }
    });
    console.log("%c Protegido pela Lei 9.610/98 - Autoria: Cristiane Oliveira ", "color: white; background: red; font-weight: bold; font-size: 14px;");
})();
</script>

</body>
</html>
