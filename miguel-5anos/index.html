<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Miguel 5 anos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

/* ===== CENAS ===== */
.cena{
  position:absolute;
  inset:0;
  display:none;
  z-index: 1;
}

.cena.active{
  display:block;
}

video,img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== HOTSPOTS GERAIS ===== */
.hotspot{
  position:absolute;
  cursor:pointer;
  z-index: 5;
}

.hotspot-full{
  inset:0;
  background: transparent;
}

/* ===== MENU LATERAL ===== */
.menu-container{
  position:absolute;
  right:0;              
  top:55%; 
  transform:translateY(-50%);
  width: 350px;         
  z-index:20;
  display: none;         
  flex-direction: column;
  gap: 25px; 
  align-items: flex-end;

  background-image: url("media/menu-botoes.png");
  background-size: 140%; 
  background-repeat: no-repeat;
  background-position: right center;
}

.menu-btn{
  width: 350px;         
  height: 150px; 
  cursor: pointer;
  display: block;
}

/* ===== TOPO E CRONÔMETRO ===== */
.top-bar{
  position:absolute;
  top:0;
  width:100%;
  height:100px;
  z-index:10;
  pointer-events: none;
}

.hotspot-audio, .hotspot-menu, .hotspot-back{
  pointer-events: auto;
}

.hotspot-audio{
  left:0;
  top:0;
  width:80px;
  height:100px;
}

.hotspot-menu{
  right:0px;
  top:0px;
  width:120px;
  height:120px;
}

#timer{
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:24px;
  z-index:15;
  display:none;
}

/* ===== RODAPÉ ===== */
.bottom-bar{
  position:absolute;
  bottom:0;
  width:100%;
  height:120px;
  display:flex;
  justify-content:space-between;
  z-index:10;
}

.bottom-bar a{
  width:120px;
  height:120px;
}

.hotspot-back{
  top:0;
  right:120px;
  width:120px;
  height:120px;
}

@media(max-width:768px){
  .hotspot-menu, .hotspot-back{ right:0px; }
  .menu-container { width: 300px; }
  .menu-btn { width: 300px; height: 110px; }
}
</style>
</head>

<body>

<audio id="bgAudio" src="media/audio.mp3" loop></audio>

<section id="cena1" class="cena active">
  <video src="media/video1.mp4" autoplay muted playsinline loop></video>
  <div class="hotspot hotspot-full" onclick="iniciarTudo()"></div>
</section>

<section id="cena2" class="cena">
  <video id="video2" src="media/video2.mp4" playsinline></video>

  <div class="top-bar">
    <div class="hotspot hotspot-audio" onclick="toggleAudio()"></div>
    <div id="timer"></div>
    <div class="hotspot hotspot-menu" onclick="toggleMenu()"></div>
  </div>

  <div id="menu" class="menu-container">
    <a class="menu-btn" href="https://maps.app.goo.gl/AZBjKdxYEqVsC6N38" target="_blank"></a>
    <div class="menu-btn" onclick="goToCena(3)"></div>
    <div class="menu-btn" onclick="goToCena(4)"></div>
  </div>

  <div class="bottom-bar">
    <a href="https://forms.gle/j1xWuV1bQKevcKWZ8" target="_blank"></a>
    <a href="https://forms.gle/gCTygBPyy5mx22aZA" target="_blank"></a>
  </div>
</section>

<section id="cena3" class="cena">
  <img src="media/cena3.png">
  <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
</section>

<section id="cena4" class="cena">
  <img src="media/cena4.png">
  <div class="hotspot hotspot-back" onclick="goToCena(2, true)"></div>
</section>

<script>
// --- FUNÇÕES DO CONVITE ---
const audio = document.getElementById("bgAudio");
const video2 = document.getElementById("video2");
let audioStarted = false;

function iniciarTudo() {
  audio.volume = 1.0;
  audio.play().then(() => { 
    audioStarted = true; 
    goToCena(2);
  }).catch(e => {
    console.log("Erro ao iniciar áudio:", e);
    goToCena(2); // Vai para cena 2 mesmo se o áudio falhar
  });
}

function goToCena(n, voltarFinal = false){
  document.getElementById("menu").style.display = "none";
  document.querySelectorAll(".cena").forEach(c => c.classList.remove("active"));
  document.getElementById("cena"+n).classList.add("active");

  if(n === 2) {
    // Abaixa o som do fundo para o personagem falar
    audio.volume = 0.2; 
    
    if(voltarFinal) {
      video2.currentTime = 6; 
      document.getElementById("timer").style.display = "block";
      audio.volume = 1.0; // Se voltou ao final, o áudio de fundo pode ficar alto
    } else {
      video2.currentTime = 0;
      video2.play().catch(e => console.log("Erro play vídeo:", e));
    }
  } else {
    video2.pause();
    audio.volume = 1.0; // Restaura volume nas outras cenas
  }
}

function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "flex" : "none";
}

function toggleAudio(){
  audio.paused ? audio.play() : audio.pause();
}

// Quando o vídeo do personagem termina, o som de fundo volta ao normal
video2.addEventListener("ended", () => {
  document.getElementById("timer").style.display = "block";
  audio.volume = 1.0; 
});

// --- CRONÔMETRO ---
const eventDate = new Date("2026-01-31T17:00:00");
const timerDiv = document.getElementById("timer");

setInterval(()=>{
  const now = new Date();
  const diff = eventDate - now;
  if(diff <= 0){
    timerDiv.innerText = "É hoje!";
    return;
  }
  const d = Math.floor(diff/86400000);
  const h = Math.floor(diff/3600000)%24;
  const m = Math.floor(diff/60000)%60;
  const s = Math.floor(diff/1000)%60;
  timerDiv.innerText = `${d}d ${h}h ${m}m ${s}s`;
}, 1000);

// --- SCRIPT DE SEGURANÇA ---
(function() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.keyCode == 85) || 
           (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
           (e.ctrlKey && e.keyCode == 67) || (e.ctrlKey && e.keyCode == 83)) {
            e.preventDefault();
            return false;
        }
    });
    console.log("%c Protegido pela Lei 9.610/98 - Autoria: Cristiane Oliveira ", "color: white; background: red; font-weight: bold; font-size: 14px;");
})();
</script>

</body>
</html>
