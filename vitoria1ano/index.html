<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Convite Vitoria</title>
    
    <style>
        :root {
            --cor-botao: #ffffff; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Remove o brilho azul ao tocar no iPhone */
        }

        body {
            background: #000;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            display: none;
            width: 100%;
            height: 100dvh;
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .page img,
        .page video {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        .content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BOTÃO DE ÁUDIO MELHORADO */
        .btn-audio {
            position: fixed;
            bottom: 30px; /* Um pouco mais alto para não bater na barra do iPhone */
            left: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3); /* Fundo leve para visibilidade */
            border: 2px solid var(--cor-botao);
            color: var(--cor-botao);
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .hotspot { position: absolute; cursor: pointer; z-index: 10; }
        .btn-voltar { position: absolute; top: 5%; right: 5%; width: 12%; aspect-ratio: 1/1; z-index: 20; }
    </style>
</head>

<body>

<audio id="musica" src="audio.mp3" loop preload="auto"></audio>

<div id="btnControleAudio" class="btn-audio" onclick="toggleAudio()">
    <span id="iconeAudio">II</span>
</div>

<div class="page" id="page1" style="display:block;">
    <div class="content-wrapper" onclick="startInvite()">
        <img src="pagina1.jpg">
        <div class="hotspot" style="top:0; left:0; width:100%; height:100%;"></div>
    </div>
</div>

<div class="page" id="page2">
    <div class="content-wrapper">
        <video id="video" src="pagina2.mp4" playsinline webkit-playsinline muted></video>
    </div>
</div>

<div class="page" id="page3">
    <div class="content-wrapper">
        <img src="pagina3.jpg">
        <a class="hotspot" style="bottom:25%; left:16%; width:20%; height:10%;" href="https://maps.google.com" target="_blank"></a>
        <a class="hotspot" style="bottom:25%; left:40%; width:20%; height:10%;" href="https://wa.me/5511947057844" target="_blank"></a>
        <div class="hotspot" style="bottom:25%; left:64%; width:20%; height:10%;" onclick="goPage(4)"></div>
    </div>
</div>

<div class="page" id="page4">
    <div class="content-wrapper">
        <img src="pagina4.jpg">
        <div class="btn-voltar" onclick="goPage(3)"></div>
    </div>
</div>

<script>
    const musica = document.getElementById('musica');
    const video = document.getElementById('video');
    const btnAudio = document.getElementById('btnControleAudio');
    const iconeAudio = document.getElementById('iconeAudio');

    function startInvite() {
        // No iPhone, o play() DEVE acontecer dentro dessa função de clique
        musica.play().then(() => {
            console.log("Áudio tocando com sucesso");
        }).catch(e => {
            console.log("Erro ao tocar áudio: ", e);
        });

        btnAudio.style.display = 'flex';
        goPage(2);
        
        // Tenta tocar o vídeo
        video.play();

        video.onended = () => {
            goPage(3);
        };
    }

    function toggleAudio() {
        if (musica.paused) {
            musica.play();
            iconeAudio.innerText = "II";
        } else {
            musica.pause();
            iconeAudio.innerText = "▶";
        }
    }

    function goPage(num) {
        document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
        const targetPage = document.getElementById('page' + num);
        if (targetPage) {
            targetPage.style.display = 'block';
        }
    }

    // Truque extra para navegadores mobile que suspendem o áudio
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && !musica.paused) {
            musica.play();
        }
    });
</script>

</body>
</html>
