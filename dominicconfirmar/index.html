<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP</title>
<style>
:root{--c:#7b2cbf}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;padding:20px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;font-family:'Segoe UI',sans-serif;color:#333;background:#faf7fb;background:color-mix(in srgb,var(--c) 9%,#fff)}
.card{background:#fff;border-radius:20px;max-width:440px;width:100%;box-shadow:0 10px 35px rgba(0,0,0,.12);overflow:hidden;padding-bottom:30px}
.card>img{width:100%;display:block}
.in{padding:0 28px}
h2{font-family:Georgia,'Times New Roman',serif;text-align:center;font-size:26px;margin:24px 0 4px;color:var(--c)}
.sub{text-align:center;color:#777;font-style:italic;margin:0 0 22px;font-family:Georgia,serif}
h3{font-family:Georgia,serif;font-size:19px;text-align:center;margin:0 0 12px;font-weight:600}
.busca{position:relative}
.busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round}
.busca input{padding-left:46px}
input{width:100%;padding:14px;border:1.5px solid #e3dbe9;border-radius:30px;font:inherit;outline:none;margin:0}
input:focus{border-color:var(--c)}
#sg button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #f0eaf4;padding:13px 18px;font:inherit;cursor:pointer}
#sg button:hover{background:#f7f1fb}
#sg{margin-top:6px;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.msg{background:#fdf6ec;border-radius:14px;padding:16px;margin-top:14px;text-align:center;line-height:1.5;font-size:15px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:30px;background:var(--c);color:#fff;font:inherit;font-weight:bold;font-size:16px;cursor:pointer;margin-top:14px}
.btn.zap{background:#25D366}
.btn.ghost{background:#fff;color:var(--c);border:1.5px dashed var(--c)}
.flow{margin-top:26px;border-top:1px solid #eee;padding-top:22px}
.perg{display:flex;gap:12px}
.perg button{flex:1;padding:14px;border-radius:30px;border:2px solid var(--c);background:#fff;color:var(--c);font:inherit;font-weight:bold;cursor:pointer}
.perg button.on{background:var(--c);color:#fff}
.ac{display:flex;gap:8px;margin-bottom:10px}
.ac input:first-child{flex:2}.ac input:nth-child(2){flex:1;min-width:0}
.ac .x{background:none;border:0;font-size:22px;color:#aaa;cursor:pointer}
.tx{width:100%;padding:14px;border:1.5px solid #e3dbe9;border-radius:16px;font:inherit;outline:none;margin-top:8px;resize:vertical}
.tx:focus{border-color:var(--c)}
.dica{text-align:center;color:#777;font-size:14px;margin:0 0 14px}
/* ===== PAINEL DO ANFITRIÃO (#admin) ===== */
#adm{width:100%;max-width:440px}
#adm .ap{background:var(--abg);color:var(--atx);border:2px solid var(--atx);border-radius:18px;padding:22px 16px;font-family:Georgia,'Times New Roman',serif}
#adm h2{text-align:left;color:var(--atx);font-size:22px;margin:0;font-variant:small-caps}
#adm .asub{margin:2px 0 14px;font-size:12px;opacity:.7;font-variant:small-caps}
#adm input{width:auto;flex:1;min-width:0;border:1.5px solid var(--atx);border-radius:12px;padding:11px;background:#fff;color:var(--atx)}
#adm .arow{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.ab{border:2px solid var(--atx);border-radius:20px;padding:9px 14px;font:inherit;font-weight:bold;font-size:12px;text-transform:uppercase;cursor:pointer;box-shadow:0 3px 0 var(--atx);white-space:nowrap}
.ab.b1{background:var(--b1);color:var(--b1t)}.ab.b2{background:var(--b2);color:var(--b2t)}.ab.b3{background:var(--b3);color:var(--b3t)}
.ast{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.at{border:2px solid var(--atx);border-radius:16px;padding:14px 8px;text-align:center;background:#fff;box-shadow:0 4px 0 var(--atx)}
.at b{display:block;font-size:30px}.at span{font-size:10px;letter-spacing:.6px;text-transform:uppercase}
.at.k1{background:var(--c1);color:var(--c1t)}.at.k2{background:var(--c2);color:var(--c2t)}
.abox{background:#fff;border:2px solid var(--atx);border-radius:18px;padding:12px}
.achs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.ach{border:1.5px solid var(--atx);background:#fff;color:var(--atx);border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;font-weight:bold;cursor:pointer}
.ach.on{background:var(--ch);color:var(--cht)}
.gc{border:1.5px solid var(--atx);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.gc small{display:block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;opacity:.6;margin-top:8px}
.gc small:first-child{margin-top:0}
.gv{font-weight:bold;white-space:pre-line}
.bd{display:inline-block;border-radius:12px;padding:2px 10px;font-size:11px;font-weight:bold;color:#fff}
.bd.v{background:#2e9e44}.bd.n{background:#b3262e}.bd.p{background:#777}
#aInfo{font-size:13px;margin:8px 0;min-height:16px}
.adv{text-align:center;opacity:.7;font-size:14px}
</style>
</head>
<body>

<img id="hd" alt="">
<div class="in">
<h2 id="ev"></h2>
<p class="sub" data-t="sub"></p>
<p class="dica" id="lim" hidden style="margin-top:-12px;font-weight:bold;color:var(--c)"></p>

<button type="button" class="btn zap" id="alt" data-t="btnAlt"></button>
</div>

<button type="button" class="btn ghost" id="add" data-t="btnAdd"></button>

<button type="button" class="btn zap" id="envS" data-t="btnEnv"></button>
</div>

<div id="no" hidden style="margin-top:24px">
<div class="msg" data-t="msgNao"></div>
<p class="dica" data-t="tMsg" style="margin:20px 0 0"></p>
<textarea class="tx" id="msgN" rows="3" data-p="phMsg"></textarea>
<button type="button" class="btn zap" id="envN" data-t="btnEnvNao"></button>
</div>
</div>

<div class="msg" id="fim" hidden></div>
</div>
</div>

<div id="adm" hidden>
<div class="ap">
<h2>Lista de presença</h2>
<p class="asub" id="aS"></p>
<div id="aInfo"></div>
<div id="aLogin" class="arow"><input id="aPin" type="password" placeholder="Senha do painel" autocomplete="off"><button type="button" class="ab b1" id="aGo">Entrar</button></div>
<div id="aMain" hidden>
<div class="ast">
<div class="at k1"><b id="n1">0</b><span>Confirmados</span></div>

</div>

<div class="arow"><button type="button" class="ab b2" id="aCsv">Baixar planilha</button><button type="button" class="ab b3" id="aAdd">+ Adicionar</button></div>
<div class="arow" id="aAddRow" hidden><input id="aNovo" placeholder="Nome completo do convidado"><button type="button" class="ab b3" id="aSalvar">Salvar</button></div>

<script>
const C=JSON.parse(document.getElementById('cfg').textContent);
const $=id=>document.getElementById(id);
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
document.title=C.evento;
document.documentElement.style.setProperty('--c',C.cor);
if(C.img)$('hd').src=C.img;else $('hd').remove();
$('ev').textContent=C.evento;
if(C.idadeMax===undefined)C.idadeMax=11;
const livre=C.tipoLista==='livre';
const ti=x=>x.split('{idade}').join(C.idadeMax);
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=ti(C[e.dataset.t]));
document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=ti(C[e.dataset.p]));
if(livre){$('tb').textContent=ti(C.tBuscaLivre);$('q').placeholder=ti(C.phBuscaLivre)}
let nome='';
const L=C.lista.map(n=>({n:n,k:norm(n)}));
function wa(t){window.open('https://wa.me/'+C.zap+'?text='+encodeURIComponent(t),'_blank')}

$('q').oninput=()=>{
 $('flow').hidden=true;$('blq').hidden=true;$('fim').hidden=true;$('nf').hidden=true;$('sg').innerHTML='';nome='';
 if(livre){$('cont').hidden=$('q').value.trim().length<3;return}
 const q=norm($('q').value).trim();
 if(q.length<3)return;
 const ws=q.split(/\s+/);
 const r=L.filter(x=>ws.every(w=>x.k.includes(w))).slice(0,6);
 if(!r.length){$('nf').hidden=false;return}
 r.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.n;b.onclick=()=>pick(x.n);$('sg').appendChild(b)});
};
const chave=n=>'rsvp|'+C.evento+'|'+norm(n);
function jaLocal(n){try{return localStorage.getItem(chave(n))==='1'}catch(e){return false}}
const fmtD=d=>d.split('-').reverse().join('/');
const t=new Date(),hoje=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
const expirou=C.trava==='data'&&hoje>C.limite;
if(C.trava==='data'&&!expirou){$('lim').textContent=C.tLimite.split('{data}').join(fmtD(C.limite));$('lim').hidden=false}
function abrir(n){if(nome===n){$('blq').hidden=true;$('flow').hidden=false}}
function bloquear(n,conf){if(nome===n){$('tbq').textContent=conf?C.tBloq:C.tPrazo.split('{data}').join(fmtD(C.limite||''));$('flow').hidden=true;$('blq').hidden=false}}
function pick(n){
 $('cont').hidden=true;nome=n;$('q').value=n;$('sg').innerHTML='';
 $('saud').textContent=C.saud.split('{nome}').join(n.split(' ')[0]);
 $('yes').hidden=true;$('no').hidden=true;$('bs').classList.remove('on');$('bn').classList.remove('on');
 $('flow').hidden=true;$('blq').hidden=true;
 if(C.trava==='nao'||(C.trava==='data'&&!expirou)){abrir(n);return}
 const dec=c=>c?bloquear(n,true):(expirou?bloquear(n,false):abrir(n));
 if(C.modo==='whats'){dec(jaLocal(n));return}
 fetch(C.url+'?acao=checar&evento='+encodeURIComponent(C.evento)+'&nome='+encodeURIComponent(n))
  .then(r=>r.json()).then(j=>dec(j.confirmado)).catch(()=>dec(false));
}
$('cont').onclick=()=>pick($('q').value.trim().replace(/\s+/g,' '));
$('q').onkeydown=e=>{if(e.key==='Enter'&&livre&&!$('cont').hidden)$('cont').click()};
$('alt').onclick=()=>wa(C.msgAlt.split('{nome}').join(nome));
$('org').onclick=()=>wa(C.msgOrg.split('{nome}').join($('q').value.trim()));
$('bs').onclick=()=>{$('bs').classList.add('on');$('bn').classList.remove('on');$('yes').hidden=false;$('no').hidden=true};
$('bn').onclick=()=>{$('bn').classList.add('on');$('bs').classList.remove('on');$('no').hidden=false;$('yes').hidden=true};

$('add').onclick=()=>{
 const d=document.createElement('div');d.className='ac';
 const a=document.createElement('input');a.className='an';a.placeholder=C.phNomeA;
 const i=document.createElement('input');i.className='ai';i.type='number';i.min='0';i.inputMode='numeric';i.placeholder=ti(C.phIdade);
 const x=document.createElement('button');x.type='button';x.className='x';x.textContent='×';x.onclick=()=>d.remove();
 d.append(a,i,x);$('acs').appendChild(d);a.focus();
};
function fim(){if(C.trava!=='nao'&&C.modo==='whats'){try{localStorage.setItem(chave(nome),'1')}catch(e){}}
 $('fim').textContent=C.fim;$('fim').hidden=false;$('envS').disabled=$('envN').disabled=true}
function erro(){$('fim').textContent=C.erro;$('fim').hidden=false;$('envS').disabled=$('envN').disabled=false}
function enviar(vai){
 const ac=vai?[...document.querySelectorAll('.ac')].map(r=>({n:r.querySelector('.an').value.trim(),i:r.querySelector('.ai').value.trim()})).filter(a=>a.n):[];
 const kids=ac.filter(a=>a.i!==''&&+a.i<=C.idadeMax).length;
 const tot=vai?ac.length+1:0;
 const lst=ac.map((a,k)=>(k+1)+'. '+a.n+(a.i!==''?' — '+a.i+(+a.i===1?' ano':' anos')+(+a.i<=C.idadeMax?' (criança)':''):''));
 const msg=(vai?$('msgS'):$('msgN')).value.trim();
 let m=C.cab+'\n\nEvento: '+C.evento+'\nConvidado(a): '+nome+'\nPresença: '+(vai?'✅ SIM':'❌ NÃO poderá comparecer');
 if(vai){if(lst.length)m+='\n\nAcompanhantes:\n'+lst.join('\n');m+='\n\nTotal de pessoas: '+tot+' ('+(tot-kids)+' adultos, '+kids+' crianças)'}
 if(msg)m+='\n\nMensagem: '+msg;
 if(C.modo!=='sheet')wa(m);
 if(C.modo==='whats'){fim();return}
 $('envS').disabled=$('envN').disabled=true;
 const d={evento:C.evento,nome:nome,presenca:vai?'SIM':'NÃO',total:tot,adultos:vai?tot-kids:0,criancas:kids,acompanhantes:lst.join('\n')||'Nenhum',mensagem:msg||'Sem mensagem',bloquear:C.trava==='imediato',limite:C.trava==='data'?C.limite:''};
 fetch(C.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}).then(fim).catch(erro);
}
$('envN').onclick=()=>enviar(false);
$('envS').onclick=()=>enviar(true);
if(!C.zap){$('org').hidden=true;$('alt').hidden=true}
/* ===== NOMES EXTRAS (adicionados pelo anfitrião) aparecem na busca ===== */
if(C.modo!=='whats'&&C.url&&!livre){
 fetch(C.url+'?acao=extras&evento='+encodeURIComponent(C.evento)).then(r=>r.json()).then(j=>{
  (j.nomes||[]).forEach(n=>{if(!L.some(x=>x.k===norm(n)))L.push({n:n,k:norm(n)})});
 }).catch(()=>{});
}

/* ===== PAINEL DO ANFITRIÃO — só aparece com #admin no final do link ===== */
(function(){
/* SHA-256 em JS puro (funciona em qualquer navegador, inclusive abrindo o arquivo direto) */
const SK=[],SH=[];(function(){const f=x=>Math.floor((x-Math.floor(x))*4294967296);let n=2,c=0;while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}if(p){if(c<8)SH.push(f(Math.sqrt(n)));SK.push(f(Math.cbrt(n)));c++}n++}})();
function sha(str){
 const b=unescape(encodeURIComponent(str)),l=b.length,w=[];
 for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
 w[l>>2]|=0x80<<(24-(l%4)*8);w[(((l+8)>>6)+1)*16-1]=l*8;
 const h=SH.slice(),x=new Array(64),R=(v,n)=>(v>>>n)|(v<<(32-n));
 for(let j=0;j<w.length;j+=16){
  for(let i=0;i<64;i++){if(i<16)x[i]=w[j+i]|0;else{const a=x[i-15],c=x[i-2];x[i]=(x[i-16]+(R(a,7)^R(a,18)^(a>>>3))+x[i-7]+(R(c,17)^R(c,19)^(c>>>10)))|0}}
  let [a,b2,c,d,e,f,g,hh]=h;
  for(let i=0;i<64;i++){
   const t1=(hh+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+SK[i]+x[i])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&b2)^(a&c)^(b2&c)))|0;
   hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b2;b2=a;a=(t1+t2)|0;
  }
  [a,b2,c,d,e,f,g,hh].forEach((v,i)=>h[i]=(h[i]+v)|0);
 }
 return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
function kdf(pw,salt){let h=sha(salt+'|'+pw);for(let i=0;i<5000;i++)h=sha(h+salt);return h}

const A=Object.assign({c1:'#e63946',c2:'#ffc93c',b1:'#ffc93c',b2:'#e63946',b3:'#ffc93c',ch:'#1d1a5c',bg:'#e8f1fb',tx:'#1d1a5c'},C.adm||{});
const P=$('adm'),card=document.querySelector('.card');
const onC=h=>{const n=parseInt(h.slice(1),16);return (((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000)>150?'#1d1a5c':'#fff'};
['c1','c2','b1','b2','b3','ch'].forEach(k=>{P.style.setProperty('--'+k,A[k]);P.style.setProperty('--'+k+'t',onC(A[k]))});
P.style.setProperty('--abg',A.bg);P.style.setProperty('--atx',A.tx);
$('aS').textContent='Painel do anfitrião'+(C.anf?' — '+C.anf:'');
let PIN='',D=[],F='todos',Q='';
try{PIN=sessionStorage.getItem('adm-pin')||''}catch(e){}
const ev=encodeURIComponent(C.evento);
const api=q=>fetch(C.url+'?'+q).then(r=>r.json());
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const aviso=t=>{$('aInfo').textContent=t};
const rec=x=>x.msg&&x.msg!=='Sem mensagem';
const H1=(C.ck||[]).slice().reverse().join('');
const pend=()=>{if(livre)return[];const ja=new Set(D.map(x=>norm(x.nome)));return L.filter(x=>!ja.has(x.k))};

function carregar(){
 aviso('Carregando...');
 return api('acao=listar&evento='+ev+'&senha='+encodeURIComponent(PIN)).then(j=>{
  if(!j.ok)throw new Error(j.erro||'Senha incorreta.');
  try{sessionStorage.setItem('adm-pin',PIN)}catch(e){}
  D=j.itens||[];$('aLogin').hidden=true;$('aMain').hidden=false;aviso('');rend();
 }).catch(e=>{
  PIN='';$('aLogin').hidden=false;$('aMain').hidden=true;
  aviso(e instanceof TypeError?'Não consegui conectar ao script. Confira a URL e a implantação.':e.message);
 });
}
function rend(){
 const vai=D.filter(x=>x.presenca==='SIM');
 const s=k=>vai.reduce((a,x)=>a+(+x[k]||0),0);
 $('n1').textContent=vai.length;$('n2').textContent=s('total');
 $('n3').textContent=D.length-vai.length;$('n4').textContent=D.filter(rec).length;
 const pd=pend();$('fPend').hidden=livre;$('fPend').textContent='Faltam responder ('+pd.length+')';
 $('fAd').textContent='Adultos ('+s('adultos')+')';$('fKid').textContent='Crianças ('+s('criancas')+')';
 document.querySelectorAll('.ach').forEach(b=>b.classList.toggle('on',b.dataset.f===F));
 const q=norm(Q).trim();
 const ok=x=>(F==='todos'||(F==='vai'&&x.presenca==='SIM')||(F==='nao'&&x.presenca!=='SIM')||(F==='rec'&&rec(x))||(F==='ad'&&x.presenca==='SIM'&&x.adultos>0)||(F==='kid'&&x.criancas>0))&&norm(x.nome).includes(q);
 const box=$('aLista');box.textContent='';
 if(F==='pend'){
  const pl=pd.filter(x=>x.k.includes(q));
  if(!pl.length)box.appendChild(el('p','adv',pd.length?'Nenhum registro encontrado.':'Todos já responderam! 🎉'));
  pl.forEach(x=>{const g=el('div','gc');g.appendChild(el('small','','Convidado'));g.appendChild(el('div','gv',x.n));g.appendChild(el('small','','Presença'));g.appendChild(el('span','bd p','AGUARDANDO RESPOSTA'));box.appendChild(g)});
  return;
 }
 const l=D.filter(ok);
 if(!l.length)box.appendChild(el('p','adv','Nenhum registro encontrado.'));
 l.forEach(x=>{
  const g=el('div','gc');
  const f=(r,v)=>{g.appendChild(el('small','',r));g.appendChild(el('div','gv',v))};
  f('Convidado',x.nome);
  g.appendChild(el('small','','Presença'));
  g.appendChild(el('span','bd '+(x.presenca==='SIM'?'v':'n'),x.presenca==='SIM'?'VAI':'NÃO VAI'));
  if(x.acomp&&x.acomp!=='Nenhum')f('Acompanhantes',x.acomp.split('\n').join(', '));
  if(rec(x))f('Recado',x.msg);
  f('Enviado em',x.data);
  box.appendChild(g);
 });
}
function csv(){
 const c=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const h=['Nome','Presença','Total','Adultos','Crianças','Acompanhantes','Recado','Enviado em'].map(c).join(';');
 const r=D.map(x=>[x.nome,x.presenca,x.total,x.adultos,x.criancas,x.acomp,x.msg,x.data].map(c).join(';')).concat(pend().map(x=>[x.n,'SEM RESPOSTA','','','','','',''].map(c).join(';')));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+[h].concat(r).join('\r\n')],{type:'text/csv;charset=utf-8'}));
 a.download='presenca-'+C.evento.replace(/[^\w\-]+/g,'_')+'.csv';a.click();
}
function salvarNome(){
 const n=$('aNovo').value.trim().replace(/\s+/g,' ');
 if(n.length<3){aviso('Digite o nome completo.');return}
 aviso('Salvando...');
 api('acao=adicionar&evento='+ev+'&senha='+encodeURIComponent(PIN)+'&nome='+encodeURIComponent(n)).then(j=>{
  if(!j.ok)throw new Error(j.erro||'Não foi possível salvar.');
  if(!L.some(x=>x.k===norm(n)))L.push({n:n,k:norm(n)});$('aNovo').value='';rend();aviso('✓ '+n+(j.repetido?' já estava na lista.':' adicionado. Já aparece na busca do convite.'));
 }).catch(e=>aviso(e instanceof TypeError?'Falha de conexão. Tente de novo.':e.message));
}
$('aGo').onclick=()=>{
 const pw=$('aPin').value;
 if(!pw){aviso('Digite a senha.');return}
 aviso('Conferindo...');
 setTimeout(()=>{
  if(kdf(pw,'ui-rsvp')!==H1){aviso('Senha incorreta.');return}
  PIN=kdf(pw,'srv|'+norm(C.evento));$('aPin').value='';carregar();
 },30);
};
$('aPin').onkeydown=e=>{if(e.key==='Enter')$('aGo').click()};
$('aRef').onclick=carregar;
$('aCsv').onclick=csv;
$('aAdd').onclick=()=>{$('aAddRow').hidden=!$('aAddRow').hidden;if(!$('aAddRow').hidden)$('aNovo').focus()};
$('aSalvar').onclick=salvarNome;
$('aNovo').onkeydown=e=>{if(e.key==='Enter')salvarNome()};
$('aQ').oninput=()=>{Q=$('aQ').value;rend()};
document.querySelectorAll('.ach').forEach(b=>b.onclick=()=>{F=b.dataset.f;rend()});

function rota(){
 const on=location.hash==='#admin';
 P.hidden=!on;card.hidden=on;
 if(!on)return;
 document.title='Painel — '+C.evento;
 if(C.modo==='whats'||!C.url){$('aLogin').hidden=true;aviso('O painel precisa do modo "Planilha Google". Gere a página nesse modo.');return}
 if(!H1){$('aLogin').hidden=true;aviso('Este painel está sem senha. Defina a senha no gerador (seção Painel do anfitrião) e gere a página de novo.');return}
 if(PIN&&$('aMain').hidden)carregar();
}
addEventListener('hashchange',rota);rota();
})();

</script>
