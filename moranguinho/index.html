<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Isabella - 3 Anos</title>

    <meta property="og:title" content="Convite Especial: Isabella - 3 Anos">
    <meta property="og:description" content="Clique para ver os detalhes do convite da Isabella!">
    <meta property="og:image" content="https://crispoparte.com.br/moranguinho/capalink.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:url" content="https://crispoparte.com.br/moranguinho/">
    <meta property="og:type" content="website">

    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: sans-serif; 
        }
        
        .section { 
            display: none; 
            width: 100%; 
            height: 100vh; 
            position: relative; 
            align-items: center;
            justify-content: center;
        }
        .active { display: flex; }

        img, video { 
            max-width: 100%; 
            max-height: 100vh; 
            display: block;
        }

        /* Container dos 3 Hotspots no Vídeo */
        .video-controls {
            position: absolute;
            bottom: 200px; /* Distância exata do rodapé */
            left: 50%;
            transform: translateX(-50%); /* Centraliza na horizontal */
            display: flex;
            gap: 30px; /* Espaço entre os botões */
            z-index: 100;
        }

        .hotspot {
            width: 80px;  /* Tamanho da área de clique */
            height: 80px;
            cursor: pointer;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5); /* Deixe em 0.1 para testar a posição, depois 0.0 para sumir */
            transition: background 0.3s;
        }
        
        /* Debug: use esta linha abaixo para enxergar os botões durante os testes */
        /* .hotspot { background: rgba(255, 255, 255, 0.5); border: 1px solid white; } */

        /* Botão Voltar na Página (Superior Direito) */
        .btn-back { 
            position: absolute;
            top: 10px; 
            right: 10px; 
            width: 120px; 
            height: 120px; 
            background: rgba(255, 255, 255, 0.5);
            z-index: 100;
        }

        /* Animação de pulsação simples para a capa */
        .click-hint {
            position: absolute;
            bottom: 20%;
            color: white;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div id="etapa-capa" class="section active" onclick="iniciarVideo()">
        <img src="capa.png" alt="Capa">
        <div class="click-hint">Clique para abrir</div>
    </div>

    <div id="etapa-video" class="section">
        <video id="meuVideo" playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
        
        <div class="video-controls">
            <a href="https://api.whatsapp.com/send?phone=5571993233142" target="_blank" class="hotspot"></a>
            
            <a href="https://maps.app.goo.gl/TY6YvE9iN7LfRTFU7" target="_blank" class="hotspot"></a>
            
            <div onclick="irParaPagina()" class="hotspot"></div>
        </div>
    </div>

    <div id="etapa-pagina" class="section">
        <img src="pagina.png" alt="Página">
        
        <div onclick="voltarVideo()" class="btn-back"></div>
    </div>

    <script>
        const v = document.getElementById('meuVideo');

        function iniciarVideo() {
            document.getElementById('etapa-capa').classList.remove('active');
            document.getElementById('etapa-video').classList.add('active');
            v.play();
        }

        function irParaPagina() {
            v.pause();
            document.getElementById('etapa-video').classList.remove('active');
            document.getElementById('etapa-pagina').classList.add('active');
        }

        function voltarVideo() {
            document.getElementById('etapa-pagina').classList.remove('active');
            document.getElementById('etapa-video').classList.add('active');
            v.play();
        }

        // Se o vídeo terminar, ele volta para o começo (loop)
        v.onended = function() {
            v.play();
        };
    </script>
</body>
</html>
