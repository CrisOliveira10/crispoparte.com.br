<!DOCTYPE html>
<html lang="pt-br" prefix="og: http://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Convite Isabella - 3 Anos</title>
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://crispoparte.com.br/moranguinho/">
    <meta property="og:title" content="Convite Especial: Isabella - 3 Anos">
    <meta property="og:description" content="Clique para ver os detalhes do convite da Isabella!">
    <meta property="og:image" content="https://crispoparte.com.br/moranguinho/capalink.png">
    <meta property="og:image:secure_url" content="https://crispoparte.com.br/moranguinho/capalink.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://crispoparte.com.br/moranguinho/capalink.png">

    <style>
        * { box-sizing: border-box; }
        
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; 
            /* Fix para Safari iOS: usa a altura dinâmica da tela */
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; 
            background: #000; 
            font-family: sans-serif; 
        }
        
        .section { 
            display: none; 
            width: 100%; 
            height: 100vh;
            height: 100dvh;
            position: relative; 
            align-items: center;
            justify-content: center;
            /* Respeita o entalhe (notch) do iPhone */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .active { display: flex; }

        /* Faz a mídia se ajustar sem cortar, mantendo a proporção */
        img, video { 
            max-width: 100%; 
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Container que envolve o vídeo para alinhar os botões sobre ele */
        .media-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
        }

        /* Os hotspots agora usam porcentagem para não sair do lugar */
        .video-controls {
            position: absolute;
            bottom: 30%; /* Ajuste este % para subir ou descer os 3 botões juntos */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px; 
            z-index: 100;
        }

        .hotspot {
            width: 70px; 
            height: 70px;
            cursor: pointer;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.0); /* Mude para 0.2 para ver onde estão os círculos ao testar */
            transition: background 0.3s;
        }
        
        /* Botão Voltar (Superior Direito) */
        .btn-back { 
            position: absolute;
            top: 20px; 
            right: 20px; 
            width: 80px; 
            height: 80px; 
            background: rgba(255, 255, 255, 0.0);
            z-index: 100;
            border-radius: 50%;
        }

        .pulse-text {
            position: absolute;
            bottom: 12%;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 24px;
            border-radius: 30px;
            color: #d63384;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            pointer-events: none;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div style="display: none !important; visibility: hidden; pointer-events: none;" aria-hidden="true">
        © 2026 Cristiane Oliveira. Todos os direitos reservados. 
        Protegido pela Lei nº 9.610/98.
    </div>

    <div id="etapa-capa" class="section active" onclick="iniciarVideo()">
        <img src="capa.png" alt="Capa">
        <div class="pulse-text">Clique para abrir o convite! 🍓</div>
    </div>
   
    <div id="etapa-video" class="section">
        <div class="media-container">
            <video id="meuVideo" playsinline>
                <source src="video.mp4" type="video/mp4">
            </video>
            
            <div class="video-controls">
                <a href="https://api.whatsapp.com/send?phone=5571993233142" target="_blank" class="hotspot"></a>
                
                <a href="https://maps.google.com/?q=Localizacao" target="_blank" class="hotspot"></a>
                
                <div onclick="irParaPagina()" class="hotspot"></div>
            </div>
        </div>
    </div>

    <div id="etapa-pagina" class="section">
        <div class="media-container">
            <img src="pagina.png" alt="Página">
            <div onclick="voltarVideo()" class="btn-back"></div>
        </div>
    </div>

    <script>
        const v = document.getElementById('meuVideo');

        function iniciarVideo() {
            document.getElementById('etapa-capa').classList.remove('active');
            document.getElementById('etapa-video').classList.add('active');
            v.play().catch(e => console.log("Erro ao dar play: ", e));
        }

        function irParaPagina() {
            v.pause();
            document.getElementById('etapa-video').classList.remove('active');
            document.getElementById('etapa-pagina').classList.add('active');
        }

        function voltarVideo() {
            document.getElementById('etapa-pagina').classList.remove('active');
            document.getElementById('etapa-video').classList.add('active');
            v.play();
        }

        v.onended = function() {
            v.play();
        };
    </script>
</body>
</html>
